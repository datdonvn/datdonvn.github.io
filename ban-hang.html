  function openCashCheckModal(day, opener) {
    const K = ST.kk;
    const st = {};
    for (const [m] of KK_METHODS) {
      const ck = K.checks.find(c => c.day === day && c.method === m);
      let tin = 0, tout = 0;
      for (const e of K.cash) if (app.toVnYmd(new Date(e.at)) === day && cashMethodOf(e.pay_method_id) === m) { if (e.dir === 'in') tin += e.amount; else tout += e.amount; }
      st[m] = { opening: ck ? ck.opening : 0, status: ck ? ck.status : null, actual: ck && ck.actual != null ? ck.actual : '', note: ck ? (ck.note || '') : '', tin, tout, diffOpen: ck ? ck.status === 'diff' : false };
    }
    const body = el('div');
    const save = async (m, status, btn) => {
      const s = st[m];
      if (status === 'diff' && !(s.actual !== '' && !Number.isNaN(Number(s.actual)))) { app.showToast('Nhập số tiền thực tế', 'error'); return; }
      btn.disabled = true;
      try {
        const { error } = await sb.rpc('save_cash_check', { p_shop: shopId, p_day: day, p_method: m, p_opening: Math.round(Number(s.opening) || 0), p_status: status, p_actual: status === 'diff' ? Math.round(Number(s.actual)) : null, p_note: s.note || null });
        if (error) throw error;
        s.status = status;
        const i = K.checks.findIndex(c => c.day === day && c.method === m);
        const rec = { shop_id: shopId, day, method: m, opening: Math.round(Number(s.opening) || 0), status, actual: status === 'diff' ? Math.round(Number(s.actual)) : null, note: s.note || null };
        if (i >= 0) K.checks[i] = rec; else K.checks.push(rec);
        app.showToast('Đã lưu', 'accent'); draw(); renderOvKK();
      } catch (e) { showErr(e); btn.disabled = false; }
    };
    const draw = () => body.replaceChildren(...KK_METHODS.map(([m, label]) => {
      const s = st[m];
      const endV = () => (Number(s.opening) || 0) + s.tin - s.tout;
      const endEl = el('b', { className: 'num', text: app.formatMoney(endV()) });
      const diffEl = el('small', { className: 'num', style: 'color:var(--error)' });
      const updDiff = () => { diffEl.textContent = s.actual !== '' ? 'Lệch so với sổ: ' + app.formatMoney(Number(s.actual) - endV()) : ''; };
      updDiff();
      const okBtn = el('button', { type: 'button', className: 'chip', 'aria-pressed': String(s.status === 'ok' && !s.diffOpen), text: 'Đúng', onClick: e => { s.diffOpen = false; save(m, 'ok', e.currentTarget); } });
      const diffBtn = el('button', { type: 'button', className: 'chip', 'aria-pressed': String(s.diffOpen || s.status === 'diff'), text: 'Lệch (khai báo lệch)', onClick: () => { s.diffOpen = true; draw(); } });
      const row = (k, v) => el('div', { className: 'row-between', style: 'padding:4px 0' }, el('span', { text: k }), v);
      return el('div', { className: 'card', style: 'margin-bottom:10px' },
        el('b', { style: 'display:block;margin-bottom:6px', text: label }),
        el('div', { className: 'field', style: 'margin:0 0 6px' }, el('label', { text: 'Tiền đầu ngày' }),
          el('input', { className: 'input num', type: 'number', min: 0, value: s.opening, onInput: e => { s.opening = e.target.value; endEl.textContent = app.formatMoney(endV()); updDiff(); } })),
        row('Thu trong ngày', el('span', { className: 'num', text: app.formatMoney(s.tin) })),
        row('Chi trong ngày', el('span', { className: 'num', text: app.formatMoney(s.tout) })),
        row('Cuối ngày', endEl),
        el('div', { className: 'chips', style: 'margin-top:8px' }, okBtn, diffBtn),
        (s.diffOpen || s.status === 'diff') ? el('div', { style: 'margin-top:8px' },
          el('div', { className: 'field', style: 'margin:0 0 6px' }, el('label', { text: 'Tiền thực tế đếm được' }),
            el('input', { className: 'input num', type: 'number', value: s.actual, onInput: e => { s.actual = e.target.value; updDiff(); } })),
          diffEl,
          el('div', { className: 'field', style: 'margin:6px 0' }, el('label', { text: 'Ghi chú' }), el('input', { className: 'input', maxlength: 300, value: s.note, onInput: e => { s.note = e.target.value; } })),
          el('button', { type: 'button', className: 'btn btn-primary btn-sm', text: 'Lưu số lệch', onClick: e => save(m, 'diff', e.currentTarget) })) : null,
        (!s.status) ? el('div', { style: 'margin-top:6px' }, el('button', { type: 'button', className: 'btn btn-sm', text: 'Chỉ lưu tiền đầu ngày', onClick: e => save(m, null, e.currentTarget) })) : null);
    }));
    draw();
    openModal('Kiểm quỹ ' + dmy(day), body, [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })], opener);
  }

  function renderOvKK() {
    stickyHost.replaceChildren();
    if (!ST.kk) { ovLoading('ov_kk', renderOvKK); return; }
    const K = ST.kk, today = app.toVnYmd(new Date());
    const head = (title, sub) => el('div', { style: 'margin:16px 2px 8px' }, el('b', { style: 'font-size:16px', text: title }), sub ? el('small', { className: 'num', style: 'display:block;color:var(--text-sub)', text: sub }) : null);
    const empty = t => el('div', { className: 'empty-state', text: t });

    // 1. Tồn kho hàng bán theo lô
    const lotsOf = id => K.lots.filter(l => l.inv_item_id === id);
    const lotRow = (l, it) => {
      const expAt = l.expiry_at ? new Date(l.expiry_at) : null, ms = expAt ? expAt - new Date() : null;
      const over = ms != null && ms < 0, soon = ms != null && ms >= 0 && ms <= 3 * 86400000;
      const expTxt = expAt ? (l.source === 'batch' ? app.formatVnDateTime(l.expiry_at) : dmy(l.expiry)) : 'chưa khai';
      const used = l.qty_in - l.qty_left - l.qty_expired;
      return el('div', { className: 'line-row', style: 'padding:10px 6px;flex-wrap:wrap;gap:6px' },
        el('div', { className: 'line-main', style: 'flex:1 1 100%' },
          el('b', { text: it.name + ' · ' + l.code }),
          el('small', { className: 'num', text: 'Còn ' + kkNum(l.qty_left) + ' ' + it.unit + ' · Nhập ' + dm(app.toVnYmd(new Date(l.received_at))) + ' (' + kkNum(l.qty_in) + ', đã dùng ' + kkNum(used) + ') · HSD ' + expTxt })),
        over ? el('span', { className: 'badge badge-err', text: 'Hết hạn' }) : (soon ? el('span', { className: 'badge badge-warn', text: 'Sắp hết hạn' }) : null),
        el('button', { type: 'button', className: 'btn btn-sm' + (over ? ' btn-danger' : ''), text: 'Hết HSD', onClick: e => confirmModal('Báo hết HSD lô ' + l.code + '?', 'Còn ' + kkNum(l.qty_left) + ' ' + it.unit + ' ' + it.name + ' sẽ bỏ khỏi kho và ghi là hao hụt.', 'Hết HSD', async () => {
          const { error } = await sb.rpc('expire_lot', { p_lot: l.id });
          if (error) throw error;
          app.showToast('Đã bỏ ' + kkNum(l.qty_left) + ' ' + it.unit + ' khỏi kho', 'accent');
          await kkRefresh();
        }, e.currentTarget) }),
        // bán thành phẩm: HSD theo giờ (công thức, mốc lúc nhập thực tế, tự sửa được); hàng hóa / nguyên liệu: theo ngày
        kebab({ text: 'Sửa HSD', fn: e => openLotExpiryModal(l, e.currentTarget, it.kind === 'btp') }));
    };
    const unlRow = it => {
      const unl = it.qty - K.lots.filter(l => l.inv_item_id === it.id).reduce((a, l) => a + Number(l.qty_left), 0);
      if (!(unl > 1e-9)) return null;
      return el('div', { className: 'line-row', style: 'padding:10px 6px' },
        el('div', { className: 'line-main' }, el('b', { text: it.name + ' · Tồn cũ' }), el('small', { className: 'num', text: 'Còn ' + kkNum(unl) + ' ' + it.unit + ' · chưa có lô' + (it.kind === 'btp' ? ' (HSD khai ở Công thức)' : '') })),
        it.kind === 'btp' ? null : el('button', { type: 'button', className: 'btn btn-sm', text: 'Khai HSD', onClick: e => openOpeningLotModal(it, unl, e.currentTarget) }));
    };
    const group = (title, items, showUnl) => {
      const rows = [];
      for (const it of items) {
        K.lots.filter(l => l.inv_item_id === it.id && l.qty_left > 0).sort((a, b) => (a.expiry_at || '9999') < (b.expiry_at || '9999') ? -1 : 1).forEach(l => rows.push(lotRow(l, it)));
        if (showUnl) { const r = unlRow(it); if (r) rows.push(r); }
      }
      return el('div', { className: 'card', style: 'margin-bottom:10px' }, el('b', { style: 'display:block;margin-bottom:4px', text: title }), rows.length ? rows : empty('Không có hàng trong kho.'));
    };
    const byKind = k => ST.invItems.filter(i => i.kind === k && i.active !== false);
    const hsdOther = ST.invItems.filter(i => ['nl', 'bb', 'ccdc', 'khac'].includes(i.kind) && K.lots.some(l => l.inv_item_id === i.id && l.expiry && l.qty_left > 0));
    const stockSec = [
      head('Tồn kho hàng bán'),
      group('Bán thành phẩm', byKind('btp'), true),
      group('Hàng hóa', byKind('hh'), true),
      hsdOther.length ? group('Vật tư có HSD', hsdOther, false) : null
    ];

    // 2. Kiểm quỹ
    const days = []; for (let i = 0; i < 14; i++) days.push(app.shiftYmd(today, -i));
    const dayTot = {};
    for (const e of K.cash) {
      const d = app.toVnYmd(new Date(e.at)), m = cashMethodOf(e.pay_method_id);
      const t = dayTot[d] || (dayTot[d] = { cash: 0, bank: 0 });
      t[m] += e.dir === 'in' ? e.amount : -e.amount;
    }
    const endOf = (d, m) => { const ck = K.checks.find(c => c.day === d && c.method === m); return (ck ? ck.opening : 0) + ((dayTot[d] || {})[m] || 0); };
    const cashSec = [
      head('Kiểm quỹ', 'Tiền quỹ cuối mỗi ngày (14 ngày gần nhất)'),
      el('div', { className: 'card' }, days.map(d => {
        const cks = K.checks.filter(c => c.day === d);
        const anyDiff = cks.some(c => c.status === 'diff'), allOk = cks.length === 2 && cks.every(c => c.status === 'ok');
        return el('div', { className: 'line-row', style: 'padding:10px 6px' },
          el('div', { className: 'line-main' },
            el('b', { text: dmy(d) + (d === today ? ' (hôm nay)' : '') }),
            el('small', { className: 'num', text: 'Tiền mặt ' + app.formatMoney(endOf(d, 'cash')) + ' · Ngân hàng ' + app.formatMoney(endOf(d, 'bank')) })),
          anyDiff ? el('span', { className: 'badge badge-err', text: 'Lệch' }) : (allOk ? el('span', { className: 'badge', text: 'Đúng' }) : null),
          el('button', { type: 'button', className: 'btn btn-sm', text: 'Xem', onClick: e => openCashCheckModal(d, e.currentTarget) }));
      }))
    ];

    // 3. Trả nợ: các phiếu mua chưa trả hết
    const debtTotal = ST.debts.reduce((a, p) => a + (p.total - p.paid), 0);
    const debtSec = [
      head('Trả nợ', ST.debts.length ? ST.debts.length + ' phiếu · Còn nợ ' + app.formatMoney(debtTotal) : ''),
      el('div', { className: 'card' }, ST.debts.length ? ST.debts.map(p => {
        const left = p.total - p.paid, overdue = p.due_date && p.due_date < today;
        return el('div', { className: 'line-row', style: 'padding:10px 6px' },
          el('div', { className: 'line-main' },
            el('b', { className: 'num', text: p.code + ' · ' + p.place }),
            el('small', { className: 'num', text: 'Còn nợ ' + app.formatMoney(left) + ' / ' + app.formatMoney(p.total) + (p.due_date ? ' · Hẹn ' + dmy(p.due_date) : '') })),
          overdue ? el('span', { className: 'badge badge-err', text: 'Quá hạn' }) : null,
          el('button', { type: 'button', className: 'btn btn-sm', text: 'Xem', onClick: e => openPurchaseDetailModal(p, e.currentTarget) }),
          el('button', { type: 'button', className: 'btn btn-sm btn-primary', text: 'Trả nợ', onClick: e => openCashModal(null, e.currentTarget, { cat: 'tra_no_ncc', supplier: p.place, amount: left }) }));
      }) : empty('Không còn khoản nợ nào.'))
    ];

    contentHost.replaceChildren(renderMetaBar('ov_kk', kkRefresh), ...stockSec.filter(Boolean), ...cashSec, ...debtSec);
  }

  /* ===== NHẬT KÝ: xem tổng quan hoạt động trong ngày (chỉ đọc lại dữ liệu các tab khác) ===== */
  async function loadOvLog() {
    if (!ST.logDate) ST.logDate = app.toVnYmd(new Date());
    const day = ST.logDate, from = day + 'T00:00:00+07:00', to = day + 'T23:59:59+07:00';
    const sh = shopId;
    const [ord, pur, cash, bat, mv, inv] = await Promise.all([
      sb.from('orders').select('id,code,total,status,order_items(name,qty,is_gift)').eq('shop_id', sh).neq('status', 'cancelled').gte('ordered_at', from).lte('ordered_at', to).limit(1000),
      sb.from('purchases').select('id,code,at,place,total,on_credit,purchase_lines(name,qty,unit,cost)').eq('shop_id', sh).gte('at', from).lte('at', to).order('at', { ascending: true }),
      sb.from('cash_entries').select('dir,amount').eq('shop_id', sh).gte('at', from).lte('at', to).limit(2000),
      sb.from('batches').select('id,code,at,out_item_id,out_qty,cost_total,status,note').eq('shop_id', sh).gte('at', from).lte('at', to).order('at', { ascending: true }),
      sb.from('stock_moves').select('inv_item_id,at,kind,qty').eq('shop_id', sh).gte('at', from).limit(5000),
      sb.from('inv_items').select('id,name,unit,kind,qty').eq('shop_id', sh)
    ]);
    for (const r of [ord, pur, cash, bat, mv, inv]) if (r.error) throw r.error;
    ST.logData = { ord: ord.data || [], pur: pur.data || [], cash: cash.data || [], bat: bat.data || [], mv: mv.data || [], inv: inv.data || [], to };
  }
  function shiftLogDay(n) { ST.logDate = app.shiftYmd(ST.logDate, n); ST.logData = null; loadTabData('ov_log').then(renderOvLog).catch(e => showErr(e)); }
  function renderOvLog() {
    stickyHost.replaceChildren();
    if (!ST.logDate) ST.logDate = app.toVnYmd(new Date());
    const redraw = async () => { await loadTabData('ov_log'); renderOvLog(); };
    const dateBar = el('div', { className: 'row-between', style: 'gap:8px;margin-bottom:4px' },
      el('button', { type: 'button', className: 'btn', 'aria-label': 'Ngày trước', onClick: () => shiftLogDay(-1), text: '‹' }),
      el('input', { className: 'input', type: 'date', style: 'flex:1;text-align:center', value: ST.logDate, onChange: e => { if (!e.target.value) return; ST.logDate = e.target.value; ST.logData = null; redraw(); } }),
      el('button', { type: 'button', className: 'btn', 'aria-label': 'Ngày sau', onClick: () => shiftLogDay(1), text: '›' }));
    if (!ST.logData) { contentHost.replaceChildren(renderMetaBar('ov_log', redraw), dateBar, el('div', { className: 'empty-state', text: 'Đang tải…' })); return; }
    const D = ST.logData, money = n => app.formatMoney(Math.round(n));
    const head = (title, sub) => el('div', { style: 'margin:16px 2px 8px' }, el('b', { style: 'font-size:16px', text: title }), sub ? el('small', { className: 'num', style: 'display:block;color:var(--text-sub)', text: sub }) : null);
    const row = (main, sub, right) => el('div', { className: 'line-row', style: 'padding:10px 6px' }, el('div', { className: 'line-main' }, el('b', { text: main }), sub ? el('small', { className: 'num', text: sub }) : null), right != null ? el('b', { className: 'num', text: right }) : null);
    const empty = txt => el('div', { className: 'empty-state', text: txt });
    const hhmm = iso => { const d = new Date(iso); return app.pad2(d.getHours()) + ':' + app.pad2(d.getMinutes()); };
    const invBy = new Map(D.inv.map(i => [i.id, i]));

    // 1. Bán hàng
    const sold = new Map(); let revenue = 0;
    for (const o of D.ord) { revenue += o.total || 0; for (const it of (o.order_items || [])) { if (it.is_gift) continue; sold.set(it.name, (sold.get(it.name) || 0) + it.qty); } }
    const sale = el('div', { className: 'card' }, D.ord.length ? [
      row(D.ord.length + ' đơn', null, money(revenue)),
      ...[...sold.entries()].sort((a, b) => b[1] - a[1]).map(([n, q]) => row(n, null, 'x' + q))
    ] : empty('Chưa có đơn nào.'));

    // 2. Mua hàng
    const buyTotal = D.pur.reduce((a, p) => a + p.total, 0);
    const buy = el('div', { className: 'card' }, D.pur.length ? D.pur.map(p => row(
      hhmm(p.at) + ' · ' + p.place + (p.on_credit ? ' · Nợ NCC' : ''),
      (p.purchase_lines || []).map(l => l.name + ' ' + l.qty + ' ' + l.unit).join(', '), money(p.total))) : empty('Không có phiếu mua.'));

    // 3. Dòng tiền
    let cin = 0, cout = 0; for (const c of D.cash) { if (c.dir === 'in') cin += c.amount; else cout += c.amount; }
    const flow = el('div', { className: 'kpi-row2', style: 'grid-template-columns:repeat(3,minmax(0,1fr));gap:8px' },
      el('div', { className: 'kpi-box' }, el('small', { text: 'Thu vào' }), el('b', { className: 'num', style: 'font-size:15px', text: money(cin) })),
      el('div', { className: 'kpi-box' }, el('small', { text: 'Chi ra' }), el('b', { className: 'num', style: 'font-size:15px', text: money(cout) })),
      el('div', { className: 'kpi-box' }, el('small', { text: 'Chênh lệch' }), el('b', { className: 'num', style: 'font-size:15px;' + (cin - cout < 0 ? 'color:var(--error)' : ''), text: money(cin - cout) })));

    // 4. Sản xuất
    const prod = el('div', { className: 'card' }, D.bat.length ? D.bat.map(b => { const it = invBy.get(b.out_item_id); return row(hhmm(b.at) + ' · ' + (it ? it.name : 'Mẻ nấu'), (b.code ? 'Mã mẻ ' + b.code + ' · ' : '') + 'Chi phí NVL: ' + money(b.cost_total) + (b.status === 'cooking' ? ' · đang nấu' : ''), b.status === 'cooking' && !(b.out_qty > 0) ? 'Đang nấu' : '+' + b.out_qty + ' ' + (it ? it.unit : '')); }) : empty('Không nấu mẻ nào.'));

    // 5. Nhập xuất kho: tồn cuối ngày = tồn hiện tại trừ biến động các ngày sau
    const per = new Map();
    for (const m of D.mv) {
      const p = per.get(m.inv_item_id) || { in: 0, out: 0, after: 0 };
      if (m.at > D.to) p.after += Number(m.qty); else if (m.qty > 0) p.in += Number(m.qty); else p.out += -Number(m.qty);
      per.set(m.inv_item_id, p);
    }
    const stockRows = [...per.entries()].filter(([, p]) => p.in || p.out).map(([id, p]) => ({ it: invBy.get(id), p })).filter(x => x.it)
      .sort((a, b) => String(a.it.name).localeCompare(String(b.it.name), 'vi'));
    const num = n => String(Math.round(n * 100) / 100);
    const stock = el('div', { className: 'card' }, stockRows.length ? stockRows.map(({ it, p }) => {
      const end = Number(it.qty) - p.after;
      return row(it.name, 'Nhập ' + num(p.in) + ' · Xuất ' + num(p.out) + ' ' + it.unit, 'Tồn ' + num(end));
    }) : empty('Kho không biến động.'));

    contentHost.replaceChildren(renderMetaBar('ov_log', redraw), dateBar,
      head('Bán hàng', D.ord.length + ' đơn · ' + money(revenue)), sale,
      head('Mua hàng', D.pur.length ? D.pur.length + ' phiếu · ' + money(buyTotal) : ''), buy,
      head('Dòng tiền'), flow,
      head('Sản xuất'), prod,
      head('Nhập xuất kho'), stock);
  }

  // Tổng quan = Tồn kho: một màn hình dài, theo thứ tự Bán thành phẩm, NVL, Bao bì, CCDC, Khác
  function renderOvStock() {
    stickyHost.replaceChildren();
    if (!ST.loadedAt.ov_stock) { ovLoading('ov_stock', renderOvStock); return; }
    const q = fold(ST.invSearch.trim());
    const isOut = it => it.active && it.qty <= 0;
    const isLow = it => it.active && it.qty > 0 && it.min_stock > 0 && it.qty <= it.min_stock;
    const match = it => (!ST.invLowOnly || isLow(it) || isOut(it)) && (!q || fold(it.name).includes(q));
    const acts = it => kebab({ text: 'Kiểm kho', fn: e => openAdjustStockModal(it, e.currentTarget) }, { text: 'Sửa vật tư', fn: e => openInvItemModal(it, e.currentTarget) }, { text: 'Lịch sử nhập xuất', fn: e => openStockMovesModal(it, e.currentTarget) });
    const value = list => list.filter(i => i.active).reduce((a, i) => a + Math.max(0, i.qty) * i.avg_cost, 0);
    const secHead = (title, list, defKind) => el('div', { className: 'row-between', style: 'margin:16px 2px 8px' },
      el('div', null, el('b', { style: 'font-size:16px', text: title }),
        el('small', { className: 'num', style: 'display:block;color:var(--text-sub)', text: 'Giá trị: ' + app.formatMoney(Math.round(value(list))) })),
      el('button', { type: 'button', className: 'btn', onClick: e => openInvItemModal(null, e.currentTarget, null, defKind), text: '+ Thêm' }));
    const listCard = items => el('div', { className: 'card' }, items.length ? items.map(it => {
      const low = isLow(it), out = isOut(it);
      return el('div', { className: 'line-row' + ((low || out) ? ' low-row' : ''), style: 'padding:10px 6px;border-radius:8px' },
        el('div', { className: 'line-main' },
          el('b', { text: it.name + (it.active ? '' : ' (Ngưng dùng)') }),
          el('small', { className: 'num', text: 'Tồn: ' + it.qty + ' ' + it.unit + ' · Giá BQ: ' + app.formatMoney(it.avg_cost) + ' · Giá trị: ' + app.formatMoney(it.qty * it.avg_cost) })),
        out ? el('span', { className: 'badge badge-err', text: 'Hết hàng' }) : (low ? el('span', { className: 'badge badge-warn', text: 'Sắp hết' }) : null),
        acts(it));
    }) : el('div', { className: 'empty-state', text: 'Không có mục nào.' }));
    const kindList = k => ST.invItems.filter(i => i.kind === k);
    const sec = (title, k) => [secHead(title, kindList(k), k), listCard(kindList(k).filter(match))];
    const total = value(ST.invItems), nLow = ST.invItems.filter(isLow).length, nOut = ST.invItems.filter(isOut).length;

    contentHost.replaceChildren(
      renderMetaBar('ov_stock', async () => { await loadTabData('ov_stock'); renderOvStock(); }),
      el('div', { className: 'kpi-box', style: 'margin-bottom:8px' }, el('small', { text: 'Tổng giá trị kho' }), el('b', { className: 'num', text: app.formatMoney(Math.round(total)) })),
      el('div', { className: 'kpi-row2', style: 'margin-bottom:10px' },
        el('div', { className: 'kpi-box' }, el('small', { text: 'Sắp hết' }), el('b', { className: 'num', style: nLow > 0 ? 'color:var(--error)' : '', text: String(nLow) })),
        el('div', { className: 'kpi-box' }, el('small', { text: 'Hết hàng' }), el('b', { className: 'num', style: nOut > 0 ? 'color:var(--error)' : '', text: String(nOut) }))),
      el('div', { className: 'row-between', style: 'gap:8px' },
        el('input', { className: 'input', style: 'flex:1 1 180px', type: 'search', placeholder: 'Tìm tên…', value: ST.invSearch, onInput: e => { ST.invSearch = e.target.value; renderOvStock(); refocusSearch(); } }),
        el('button', { type: 'button', className: 'chip', 'aria-pressed': String(ST.invLowOnly), onClick: () => { ST.invLowOnly = !ST.invLowOnly; renderOvStock(); }, text: 'Sắp hết / hết' })),
      ...sec('Bán thành phẩm', 'btp'), ...sec('Hàng hóa', 'hh'), ...sec('NVL', 'nl'), ...sec('Bao bì', 'bb'), ...sec('CCDC', 'ccdc'), ...sec('Khác', 'khac')
    );
  }

  // Danh sách nợ nhà cung cấp (mở từ tab Thu chi)
  function openDebtListModal(opener) {
    const today = app.toVnYmd(new Date());
    const byPlace = new Map();
    for (const p of ST.debts) {
      const left = p.total - p.paid;
      if (!byPlace.has(p.place)) byPlace.set(p.place, { total: 0, list: [], overdue: false });
      const g = byPlace.get(p.place);
      g.total += left; g.list.push(p);
      if (p.due_date && p.due_date < today) g.overdue = true;
    }
    openModal('Nợ nhà cung cấp', byPlace.size ? el('div', null, [...byPlace.entries()].map(([place, grp]) => el('div', { className: 'line-row' },
      el('div', { className: 'line-main' }, el('b', { text: place }), el('small', { className: 'num', text: grp.list.length + ' phiếu · Còn nợ ' + app.formatMoney(grp.total) })),
      grp.overdue ? el('span', { className: 'badge badge-err', text: 'Quá hạn' }) : null,
      el('button', { type: 'button', className: 'btn btn-sm', onClick: e => { closeModal(); openDebtDetailModal(place, grp, e.currentTarget); }, text: 'Xem' })
    ))) : el('div', { className: 'empty-state', text: 'Không còn khoản nợ nhà cung cấp nào.' }), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })], opener);
  }
  function openDebtDetailModal(place, grp, opener) {
    const today = app.toVnYmd(new Date());
    openModal(place, el('div', null,
      el('div', { className: 'alert', style: 'margin-bottom:10px', text: 'Mọi khoản trả nợ ghi ở tab Thu chi, hệ thống tự trừ vào các phiếu nợ cũ trước.' }),
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px' },
        el('button', { type: 'button', className: 'btn btn-primary btn-sm', text: 'Trả nợ (ghi ở Thu chi)', onClick: e => { closeModal(); openCashModal(null, e.currentTarget, { cat: 'tra_no_ncc', supplier: place, amount: grp.total }); } }),
        el('button', { type: 'button', className: 'btn btn-sm', text: 'Lịch sử trả', onClick: e => { closeModal(); openSupplierPaysModal(place, e.currentTarget); } })),
      grp.list.map(p => {
        const left = p.total - p.paid, overdue = p.due_date && p.due_date < today;
        return el('div', { className: 'line-row' },
          el('div', { className: 'line-main' },
            el('b', { className: 'num', text: p.code + ' · Còn nợ ' + app.formatMoney(left) }),
            el('small', { text: 'Tổng ' + app.formatMoney(p.total) + ' · Đã trả ' + app.formatMoney(p.paid) + (p.due_date ? ' · Hẹn ' + p.due_date.split('-').reverse().join('/') : '') })),
          overdue ? el('span', { className: 'badge badge-err', text: 'Quá hạn' }) : null);
      })
    ), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })], opener);
  }

  /* ===== KHỞI CHẠY BAN ĐẦU ===== */
  try {
    await Promise.all([loadShopFull(), loadPayMethods(), loadOnlineOrders(false)]);
    renderShopHeader();
    try { await Promise.all([loadMenu(), loadCustomersBase()]); } catch (e) {}
    await loadTabData('online');
    renderCurrentTab();
  } catch (err) {
    showErr(err);
  }
})();
</script>
</body>
</html>
