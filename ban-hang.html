  function resetBuyForm() {
    ST.buyEditId = null;
    ST.buyForm = {
      at: '', place: '', pay_method_id: activePayMethods()[0] ? activePayMethods()[0].id : null,
      on_credit: false, due_date: '', note: '',
      lines: [{ grp: 'nl', name: '', unit: 'kg', qty: '', cost: '', inv_item_id: null }]
    };
  }

  async function submitPurchase(btn) {
    const bf = ST.buyForm;
    if (!bf.place.trim()) { app.showToast('Nhập nơi mua / nhà cung cấp', 'error'); return; }
    const lines = [];
    for (const l of bf.lines) {
      const qty = Number(l.qty);
      const cost = Math.round(Number(l.cost));
      if (!l.name.trim() || !(qty > 0) || Number.isNaN(cost) || cost < 0) {
        app.showToast('Kiểm tra lại tên hàng, số lượng (>0) và thành tiền (≥0)', 'error');
        return;
      }
      lines.push({ grp: l.grp, name: l.name.trim(), unit: l.unit.trim() || 'cái', qty, cost, inv_item_id: l.inv_item_id || null, expiry: (BUY_INV_GRPS.includes(l.grp) && l.expiry) ? l.expiry : null });
    }
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      const { data, error } = await sb.rpc('save_purchase', {
        p_shop: shopId, p_purchase: ST.buyEditId || null, p_at: localDtToIso(bf.at),
        p_place: bf.place.trim(), p_pay_method: bf.on_credit ? null : bf.pay_method_id,
        p_on_credit: bf.on_credit, p_due: bf.on_credit && bf.due_date ? bf.due_date : null,
        p_note: bf.note.trim(), p_lines: lines
      });
      if (error) throw error;
      app.showToast('Đã lưu phiếu ' + data.code + ' · ' + app.formatMoney(data.total), 'accent');
      resetBuyForm();
      await Promise.all([loadPurchases(), loadDebts(), loadInvItems()]);
      renderBuyTab();
    } catch (err) { showErr(err); btn.disabled = false; btn.textContent = 'Lưu phiếu mua'; }
  }

  function renderDebtView(seg) {
    stickyHost.replaceChildren();
    const today = app.toVnYmd(new Date());
    const byPlace = new Map();
    let grandTotal = 0;
    for (const p of ST.debts) {
      const left = p.total - p.paid;
      grandTotal += left;
      if (!byPlace.has(p.place)) byPlace.set(p.place, { total: 0, list: [] });
      byPlace.get(p.place).total += left;
      byPlace.get(p.place).list.push(p);
    }

    contentHost.replaceChildren(
      renderMetaBar('buy', async () => { await loadDebts(); renderBuyTab(); }),
      seg,
      el('div', { className: 'alert', text: 'Phiếu mua chỉ ghi lại lúc mua. Mọi khoản trả nợ ghi ở tab Thu chi, hệ thống tự trừ vào các phiếu nợ cũ trước.' }),
      el('div', { className: 'card row-between' },
        el('span', { style: 'font-weight:700', text: 'Tổng nợ nhà cung cấp' }),
        el('b', { className: 'num', style: 'font-size:20px;color:var(--error)', text: app.formatMoney(grandTotal) })
      ),
      byPlace.size ? [...byPlace.entries()].map(([place, grp]) => el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:6px' },
          el('b', { text: place }),
          el('b', { className: 'num', style: 'color:var(--error)', text: app.formatMoney(grp.total) })
        ),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px' },
          el('button', { type: 'button', className: 'btn btn-primary btn-sm', text: 'Trả nợ (ghi ở Thu chi)', onClick: e => openCashModal(null, e.currentTarget, { cat: 'tra_no_ncc', supplier: place, amount: grp.total }) }),
          el('button', { type: 'button', className: 'btn btn-sm', text: 'Lịch sử trả', onClick: e => openSupplierPaysModal(place, e.currentTarget) })
        ),
        grp.list.map(p => {

          return el('div', { className: 'line-row' },

              el('small', { text: 'Tổng ' + app.formatMoney(p.total) + ' · Đã trả ' + app.formatMoney(p.paid) + (p.due_date ? ' · Hẹn ' + p.due_date.split('-').reverse().join('/') : '') })

  async function loadAllRecipeFlags() {
    const { data } = await sb.from('recipes').select('menu_item_id,inv_item_id,qty').eq('shop_id', shopId);
    ST.allRecipes = data || [];

  async function loadRecipesForMenu(menuId) {
    const { data, error } = await sb.from('recipes').select('*').eq('shop_id', shopId).eq('menu_item_id', menuId);
    if (error) throw error;
    ST.recipes = data || [];
  }

  // Nhóm thành phần định mức theo thứ tự: Nước cốt, Siro, Đá, Bao bì
  const RECIPE_GROUPS = ['Nước cốt', 'Siro', 'Đá', 'Bao bì'];
  function recipeGroupOf(iv) {
    const n = String((iv && iv.name) || '').toLowerCase();
    if (/siro|xi\s?rô|xirô|syrup/.test(n)) return 'Siro';
    if (/(^|\s)đá(\s|$)/.test(n)) return 'Đá';
    if ((iv && iv.kind === 'bb') || /chai|nắp|tem|nhãn|ống hút|bịch|túi|hộp|muỗng|bao bì/.test(n)) return 'Bao bì';
    return 'Nước cốt';
  }
  function recipeGroupedRows(invMap, rowOf) {
    const buckets = new Map(RECIPE_GROUPS.map(g => [g, []]));
    for (const r of ST.recipes) buckets.get(recipeGroupOf(invMap.get(r.inv_item_id))).push(r);
    const out = [];
    for (const g of RECIPE_GROUPS) {
      const list = buckets.get(g);
      if (!list.length) continue;
      const sub = list.reduce((a, r) => { const iv = invMap.get(r.inv_item_id); return a + (iv ? Number(r.qty) * Number(iv.avg_cost || 0) : 0); }, 0);
      out.push(el('div', { className: 'row-between', style: 'margin:14px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--accent)' },
        el('b', { style: 'color:var(--accent)', text: g }),
        el('small', { className: 'num', style: 'color:var(--text-sub)', text: app.formatMoney(sub) })));
      for (const r of list) out.push(rowOf(r));
    }
    return out;
  }

  // Danh sách định mức của tất cả món (hiện ở cuối tab)

    const by = new Map();
    for (const r of (ST.allRecipes || [])) { if (!by.has(r.menu_item_id)) by.set(r.menu_item_id, []); by.get(r.menu_item_id).push(r); }
    const rows = ST.menuItems.map(m => {
      const list = by.get(m.id) || [];

    });
    const done = rows.filter(x => x.list.length).length;
    return el('div', { className: 'card' },
      el('div', { className: 'row-between', style: 'margin-bottom:8px' },

  async function loadCashCats() {
    const { data } = await sb.from('cash_cats').select('*').eq('shop_id', shopId).order('created_at');
    ST.cashCats = data || [];
  }
  const allCashCats = () => CASH_CATS.concat((ST.cashCats || []).map(c => ({ id: 'x:' + c.label, label: c.label, dir: c.dir, custom: c })));
  const cashCatOf = id => allCashCats().concat(AUTO_CATS).find(x => x.id === id) || { id, label: String(id).replace(/^x:/, ''), dir: 'out' };
  async function loadCashEntries() {
    const { data, error } = await sb.from('cash_entries').select('*').eq('shop_id', shopId)
      .gte('at', ST.cashFrom + 'T00:00:00+07:00').lte('at', ST.cashTo + 'T23:59:59+07:00')
      .order('at', { ascending: false });
    if (error) throw error;
    ST.cashEntries = data || [];
    const tdy = app.toVnYmd(new Date());
    const td = await sb.from('cash_entries').select('dir,amount').eq('shop_id', shopId).gte('at', tdy + 'T00:00:00+07:00').lte('at', tdy + 'T23:59:59+07:00');
    if (td.error) throw td.error;
    ST.cashToday = { in: 0, out: 0 };
    for (const c of (td.data || [])) { if (c.dir === 'in') ST.cashToday.in += c.amount; else ST.cashToday.out += c.amount; }
    await Promise.all([loadCashCats(), app.hasPlan('pro') ? loadDebts() : Promise.resolve()]);
  }

  function renderCashTab() {
    const tdy = app.toVnYmd(new Date()), mStart = tdy.slice(0, 8) + '01', pmEnd = app.shiftYmd(mStart, -1);
    const cashPresets = [['Hôm nay', tdy, tdy], ['7 ngày', app.shiftYmd(tdy, -6), tdy], ['Tháng này', mStart, tdy], ['Tháng trước', pmEnd.slice(0, 8) + '01', pmEnd]];
    let totalIn = 0, totalOut = 0;
    for (const c of ST.cashEntries) { if (c.dir === 'in') totalIn += c.amount; else totalOut += c.amount; }
    const debtNcc = (ST.debts || []).reduce((a, p) => a + (p.total - p.paid), 0);
    const tIn = (ST.cashToday && ST.cashToday.in) || 0, tOut = (ST.cashToday && ST.cashToday.out) || 0;
    const statRow = (label, val, o) => {

    const reopen = () => openCashModal(entry, opener, f);

      at: entry ? toLocalDtValue(entry.at) : toLocalDtValue(null),

      amount: entry ? entry.amount : '',
      pay_method_id: entry ? entry.pay_method_id : (activePayMethods()[0] ? activePayMethods()[0].id : null),
      note: entry ? (entry.note || '') : '',
      supplier: entry ? (entry.supplier || '') : ''
    }, saved || {});
    const debtBySup = () => {
      const m = new Map();
      for (const p of (ST.debts || [])) m.set(p.place, (m.get(p.place) || 0) + (p.total - p.paid));
      return m;
    };
    const body = el('div');
    const draw = () => {
      body.replaceChildren(
        el('div', { className: 'field' },
          el('label', { text: 'Loại thu / chi' }),
          ['out', 'in'].map(d => el('div', null,
            el('div', { style: 'font-size:13px;font-weight:700;margin:8px 0 4px;color:' + (d === 'in' ? 'var(--accent)' : 'var(--error)'), text: d === 'in' ? 'Khoản thu' : 'Khoản chi' }),
            el('div', { className: 'chips' }, allCashCats().filter(c => c.dir === d).map(c => el('span', { style: 'display:inline-flex;gap:2px;align-items:center' },

              c.custom ? el('button', { type: 'button', className: 'btn btn-sm', 'aria-label': 'Xóa loại ' + c.label, title: 'Xóa loại này', style: 'padding:2px 8px', text: '×', onClick: () => confirmModal('Xóa loại "' + c.label + '"?', 'Các khoản đã ghi vẫn giữ nguyên.', 'Xóa loại', async () => {
                const res = await sb.from('cash_cats').delete().eq('id', c.custom.id).eq('shop_id', shopId).select('id'); checkMutated(res);
                await loadCashCats(); if (f.cat === c.id) f.cat = 'chi_khac'; setTimeout(reopen, 0);
              }, null) }) : null
            )))
          )),
          el('button', { type: 'button', className: 'btn btn-sm', style: 'margin-top:10px', text: '+ Thêm loại mới', onClick: () => openNewCashCat(f.cat && cashCatOf(f.cat).dir, async (id) => { await loadCashCats(); if (id) f.cat = id; reopen(); }) })
        ),
        f.cat === 'tra_no_ncc' ? el('div', { className: 'field' },
          el('label', { text: 'Trả nợ cho nhà cung cấp nào' }),
          debtBySup().size ? el('div', { className: 'chips' }, [...debtBySup().entries()].map(([sp, left]) => el('button', {
            type: 'button', className: 'chip', 'aria-pressed': String(f.supplier === sp),
            onClick: () => { f.supplier = sp; f.amount = left; draw(); }, text: sp + ' · nợ ' + app.formatMoney(left)
          }))) : el('small', { style: 'color:var(--text-sub)', text: 'Hiện không có khoản nợ nhà cung cấp nào.' }),
          f.supplier && debtBySup().has(f.supplier) ? el('small', { style: 'display:block;margin-top:4px;color:var(--text-sub)', text: 'Có thể trả một phần hoặc trả hết. Hệ thống tự trừ vào phiếu nợ cũ nhất trước.' }) : null
        ) : null,
        el('div', { className: 'grid-2' },
          el('div', { className: 'field' }, el('label', { text: 'Số tiền (đ)' }), el('input', { className: 'input num', type: 'number', min: 1, value: f.amount, onInput: e => { f.amount = e.target.value; } })),
          el('div', { className: 'field' }, el('label', { text: 'Ngày giờ' }), el('input', { className: 'input', type: 'datetime-local', value: f.at, onChange: e => { f.at = e.target.value; } }))
        ),
        el('div', { className: 'field' },
          el('label', { text: 'Phương thức' }),

            type: 'button', className: 'chip', 'aria-pressed': String(f.pay_method_id === m.id),
            onClick: () => { f.pay_method_id = m.id; draw(); }, text: m.name
          })))
        ),
        el('div', { className: 'field' }, el('label', { text: 'Ghi chú' }), el('input', { className: 'input', value: f.note, onInput: e => { f.note = e.target.value; } }))
      );

      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        const amt = Math.round(Number(f.amount));
        if (!(amt > 0)) { app.showToast('Số tiền phải lớn hơn 0', 'error'); return; }
        const catObj = cashCatOf(f.cat);
        if (catObj.id === 'tra_no_ncc' && !f.supplier) { app.showToast('Chọn nhà cung cấp cần trả nợ', 'error'); return; }
        okBtn.disabled = true; okBtn.textContent = 'Đang lưu…';

  /* ===== TAB: Làm / Sản xuất (gói tối thiểu: pro, đặt cuối nhóm Pro) ===== */
  async function loadBatches() {
    const [{ data, error }, fr] = await Promise.all([
      sb.from('batches').select('*').eq('shop_id', shopId).order('at', { ascending: false }).range(0, 39),
      sb.from('batch_formulas').select('*').eq('shop_id', shopId)]);
    if (error) throw error;
    ST.batches = data || [];
    ST.formulas = fr.data || [];
  }

  // Chọn thành phẩm: nếu có công thức thì tự điền sản lượng và nguyên liệu theo định lượng (vẫn sửa/xóa tay được)
  function applyFormula(outId) {
    const bf = ST.batchForm;
    bf.out_item_id = outId;
    bf.fromFormula = false; bf.base = null;
    const f = (ST.formulas || []).find(x => x.out_item_id === outId);
    if (f && !ST.batchEditId) {
      const have = new Set(ST.invItems.map(i => i.id));
      const lines = (f.lines || []).filter(l => have.has(l.inv_item_id));
      if (lines.length) {
        bf.out_qty = f.out_qty;
        bf.inputs = lines.map(l => ({ inv_item_id: l.inv_item_id, qty: l.qty }));
        bf.fromFormula = true;
        bf.base = { out_qty: Number(f.out_qty), lines: lines.map(l => ({ inv_item_id: l.inv_item_id, qty: Number(l.qty) })) };
      }
    }
  }

  function openFormulaModal(f, opener) {
    const g = { shelf_hours: f && f.shelf_hours ? f.shelf_hours : '', out_item_id: f ? f.out_item_id : '', out_qty: f ? f.out_qty : '', lines: f ? (f.lines || []).map(l => ({ inv_item_id: l.inv_item_id, qty: l.qty })) : [{ inv_item_id: '', qty: '' }] };
    if (!g.lines.length) g.lines = [{ inv_item_id: '', qty: '' }];
    const body = el('div');
    const draw = () => {
      body.replaceChildren(
        el('div', { className: 'field' },
          el('label', { text: 'Làm ra (thành phẩm / bán thành phẩm)' }),
          el('select', { className: 'select', disabled: !!f, onChange: e => { g.out_item_id = e.target.value; draw(); } },
            el('option', { value: '', text: 'Chọn vật tư làm ra…' }),
            invOpts(['btp'], g.out_item_id, [], i => i.name + ' (' + i.unit + ')'))),
        el('div', { className: 'field' }, el('label', { text: 'Mỗi mẻ làm ra được bao nhiêu' }),
          el('input', { className: 'input num', type: 'number', step: 'any', min: 0, value: g.out_qty, onInput: e => { g.out_qty = e.target.value; } })),
        el('div', { className: 'field' }, el('label', { text: 'Hạn sử dụng (số giờ kể từ lúc nhập thực tế, không bắt buộc)' }),
          el('input', { className: 'input num', type: 'number', min: 1, step: 1, placeholder: 'Ví dụ: 72 (= 3 ngày)', value: g.shelf_hours, onInput: e => { g.shelf_hours = e.target.value; } })),
        el('div', { style: 'font-weight:700;margin:12px 0 6px', text: 'Nguyên liệu và định lượng mỗi mẻ' }),
        g.lines.map((l, idx) => {
          const iv = ST.invItems.find(i => i.id === l.inv_item_id);
          return el('div', { className: 'line-row' },
            el('select', { className: 'select', style: 'flex:1 1 100%;min-width:0', onChange: e => { l.inv_item_id = e.target.value; draw(); } },
              el('option', { value: '', text: 'Chọn nguyên liệu…' }),
              invOpts(['nl', 'btp'], l.inv_item_id, [g.out_item_id].concat(g.lines.filter(x => x !== l).map(x => x.inv_item_id)), i => i.name + ' (' + INV_KINDS[i.kind] + ', ' + i.unit + ')')),
            el('input', { className: 'input num', style: 'flex:1 1 120px;min-width:0', type: 'number', step: 'any', min: 0, placeholder: 'Định lượng' + (iv ? ' (' + iv.unit + ')' : ''), value: l.qty, onInput: e => { l.qty = e.target.value; } }),
            g.lines.length > 1 ? el('button', { type: 'button', className: 'btn btn-sm btn-danger', text: 'Xóa', onClick: () => { g.lines.splice(idx, 1); draw(); } }) : null);
        }),
        el('button', { type: 'button', className: 'btn btn-sm', style: 'margin-top:8px', text: '+ Thêm nguyên liệu', onClick: () => { g.lines.push({ inv_item_id: '', qty: '' }); draw(); } })
      );
    };
    draw();
    const ok = el('button', { type: 'button', className: 'btn btn-primary', text: 'Lưu công thức', onClick: async () => {
      const lines = g.lines.filter(l => l.inv_item_id && Number(l.qty) > 0).map(l => ({ inv_item_id: l.inv_item_id, qty: Number(l.qty) }));
      if (!g.out_item_id || !(Number(g.out_qty) > 0) || !lines.length) { app.showToast('Chọn vật tư làm ra, sản lượng > 0 và ít nhất 1 nguyên liệu', 'error'); return; }
      ok.disabled = true; ok.textContent = 'Đang lưu…';
      try {
        const { error } = await sb.rpc('save_formula', { p_shop: shopId, p_out_item: g.out_item_id, p_out_qty: Number(g.out_qty), p_lines: lines, p_shelf_hours: Number(g.shelf_hours) > 0 ? Math.round(Number(g.shelf_hours)) : null });
        if (error) throw error;
        closeModal(); app.showToast('Đã lưu công thức', 'accent');
        await loadBatches(); renderBatchTab();
      } catch (err) { showErr(err); ok.disabled = false; ok.textContent = 'Lưu công thức'; }
    } });
    openModal(f ? 'Sửa công thức sản xuất' : 'Thêm công thức sản xuất', body, [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), ok], opener);
  }

  function refocusSearch() {
    const n = contentHost.querySelector('input[type=search]');
    if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) {} }
  }

  function renderBatchTab() {
    const bf = ST.batchForm;
    const invMap = new Map(ST.invItems.map(i => [i.id, i]));
    let estTotal = 0;
    for (const inp of bf.inputs) {
      const iv = invMap.get(inp.inv_item_id);
      if (iv && Number(inp.qty) > 0) estTotal += Number(inp.qty) * Number(iv.avg_cost || 0);
    }
    const estUnit = Number(bf.out_qty) > 0 ? estTotal / Number(bf.out_qty) : 0;
    const estSpan = el('span', { className: 'num', style: 'font-size:14px;font-weight:600' });
    const updBatchEst = () => {
      let t = 0;
      for (const inp of bf.inputs) { const iv = ST.invItems.find(x => x.id === inp.inv_item_id); if (iv && Number(inp.qty) > 0) t += Number(inp.qty) * Number(iv.avg_cost || 0); }
      const u = Number(bf.out_qty) > 0 ? t / Number(bf.out_qty) : 0;
      estSpan.textContent = 'Giá vốn dự kiến: ' + app.formatMoney(t) + (u > 0 ? ' (' + app.formatMoney(u) + '/đv)' : '');
    };
    updBatchEst();

    const rowInps = [];
    const r3 = v => Math.round(v * 1000) / 1000;
    const isActualEdit = !!ST.batchEditId && ST.batchEditStatus === 'done';
    // Nhập sản lượng dự kiến thì nguyên liệu trong công thức tự co giãn theo (vẫn sửa tay từng dòng được)
    const outQtyInp = el('input', { className: 'input num', type: 'number', step: 'any', min: 0, value: bf.out_qty, onInput: e => {
      bf.out_qty = e.target.value;
      const x = Number(bf.out_qty);
      if (bf.base && x > 0) {
        const k = x / bf.base.out_qty;
        bf.inputs.forEach((inp, i) => { const bl = bf.base.lines.find(l => l.inv_item_id === inp.inv_item_id); if (bl) { inp.qty = r3(bl.qty * k); if (rowInps[i]) rowInps[i].value = inp.qty; } });
      }
      updBatchEst();
    } });
    const formCard = el('div', { className: 'card' },
      el('div', { className: 'row-between', style: 'margin-bottom:8px' },
        el('b', { text: ST.batchEditId ? 'Đang sửa nhật ký sản xuất' : 'Ghi nhật ký sản xuất' }),
        el('div', { style: 'display:flex;gap:6px' },
          ST.batchEditId ? el('button', { type: 'button', className: 'btn btn-sm', onClick: () => { resetBatchForm(); renderBatchTab(); }, text: 'Hủy sửa' }) : null,
          bf.out_item_id ? el('button', { type: 'button', className: 'btn btn-sm', onClick: () => fillFromLatestBatch(bf.out_item_id), text: 'Lấy theo mẻ gần nhất' }) : null
        )
      ),
      el('div', { className: 'grid-2' },
        el('div', { className: 'field' },
          el('div', { className: 'row-between', style: 'margin-bottom:4px' },
            el('label', { style: 'margin:0', text: 'Vật tư làm ra' }),
            el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openInvItemModal(null, e.currentTarget, () => renderBatchTab()), text: '+ Tạo mới' })
          ),
          el('select', { className: 'select', onChange: e => { applyFormula(e.target.value); renderBatchTab(); } },
            el('option', { value: '', text: 'Chọn thành phẩm / bán thành phẩm…' }),
            invOpts(['btp'], bf.out_item_id, [], i => i.name + ' (' + i.unit + ')' + ((ST.formulas || []).some(f => f.out_item_id === i.id) ? ' · có công thức' : ''))
          )
        ),

  async function loadFlow() {
    const today = app.toVnYmd(new Date());
    const [, , , , wf, od, pr] = await Promise.all([loadMenu(), loadInvItems(), loadAllRecipeFlags(), loadBatches(),
      sb.from('shop_workflow').select('targets,steps').eq('shop_id', shopId).maybeSingle(),
      sb.from('orders').select('id,total,delivery_fee,paid,pay_method_id,pay_status,order_items(item_id,qty,price,is_gift)').eq('shop_id', shopId).neq('status', 'cancelled')
        .gte('ordered_at', today + 'T00:00:00+07:00').lte('ordered_at', today + 'T23:59:59+07:00').limit(1000),
      sb.from('promotions').select('*').eq('shop_id', shopId).then(r => r, () => ({ data: [] }))]);
    if (wf.error) throw wf.error;
    if (od.error) throw od.error;
    const orders = [], lines = [];
    for (const o of (od.data || [])) {
      orders.push({ id: o.id, total: o.total, delivery_fee: o.delivery_fee, paid: o.paid, pay_method_id: o.pay_method_id, pay_status: o.pay_status });
      for (const it of (o.order_items || [])) lines.push({ order_id: o.id, item_id: it.item_id, qty: it.qty, price: it.price, is_gift: it.is_gift });
    }
    const d = wf.data || {};
    ST.flow = { targets: (d.targets && typeof d.targets === 'object') ? d.targets : {}, steps: Array.isArray(d.steps) ? d.steps : [], orders, lines, promos: (pr && pr.data) || [] };
  }

  let flowSaveChain = Promise.resolve();
  function saveFlow() {
    const f = ST.flow;
    flowSaveChain = flowSaveChain.then(async () => {
      const { error } = await sb.from('shop_workflow').upsert({ shop_id: shopId, targets: f.targets, steps: f.steps, updated_at: new Date().toISOString() }, { onConflict: 'shop_id' });
      if (error) throw error;

    return flowSaveChain.catch(err => { showErr(err); });
  }

  // Nhóm cột = thành phẩm có công thức sản xuất (mía lau, hoa cúc...); món thuộc nhóm có lượng thành phẩm đó nhiều nhất trong định mức
  function flowGroups() {
    const invMap = new Map(ST.invItems.map(i => [i.id, i]));
    const outIds = new Set((ST.formulas || []).map(f => f.out_item_id));
    const cost = new Map(), nvl = new Map();
    const best = new Map();
    for (const r of (ST.allRecipes || [])) {
      const iv = invMap.get(r.inv_item_id);
      const line = Number(r.qty) * Number(iv ? iv.avg_cost || 0 : 0);
      cost.set(r.menu_item_id, (cost.get(r.menu_item_id) || 0) + line);
      const rg = recipeGroupOf(iv); // CP NVL = chỉ nước cốt (không tính siro, đá, bao bì)
      if (rg === 'Nước cốt') nvl.set(r.menu_item_id, (nvl.get(r.menu_item_id) || 0) + line);
      if (outIds.has(r.inv_item_id)) {
        const cur = best.get(r.menu_item_id);
        if (!cur || Number(r.qty) > cur.ml) best.set(r.menu_item_id, { gid: r.inv_item_id, ml: Number(r.qty) });
      }
    }
    const groups = new Map();
    for (const m of ST.menuItems) {
      if (m.active === false) continue;
      const b = best.get(m.id);
      if (!b) continue;
      if (!groups.has(b.gid)) { const iv = invMap.get(b.gid); groups.set(b.gid, { id: b.gid, name: iv ? iv.name : 'Thành phẩm', menus: [] }); }
      groups.get(b.gid).menus.push({ m, ml: b.ml, cost: cost.get(m.id) || 0, nvl: nvl.get(m.id) || 0 });
    }
    const out = [...groups.values()];
    out.cost = cost; // giá vốn đủ định mức mỗi món, dùng lại cho món không sản xuất
    return out;
  }

  // Giá thực thu mỗi chai khi mua k chai cùng món (đã trừ khuyến mãi đang chạy dành cho mọi người)
  function flowNetPrice(m, k) {
    const today = app.toVnYmd(new Date());
    const gross = m.price * k;
    let bestDisc = 0;
    for (const p of (ST.flow.promos || [])) {
      if (!p.active || (p.from_date && p.from_date > today) || (p.to_date && p.to_date < today)) continue;
      if (audienceOf(p) !== 'all') continue;
      const rules = Array.isArray(p.rules) ? p.rules : [{ discount_type: p.discount_type, value: p.value, min_qty: p.min_qty, min_money: p.min_money, item_ids: p.item_ids }];
      for (const r of rules) {
        if (Array.isArray(r.item_ids) && r.item_ids.length && !r.item_ids.includes(m.id)) continue;
        if (k < (Number(r.min_qty) || 0) || gross < (Number(r.min_money) || 0)) continue;
        const d = r.discount_type === 'percent' ? gross * Number(r.value || 0) / 100 : r.discount_type === 'amount' ? Number(r.value || 0) : 0;
        if (d > bestDisc) bestDisc = Math.min(d, gross);
      }
    }
    return (gross - bestDisc) / k;
  }

  const flowNum = (v, dec) => v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('vi-VN', { maximumFractionDigits: dec || 0 });
  const flowMoney = v => v == null || !isFinite(v) ? '—' : app.formatMoney(Math.round(v));
  const flowPct = v => v == null || !isFinite(v) ? '—' : Math.round(v * 100) + '%';

  function flowCompute() {
    const f = ST.flow, prodGroups = flowGroups();
    // món không có sản xuất (lương khô, sữa ngũ cốc...) vẫn thành 1 cột để đặt mục tiêu bán
    const inGroup = new Set(); for (const g of prodGroups) for (const x of g.menus) inGroup.add(x.m.id);
    const costOf = prodGroups.cost;
    const hasRecipe = ST.allRecipeMenuIds || new Set();
    const extra = ST.menuItems.filter(m => m.active !== false && hasRecipe.has(m.id) && !inGroup.has(m.id)).map(m => ({ id: 'm:' + m.id, name: m.name, noProd: true, menus: [{ m, ml: 0, cost: costOf.get(m.id) || 0, nvl: 0 }] }));
    const allGroups = prodGroups.concat(extra);
    const hidden = new Set(Array.isArray(f.targets.hidden) ? f.targets.hidden : []);
    const groups = allGroups.filter(g => !hidden.has(g.id));
    const today = app.toVnYmd(new Date());
    const k = Math.max(1, Number(f.targets.chai_don) || 2);
    const menuGroup = new Map();
    for (const g of groups) for (const x of g.menus) menuGroup.set(x.m.id, { g, x });
    // thực tế: chai bán / tặng / doanh thu phân bổ theo từng dòng
    const sold = new Map(), gift = new Map(), rev = new Map();
    const lineSum = new Map();
    for (const l of f.lines) if (!l.is_gift) lineSum.set(l.order_id, (lineSum.get(l.order_id) || 0) + l.price * l.qty);
    const ordMap = new Map(f.orders.map(o => [o.id, o]));
    for (const l of f.lines) {
      const mg = menuGroup.get(l.item_id);
      if (!mg) continue;
      const gid = mg.g.id;
      if (l.is_gift) { gift.set(gid, (gift.get(gid) || 0) + l.qty); continue; }
      const o = ordMap.get(l.order_id), S = lineSum.get(l.order_id) || 0;
      const net = o ? Math.max(0, (Number(o.total) || 0) - (Number(o.delivery_fee) || 0)) : 0;
      sold.set(l.item_id, (sold.get(l.item_id) || 0) + l.qty);
      sold.set(gid, (sold.get(gid) || 0) + l.qty);
      rev.set(gid, (rev.get(gid) || 0) + (S > 0 ? l.price * l.qty * net / S : 0));
    }
    // sản lượng nấu hôm nay (ml): mẻ đã xong lấy thực tế, mẻ đang nấu lấy dự kiến
    const made = new Map();
    for (const b of ST.batches) {
      if (app.toVnYmd(new Date(b.at)) !== today) continue;
      const ml = b.status === 'cooking' ? Number(b.planned_qty || 0) : Number(b.out_qty || 0);
      made.set(b.out_item_id, (made.get(b.out_item_id) || 0) + ml);
    }
    const mix = (g, useSold) => {
      const tot = useSold ? g.menus.reduce((s, x) => s + (sold.get(x.m.id) || 0), 0) : 0;
      const w = x => tot > 0 ? (sold.get(x.m.id) || 0) / tot : 1 / g.menus.length;
      return {
        ml: g.menus.reduce((s, x) => s + w(x) * x.ml, 0),
        cost: g.menus.reduce((s, x) => s + w(x) * x.cost, 0),
        nvl: g.menus.reduce((s, x) => s + w(x) * x.nvl, 0),
        net: g.menus.reduce((s, x) => s + w(x) * flowNetPrice(x.m, k), 0)
      };
    };
    // số chai hoà vốn: doanh thu mỗi chai trừ bao bì/đá mỗi chai phải gánh được CP NVL cả mẻ
    const breakEven = (cp, dt, ban, bbSold) => { const per = ban > 0 ? (dt - bbSold) / ban : 0; return per > 0 ? Math.ceil(cp / per - 1e-9) : null; };
    const calc = (g, mx, sx, ban, dt, bo) => {
      if (g.noProd) { const gv = Math.round(ban * mx.cost); return { g, sx: null, ban, cp: 0, gv, bbSold: 0, dt, lai: dt - gv, ratio: null, bo: null, cpBo: null, hv: null }; }
      const cp = Math.round(sx * mx.nvl), gv = Math.round(ban * mx.cost), bbSold = ban * (mx.cost - mx.nvl);
      return { g, sx, ban, cp, gv, bbSold, dt, lai: dt - gv, ratio: sx > 0 ? ban / sx : null, bo, cpBo: Math.round(Math.max(0, bo) * mx.nvl), hv: breakEven(cp, dt, ban, bbSold) };
    };
    const plan = groups.map(g => {
      const t = (f.targets.g && f.targets.g[g.id]) || {};
      const lit = Math.max(0, Number(t.lit) || 0), ban = Math.max(0, Math.floor(Number(t.ban) || 0));
      const mx = mix(g, false);
      const sx = mx.ml > 0 ? Math.floor(lit * 1000 / mx.ml) : 0;
      const dt = Math.round(ban * mx.net);
      return Object.assign(calc(g, mx, sx, ban, dt, sx - ban), { lit: g.noProd ? null : lit });
    });
    const act = groups.map(g => {
      const mx = mix(g, true);
      const ml = made.get(g.id) || 0;
      const sx = mx.ml > 0 ? Math.floor(ml / mx.ml) : 0;
      const ban = sold.get(g.id) || 0, tang = gift.get(g.id) || 0;
      const dt = Math.round(rev.get(g.id) || 0);
      return Object.assign(calc(g, mx, sx, ban, dt, sx - ban - tang), { lit: g.noProd ? null : ml / 1000 });
    });
    const total = rows => {
      const sx = rows.reduce((s, r) => s + (r.sx || 0), 0), ban = rows.reduce((s, r) => s + r.ban, 0);
      const pr = rows.filter(r => !r.g.noProd);
      const sumOf = (rs, k) => rs.reduce((s, r) => s + (Number(r[k]) || 0), 0);
      const sum = k => sumOf(rows, k), psum = k => sumOf(pr, k);
      const cp = sum('cp'), gv = sum('gv'), dt = sum('dt'), pban = psum('ban'), psx = psum('sx');
      return { sx: psx, ban, lit: psum('lit'), cp, gv, dt, lai: dt - gv, ratio: psx > 0 ? pban / psx : null, bo: psum('bo'), cpBo: psum('cpBo'), hv: breakEven(cp, psum('dt'), pban, psum('bbSold')) };
    };
    const tp = total(plan), ta = total(act);
    tp.don = tp.ban > 0 ? Math.ceil(tp.ban / k) : 0;
    ta.don = f.orders.length;
    return { groups, allGroups, hidden, plan, act, tp, ta, k };
  }

  function flowCards(redraw) {

        onChange: e => {
          f.targets.g = f.targets.g || {}; f.targets.g[gid] = f.targets.g[gid] || {};
          const v = e.target.value === '' ? null : key === 'lit' ? Math.max(0, Number(e.target.value) || 0) : Math.max(0, Math.floor(Number(e.target.value) || 0));
          f.targets.g[gid][key] = v;

    // prodOnly: dòng chỉ có ở món có sản xuất -> món không sản xuất để trắng
    const openFlowColsModal = opener => {
      const body = el('div');
      const draw = () => body.replaceChildren(
        el('div', { className: 'alert', style: 'margin-bottom:10px', text: 'Bật món muốn hiện trong bảng, tắt món không cần. Tổng chỉ tính các món đang bật.' }),
        ...C.allGroups.map(g => {
          const on = !(Array.isArray(f.targets.hidden) && f.targets.hidden.includes(g.id));
          return el('div', { className: 'line-row' },
            el('div', { className: 'line-main' }, el('b', { text: g.name }), el('small', { text: g.noProd ? 'Hàng bán, không sản xuất' : 'Có sản xuất' })),
            app.toggle(on, v => {
              const h = new Set(Array.isArray(f.targets.hidden) ? f.targets.hidden : []);
              if (v) h.delete(g.id); else h.add(g.id);
              f.targets.hidden = [...h];
              saveFlow(); redraw();
            }));
        }));
      draw();
      openModal('Thêm/Xoá món trong bảng', body, [el('button', { type: 'button', className: 'btn btn-primary', onClick: closeModal, text: 'Xong' })], opener);
    };

  async function fillFromLatestBatch(outItemId) {
    const prev = ST.batches.find(b => b.out_item_id === outItemId);
    if (!prev) { app.showToast('Chưa có mẻ trước cùng loại này', 'error'); return; }
    const { data, error } = await sb.from('batch_inputs').select('inv_item_id,qty').eq('batch_id', prev.id).eq('shop_id', shopId);
    if (error) { showErr(error); return; }
    ST.batchForm.out_qty = prev.out_qty; ST.batchForm.fromFormula = false;
    ST.batchForm.inputs = (data && data.length) ? data.map(d => ({ inv_item_id: d.inv_item_id, qty: d.qty })) : [{ inv_item_id: '', qty: '' }];
    renderBatchTab();
  }

  async function submitBatch(btn) {
    const bf = ST.batchForm;
    const outQty = Number(bf.out_qty);
    const inputs = bf.inputs.filter(i => i.inv_item_id && Number(i.qty) > 0).map(i => ({ inv_item_id: i.inv_item_id, qty: Number(i.qty) }));
    if (!bf.out_item_id || !(outQty > 0) || !inputs.length) {
      app.showToast('Chọn vật tư làm ra, số lượng > 0 và ít nhất 1 nguyên liệu', 'error');
      return;
    }
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      const { data, error } = await sb.rpc('save_batch', {
        p_shop: shopId, p_batch: ST.batchEditId || null, p_at: localDtToIso(bf.at),
        p_out_item: bf.out_item_id, p_out_qty: outQty, p_inputs: inputs, p_note: bf.note.trim(),
        p_planned: (ST.batchEditId && ST.batchEditStatus === 'done') ? null : outQty
      });
      if (error) throw error;
      const cooking = data && data.status === 'cooking';
      app.showToast(cooking ? 'Đã lưu nhật ký · đã trừ kho nguyên liệu' : 'Đã cập nhật nhật ký · Giá vốn ' + app.formatMoney(data.unit_cost) + '/đv', 'accent');
      resetBatchForm();
      await Promise.all([loadBatches(), loadInvItems()]);
      renderBatchTab();
      if (cooking) { const nb = ST.batches.find(x => x.id === data.id); if (nb) openActualModal(nb); }
    } catch (err) { showErr(err); btn.disabled = false; btn.textContent = 'Lưu nhật ký'; }
  }

  /* ===== TAB: Khách (gói tối thiểu: proplus) ===== */
  async function loadCustomersWithStats() {
    await loadCustomersBase();
    const { data } = await sb.from('orders').select('customer_id,customer_name,customer_phone,address,total,ordered_at,status').eq('shop_id', shopId).neq('status', 'cancelled').order('ordered_at', { ascending: false }).limit(5000);
    const map = new Map(), byPhone = new Map(), phoneOf = new Map();
    const dig = v => String(v || '').replace(/\D/g, '');
    for (const c of ST.customers) if (dig(c.phone).length >= 8) phoneOf.set(dig(c.phone), c.id);
    const guests = new Map();
    for (const o of (data || [])) {
      const ph = dig(o.customer_phone);
      let cid = o.customer_id || (ph.length >= 8 ? phoneOf.get(ph) : null);
      if (cid) {
        const cur = map.get(cid) || { orders: 0, spent: 0, last: '' };
        cur.orders += 1; cur.spent += Number(o.total) || 0;
        if (!cur.last || o.ordered_at > cur.last) cur.last = o.ordered_at;
        map.set(cid, cur);
      } else if (ph.length >= 8) {
        const g = guests.get(ph) || { id: 'g:' + ph, guest: true, name: o.customer_name || 'Khách', phone: o.customer_phone, apt: '', address: o.address || '', grp: '', member: false, orders: 0, spent: 0, last: '' };
        g.orders += 1; g.spent += Number(o.total) || 0;
        if (!g.last || o.ordered_at > g.last) g.last = o.ordered_at;
        guests.set(ph, g);
      }
    }
    ST.custStats = map;
    ST.custGuests = [...guests.values()];
  }

  async function openCustomerDetailModal(c, opener) {
    const [ordRes, vouRes] = await Promise.all([
      sb.from('orders').select('code,ordered_at,total,status').eq('shop_id', shopId).eq('customer_id', c.id).order('ordered_at', { ascending: false }).range(0, 19),
      sb.from('customer_vouchers').select('*').eq('shop_id', shopId).eq('customer_id', c.id).order('issued_at', { ascending: false })
    ]);
    const orders = ordRes.data || [];
    const vouchers = vouRes.data || [];
    const activeVouchers = ST.promos.filter(p => p.kind === 'voucher' && p.active);
    let selPromoId = activeVouchers[0] ? activeVouchers[0].id : '';
    const promoMap = new Map(ST.promos.map(p => [p.id, p]));
    const todayIso = new Date().toISOString();

    const grantRow = activeVouchers.length ? el('div', { style: 'display:flex;gap:8px;margin-top:8px;flex-wrap:wrap' },
      el('select', { className: 'select', style: 'flex:1', onChange: e => { selPromoId = e.target.value; } },
        activeVouchers.map(p => el('option', { value: p.id, text: p.name }))
      ),
      el('button', {
        type: 'button', className: 'btn btn-primary',
        onClick: async () => {
          const pr = promoMap.get(selPromoId);
          if (!pr) return;
          const now = new Date();
          const exp = pr.valid_days > 0 ? new Date(now.getTime() + pr.valid_days * 86400000).toISOString() : null;
          try {
            const { error } = await sb.from('customer_vouchers').insert({
              shop_id: shopId, customer_id: c.id, promo_id: pr.id, issued_at: now.toISOString(), expires_at: exp
            });
            if (error) throw error;
            app.showToast('Đã phát voucher ' + pr.name, 'accent');
            openCustomerDetailModal(c, opener);
          } catch (err) { showErr(err); }
        },
        text: 'Phát voucher'
      })
    ) : el('small', { style: 'color:var(--text-sub)', text: 'Chưa có chương trình \'Khách chỉ định\' nào đang bật ở tab Khuyến mãi.' });

    openModal(c.name + (c.code ? ' (' + c.code + ')' : ''), el('div', null,
      el('div', { style: 'font-weight:700', text: 'Voucher của khách' }),
      grantRow,
      vouchers.length ? el('div', { style: 'margin-top:8px' }, vouchers.map(v => {
        const pr = promoMap.get(v.promo_id);
        const st = v.used_order_id ? 'Đã dùng' : (v.expires_at && v.expires_at < todayIso ? 'Hết hạn' : 'Còn hạn');
        return el('div', { className: 'line-row' },
          el('span', { text: pr ? pr.name : 'Voucher' }),
          el('span', { className: 'badge ' + (st === 'Còn hạn' ? '' : 'badge-muted'), text: st })
        );
      })) : el('div', { style: 'font-size:13.5px;color:var(--text-sub);margin-top:6px', text: 'Chưa có voucher.' }),
      el('div', { style: 'font-weight:700;margin-top:16px', text: 'Đơn gần đây (' + orders.length + ')' }),
      orders.length ? orders.map(o => el('div', { className: 'line-row' },
        el('span', { className: 'num', text: o.code + ' · ' + app.formatVnDateTime(o.ordered_at) }),
        el('b', { className: 'num', text: app.formatMoney(o.total) })
      )) : el('div', { style: 'font-size:13.5px;color:var(--text-sub);margin-top:6px', text: 'Chưa có đơn nào.' })
    ), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })], opener);
  }

  function openCustCsvImportModal(opener) {
    let rows = [];
    const prev = el('div', { style: 'margin-top:8px' });
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary', disabled: true,
      onClick: async () => {
        okBtn.disabled = true; okBtn.textContent = 'Đang nhập…';
        try {
          const { error } = await sb.from('customers').insert(rows.map(r => Object.assign({ shop_id: shopId }, r)));
          if (error) throw error;
          closeModal();
          app.showToast('Đã nhập ' + rows.length + ' khách hàng', 'accent');
          await loadCustomersWithStats();
          renderCustTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Nhập khách'; }
      },
      text: 'Nhập khách'
    });
    const parse = txt => {
      rows = [];
      txt.replace(/^\uFEFF/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((l, i) => {
        const c = l.split(';').map(x => x.trim().replace(/^"|"$/g, ''));
        if (i === 0 && /tên/i.test(c[0])) return;
        if (c[0]) rows.push({ name: c[0], grp: c[1] || null, apt: c[2] || null, phone: c[3] || null, member: false });
      });
      okBtn.disabled = !rows.length;
      prev.replaceChildren(el('div', { className: 'alert alert-success', text: 'Sẵn sàng nhập ' + rows.length + ' khách hàng.' }));
    };
    openModal('Nhập khách từ CSV', el('div', null,
      el('div', { className: 'field' }, el('label', { text: 'Định dạng: tên;nhóm;căn hộ;số điện thoại' }),
        el('input', { type: 'file', accept: '.csv,text/csv', className: 'input', onChange: async e => { if (e.target.files[0]) parse(await e.target.files[0].text()); } })
      ),
      el('textarea', { className: 'textarea', placeholder: 'Hoặc dán từng dòng…', onInput: e => parse(e.target.value) }),
      prev
    ), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' }), okBtn], opener);
  }

  /* ===== TAB: Khuyến mãi (gói tối thiểu: proplus) ===== */
  async function loadPromos() {
    if (!app.hasPlan('proplus')) return;
    const { data, error } = await sb.from('promotions').select('*').eq('shop_id', shopId).order('created_at', { ascending: false });
    if (error) throw error;
    ST.promos = data || [];
    const vr = await sb.from('customer_vouchers').select('id,promo_id,customer_id,issued_at,expires_at,used_order_id').eq('shop_id', shopId);
    ST.vouchers = vr.data || [];
  }

  function promoStatus(p) {
    if (!p.active) return { text: 'Tắt', cls: 'badge-muted' };
    const today = app.toVnYmd(new Date());
    if (p.from_date && p.from_date > today) return { text: 'Sắp chạy', cls: 'badge-warn' };
    if (p.to_date && p.to_date < today) return { text: 'Đã hết hạn', cls: 'badge-err' };
    return { text: 'Đang chạy', cls: '' };
  }

  async function patchPromo(p, patch) {
    try {
      const res = await sb.from('promotions').update(patch).eq('id', p.id).eq('shop_id', shopId).select('id');
      checkMutated(res);
      Object.assign(p, patch);
    } catch (err) { showErr(err); }
    renderPromoTab();
  }

  function audienceOf(p) { return p.kind === 'voucher' ? 'custom' : (p.audience || 'all'); }
  function promoVoucherStats(p) {
    const now = new Date().toISOString();
    const list = (ST.vouchers || []).filter(v => v.promo_id === p.id);
    return { issued: list.length, used: list.filter(v => v.used_order_id).length, open: list.filter(v => !v.used_order_id && (!v.expires_at || v.expires_at > now)).length };
  }
  function shortDM(iso) { return iso ? new Date(iso).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', timeZone: 'Asia/Ho_Chi_Minh' }) : ''; }

  function renderPromoTab() {
    const list = ST.promos.filter(p => p.kind !== 'loyalty');

    contentHost.replaceChildren(
      renderMetaBar('promo', async () => { await loadPromos(); markLoaded('promo'); renderPromoTab(); }),
      el('div', { className: 'row-between', style: 'margin-bottom:10px' },
        el('b', { text: 'Khuyến mãi' }),
        el('button', { type: 'button', className: 'btn btn-primary', onClick: e => openPromoModal(null, e.currentTarget), text: '+ Thêm chương trình' })
      ),
      list.length ? el('div', { className: 'card' }, list.map(p => {
        const st = promoStatus(p);
        const aud = audienceOf(p);
        const rl = Array.isArray(p.rules) ? p.rules : null;
        const valText = rl ? rl.length + ' dòng ưu đãi' : p.discount_type === 'percent' ? 'Giảm ' + p.value + '%' :
          p.discount_type === 'amount' ? 'Giảm ' + app.formatMoney(p.value) :
          'Tặng ' + p.value + ' món';
        let audText = aud === 'member' ? 'Chỉ thành viên' : aud === 'custom' ? 'Khách chỉ định' : 'Mọi người';
        if (aud === 'custom') { const s = promoVoucherStats(p); audText += ' (' + s.issued + ' người, đã dùng ' + s.used + ')'; }
        return el('div', { className: 'line-row promo-row' },
          el('div', { className: 'line-main' },
            el('b', { text: p.name }),
            el('small', { text: [audText, valText, p.min_qty > 0 ? 'từ ' + p.min_qty + ' phần' : '', p.min_money > 0 ? 'đơn từ ' + app.formatMoney(p.min_money) : '', (p.item_ids && p.item_ids.length) ? 'áp dụng ' + p.item_ids.length + ' món' : '', (p.description && p.description !== valText) ? p.description : '', (aud !== 'custom' && p.active && p.show_banner !== false) ? 'hiện ở banner' : ''].filter(Boolean).join(' · ') })
          ),
          el('span', { className: 'badge ' + st.cls, text: st.text }),
          kebab({ text: 'Sửa chương trình', fn: e => openPromoModal(p, e.currentTarget) },
            { text: p.active ? 'Tắt chương trình (đang chạy)' : 'Bật chương trình (đang tắt)', cls: p.active ? 'btn-primary' : '', fn: () => patchPromo(p, { active: !p.active }) },
            aud !== 'custom' ? { text: p.show_banner !== false ? 'Ẩn khỏi banner (đang hiện)' : 'Hiện trên banner (đang ẩn)', cls: p.show_banner !== false ? 'btn-primary' : '', fn: () => patchPromo(p, { show_banner: p.show_banner === false }) } : null,
            { text: 'Xóa', danger: true, fn: e => confirmModal('Xóa "' + p.name + '"?', 'Chương trình sẽ bị xóa hẳn' + (aud === 'custom' ? ', các phiếu đã phát cũng mất.' : '.'), 'Xóa', async () => {
            const res = await sb.from('promotions').delete().eq('id', p.id).eq('shop_id', shopId).select('id');
            checkMutated(res);
            await loadPromos();
            renderPromoTab();
          }, e.currentTarget) }
          )
        );
      })) : el('div', { className: 'card empty-state', text: 'Chưa có chương trình nào.' })
    );
  }

  // Một form chung: Dành cho (Mọi người / Thành viên / Khách chỉ định) + các dòng ưu đãi
  function openPromoModal(p, opener) {
    const legacyRule = q => ({ discount_type: q.discount_type, value: q.value, free_item_id: q.free_item_id || '', min_qty: q.min_qty || 0, min_money: q.min_money || 0, item_ids: Array.isArray(q.item_ids) ? q.item_ids.slice() : [] });
    const f = {
      name: p ? p.name : '', description: p ? (p.description || '') : '',
      audience: p ? audienceOf(p) : 'all',
      valid_days: p && p.kind === 'voucher' ? p.valid_days : 30,
      from_date: p ? (p.from_date || '') : '', to_date: p ? (p.to_date || '') : '',
      stack: p ? !!p.stack : false, show_banner: p ? p.show_banner !== false : true, active: p ? !!p.active : true,
      rules: p ? (Array.isArray(p.rules) && p.rules.length ? p.rules.map(legacyRule) : [legacyRule(p)]) : [{ discount_type: 'amount', value: 2000, free_item_id: '', min_qty: 2, min_money: 0, item_ids: [] }]
    };
    const picked = new Set();
    let custSearch = '';
    const issued = p && f.audience === 'custom' ? (ST.vouchers || []).filter(v => v.promo_id === p.id) : [];
    const lockAud = !!p;   // loại chương trình không đổi được sau khi tạo
    const lastOf = c => (ST.custStats && ST.custStats.get(c.id) ? ST.custStats.get(c.id).last : '') || '';
    const custList = () => {
      const q = fold(custSearch.trim());
      return ST.customers.filter(c => String(c.phone || '').replace(/\D/g, '').length >= 8)
        .filter(c => !q || fold(c.name).includes(q) || fold(c.phone).includes(q) || fold(c.apt).includes(q))
        .sort((a, b) => (lastOf(b) > lastOf(a) ? 1 : lastOf(b) < lastOf(a) ? -1 : 0));
    };
    const holdsOpen = cid => issued.some(v => v.customer_id === cid && !v.used_order_id && (!v.expires_at || v.expires_at > new Date().toISOString()));

    const body = el('div');
    const pickHost = el('div');
    const drawPicker = () => {
      const shown = custList();
      const sel = shown.filter(c => !holdsOpen(c.id));
      pickHost.replaceChildren(
        el('div', { className: 'row-between', style: 'margin:12px 0 6px' },
          el('b', { text: 'Chọn khách nhận phiếu (' + picked.size + ' người)' }),
          el('button', { type: 'button', className: 'btn btn-sm', text: picked.size >= sel.length && sel.length ? 'Bỏ chọn' : 'Chọn hết', onClick: () => { if (picked.size >= sel.length && sel.length) picked.clear(); else sel.forEach(c => picked.add(c.id)); drawPicker(); } })),
        el('input', { className: 'input', placeholder: 'Tìm theo tên hoặc SĐT', value: custSearch, onInput: e => { custSearch = e.target.value; drawPickList(); } }),
        el('div', { style: 'font-size:12.5px;opacity:.7;margin:4px 0' }, 'Khách gần đây nhất xếp trên. Chỉ hiện khách đã có SĐT trong danh sách Khách hàng.'),
        pickList
      );
      drawPickList();
    };
    const pickList = el('div', { style: 'max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:8px' });
    const drawPickList = () => {
      const shown = custList().slice(0, 60);
      pickList.replaceChildren(...(shown.length ? shown.map(c => {
        const has = holdsOpen(c.id);
        const last = lastOf(c);
        return el('label', { style: 'display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--border);font-weight:500' },
          el('input', { type: 'checkbox', checked: picked.has(c.id), disabled: has, style: 'width:20px;height:20px;flex:none', onChange: e => { if (e.target.checked) picked.add(c.id); else picked.delete(c.id); const t = pickHost.querySelector('b'); if (t) t.textContent = 'Chọn khách nhận phiếu (' + picked.size + ' người)'; } }),
          el('span', { style: 'flex:1;min-width:0' }, el('b', { text: c.name }), el('small', { style: 'display:block;opacity:.7', text: c.phone + (last ? ' · đặt gần nhất ' + shortDM(last) : '') + (has ? ' · đã có phiếu' : '') })));
      }) : [el('div', { style: 'padding:10px;opacity:.7', text: 'Chưa có khách phù hợp.' })]));
    };

    const issuedHost = el('div');
    const drawIssued = () => {
      if (!p || f.audience !== 'custom') { issuedHost.replaceChildren(); return; }
      const nowIso = new Date().toISOString();
      const nameOf = id => { const c = ST.customers.find(x => x.id === id); return c ? c.name : 'Khách'; };
      issuedHost.replaceChildren(
        el('div', { style: 'font-weight:700;margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--border)', text: 'Đã phát (' + issued.length + ')' }),
        issued.length ? issued.map(v => {
          const used = !!v.used_order_id; const exp = !used && v.expires_at && v.expires_at <= nowIso;
          return el('div', { className: 'line-row' },
            el('span', { style: 'flex:1', text: nameOf(v.customer_id) + (v.expires_at && !used ? ' · hạn ' + shortDM(v.expires_at) : '') }),
            el('span', { className: 'badge ' + (used || exp ? 'badge-muted' : ''), text: used ? 'Đã dùng' : exp ? 'Hết hạn' : 'Còn hạn' }),
            !used ? el('button', { type: 'button', className: 'btn btn-sm btn-danger', text: 'Thu hồi', style: 'margin-left:8px', onClick: async () => {
              try {
                const res = await sb.from('customer_vouchers').delete().eq('id', v.id).eq('shop_id', shopId).is('used_order_id', null).select('id');
                checkMutated(res);
                issued.splice(issued.indexOf(v), 1);
                ST.vouchers = (ST.vouchers || []).filter(x => x.id !== v.id);
                app.showToast('Đã thu hồi phiếu', 'accent');
                drawIssued(); drawPicker();
              } catch (err) { showErr(err); }
            } }) : null);
        }) : el('div', { style: 'opacity:.7', text: 'Chưa phát cho ai.' })
      );
    };

    const draw = () => {
      const custom = f.audience === 'custom';
      const visRules = custom ? f.rules.slice(0, 1) : f.rules;
      body.replaceChildren(
        el('div', { className: 'field' }, el('label', { text: 'Tên chương trình' + (custom ? '' : ' (dòng 1 trên banner)') }), el('input', { className: 'input', value: f.name, placeholder: custom ? 'Ví dụ: Tặng bạn thân thiết giảm 10k' : 'Ví dụ: Mua nhiều, giảm nhiều', onInput: e => { f.name = e.target.value; } })),
        el('div', { className: 'field' }, el('label', { text: 'Dành cho ai' }),
          el('select', { className: 'select', disabled: lockAud && f.audience === 'custom', onChange: e => { f.audience = e.target.value; if (f.audience === 'custom') f.rules = f.rules.slice(0, 1); draw(); } },
            el('option', { value: 'all', selected: f.audience === 'all', text: 'Mọi người', disabled: !!p && f.audience === 'custom' }),
            el('option', { value: 'member', selected: f.audience === 'member', text: 'Chỉ thành viên', disabled: !!p && f.audience === 'custom' }),
            el('option', { value: 'custom', selected: f.audience === 'custom', text: 'Khách chỉ định', disabled: !!p && f.audience !== 'custom' }))),
        el('div', { style: 'font-size:12.5px;opacity:.7;margin:-4px 0 8px', text: f.audience === 'all' ? 'Tự áp dụng cho mọi đơn đủ điều kiện.' : f.audience === 'member' ? 'Tự áp dụng khi khách đặt bằng SĐT của khách đã là thành viên.' : 'Mỗi khách được chọn nhận 1 phiếu, dùng 1 lần.' + (lockAud ? ' Loại này không đổi sang loại khác được.' : '') }),
        custom ? null : el('div', { className: 'field' }, el('label', { text: 'Mô tả (dòng 2 trên banner)' }), el('input', { className: 'input', value: f.description, placeholder: 'Ví dụ: 330ml mua 2 giảm 2k, mua 3 giảm 5k…', onInput: e => { f.description = e.target.value; } })),
        custom ? el('div', { className: 'field' }, el('label', { text: 'Số ngày hiệu lực từ lúc phát (0 = không giới hạn)' }), el('input', { className: 'input num', type: 'number', min: 0, value: f.valid_days, onInput: e => { f.valid_days = e.target.value; } }))
          : el('div', { className: 'grid-2' },
            el('div', { className: 'field' }, el('label', { text: 'Từ ngày' }), el('input', { className: 'input', type: 'date', value: f.from_date, onChange: e => { f.from_date = e.target.value; } })),
            el('div', { className: 'field' }, el('label', { text: 'Đến ngày' }), el('input', { className: 'input', type: 'date', value: f.to_date, onChange: e => { f.to_date = e.target.value; } }))),

  function ovChartCard(C) {
    const metrics = [
      ['Nấu (lít)', C.ta.lit, C.tp.lit, v => flowNum(v, 1)],
      ['Số chai bán', C.ta.ban, C.tp.ban, v => flowNum(v, 0)],
      ['Doanh thu', C.ta.dt, C.tp.dt, v => flowMoney(v)],
      ['Lãi gộp', C.ta.lai, C.tp.lai, v => flowMoney(v)]
    ];
    const H = 84;
    const col = (val, max, fmt, color, label) => {
      const h = max > 0 ? Math.max(val > 0 ? 3 : 0, Math.round(Math.max(0, val) / max * H)) : 0;
      return el('div', { style: 'flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px', title: label + ': ' + fmt(val) },
        el('span', { className: 'num', style: 'font-size:11.5px;color:var(--text-sub);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis', text: fmt(val) }),
        el('div', { style: 'width:70%;max-width:34px;height:' + h + 'px;background:' + color + ';border-radius:4px 4px 0 0' }));
    };
    const cells = metrics.map(([name, act, tgt, fmt]) => {
      const max = Math.max(Math.abs(act), Math.abs(tgt), 0);
      return el('div', { style: 'min-width:0' },
        el('div', { style: 'font-size:13px;font-weight:700;margin-bottom:6px', text: name }),
        el('div', { style: 'display:flex;align-items:flex-end;gap:6px;height:' + (H + 22) + 'px;border-bottom:1px solid var(--border)' },
          col(act, max, fmt, 'var(--accent)', 'Hôm nay'), col(tgt, max, fmt, 'var(--border)', 'Mục tiêu')),
        el('div', { style: 'display:flex;gap:6px;margin-top:4px;font-size:11.5px;color:var(--text-sub);text-align:center' },
          el('span', { style: 'flex:1', text: 'Hôm nay' }), el('span', { style: 'flex:1', text: 'Mục tiêu' })));
    });
    return el('div', { className: 'card' }, el('b', { style: 'display:block;margin-bottom:10px', text: 'Hôm nay so với mục tiêu' }),
      el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:16px 14px' }, cells));
  }

  const dmy = ymd => ymd ? ymd.split('-').reverse().join('/') : '';

  function cashMethodOf(id) {
    if (!id) return 'cash';

    return m && /ti[eềề]n m[aặ]t/i.test(m.name) ? 'cash' : 'bank';
  }
  async function loadOvKK() {
    const since = app.shiftYmd(app.toVnYmd(new Date()), -13);

      sb.from('inv_lots').select('*').eq('shop_id', shopId).gt('qty_left', 0).order('received_at', { ascending: false }).limit(800),
      sb.from('cash_entries').select('at,dir,amount,pay_method_id').eq('shop_id', shopId).gte('at', since + 'T00:00:00+07:00').limit(5000),
      sb.from('cash_checks').select('*').eq('shop_id', shopId).gte('day', since),
      loadInvItems(), loadDebts()
    ]);
    for (const r of [lots, cash, chk]) if (r.error) throw r.error;
    ST.kk = { lots: lots.data || [], cash: cash.data || [], checks: chk.data || [], since };
  }
