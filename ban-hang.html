<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest-banhang.json">
<link rel="icon" type="image/png" href="icon-banhang-180.png">
<link rel="apple-touch-icon" href="icon-banhang-180.png">
<title>Vận hành</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
html { overflow-x: clip; }
body { font-family: "Be Vietnam Pro", var(--font, system-ui, sans-serif); }
.num { font-variant-numeric: tabular-nums; }

/* Bố cục chung của trang Bán hàng */
.bh-wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 12px 14px calc(150px + env(safe-area-inset-bottom));
}
@media (min-width: 900px) {
  .bh-wrap { padding-bottom: 110px; }
}

/* Thanh thẻ chức năng: điện thoại ở đáy, màn rộng ≥ 900px ở đầu trang */
.bh-nav {
  position: fixed;
  transform: translate3d(0, 0, 0);
  -webkit-transform: translate3d(0, 0, 0);
  will-change: transform;

  left: 0;
  right: 0;
  bottom: 0;
  z-index: 12;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.bh-nav-in {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
}
.bh-nav button {
  flex: 1;
  min-height: 58px;
  padding: 6px 4px;
  border: 0;
  background: transparent;
  color: var(--text-sub);
  font-family: inherit; font-size: 11.5px; font-weight: 600; line-height: 1.2; white-space: nowrap;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  position: relative;
  cursor: pointer;
}
.bh-nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.bh-nav svg { flex-shrink: 0; }
.more-info { margin-top: 4px; border-top: 1px dashed var(--border); padding-top: 10px; }
.more-info summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); min-height: 32px; display: flex; align-items: center; }
.line-row:has(.kebab) { flex-wrap: nowrap; }
.line-row.promo-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; column-gap: 10px; row-gap: 4px; }
.promo-row .line-main { display: contents; }
.promo-row .line-main b { grid-column: 1; grid-row: 1; }
.promo-row .line-main small { grid-column: 1 / -1; grid-row: 2; }
.promo-row > :not(.line-main) { grid-row: 1; }
.line-row:has(.kebab) .line-main { min-width: 0; flex: 1 1 auto; }
.hscroll.even > .chip, .chips.even > .chip { flex: 1 1 0; text-align: center; justify-content: center; }
.hscroll .chip { padding: 8px 12px; min-height: 40px; font-size: 13.5px; }
.kebab { min-width: 40px; padding: 6px 10px; font-size: 18px; line-height: 1; letter-spacing: 1px; }
.bh-nav .bh-badge {
  position: absolute;
  top: 4px;
  right: calc(50% - 22px);
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--error);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
}
@media (min-width: 900px) {
  .bh-nav {
    position: sticky;
    top: 0;
    bottom: auto;
    border-top: 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .bh-nav-in {
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px 14px;
  }
  .bh-nav button {
    flex: 0 0 auto;
    min-height: 44px;
    flex-direction: row;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
  }
  .bh-nav button[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .bh-nav .bh-badge { position: static; margin-left: 2px; }
  .bh-nav svg { width: 20px; height: 20px; }
}

/* Thanh đầu kiểu Sâmila v1 */
.top { position: sticky; top: 0; z-index: 13; background: var(--accent); color: var(--accent-text); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
.top h1 { margin: 0; flex: 1; min-width: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .pill { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: rgba(255,255,255,.16); color: inherit; font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.top .gear { width: 40px; height: 40px; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.16); color: inherit; cursor: pointer; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-width: 900px) { .bh-nav { top: 60px; } }
body .dd-wrap { max-width: none; padding: 0 0 40px; }
.bh-wrap { max-width: 600px; }
.sticky-bar-in { max-width: 576px; }
/* Chọn món kiểu v1 */
.v1-h { margin: 18px 0 8px; font-size: 15px; font-weight: 600; color: var(--text-sub); }
.v1-group { background: var(--surface); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
.v1-group h3 { margin: 0; padding: 12px 14px 2px; font-size: 16px; font-weight: 700; }
.v1-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); }
.v1-group h3 + .v1-item { border-top: 0; }
.v1-item.on { background: var(--accent-soft); }
.v1-item .nm { font-weight: 600; min-width: 0; word-break: break-word; }
.v1-item .pr { color: var(--text-sub); font-size: 14px; }
.v1-item .stepper button:disabled { opacity: .35; }
.v1-item .stepper output { min-width: 34px; font-size: 19px; }
/* Chọn món kiểu trang khách */
.cat-bar { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 10px 0 8px; display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cat-pill { flex: none; min-height: 44px; padding: 0 15px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--border); font-size: 14.5px; font-weight: 600; color: var(--text-sub); white-space: nowrap; }
.cat-pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.cat-title { margin: 16px 0 8px; font-size: 17px; font-weight: 700; scroll-margin-top: 66px; }
.menu-item { display: flex; gap: 12px; align-items: center; }
.item-img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: var(--accent-soft); }
.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 700; font-size: 16px; line-height: 1.3; word-break: break-word; }
.item-price-row { margin-top: 6px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.item-price { font-weight: 700; font-size: 16.5px; color: var(--accent); }
.item-unit { font-size: 13px; color: var(--text-sub); }
.item-act { flex-shrink: 0; }
.btn-add { min-width: 78px; min-height: 44px; border-radius: 999px; padding: 0 16px; background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 15.5px; border: 0; }
.stepper { display: inline-flex; align-items: center; gap: 4px; user-select: none; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 22px; font-weight: 700; display: grid; place-items: center; }
.stepper button.plus { background: var(--accent); color: var(--accent-text); }
.stepper output { min-width: 28px; text-align: center; font-weight: 700; font-size: 17px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px; color: var(--accent); font-weight: 600; font-size: 15px; background: none; border: 0; }

/* Thanh phụ: cập nhật lúc + Tải lại (như v1) */
.bh-meta-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 14px; color: var(--text-sub); }
.bh-meta-bar .reload { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 700; padding: 10px 4px; cursor: pointer; }
.bh-seg {
  display: inline-flex;
  background: var(--accent-soft);
  padding: 3px;
  border-radius: 12px;
  gap: 3px;
  margin-bottom: 12px;
  max-width: 100%;
  overflow-x: auto;
}
.bh-seg button {
  min-height: 40px;
  padding: 6px 14px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text-sub);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
.bh-seg.tight { display: flex; width: 100%; }
.bh-seg.tight button { flex: 1; padding: 6px 2px; font-size: 13px; white-space: nowrap; }
.bh-seg button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--accent);
}

/* Lưới nút chọn nhanh (chips) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.ofilters > .chip { padding: 9px 2px; font-size: 14px; text-align: center; justify-content: center; white-space: nowrap; min-width: 0; }
.chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}

/* Lưới sản phẩm bán hàng */
.pos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.pos-tile {
  min-height: 74px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 4px;
  position: relative;
}
.pos-tile.in-cart { border-color: var(--accent); background: var(--accent-soft); }
.pos-tile b { font-size: 14.5px; line-height: 1.25; word-break: break-word; }
.pos-tile span { font-size: 13.5px; color: var(--accent); font-weight: 700; }
.pos-tile .qty-pill {
  position: absolute;
  top: 6px;
  right: 6px;
  min-width: 24px;
  height: 24px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 12px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

/* Dòng đơn hàng / phiếu mua */
.line-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.line-row:first-child { border-top: 0; }
.opt-card { border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
.opt-card.removed { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text-sub); background: var(--bg); }
.opt-row { display: flex; gap: 10px; align-items: flex-end; }
.opt-act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.opt-on { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-right: auto; }
.opt-on input { width: 20px; height: 20px; }
.menu-prod.off .line-main b { opacity: 0.6; }
.menu-set { flex: none; }
.menu-grp { padding: 10px 0; border-top: 1px solid var(--border); }
.menu-grp:first-child { border-top: 0; }
.menu-grp-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.menu-grp-head b { font-size: 16px; }
.menu-var { display: flex; align-items: center; gap: 10px; padding: 4px 0 4px 8px; }
.menu-size { flex: none; min-width: 58px; text-align: center; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; }
.menu-var-price { flex: 1 1 auto; min-width: 0; color: var(--text-sub); font-size: 15px; }
.menu-var.off .menu-size { opacity: 0.5; text-decoration: line-through; }
.line-main { flex: 1 1 140px; min-width: 0; }
.line-main b { display: block; font-size: 15px; }
.line-main small { color: var(--text-sub); font-size: 13px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}
.stepper output { min-width: 28px; text-align: center; font-weight: 700; }

/* Thanh tổng cố định đáy */
.sticky-bar {
  position: fixed;
  transform: translate3d(0, 0, 0);
  -webkit-transform: translate3d(0, 0, 0);
  left: 0;
  right: 0;
  bottom: calc(58px + env(safe-area-inset-bottom));
  z-index: 10;
  padding: 0 12px 8px;
  pointer-events: none;
}
@media (min-width: 900px) {
  .sticky-bar { bottom: 12px; }
}
.sticky-bar-in {
  max-width: 932px;
  margin: 0 auto;
  background: var(--accent);
  color: var(--accent-text);
  border-radius: 16px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
  pointer-events: auto;
}
.sticky-bar-in .sum { flex: 1; min-width: 0; line-height: 1.25; }
.sticky-bar-in .sum small { display: block; font-size: 13px; opacity: 0.88; }
.sticky-bar-in .sum b { font-size: 20px; color: var(--yellow); }
.sticky-bar-in .btn-save {
  min-height: 46px;
  padding: 0 22px;
  border-radius: 999px;
  border: 0;
  background: var(--yellow);
  color: #14231B;
  font-weight: 700;
  font-size: 15.5px;
  cursor: pointer;
  white-space: nowrap;
}
.sticky-bar-in .btn-save:disabled { background: rgba(255,255,255,.22); color: rgba(255,255,255,.75); cursor: not-allowed; }

/* Thẻ & Bảng */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--accent-soft);
  color: var(--accent);
}
.badge-warn { background: var(--warn-bg); color: var(--warn-text); }
.badge-err { background: var(--error-bg); color: var(--error); }
.badge-muted { background: var(--surface-alt); color: var(--text-sub); }

.ocard { border-left: 4px solid var(--border); }
/* Màu trạng thái đơn online: đỏ Mới, vàng Đang làm, xanh dương Đang giao, xanh lá Xong, xám Đã hủy */
:root { --st-new: #C0392B; --st-prep: #D99A00; --st-deliv: #2F6FB0; --st-done: #2E7D52; --st-cancel: #8A918C; }
@media (prefers-color-scheme: dark) { :root { --st-new: #F07A5E; --st-prep: #F2C14E; --st-deliv: #6AA6E6; --st-done: #5CBF8A; --st-cancel: #9AA39D; } }
.ocard.st-new { border-left-color: var(--st-new); }
.ocard.st-preparing { border-left-color: var(--st-prep); }
.ocard.st-delivering { border-left-color: var(--st-deliv); }
.ocard.st-done { border-left-color: var(--st-done); }
.ocard.st-cancelled { border-left-color: var(--st-cancel); }
.stb { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: #fff; }
.stb-new { background: var(--st-new); } .stb-preparing { background: var(--st-prep); color: #3A2A00; }
.stb-delivering { background: var(--st-deliv); } .stb-done { background: var(--st-done); } .stb-cancelled { background: var(--st-cancel); }
.st-legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; font-size: 12.5px; color: var(--text-sub); margin: -4px 0 12px; }
.st-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.g2x { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi-row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi-row3 .kpi-box b { font-size: 15.5px; }
.kpi-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
}
.kpi-box small { display: block; color: var(--text-sub); font-size: 13px; }
.kpi-box b { display: block; font-size: 19px; margin-top: 2px; }

.table-scroll { overflow-x: auto; }
table.bh-tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.bh-tbl th, table.bh-tbl td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}
table.bh-tbl th { font-size: 13px; color: var(--text-sub); font-weight: 600; }
table.bh-tbl .r { text-align: right; white-space: nowrap; }

.input, .select, .textarea { min-height: 44px; font-size: 16px; }
/* iPhone: ô giờ/ngày có độ rộng riêng nên bị tràn khung, ép về đúng khung */
input[type=time].input, input[type=date].input { display: block; width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; -webkit-appearance: none; appearance: none; text-align: left; }
input[type=time].input::-webkit-date-and-time-value, input[type=date].input::-webkit-date-and-time-value { text-align: left; }
.btn { min-height: 44px; }
.btn-sm { min-height: 44px; padding: 8px 12px; }

/* Hộp thoại */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.52);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-sheet {
  width: 100%;
  max-width: 620px;
  max-height: 90dvh;
  background: var(--bg);
  border-radius: 18px 18px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 16px; }
  .modal-sheet { border-radius: 18px; }
}
.modal-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.modal-hd h2 { margin: 0; font-size: 17px; }
.modal-close {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 0;
  background: var(--surface-alt);
  color: var(--text);
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
}
.modal-body { padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; flex: 1; }
.modal-ft { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.empty-state { text-align: center; padding: 28px 14px; color: var(--text-sub); }
.empty-state b { display: block; color: var(--text); margin-bottom: 4px; }
.low-row { background: var(--warn-bg); }
.img-preview { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); margin-top: 6px; }
</style>
</head>
<body>
<div id="dd-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="thuonghieu.js"></script>
<script src="qrcode.js"></script>
<script src="vietqr.js"></script>
<script src="chung.js"></script>
<script>
'use strict';

(async function () {
  const app = await DatdonApp.start({ page: 'ban-hang', header: 'none' });
  const sb = app.sb;
  const shopId = app.shop.id;
  const el = app.el;

  /* ===== HỖ TRỢ CHUNG, HỘP THOẠI & ÂM THANH ===== */

  function playTing() {
    if (!ST.soundOn || !audioUnlocked || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.14);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.36);
    } catch (e) {}
  }

  // Ảnh món: cắt vuông giữa, 480px, JPEG dưới 190KB
  function makeDishImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file); const im = new Image();
      im.onload = async () => {
        try {
          const side = Math.min(im.naturalWidth, im.naturalHeight);
          const sx = (im.naturalWidth - side) / 2, sy = (im.naturalHeight - side) / 2;
          let out = Math.min(480, side), q = 0.85, blob = null;
          for (let n = 0; n < 12; n++) {
            const cv = document.createElement('canvas'); cv.width = out; cv.height = out;
            const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, out, out);
            cx.drawImage(im, sx, sy, side, side, 0, 0, out, out);
            blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
            if (blob && blob.size <= 190 * 1024) break;
            if (q > 0.55) q -= 0.1; else out = Math.round(out * 0.85);
          }
          URL.revokeObjectURL(url);
          if (!blob || blob.size > 200 * 1024) reject(new Error('Ảnh quá nặng, chọn ảnh khác')); else resolve(blob);
        } catch (e) { reject(e); }
      };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Không đọc được ảnh này')); };
      im.src = url;
    });
  }

  // Bảng tồn kho hàng bán (gói pro): bán thành phẩm + nguyên liệu dùng thẳng trong món (cam, sữa...)
  async function loadStockBoard() {
    if (!app.hasPlan('pro')) { ST.stockBoard = []; return; }
    try {
      const [inv, rec, mn] = await Promise.all([
        sb.from('inv_items').select('id,name,kind,unit,qty').eq('shop_id', shopId).eq('active', true),
        sb.from('recipes').select('menu_item_id,inv_item_id,qty').eq('shop_id', shopId),
        sb.from('menu_items').select('id,name,unit,sort').eq('shop_id', shopId).eq('active', true).order('sort', { ascending: true }).order('name', { ascending: true })]);
      if (inv.error || rec.error || mn.error) throw (inv.error || rec.error || mn.error);
      // Định mức 1 chai = trung bình định mức của các món đang bán dùng vật tư đó
      const activeMenu = new Set((mn.data || []).map(m => m.id));
      const per = {};
      for (const r of rec.data || []) { if (!activeMenu.has(r.menu_item_id) || !(Number(r.qty) > 0)) continue; (per[r.inv_item_id] = per[r.inv_item_id] || []).push(Number(r.qty)); }
      ST.stockMenus = mn.data || [];
      ST.stockRec = (rec.data || []).filter(r => activeMenu.has(r.menu_item_id));
      ST.stockPer = {};
      for (const k of Object.keys(per)) ST.stockPer[k] = per[k].reduce((s, x) => s + x, 0) / per[k].length;
      // Chỉ hiện vật tư dùng trong các món đang bán
      const used = new Set(ST.stockRec.map(r => r.inv_item_id));
      ST.stockBoard = (inv.data || []).filter(i => (i.kind === 'btp' || i.kind === 'nl' || i.kind === 'hh') && used.has(i.id))
        .sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'btp' ? -1 : 1) || String(a.name).localeCompare(String(b.name), 'vi'));
    } catch (e) { ST.stockBoard = ST.stockBoard || []; }
  }

  // Khuyến mãi tự áp (gói Pro plus): kết quả báo giá của máy chủ, chỉ dùng khi đúng với giỏ hiện tại
  function saleQuoteKey() {
    const sl = ST.sale;
    return JSON.stringify([sl.items.map(it => [it.item_id, it.qty]), String(sl.customer_phone || '').trim(), sl.voucher_id || null]);
  }
  function saleQuoteNow() {
    return (app.hasPlan('proplus') && ST.saleQuote && ST.saleQuote.key === saleQuoteKey()) ? ST.saleQuote : null;
  }
  function saleTotals() {
    const subtotal = ST.sale.items.reduce((s, it) => s + it.price * it.qty, 0);
    const qt = saleQuoteNow();
    const promo = qt ? Math.max(0, Math.min(subtotal, qt.discount || 0)) : 0;
    const manual = Math.max(0, Math.min(subtotal - promo, Number(ST.sale.discount) || 0));
    const disc = promo + manual;
    const places = Array.isArray(ST.shop && ST.shop.places) ? ST.shop.places : [];
    const pl = (ST.sale.ship && !ST.sale.editId) ? (places.find(p => p.name === ST.sale.shipPlace) || places[0] || null) : null;
    const fee = pl ? Math.max(0, Number(pl.fee) || 0) : 0;
    const total = Math.max(0, subtotal - disc) + fee;
    const count = ST.sale.items.reduce((s, it) => s + it.qty, 0);
    return { subtotal, promo, manual, disc, fee, total, count };
  }
  let saleQuoteTimer = null;
  async function fetchSaleQuote() {
    const sl = ST.sale;
    if (!app.hasPlan('proplus') || !sl.items.length) { ST.saleQuote = null; drawSalePromo(); updateSaleSticky(); return; }
    const key = saleQuoteKey();
    try {
      const { data, error } = await sb.rpc('quote_sale', {
        p_shop: shopId, p_phone: String(sl.customer_phone || '').trim(),
        p_items: sl.items.map(it => ({ item_id: it.item_id, qty: it.qty })), p_voucher: sl.voucher_id || null
      });
      if (error) throw error;
      if (key !== saleQuoteKey()) return; // giỏ đã đổi trong lúc chờ
      ST.saleQuote = { key, discount: data.discount || 0, applied: data.applied || [], free: data.free_items || [] };
    } catch (err) {
      if (key !== saleQuoteKey()) return;
      if (sl.voucher_id) { sl.voucher_id = null; saveDraft(); app.showToast('Voucher này không dùng được cho đơn, đã bỏ chọn', 'error'); }
      ST.saleQuote = null;
    }
    drawSalePromo(); updateSaleSticky();
  }
  function scheduleSaleQuote() {
    clearTimeout(saleQuoteTimer);
    saleQuoteTimer = setTimeout(fetchSaleQuote, 350);
  }
  let saleVoucherPhone = null;
  async function fetchSaleVouchers() {
    const ph = String(ST.sale.customer_phone || '').replace(/[ .\-]/g, '');
    if (!app.hasPlan('proplus') || ph.length < 8) { ST.saleVouchers = []; saleVoucherPhone = null; drawSalePromo(); return; }
    if (ph === saleVoucherPhone) return;
    saleVoucherPhone = ph;
    try {
      const { data, error } = await sb.rpc('sale_vouchers', { p_shop: shopId, p_phone: ph });
      if (error) throw error;
      if (ph !== String(ST.sale.customer_phone || '').replace(/[ .\-]/g, '')) return;
      const keep = (ST.sale.voucher_id && (ST.saleVouchers || []).find(v => v.id === ST.sale.voucher_id)) || null;
      ST.saleVouchers = (data || []).concat(keep && !(data || []).find(v => v.id === keep.id) ? [keep] : []);
    } catch (err) { ST.saleVouchers = []; }
    drawSalePromo();
  }
  function drawSalePromo() {
    const host = ST.salePromoHost; if (!host || !host.isConnected) return;
    const sl = ST.sale, qt = saleQuoteNow();
    if (!app.hasPlan('proplus')) { host.replaceChildren(); return; }
    const rows = [];
    if (qt) {
      (qt.applied || []).forEach(a => rows.push(el('div', { className: 'row-between', style: 'font-size:14px;color:var(--accent);padding:2px 0' },
        el('span', { text: (a.voucher ? 'Voucher: ' : 'Khuyến mãi: ') + a.name }), el('span', { className: 'num', text: '−' + app.formatMoney(a.amount) }))));
      (qt.free || []).forEach(g => rows.push(el('div', { className: 'row-between', style: 'font-size:14px;color:var(--accent);padding:2px 0' },
        el('span', { text: 'Tặng: ' + g.qty + ' × ' + (g.item_name || 'món tặng') }), el('span', { className: 'num', text: '0đ' }))));
    }
    const vs = ST.saleVouchers || [];
    const vbox = vs.length ? el('div', { style: 'margin-top:6px' },
      el('div', { style: 'font-size:13px;color:var(--text-sub);margin-bottom:4px', text: 'Khách có voucher, chạm để dùng:' }),
      el('div', { className: 'chips' }, vs.map(v => el('button', {
        type: 'button', className: 'chip', 'aria-pressed': String(sl.voucher_id === v.id),
        onClick: () => { sl.voucher_id = sl.voucher_id === v.id ? null : v.id; sl.paidCustom = null; saveDraft(); ST.saleQuote = null; drawSalePromo(); fetchSaleQuote(); },
        text: v.name + (v.text ? ' (' + v.text + ')' : '')
      })))) : null;
    host.replaceChildren(...[rows.length ? el('div', { style: 'margin-top:8px;border-top:1px dashed var(--border);padding-top:6px' }, rows) : null, vbox].filter(Boolean));
  }

  function addSaleItem(mi) {
    const ex = ST.sale.items.find(x => x.item_id === mi.id);
    if (ex) ex.qty = Math.min(999, ex.qty + 1);
    else ST.sale.items.push({ item_id: mi.id, name: mi.name, unit: mi.unit || 'phần', price: mi.price, qty: 1 });
    ST.sale.paidCustom = null;
    saveDraft();
    renderSaleTab();
  }

  function buildStockCard(redraw, opts) {
    opts = opts || {};
    const stockFmt = it => {
      let q = Number(it.qty) || 0, u = it.unit;
      if (u === 'ml') { q /= 1000; u = 'lít'; } else if (u === 'g') { q /= 1000; u = 'kg'; }
      return Math.round(q * 100) / 100;
    };
    const stockUnit = it => it.unit === 'ml' ? 'lít' : it.unit === 'g' ? 'kg' : it.unit;
    const selMenu = (ST.stockMenus || []).find(m => m.id === ST.stockSel) || null;
    const stockBottles = it => {
      if (selMenu) { const r = (ST.stockRec || []).find(x => x.menu_item_id === selMenu.id && x.inv_item_id === it.id); return r && Number(r.qty) > 0 ? Math.max(0, Math.floor((Number(it.qty) || 0) / Number(r.qty) + 1e-9)) : null; }
      const per = (ST.stockPer || {})[it.id]; return per > 0 ? Math.max(0, Math.floor((Number(it.qty) || 0) / per + 1e-9)) : null;
    };

    const stockRows = (ST.stockBoard || []).filter(it => (!selMenu || stockBottles(it) != null) && (!opts.filter || opts.filter(it)));
    const sortSel = el('select', { className: 'input', 'aria-label': 'Tính số theo món', style: 'min-height:36px;padding:4px 8px;font-size:14px;width:100%',
      onChange: e => { ST.stockSel = e.target.value; redraw(); } },
      el('option', { value: '', selected: !selMenu, text: 'Trung bình các món' }),
      (ST.stockMenus || []).map(m => el('option', { value: m.id, selected: !!selMenu && selMenu.id === m.id, text: m.name })));
    return (ST.stockBoard || []).length ? el('div', { className: 'card', style: 'margin-bottom:12px' },
      el('b', { style: 'display:block;margin-bottom:8px', text: opts.title || 'Tồn kho hàng bán' }),
      el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:8px' },
        el('span', { style: 'flex:none;font-size:13.5px;color:var(--text-sub)', text: 'Tính theo' }), sortSel),
      el('div', { style: g3 + ';font-size:12.5px;color:var(--text-sub);padding:0 0 6px' },
        el('span', { text: 'Tên' }), el('span', { style: 'text-align:right', text: 'Tồn kho' }), el('span', { style: 'text-align:right', text: 'Số ' + ((selMenu && selMenu.unit) || 'chai') }), opts.actions ? el('span') : null),
      stockRows.map(it => {
        const n = stockBottles(it), low = n != null && n <= 0;
        return el('div', { style: g3 + ';padding:9px 0;border-top:1px solid var(--border)' },
          el('span', { style: 'font-weight:600;overflow-wrap:anywhere', text: it.name }),
          el('span', { className: 'num', style: 'text-align:right;font-size:14px' }, String(stockFmt(it)).replace('.', ',') + ' ', el('span', { style: 'color:var(--text-sub)', text: stockUnit(it) })),
          el('span', { className: 'num', style: 'text-align:right;font-size:17px;font-weight:800;color:' + (n == null ? 'var(--text-sub)' : low ? 'var(--error)' : 'var(--accent)'), text: n == null ? '—' : String(n) }),
          opts.actions ? opts.actions(it) : null);
      })) : null;
  }

      })(),

    );

    );

    // Danh sách 40 đơn tay gần đây nhóm theo ngày

          ),

    if (ST.tab !== 'sale' || (false && ST.saleList === 'saved' && ST.saleView !== 'order')) { stickyHost.replaceChildren(); return; }

  function resetSaleForm() {
    const keepPlace = ST.sale.place || 'Tại quầy';
    const keepPay = ST.sale.pay_method_id;
    ST.sale = {
      editId: null, editCode: '', items: [],
      place: keepPlace, customer_name: '', customer_phone: '', customer_id: null, note: '',
      at: '', discount: 0, voucher_id: null, pay_method_id: keepPay, unpaid: false, paidCustom: null
    };

    ST.saleView = 'pick';
    app.storageSet(DRAFT_KEY, null);

  function startEditManualOrder(o) {
    ST.sale = {
      editId: o.id,
      editCode: o.code,
      items: (o.order_items || []).filter(it => !it.is_gift).map(it => ({ item_id: it.item_id, name: it.name, unit: it.unit || 'phần', price: it.price, qty: it.qty })),
      place: o.place || 'Tại quầy',
      customer_name: o.customer_name || '',
      customer_phone: o.customer_phone || '',
      customer_id: o.customer_id || null,
      note: o.note || '',
      at: toLocalDtValue(o.ordered_at),
      discount: Math.max(0, (o.discount || 0) - (o.promo_discount || 0)),
      voucher_id: null,
      pay_method_id: o.pay_method_id,
      unpaid: o.pay_status !== 'paid',
      origPay: o.pay_status,
      paidCustom: o.paid,
      address: o.address || '',
      editStatus: o.status,
      fromOnline: o.source !== 'manual'
    };
    ST.saleQuote = null; ST.saleVouchers = [];
    ST.saleView = 'order';
    if (ST.tab !== 'sale') { ST.tab = 'sale'; stickyHost.replaceChildren(); renderShopHeader(); renderNav(); }
    if (app.hasPlan('proplus')) {
      sb.from('customer_vouchers').select('id,promo_id').eq('shop_id', shopId).eq('used_order_id', o.id).limit(1).then(r => {
        const cv = r && r.data && r.data[0];
        if (cv && ST.sale.editId === o.id) { ST.sale.voucher_id = cv.id; ST.saleVouchers = [{ id: cv.id, name: 'Voucher đã dùng cho đơn này', text: '' }]; ST.saleQuote = null; drawSalePromo(); fetchSaleQuote(); }
      });
    }
    renderSaleTab();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function submitSaleOrder(btn) {
    const s = ST.sale;
    if (!s.items.length) return;
    if (s.ship && !s.editId) return submitShipOrder(btn);
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      clearTimeout(saleQuoteTimer);
      if (app.hasPlan('proplus') && !saleQuoteNow()) await fetchSaleQuote(); // chốt giá khuyến mãi mới nhất trước khi lưu
      const tot = saleTotals();
      const place = (s.place || '').trim() || 'Tại quầy';
      if (!ST.salePlaces.includes(place)) {
        ST.salePlaces = [place].concat(ST.salePlaces).slice(0, 10);
        app.storageSet('dd_sale_places_' + shopId, ST.salePlaces);
      }
      app.storageSet('dd_last_place_' + shopId, place);
      const paidAmt = s.unpaid ? 0 : (s.paidCustom != null ? s.paidCustom : tot.total);
      const args = {
        p_shop: shopId,
        p_order: s.editId || null,
        p_at: localDtToIso(s.at),
        p_customer_name: (s.customer_name || '').trim(),
        p_customer_phone: (s.customer_phone || '').trim(),
        p_address: s.address || '',
        p_note: (s.note || '').trim(),
        p_customer_id: app.hasPlan('proplus') ? (s.customer_id || null) : null,
        p_place: place,
        p_items: s.items.map(it => ({ item_id: it.item_id, qty: it.qty })),
        p_discount: tot.manual,
        p_promo: app.hasPlan('proplus'),
        p_voucher: app.hasPlan('proplus') ? (s.voucher_id || null) : null,
        p_pay_method: s.unpaid ? null : (s.pay_method_id || null),
        p_pay_status: s.unpaid ? (s.origPay === 'checking' ? 'checking' : 'unpaid') : 'paid',
        p_paid: paidAmt,
        p_status: s.editId ? (s.editStatus || 'done') : 'done'
      };
      ST.saleLastArgs = args;
      let data, error;
      if (s.editId) ({ data, error } = await sb.rpc('save_order', args));
      else {
        // Đơn mới gửi kèm mã chống trùng: gửi lại nhiều lần vẫn chỉ ra một đơn
        if (!s.key) s.key = newKey();
        ({ data, error } = await sb.rpc('save_order_once', onceArgs(s.key, args)));
      }
      if (error) throw error;
      app.showToast((s.editId ? 'Đã cập nhật đơn ' : 'Đã lưu đơn ') + data.code + ' · ' + app.formatMoney(data.total), 'accent');
      const backToOrders = !!s.fromOnline;
      resetSaleForm();
      await Promise.all([loadManualOrders(), loadStockBoard()]);
      if (backToOrders) { try { await loadOnlineOrders(false); } catch (e) {} await switchTab('online'); }
      else renderSaleTab();
    } catch (err) {
      if (!s.editId && isNetErr(err) && s.key && ST.saleLastArgs) {
        outboxAdd({ key: s.key, args: onceArgs(s.key, ST.saleLastArgs), at: Date.now() });
        app.showToast('Mất mạng. Đơn đã lưu trên máy, sẽ tự gửi khi có mạng.', 'accent');
        resetSaleForm();
        renderSaleTab();
        return;
      }
      showErr(err);
      btn.disabled = false; btn.textContent = ST.sale.editId ? 'Cập nhật đơn' : 'Lưu đơn';
    }
  }

  function shipPlacePicker(s, places) {
    const areas = [...new Set((Array.isArray(ST.shop.areas) ? ST.shop.areas : []).map(x => typeof x === 'string' ? x : x.name).concat(places.map(x => x.area).filter(Boolean)))];
    const out = s.shipScope === 'out';
    const scopeBtn = (v, txt) => el('button', { type: 'button', className: 'chip', 'aria-pressed': String(out === (v === 'out')), onClick: () => { s.shipScope = v; saveDraft(); renderSaleTab(); }, text: txt });
    const wrap = el('div', { className: 'field' }, el('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px' },
      el('label', { style: 'margin:0', text: 'Nơi giao' }), el('div', { className: 'chips', style: 'margin:0' }, scopeBtn('in', 'Trong chung cư'), scopeBtn('out', 'Ngoài chung cư'))));
    const feeTxt = pl => (pl.fee > 0 ? ' (+' + app.formatMoney(pl.fee) + ')' : '');
    const pick = pl => { s.shipPlace = pl.name; saveDraft(); renderSaleTab(); };
    if (places.length <= 6 && areas.length <= 1) {
      wrap.append(el('div', { className: 'chips' }, places.map(p => el('button', { type: 'button', className: 'chip', 'aria-pressed': String(s.shipPlace === p.name), onClick: () => pick(p), text: p.name + feeTxt(p) }))));
    } else {
      let q = '', ar = '';
      const listBox = el('div', { style: 'max-height:200px;overflow:auto;margin-top:6px;border:1px solid var(--border);border-radius:10px' });
      const pills = el('div', { className: 'chips', style: 'margin-top:8px' });
      const draw = () => {
        const fq = fold(q);
        const shown = places.filter(p => (!ar || (p.area || '') === ar) && (!fq || fold(p.name).includes(fq) || fold(p.address || '').includes(fq) || fold(p.area || '').includes(fq)));
        pills.replaceChildren(...[''].concat(areas).map(a => el('button', { type: 'button', className: 'chip', 'aria-pressed': String(ar === a), onClick: () => { ar = a; draw(); }, text: a || 'Tất cả' })));
        listBox.replaceChildren(...(shown.length ? shown.map(p => el('button', { type: 'button', className: 'btn', style: 'width:100%;text-align:left;border:0;border-radius:0;border-top:1px solid var(--border);' + (s.shipPlace === p.name ? 'font-weight:700;background:var(--accent-soft, #e3ede5)' : ''), onClick: () => pick(p) },
          p.name + feeTxt(p) + (p.area ? ' · ' + p.area : ''))) : [el('div', { style: 'padding:10px;color:var(--text-sub)', text: 'Không tìm thấy nơi giao.' })]));
      };
      const cur = places.find(x => x.name === s.shipPlace);
      wrap.append(el('div', { style: 'font-weight:700', text: 'Đang chọn: ' + (cur ? cur.name + feeTxt(cur) : 'chưa chọn') }),
        areas.length > 1 ? pills : null,
        el('input', { className: 'input', style: 'margin-top:8px', placeholder: 'Gõ tên nơi giao để lọc', onInput: e => { q = e.target.value; draw(); } }), listBox);
      draw();
    }
    const cur = places.find(x => x.name === s.shipPlace);
    const lines = cur ? [out ? 'Chọn chung cư gần nhất' : cur.address, cur.promise ? 'Giao trong khoảng ' + cur.promise : '', cur.min_qty > 0 ? 'Tối thiểu ' + cur.min_qty + ' sản phẩm' : ''].filter(Boolean) : [];
    if (lines.length) wrap.append(el('div', { style: 'font-size:12.5px;color:var(--text-sub);margin-top:6px', text: lines.join(' · ') }));
    return wrap;
  }

  // Đơn giao tận nơi (như v1 "Giao tận nơi"): lên đơn vào hàng chờ cho bếp, hiện ở mục Đơn
  async function submitShipOrder(btn) {
    const s = ST.sale;
    const phone = (s.customer_phone || '').replace(/[\s.\-]/g, '');
    if (!/^\+?[0-9]{8,15}$/.test(phone)) { app.showToast('Nhập số điện thoại khách để giao hàng.', 'error'); return; }
    const places = Array.isArray(ST.shop.places) ? ST.shop.places : [];
    const pl = places.find(p => p.name === s.shipPlace) || null;
    const nd = NEEDS[needKey(pl)];
    const outside = s.shipScope === 'out';
    if (!(s.shipAddr || '').trim()) { app.showToast(outside ? 'Chưa nhập địa chỉ nhận hàng ngoài chung cư.' : nd.err, 'error'); return; }
    const qtyAll = s.items.reduce((t, it) => t + (Number(it.qty) || 0), 0);
    if (pl && pl.min_qty > 0 && qtyAll < pl.min_qty) { app.showToast('Nơi giao này cần tối thiểu ' + pl.min_qty + ' sản phẩm.', 'error'); return; }
    let shipAddr = (s.shipAddr || '').trim();
    if (outside) shipAddr = 'Ngoài chung cư: ' + shipAddr;
    btn.disabled = true; btn.textContent = 'Đang lên đơn…';
    try {
      if (!s.key) s.key = newKey();
      const { data, error } = await sb.rpc('staff_create_order', {
        p_key: s.key, p_shop: shopId, p_name: (s.customer_name || '').trim(), p_phone: phone,
        p_address: shipAddr, p_note: (s.note || '').trim(),
        p_items: s.items.map(it => ({ item_id: it.item_id, qty: it.qty })),
        p_pay_method: s.pay_method_id || null, p_voucher: app.hasPlan('proplus') ? (s.voucher_id || null) : null,
        p_place: pl ? pl.name : null, p_paid: false
      });
      if (error) throw error;
      app.showToast('Đã lên đơn giao ' + data.code + ' · ' + app.formatMoney(data.total) + '. Xem ở mục Đơn.', 'accent');
      resetSaleForm();
      renderSaleTab();
      try { await loadOnlineOrders(false); renderNav(); } catch (e) {}
    } catch (err) {
      showErr(err);
      btn.disabled = false; btn.textContent = 'Lên đơn giao';
    }
  }

  /* ===== HÀNG ĐỢI OFFLINE (như v1): mất mạng thì lưu đơn bán tại quầy trên máy, có mạng tự gửi ===== */
  const OUTBOX_KEY = 'dd_outbox_' + shopId;
  const newKey = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'k' + Date.now() + Math.random().toString(16).slice(2);
  const isNetErr = err => {
    const m = String((err && (err.message || err.details)) || err || '');
    return !navigator.onLine || /failed to fetch|networkerror|load failed|network request failed|timeout/i.test(m);
  };
  function onceArgs(key, a) {
    return {
      p_key: key, p_shop: a.p_shop, p_items: a.p_items, p_at: a.p_at, p_customer_name: a.p_customer_name, p_customer_phone: a.p_customer_phone,
      p_note: a.p_note, p_customer_id: a.p_customer_id, p_place: a.p_place, p_discount: a.p_discount, p_pay_method: a.p_pay_method,
      p_pay_status: a.p_pay_status, p_paid: a.p_paid, p_promo: a.p_promo, p_voucher: a.p_voucher
    };
  }
  const outboxGet = () => { const v = app.storageGet(OUTBOX_KEY, []); return Array.isArray(v) ? v : []; };
  function outboxAdd(item) { app.storageSet(OUTBOX_KEY, outboxGet().concat(item)); drawOutboxBar(); }
  let outboxBusy = false;
  async function flushOutbox(manual) {
    if (outboxBusy || (!navigator.onLine && !manual)) return;
    const list = outboxGet();
    if (!list.length) { drawOutboxBar(); return; }
    outboxBusy = true; drawOutboxBar();
    let sent = 0;
    try {
      for (const it of list) {
        if (it.err && !manual) continue;
        const { error } = await sb.rpc('save_order_once', it.args);
        if (!error) { sent++; app.storageSet(OUTBOX_KEY, outboxGet().filter(x => x.key !== it.key)); continue; }
        if (isNetErr(error)) break;
        app.storageSet(OUTBOX_KEY, outboxGet().map(x => x.key === it.key ? Object.assign({}, x, { err: app.translateServerError(error) }) : x));
      }
    } finally { outboxBusy = false; drawOutboxBar(); }
    if (sent) {
      app.showToast('Đã gửi ' + sent + ' đơn lưu khi mất mạng', 'accent');
      try { await loadManualOrders(); if (ST.tab === 'sale') renderSaleTab(); } catch (e) {}
    }
  }
  function drawOutboxBar() {
    let bar = document.getElementById('outbox-bar');
    const list = outboxGet();

  async function loadEodPro() {
    await loadFlow();
    const today = app.toVnYmd(new Date());
    const from = today + 'T00:00:00+07:00', to = today + 'T23:59:59+07:00';
    const pu = await sb.from('purchases').select('id,total,paid').eq('shop_id', shopId).gte('at', from).lte('at', to);
    if (pu.error) throw pu.error;
    let lines = [];
    if ((pu.data || []).length) {
      const pl = await sb.from('purchase_lines').select('purchase_id,name').eq('shop_id', shopId).in('purchase_id', pu.data.map(p => p.id));
      if (pl.error) throw pl.error;
      lines = pl.data || [];
    }
    const ce = await sb.from('cash_entries').select('dir,cat,amount,pay_method_id').eq('shop_id', shopId).gte('at', from).lte('at', to);
    if (ce.error) throw ce.error;
    const sn = await sb.from('eod_snapshots').select('day,data').eq('shop_id', shopId).gte('day', app.shiftYmd(today, -2)).order('day', { ascending: false });
    if (sn.error) throw sn.error;
    ST.eodPro = { purchases: pu.data || [], lines, cash: ce.data || [], snaps: sn.data || [] };
    const mine = ST.eodPro.snaps.find(s => s.day === today);
    const stt = mine && mine.data && mine.data.state;
    ST.eodState = { open: (stt && stt.open) || {}, ok: (stt && stt.ok) || {}, actual: (stt && stt.actual) || {}, checks: (stt && stt.checks) || {} };
    eodPersist(false);
  }

  let eodSaveT = null;
  function eodPersist(now) {
    clearTimeout(eodSaveT);
    const run = async () => {
      try {
        const today = app.toVnYmd(new Date());
        const { error } = await sb.from('eod_snapshots').upsert({ shop_id: shopId, day: today, data: { state: ST.eodState, model: eodModel() }, updated_at: new Date().toISOString() }, { onConflict: 'shop_id,day' });
        if (error) throw error;
        await sb.from('eod_snapshots').delete().eq('shop_id', shopId).lt('day', app.shiftYmd(today, -2));
        return true;
      } catch (e) { showErr(e); return false; }
    };
    if (now) return run();
    eodSaveT = setTimeout(run, 700);
  }

  const stepKey = s => (s.time || '') + '|' + s.text;
  function eodModel() {
    const f = ST.flow, P = ST.eodPro, st = ST.eodState, C = flowCompute();
    const rev = f.orders.reduce((s, o) => s + Math.max(0, (Number(o.total) || 0) - (Number(o.delivery_fee) || 0)), 0);
    const kpi = {
      rev: { act: rev, tgt: C.tp.dt }, don: { act: f.orders.length, tgt: C.tp.don },
      lit: C.groups.map((g, i) => ({ g, name: g.name, act: C.act[i].lit, tgt: C.plan[i].lit })).filter(x => !x.g.noProd).map(x => ({ name: x.name, act: x.act, tgt: x.tgt })),
      litTot: { act: C.ta.lit, tgt: C.tp.lit },
      bot: (() => {
        const q = new Map();
        for (const l of f.lines) if (!l.is_gift) q.set(l.item_id, (q.get(l.item_id) || 0) + (Number(l.qty) || 0));
        const items = (ST.menuItems || []).filter(m => m.active || q.get(m.id)).map(m => ({ name: m.name, unit: m.unit || 'chai', act: q.get(m.id) || 0 }));
        return { tot: items.reduce((a, x) => a + x.act, 0), items };
      })()
    };
    const steps = f.steps.slice().sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')).map(s => ({ text: s.text, time: s.time || '', note: s.note || '', done: !!st.checks[stepKey(s)] }));
    const accs = new Map(activePayMethods().map(m => [m.id, { id: m.id, name: m.name, sales: 0, buy: 0, other: 0 }]));
    const acc = id => {
      const k = id || '_none';
      if (!accs.has(k)) accs.set(k, { id: k, name: id ? (payMethodName(id) || 'Tài khoản khác') : 'Chưa chọn tài khoản', sales: 0, buy: 0, other: 0 });
      return accs.get(k);
    };
    for (const o of f.orders) {
      const got = Number(o.paid) > 0 ? Number(o.paid) : (o.pay_status === 'paid' ? Number(o.total) || 0 : 0);
      if (got > 0) acc(o.pay_method_id).sales += got;
    }
    for (const c of P.cash) {
      const a = Number(c.amount) || 0;
      if (c.cat === 'mua_hang' || c.cat === 'tra_no_ncc') { if (c.dir === 'out') acc(c.pay_method_id).buy += a; else acc(c.pay_method_id).buy -= a; }
      else acc(c.pay_method_id).other += c.dir === 'in' ? a : -a;
    }
    const accounts = [...accs.values()].map(a => {
      const open = Number(st.open[a.id]) || 0;
      const end = open + a.sales;
      const book = end - a.buy + a.other;
      const ok = st.ok[a.id] === undefined ? null : st.ok[a.id];
      const actual = ok === false && st.actual[a.id] != null ? Number(st.actual[a.id]) : null;
      return Object.assign({}, a, { open, end, book, ok, actual, real: actual != null ? actual : book });
    }).filter(a => a.open || a.sales || a.buy || a.other || a.id !== '_none');
    const sum = k => accounts.reduce((s, a) => s + a[k], 0);
    return {
      kpi, steps,
      money: { accounts, items: P.lines.length, buyTotal: P.purchases.reduce((s, p) => s + (Number(p.total) || 0), 0), tot: { open: sum('open'), sales: sum('sales'), end: sum('end'), buy: sum('buy'), other: sum('other'), book: sum('book'), real: sum('real') } }
    };
  }

  function eodVerdict(model) {
    const K = model.kpi;
    const ge = x => !(Number(x.tgt) > 0) || Number(x.act) >= Number(x.tgt);
    const A = ge(K.rev) && ge(K.don) && ge(K.litTot) ? 'Đạt' : 'Không đạt';
    const steps = model.steps || [];
    const B = !steps.length ? '—' : steps.every(s => s.done) ? 'Đạt' : 'Không đạt';
    const used = (model.money.accounts || []).filter(a => a.open || a.sales || a.buy || a.other);
    const C = used.some(a => a.ok === false) ? 'Không đạt' : used.every(a => a.ok === true) ? 'Đạt' : 'Chưa kiểm';
    return { A, B, C };
  }

          el('div', { className: 'line-main' }, el('b', { text: d.slice(8, 10) + '/' + d.slice(5, 7) }),

          m ? el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openEodPastModal({ data: { model: m } }, d, e.currentTarget), text: 'Xem' }) : null);
      }));
    return [...eodCards(model, true, 'Hôm nay'), histCard];
  }

  function openEodPastModal(sn, day, opener) {
    const model = sn.data.model;
    openModal('Cuối ngày ' + day.slice(8, 10) + '/' + day.slice(5, 7), el('div', null, (cs => [cs[0], cs[2]])(eodCards(model, false, ''))), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })], opener);
  }

  // Đổi phương thức thanh toán của đơn (giữ nguyên trạng thái thu tiền và số đã thu)
  function openChangePaymentModal(order, opener) {
    let sel = order.pay_method_id || null;
    const body = el('div');
    const draw = () => {
      body.replaceChildren(
        el('p', { style: 'margin:0 0 10px', text: 'Đơn ' + order.code + ' đang thanh toán bằng: ' + (order.pay_method_id ? payMethodName(order.pay_method_id) : 'chưa chọn') + '. Chọn cách mới:' }),
        el('div', { className: 'chips' },
          activePayMethods().map(m => el('button', {
            type: 'button', className: 'chip', 'aria-pressed': String(sel === m.id),
            onClick: () => { sel = m.id; draw(); }, text: m.name
          }))
        ),
        order.pay_status === 'paid' ? el('small', { style: 'display:block;margin-top:10px;color:var(--text-sub)', text: 'Đơn đã thu tiền, chỉ đổi cách thanh toán đã ghi.' }) : null,
        // Chọn cách không phải tiền mặt: hiện luôn QR để khách quét ngay
        (sel && !/tiền mặt/i.test(payMethodName(sel) || '') && window.DDQR && DDQR.canShow(ST.shop))
          ? el('div', { style: 'margin-top:14px;padding-top:12px;border-top:1px solid var(--border)' }, DDQR.block(ST.shop, order.total, order.code)) : null
      );
    };
    draw();
    const okBtn = el('button', { type: 'button', className: 'btn btn-primary', text: 'Lưu' });
    okBtn.onclick = async () => {
      if (!sel || sel === order.pay_method_id) { closeModal(); return; }
      okBtn.disabled = true; okBtn.textContent = 'Đang lưu…';
      try {
        const paidAmt = order.pay_status === 'paid' ? (order.paid != null && order.paid > 0 ? order.paid : order.total) : (order.paid || 0);
        const { error } = await sb.rpc('set_order_payment', { p_order: order.id, p_pay_method: sel, p_pay_status: order.pay_status, p_paid: paidAmt });
        if (error) throw error;
        order.pay_method_id = sel;
        closeModal();
        app.showToast('Đã đổi cách thanh toán đơn ' + order.code + ' sang ' + payMethodName(sel), 'accent');
        if (ST.tab === 'online') renderOnlineTab();
      } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Lưu'; }
    };
    openModal('Đổi cách thanh toán', body, [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), okBtn], opener);
  }

  function openConfirmPaymentModal(order, onDone, opener) {
    let selMethod = order.pay_method_id || (activePayMethods()[0] && activePayMethods()[0].id) || null;
    const body = el('div');
    const draw = () => {
      body.replaceChildren(
        el('p', { style: 'margin:0 0 10px', text: 'Xác nhận đã thu đủ ' + app.formatMoney(order.total) + ' cho đơn ' + order.code + ':' }),
        el('div', { className: 'chips' },
          activePayMethods().map(m => el('button', {
            type: 'button', className: 'chip', 'aria-pressed': String(selMethod === m.id),
            onClick: () => { selMethod = m.id; draw(); }, text: m.name
          }))
        )
      );
    };
    draw();
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        okBtn.disabled = true; okBtn.textContent = 'Đang lưu…';
        try {
          const { error } = await sb.rpc('set_order_payment', {
            p_order: order.id, p_pay_method: selMethod, p_pay_status: 'paid', p_paid: order.total
          });
          if (error) throw error;
          closeModal();
          app.showToast('Đã xác nhận thu tiền đơn ' + order.code, 'accent');
          if (onDone) await onDone();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Đã nhận tiền'; }
      },
      text: 'Đã nhận tiền'
    });
    openModal('Xác nhận thanh toán', body, [
      el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }),
      okBtn
    ], opener);
  }

  /* ===== TAB: Đơn online (gói tối thiểu: standard) ===== */
  const ONLINE_STATES = [
    { id: 'new', label: 'Mới' },
    { id: 'preparing', label: 'Đang làm' },
    { id: 'delivering', label: 'Đang giao' },
    { id: 'done', label: 'Xong' },
    { id: 'cancelled', label: 'Đã hủy' },
    { id: 'all', label: 'Tất cả' }
  ];
  const ACTIVE_ST = ['new', 'preparing', 'delivering'];
  const NEXT_ACTION = {
    new: { next: 'preparing', label: 'Nhận đơn' },
    preparing: { next: 'delivering', label: 'Giao hàng' },
    delivering: { next: 'done', label: 'Hoàn tất' }
  };

  async function loadOnlineOrders(append) {
    const from = append ? ST.onlineOffset : 0;
    const to = from + 49;
    const { data, error } = await sb.from('orders')
      .select('*, order_items(id,item_id,name,unit,price,qty)')
      .eq('shop_id', shopId)
      .in('source', ['online', 'manual'])
      .order('created_at', { ascending: false })
      .range(from, to);
    if (error) throw error;
    const list = data || [];
    if (append) {
      const seen = new Set(ST.onlineOrders.map(o => o.id));
      ST.onlineOrders = ST.onlineOrders.concat(list.filter(o => !seen.has(o.id)));
    } else {
      ST.onlineOrders = list;
    }
    ST.onlineOffset = ST.onlineOrders.length;
    ST.onlineHasMore = list.length === 50;
  }

  function renderOnlineTab() {
    const OFILTERS = [
      ['new', 'Đơn mới', o => o.status === 'new'],
      ['doing', 'Đang làm', o => o.status === 'preparing' || o.status === 'delivering'],
      ['recent', 'Gần đây', () => true]
    ];
    const waitingPay = o => o.status === 'done' && o.pay_status !== 'paid';
    if (!OFILTERS.some(x => x[0] === ST.onlineFilter) && ST.onlineFilter !== 'rate') ST.onlineFilter = 'new';
    const cur = OFILTERS.find(x => x[0] === ST.onlineFilter) || OFILTERS[2];
    const shown = ST.onlineOrders.filter(cur[2]).sort((a, b) => ST.onlineFilter === 'recent' ? ((waitingPay(b) - waitingPay(a)) || (new Date(b.created_at) - new Date(a.created_at))) : (new Date(a.created_at) - new Date(b.created_at)));
    const chipRow = (k, label, n, onClick) => el('button', {
      type: 'button', className: 'chip', 'aria-pressed': String(ST.onlineFilter === k),
      onClick: onClick || (() => { ST.onlineFilter = k; renderOnlineTab(); }),
      text: label + (n ? ' · ' + n : '')
    });
    const nCols = OFILTERS.length + (app.hasPlan('proplus') ? 1 : 0);
    const filterRow = el('div', { className: 'chips ofilters', style: 'margin-bottom:12px;display:grid;grid-template-columns:repeat(' + nCols + ',1fr);gap:6px', role: 'group', 'aria-label': 'Lọc đơn' },
      OFILTERS.map(([k, label, fn]) => chipRow(k, label, k === 'recent' ? 0 : ST.onlineOrders.filter(fn).length)),
      app.hasPlan('proplus') ? chipRow('rate', 'Đánh giá', 0, () => switchTab('feedback')) : null
    );
    const nWait = ST.onlineOrders.filter(waitingPay).length;
    const legend = (ST.onlineFilter === 'recent' && nWait) ? el('div', { className: 'alert', style: 'margin-bottom:10px', text: nWait + ' đơn đã giao đang chờ thu tiền, xếp lên đầu.' }) : null;

    const cards = shown.length ? shown.map(o => {
      const next = NEXT_ACTION[o.status];
      const payLabel = o.pay_status === 'paid' ? 'Đã thu' : (o.pay_status === 'checking' ? 'Chờ xác nhận' : 'Chưa thu');
      const payCls = o.pay_status === 'paid' ? '' : (o.pay_status === 'checking' ? 'badge-warn' : 'badge-err');
      return el('div', { className: 'card ocard st-' + o.status },
        el('div', { className: 'row-between' },
          el('b', { className: 'num', style: 'font-size:17px', text: o.code }),
          el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' },
            el('span', { className: 'stb stb-' + o.status, text: (ONLINE_STATES.find(x => x.id === o.status) || {}).label || o.status }),
            el('span', { className: 'badge ' + payCls, text: payLabel })
          )
        ),
        el('div', { style: 'font-size:13.5px;color:var(--text-sub);margin-top:4px', text: 'Đặt lúc ' + app.formatVnDateTime(o.ordered_at || o.created_at) + (o.deliver_at ? ' · Hẹn giao ' + app.formatVnDateTime(o.deliver_at) : '') }),
        el('div', { style: 'margin-top:6px;font-weight:600' },
          (o.customer_name || 'Khách') + ' · ',
          o.customer_phone ? el('a', { href: 'tel:' + o.customer_phone, style: 'color:var(--accent)', text: o.customer_phone }) : null
        ),
        (o.place || o.address) ? (() => {
          const pl0 = (Array.isArray(ST.shop.places) ? ST.shop.places : []).find(x => x.name === o.place);
          return el('div', { style: 'margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft, #e3ede5)' },
            o.place ? el('div', { style: 'font-size:20px;font-weight:800;line-height:1.25', text: o.place }) : null,
            o.address ? el('div', { style: 'font-size:17px;font-weight:700;margin-top:2px', text: o.address }) : null,
            pl0 && pl0.address ? el('div', { style: 'font-size:13px;color:var(--text-sub);margin-top:2px', text: pl0.address }) : null,
            o.delivery_fee > 0 ? el('div', { style: 'font-size:13px;color:var(--text-sub);margin-top:2px', text: 'Phí giao ' + app.formatMoney(o.delivery_fee) }) : null);
        })() : null,
        o.note ? el('div', { style: 'font-size:14px;font-style:italic;margin-top:4px', text: 'Ghi chú: ' + o.note }) : null,
        el('div', { style: 'margin-top:8px;border-top:1px solid var(--border);padding-top:8px' },
          (o.order_items || []).map(it => el('div', { className: 'row-between', style: 'padding:2px 0;font-size:14.5px' },
            el('span', { text: it.qty + ' × ' + it.name }),
            el('span', { className: 'num', text: app.formatMoney(it.price * it.qty) })
          )),
          o.discount > 0 ? el('div', { className: 'row-between', style: 'font-size:14px;color:var(--accent)' },
            el('span', { text: 'Giảm giá' }), el('span', { className: 'num', text: '−' + app.formatMoney(o.discount) })
          ) : null,
          el('div', { className: 'row-between', style: 'font-weight:700;font-size:16px;margin-top:4px' },
            el('span', { text: o.pay_method_id ? 'Tổng (' + payMethodName(o.pay_method_id) + ')' : 'Tổng cộng' }),
            el('span', { className: 'num', text: app.formatMoney(o.total) })
          )
        ),
        el('div', { className: 'toolbar', style: 'margin-top:10px;display:flex;gap:8px;flex-wrap:wrap' },
          next ? el('button', {
            type: 'button', className: 'btn btn-primary', style: 'flex:1',
            onClick: () => updateOnlineStatus(o, next.next),
            text: next.label
          }) : null,
          o.status !== 'cancelled' && o.pay_status !== 'paid' ? el('button', {
            type: 'button', className: 'btn',
            onClick: e => openModal('Thu tiền đơn ' + o.code, el('div', { style: 'display:grid;gap:8px' },
              el('div', { className: 'row-between', style: 'font-weight:700;font-size:17px;margin-bottom:4px' }, el('span', { text: 'Tổng cộng' }), el('span', { className: 'num', text: app.formatMoney(o.total) })),
              (window.DDQR && DDQR.canShow(ST.shop)) ? el('button', { type: 'button', className: 'btn', style: 'width:100%', onClick: () => { closeModal(); openModal('QR chuyển khoản ' + o.code, DDQR.block(ST.shop, o.total, o.code), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })]); }, text: 'Hiện mã QR chuyển khoản' }) : null,
              el('button', { type: 'button', className: 'btn btn-primary', style: 'width:100%', onClick: () => { closeModal(); openConfirmPaymentModal(o, async () => { await loadOnlineOrders(false); renderOnlineTab(); }); }, text: 'Đã nhận tiền' }),
              o.pay_status === 'unpaid' ? el('button', { type: 'button', className: 'btn', style: 'width:100%', onClick: async () => {
                closeModal();
                try {
                  const { error } = await sb.rpc('set_order_payment', { p_order: o.id, p_pay_method: o.pay_method_id, p_pay_status: 'checking', p_paid: 0 });
                  if (error) throw error;
                  o.pay_status = 'checking';
                  app.showToast('Đã đánh dấu chờ xác nhận chuyển khoản', 'accent');
                  renderOnlineTab();
                } catch (err) { showErr(err); }
              }, text: 'Khách báo đã chuyển, chờ xác nhận' }) : null
            ), null, e.currentTarget),
            text: 'Thu tiền'
          }) : null,
          o.status !== 'cancelled' ? el('button', {
            type: 'button', className: 'btn',
            onClick: e => openChangePaymentModal(o, e.currentTarget),
            text: 'Đổi cách thanh toán'
          }) : null,
          o.status !== 'cancelled' ? el('button', { type: 'button', className: 'btn', onClick: () => startEditManualOrder(o), text: 'Sửa đơn' }) : null,
          kebab(
            o.status !== 'done' && o.status !== 'cancelled' ? { text: 'Hủy đơn', danger: true, fn: e => openCancelOrderModal(o, e.currentTarget) } : null,
            { text: 'Xóa đơn', danger: true, fn: e => confirmModal('Xóa đơn ' + o.code + '?', 'Đơn bị xóa hẳn khỏi hệ thống, khoản tiền tự ghi ở Thu chi cũng mất theo. Chỉ nên xóa đơn nhập nhầm; đơn khách hủy thì dùng Hủy đơn.', 'Xóa đơn', async () => {
              const { error } = await sb.rpc('delete_order', { p_order: o.id });
              if (error) throw error;
              app.showToast('Đã xóa đơn ' + o.code, 'accent');
              await loadOnlineOrders(false); renderOnlineTab(); renderNav();
            }, e.currentTarget) })
        )
      );
    }) : [el('div', { className: 'card empty-state', text: ST.onlineFilter === 'new' ? 'Chưa có đơn mới.' : 'Không có đơn nào.' })];

    const moreBtn = ST.onlineHasMore ? el('button', {
      type: 'button', className: 'btn', style: 'width:100%',
      onClick: async () => { await loadOnlineOrders(true); renderOnlineTab(); },
      text: 'Xem thêm đơn cũ'
    }) : null;

    contentHost.replaceChildren(
      renderMetaBar('online', async () => { await loadOnlineOrders(false); markLoaded('online'); renderOnlineTab(); }),
      filterRow,
      legend,
      ...cards,
      moreBtn,
      el('div', { style: 'text-align:center;margin-top:16px;color:var(--text-sub);font-size:13px', text: 'Tự tải lại mỗi 25 giây' })
    );
  }

  // Hủy / từ chối đơn kèm lý do (như v1: khách thấy lý do trên đơn của họ)
  function openCancelOrderModal(order, opener) {
    const chips = ['Hết hàng', 'Ngoài khu vực giao', 'Quán nghỉ', 'Khách yêu cầu hủy'];
    let reason = '';
    const inp = el('input', { className: 'input', placeholder: 'Lý do (khách sẽ thấy). Có thể để trống', maxlength: 200, onInput: e => { reason = e.target.value; draw(); } });
    const row = el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin:10px 0' });
    const draw = () => row.replaceChildren(...chips.map(c => el('button', {
      type: 'button', className: 'btn btn-sm' + (reason === c ? ' btn-primary' : ''),
      onClick: () => { reason = c; inp.value = c; draw(); }, text: c
    })));
    draw();
    const okBtn = el('button', { type: 'button', className: 'btn btn-danger', text: 'Xác nhận hủy', onClick: () => { closeModal(); updateOnlineStatus(order, 'cancelled', reason.trim()); } });
    openModal('Hủy đơn ' + order.code + '?', el('div', null, el('div', { text: 'Đơn sẽ chuyển sang Đã hủy. Chọn hoặc ghi lý do để khách biết.' }), row, inp),
      [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Quay lại' }), okBtn], opener);
  }

  async function updateOnlineStatus(order, newStatus, reason) {
    const prev = order.status;
    order.status = newStatus; // Cập nhật lạc quan
    renderOnlineTab();
    try {
      const patch = { status: newStatus };
      if (newStatus === 'cancelled') patch.cancel_reason = reason || null;
      const res = await sb.from('orders').update(patch).eq('id', order.id).eq('shop_id', shopId).select('id');
      checkMutated(res);
      app.showToast('Đã chuyển đơn ' + order.code + ' sang ' + ((ONLINE_STATES.find(x => x.id === newStatus) || {}).label || newStatus), 'accent');
      renderNav();
    } catch (err) {
      order.status = prev; // Hoàn tác khi lỗi
      showErr(err);
      renderOnlineTab();
    }
  }

  // Thời gian thực cho đơn online + dự phòng 30 giây
  const onlineChannel = sb.channel('orders-' + shopId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders', filter: 'shop_id=eq.' + shopId }, async payload => {
      if (payload.new && payload.new.source === 'online') {
        playTing();
        app.showToast('Có đơn online mới: ' + payload.new.code, 'accent');
        await loadOnlineOrders(false);
        renderNav();
        if (ST.tab === 'online') renderOnlineTab();
      }
    })
    .subscribe();
  const pollOnlineTimer = setInterval(async () => {
    if (document.visibilityState !== 'visible') return;
    try {
      const prevNew = ST.onlineOrders.filter(o => o.status === 'new').length;
      await loadOnlineOrders(false);
      const currNew = ST.onlineOrders.filter(o => o.status === 'new').length;
      if (currNew > prevNew) playTing();
      renderNav();
      if (ST.tab === 'online') renderOnlineTab();
    } catch (e) {}
  }, 25000);
  window.addEventListener('beforeunload', () => {
    clearInterval(pollOnlineTimer);
    try { sb.removeChannel(onlineChannel); } catch (e) {}
  });

  /* ===== TAB: Menu (gói tối thiểu: standard) ===== */
  function renderMenuTab() {
    const cats = new Map();
    for (const m of ST.menuItems) {
      const c = (m.category || '').trim() || 'Khác';
      if (!cats.has(c)) cats.set(c, []);
      cats.get(c).push(m);
    }

    const csvTools = e => openModal('Nhập / xuất thực đơn', el('div', { style: 'display:grid;gap:8px' },
      el('button', { type: 'button', className: 'btn', style: 'width:100%', onClick: () => { closeModal(); openMenuCsvImportModal(e.currentTarget); }, text: 'Nhập từ file CSV' }),
      el('button', { type: 'button', className: 'btn', style: 'width:100%', onClick: () => {
        const rows = [['Tên món', 'Giá', 'Đơn vị', 'Nhóm', 'Mô tả', 'Đang bán']]
          .concat(ST.menuItems.map(m => [m.name, m.price, m.unit || 'phần', m.category || '', m.description || '', m.active ? 'Có' : 'Tạm ngưng']));
        app.downloadCsv('menu-' + ST.shop.slug + '.csv', rows); closeModal();
      }, text: 'Xuất thực đơn ra CSV' }),
      el('button', { type: 'button', className: 'btn', style: 'width:100%', onClick: () => {
        app.downloadCsv('mau-nhap-menu.csv', [['Tên món', 'Giá', 'Đơn vị', 'Nhóm', 'Mô tả'], ['Cà phê sữa đá', 25000, 'ly', 'Cà phê', 'Đậm vị']]); closeModal();
      }, text: 'Tải file mẫu để nhập' })
    ), null, e.currentTarget);
    const toolbar = el('div', { className: 'toolbar', style: 'display:flex;gap:8px;margin-bottom:12px' },
      el('button', { type: 'button', className: 'btn btn-primary', style: 'flex:1', onClick: e => openProductModal(null, e.currentTarget), text: '+ Thêm món' }),
      el('button', { type: 'button', className: 'btn', onClick: csvTools, text: 'Nhập / xuất' })
    );

    const menuImg = m => m.image_url && String(m.image_url).startsWith('https://') ? el('img', { src: m.image_url, alt: '', loading: 'lazy', style: 'width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)' }) : null;

    const listNodes = ST.menuItems.length ? [...cats.entries()].map(([cat, list]) => {
      const blocks = menuBlocks(list);
      return el('div', { className: 'card' },
        el('div', { style: 'font-weight:700;margin-bottom:6px', text: cat + ' (' + blocks.length + ')' }),
        blocks.map(bk => {
          const img = bk.vars.map(v => menuImg(v.m)).find(Boolean) || null;
          const multi = bk.vars.length > 1 || bk.vars[0].size;
          const parts = bk.vars.map(v => (multi && v.size ? v.size + ' ' : '') + app.formatMoney(v.m.price) + (v.m.active ? '' : ' (không bán)'));
          const sub = multi ? parts.join(' · ') : app.formatMoney(bk.vars[0].m.price) + ' / ' + (bk.vars[0].m.unit || 'phần') + (bk.vars[0].m.active ? '' : ' · Không bán');
          const allOff = bk.vars.every(v => !v.m.active);
          return el('div', { className: 'line-row menu-prod' + (allOff ? ' off' : '') },
            img,
            el('div', { className: 'line-main' },
              el('b', { text: bk.base }),
              el('small', { className: 'num', text: sub })
            ),
            el('button', { type: 'button', className: 'btn btn-sm menu-set', onClick: e => openProductModal(bk, e.currentTarget), text: 'Cài đặt' })
          );
        })
      );

  /* ===== MÓN = một sản phẩm gồm nhiều lựa chọn (size). Mỗi lựa chọn vẫn là một dòng menu_items riêng ===== */
  const SIZE_RE = /^(.*?)\s+(\d+(?:[.,]\d+)?\s?(?:ml|l|g|kg))$/i;
  function menuBlocks(list) {
    const out = [], by = new Map();
    for (const m of list) {
      const mt = SIZE_RE.exec((m.name || '').trim());
      if (!mt) { out.push({ base: (m.name || '').trim(), vars: [{ m, size: '' }] }); continue; }
      const key = mt[1].trim().toLowerCase();
      let g = by.get(key);
      if (!g) { g = { base: mt[1].trim(), vars: [] }; by.set(key, g); out.push(g); }
      g.vars.push({ m, size: mt[2].replace(/\s+/g, '') });
    }
    return out;
  }

  function openMenuCsvImportModal(opener) {
    let parsed = [];
    const prevBox = el('div', { style: 'margin-top:10px' });
    const impBtn = el('button', {
      type: 'button', className: 'btn btn-primary', disabled: true,
      onClick: async () => {
        const valid = parsed.filter(r => !r.err);
        if (!valid.length) return;
        impBtn.disabled = true; impBtn.textContent = 'Đang nhập…';
        try {
          const rows = valid.map((r, idx) => ({
            shop_id: shopId, name: r.name, price: r.price, unit: r.unit || 'phần',
            category: r.category || null, description: r.description || null, active: !app.hasPlan('pro'), sort: (ST.menuItems.length + idx) * 10
          }));
          const { error } = await sb.from('menu_items').insert(rows);
          if (error) throw error;
          closeModal();
          app.showToast('Đã nhập ' + rows.length + ' món', 'accent');
          await loadMenu();
          renderMenuTab();
        } catch (err) { showErr(err); impBtn.disabled = false; impBtn.textContent = 'Nhập các dòng hợp lệ'; }
      },
      text: 'Nhập các dòng hợp lệ'
    });

    const parseText = txt => {
      const lines = txt.replace(/^\uFEFF/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      parsed = [];
      lines.forEach((line, idx) => {
        const cols = line.split(';').map(c => c.trim().replace(/^"|"$/g, ''));
        if (idx === 0 && /tên/i.test(cols[0]) && /giá/i.test(cols[1] || '')) return;
        const name = cols[0] || '';
        const price = Math.round(Number((cols[1] || '').replace(/[^\d-]/g, '')));
        const unit = cols[2] || 'phần';
        const category = cols[3] || '';
        const description = cols[4] || '';
        let err = '';
        if (!name) err = 'Thiếu tên món';
        else if (Number.isNaN(price) || price < 0) err = 'Giá không hợp lệ';
        parsed.push({ lineNo: idx + 1, name, price, unit, category, description, err });
      });
      const okCount = parsed.filter(r => !r.err).length;
      const errCount = parsed.length - okCount;
      impBtn.disabled = okCount === 0;
      prevBox.replaceChildren(
        el('div', { className: 'alert ' + (errCount ? 'alert-warn' : 'alert-success'), text: 'Hợp lệ: ' + okCount + ' dòng · Lỗi: ' + errCount + ' dòng' }),
        el('div', { className: 'table-scroll', style: 'max-height:220px;overflow-y:auto;margin-top:8px' },
          el('table', { className: 'bh-tbl' },
            el('tbody', null, parsed.map(r => el('tr', { className: r.err ? 'low-row' : '' },
              el('td', { text: 'Dòng ' + r.lineNo }),
              el('td', { text: r.name || '—' }),
              el('td', { className: 'r num', text: r.err ? r.err : app.formatMoney(r.price) })
            )))
          )
        )
      );
    };

    const fileInp = el('input', {
      type: 'file', accept: '.csv,text/csv', className: 'input',
      onChange: async e => {
        const f = e.target.files && e.target.files[0];
        if (f) parseText(await f.text());
      }
    });
    const ta = el('textarea', {
      className: 'textarea', placeholder: 'Hoặc dán trực tiếp mỗi dòng: tên;giá;đơn vị;nhóm;mô tả',
      onInput: e => parseText(e.target.value)
    });
    openModal('Nhập menu từ CSV', el('div', null,
      el('div', { className: 'field' }, el('label', { text: 'Chọn file CSV (ngăn bằng dấu ;)' }), fileInp),
      el('div', { className: 'field' }, el('label', { text: 'Hoặc dán nội dung CSV' }), ta),

  // Mã QR để khách quét là vào đặt hàng (in dán ở quầy, gửi qua Zalo)
  function openOrderQrModal(link, opener) {
    const KEY = 'dd_qr_' + shopId;
    let cfg = { color: '#0b5d2a', logo: '' };
    try { const x = JSON.parse(localStorage.getItem(KEY) || 'null'); if (x && typeof x === 'object') cfg = Object.assign(cfg, x); } catch (e) {}
    let logoImg = null;
    const cv = document.createElement('canvas');
    cv.style.cssText = 'width:min(300px,100%);height:auto;display:block;margin:0 auto;border:1px solid var(--border);border-radius:8px';
    const draw = () => {
      const qr = qrcode(0, 'H'); qr.addData(link); qr.make();
      const n = qr.getModuleCount(), pad = 3, cell = Math.max(8, Math.ceil(900 / (n + pad * 2))), size = (n + pad * 2) * cell;
      cv.width = size; cv.height = size;
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, size, size); cx.fillStyle = cfg.color;
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) cx.fillRect((c + pad) * cell, (r + pad) * cell, cell, cell);
      if (logoImg && logoImg.naturalWidth) {
        // Logo giữ nguyên tỉ lệ, nằm giữa trong nền trắng bo tròn, chiếm tối đa ~24% cạnh mã
        const box = size * 0.24, w0 = logoImg.naturalWidth, h0 = logoImg.naturalHeight, k = Math.min(box / w0, box / h0);
        const w = w0 * k, h = h0 * k, padB = size * 0.012, bw = w + padB * 2, bh = h + padB * 2, x = (size - bw) / 2, y = (size - bh) / 2, rad = size * 0.02;
        cx.fillStyle = '#fff'; cx.beginPath();
        if (cx.roundRect) cx.roundRect(x, y, bw, bh, rad); else cx.rect(x, y, bw, bh);
        cx.fill();
        cx.drawImage(logoImg, x + padB, y + padB, w, h);
      }
    };
    const loadLogo = (src, cors) => new Promise(res => {
      const im = new Image(); if (cors) im.crossOrigin = 'anonymous';
      im.onload = () => res(im); im.onerror = () => res(null); im.src = src;
    });
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };
    const colorInp = el('input', { type: 'color', value: cfg.color, style: 'width:44px;height:36px;padding:0;border:1px solid var(--border);border-radius:8px', onInput: e => { cfg.color = e.target.value; save(); draw(); } });
    const hint = el('small', { style: 'display:block;color:var(--text-sub);margin-top:6px', text: '' });
    const fileInp = el('input', { type: 'file', accept: 'image/*', style: 'display:none', onChange: e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = async () => {
        const im = await loadLogo(rd.result, false);
        if (!im) { app.showToast('Không đọc được ảnh này, thử ảnh PNG hoặc JPG.', 'error'); return; }
        logoImg = im; cfg.logo = String(rd.result).length < 900000 ? String(rd.result) : ''; save(); draw();
        hint.textContent = cfg.logo ? '' : 'Ảnh lớn nên chỉ dùng lần này, mở lại sẽ phải chọn lại.';
      };
      rd.readAsDataURL(f); e.target.value = '';
    } });
    const swatches = ['#0b5d2a', '#000000', '#1d4ed8', '#b91c1c', '#7c3aed', '#c2410c'];
    const body = el('div', null,
      cv,
      el('div', { style: 'text-align:center;margin-top:8px;font-weight:600', text: 'Quét để đặt hàng · ' + (ST.shop.name || 'quán') }),
      el('div', { style: 'display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px' },
        el('span', { style: 'font-weight:600', text: 'Màu mã' }),
        swatches.map(c => el('button', { type: 'button', 'aria-label': 'Màu ' + c, style: 'width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:' + c, onClick: () => { cfg.color = c; colorInp.value = c; save(); draw(); } })),
        colorInp),
      el('div', { style: 'display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap' },
        el('button', { type: 'button', className: 'btn btn-sm', text: 'Chọn logo ở giữa', onClick: () => fileInp.click() }),
        el('button', { type: 'button', className: 'btn btn-sm', text: 'Bỏ logo', onClick: () => { logoImg = null; cfg.logo = ''; cfg.noDefault = true; save(); draw(); } }),
        fileInp),

      el('small', { style: 'display:block;text-align:center;color:var(--text-sub);word-break:break-all;margin-top:8px', text: link })
    );
    openModal('Mã QR đặt hàng', body, [
      el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' }),
      el('button', { type: 'button', className: 'btn btn-primary', text: 'Tải ảnh QR', onClick: () => {
