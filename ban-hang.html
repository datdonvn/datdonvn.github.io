  function renderDebtView(seg) {
    stickyHost.replaceChildren();
    const today = app.toVnYmd(new Date());
    const byPlace = new Map();
    let grandTotal = 0;
    for (const p of ST.debts) {
      const left = p.total - p.paid;
      grandTotal += left;
      if (!byPlace.has(p.place)) byPlace.set(p.place, { total: 0, list: [] });
      byPlace.get(p.place).total += left;
      byPlace.get(p.place).list.push(p);
    }

    contentHost.replaceChildren(
      renderMetaBar('buy', async () => { await loadDebts(); renderBuyTab(); }),
      seg,
      el('div', { className: 'alert', text: 'Phiếu mua chỉ ghi lại lúc mua. Mọi khoản trả nợ ghi ở tab Thu chi, hệ thống tự trừ vào các phiếu nợ cũ trước.' }),
      el('div', { className: 'card row-between' },
        el('span', { style: 'font-weight:700', text: 'Tổng nợ nhà cung cấp' }),
        el('b', { className: 'num', style: 'font-size:20px;color:var(--error)', text: app.formatMoney(grandTotal) })
      ),
      byPlace.size ? [...byPlace.entries()].map(([place, grp]) => el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:6px' },
          el('b', { text: place }),
          el('b', { className: 'num', style: 'color:var(--error)', text: app.formatMoney(grp.total) })
        ),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px' },
          el('button', { type: 'button', className: 'btn btn-primary btn-sm', text: 'Trả nợ (ghi ở Thu chi)', onClick: e => openCashModal(null, e.currentTarget, { cat: 'tra_no_ncc', supplier: place, amount: grp.total }) }),
          el('button', { type: 'button', className: 'btn btn-sm', text: 'Lịch sử trả', onClick: e => openSupplierPaysModal(place, e.currentTarget) })
        ),
        grp.list.map(p => {
          const left = p.total - p.paid;
          const overdue = p.due_date && p.due_date < today;
          return el('div', { className: 'line-row' },
            el('div', { className: 'line-main' },
              el('b', { className: 'num', text: p.code + ' · Còn nợ ' + app.formatMoney(left) }),
              el('small', { text: 'Tổng ' + app.formatMoney(p.total) + ' · Đã trả ' + app.formatMoney(p.paid) + (p.due_date ? ' · Hẹn ' + p.due_date.split('-').reverse().join('/') : '') })
            ),
            overdue ? el('span', { className: 'badge badge-err', text: 'Quá hạn' }) : null
          );
        })
      )) : el('div', { className: 'card empty-state', text: 'Không còn khoản nợ nhà cung cấp nào.' })
    );
  }

  async function openSupplierPaysModal(place, opener) {
    const { data, error } = await sb.from('cash_entries').select('*').eq('shop_id', shopId).eq('cat', 'tra_no_ncc').order('at', { ascending: false });
    if (error) { showErr(error); return; }
    const list = (data || []).filter(d => String(d.supplier || '').trim().toLowerCase() === String(place).trim().toLowerCase());
    openModal('Lịch sử trả nợ ' + place,
      list.length ? el('div', null, list.map(d => el('div', { className: 'line-row' },
        el('div', { className: 'line-main' },
          el('b', { className: 'num', text: app.formatMoney(d.amount) }),
          el('small', { text: app.formatVnDateTime(d.at) + ' · ' + payMethodName(d.pay_method_id) + (d.note ? ' · ' + d.note : '') })
        )
      ))) : el('div', { className: 'empty-state', text: 'Chưa có lần trả nợ nào.' }),
      [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })], opener
    );
  }

  /* ===== TAB: Kho (gói tối thiểu: pro) ===== */
  const INV_KINDS = { nl: 'Nguyên liệu', bb: 'Bao bì', btp: 'Bán thành phẩm' };
  const MOVE_KINDS = { buy: 'Mua', batch_in: 'Làm ra', batch_out: 'Dùng để làm', sale: 'Bán', adjust: 'Kiểm kho' };

  async function loadInventoryReport() {
    const [rep, list] = await Promise.all([
      sb.rpc('report_inventory', { p_shop: shopId }),
      sb.from('inv_items').select('*').eq('shop_id', shopId).order('name', { ascending: true })
    ]);
    if (rep.error) throw rep.error;
    if (list.error) throw list.error;
    ST.invSummary = rep.data;
    ST.invItems = list.data || [];
  }

  function renderInvTab() {
    const sum = ST.invSummary || { total_value: 0, low_count: 0 };
    const q = fold(ST.invSearch.trim());
    const items = ST.invItems.filter(it => {
      if (ST.invKind !== 'all' && it.kind !== ST.invKind) return false;
      if (ST.invLowOnly && !(it.qty <= it.min_stock)) return false;
      if (q && !fold(it.name).includes(q)) return false;
      return true;
    });

    contentHost.replaceChildren(
      renderMetaBar('inv', async () => { await loadInventoryReport(); markLoaded('inv'); renderInvTab(); }),
      el('div', { className: 'kpi-row2', style: 'margin-bottom:12px' },
        el('div', { className: 'kpi-box' }, el('small', { text: 'Tổng giá trị kho' }), el('b', { className: 'num', text: app.formatMoney(sum.total_value) })),
        el('div', { className: 'kpi-box' }, el('small', { text: 'Vật tư sắp hết' }), el('b', { className: 'num', style: sum.low_count > 0 ? 'color:var(--error)' : '', text: String(sum.low_count) }))
      ),
      el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:10px' },
          el('input', { className: 'input', style: 'flex:1 1 180px', type: 'search', placeholder: 'Tìm tên vật tư…', value: ST.invSearch, onInput: e => { ST.invSearch = e.target.value; renderInvTab(); refocusSearch(); } }),
          el('button', { type: 'button', className: 'btn btn-primary', onClick: e => openInvItemModal(null, e.currentTarget), text: '+ Thêm vào kho' })
        ),
        el('div', { className: 'chips hscroll', style: 'margin-bottom:10px' },
          el('button', { type: 'button', className: 'chip', 'aria-pressed': String(ST.invKind === 'all'), onClick: () => { ST.invKind = 'all'; renderInvTab(); }, text: 'Tất cả' }),
          Object.entries(INV_KINDS).map(([k, lbl]) => el('button', { type: 'button', className: 'chip', 'aria-pressed': String(ST.invKind === k), onClick: () => { ST.invKind = k; renderInvTab(); }, text: lbl })),
          el('button', { type: 'button', className: 'chip', 'aria-pressed': String(ST.invLowOnly), onClick: () => { ST.invLowOnly = !ST.invLowOnly; renderInvTab(); }, text: 'Chỉ sắp hết' })
        ),
        items.length ? items.map(it => {
          const low = it.qty <= it.min_stock;
          return el('div', { className: 'line-row' + (low ? ' low-row' : ''), style: 'padding:10px 6px;border-radius:8px' },
            el('div', { className: 'line-main' },
              el('b', { text: it.name + (it.active ? '' : ' (Ngưng dùng)') }),
              el('small', { className: 'num', text: 'Tồn: ' + it.qty + ' ' + it.unit + ' · Giá BQ: ' + app.formatMoney(it.avg_cost) + ' · Giá trị: ' + app.formatMoney(it.qty * it.avg_cost) })
            ),
            low ? el('span', { className: 'badge badge-warn', text: 'Sắp hết' }) : null,
            el('button', { type: 'button', className: 'btn btn-sm btn-primary', onClick: e => openAdjustStockModal(it, e.currentTarget), text: 'Kiểm kho' }),
            kebab({ text: 'Sửa vật tư', fn: e => openInvItemModal(it, e.currentTarget) }, { text: 'Lịch sử nhập xuất', fn: e => openStockMovesModal(it, e.currentTarget) })
          );
        }) : el('div', { className: 'empty-state', text: 'Chưa có vật tư khớp bộ lọc.' })
      )
    );
  }

  function openInvItemModal(item, opener, onSaved) {
    const f = { name: item ? item.name : '', unit: item ? item.unit : 'kg', kind: item ? item.kind : 'nl', min_stock: item ? item.min_stock : 0, active: item ? item.active : true };
    const body = el('div', null,
      el('div', { className: 'field' }, el('label', { text: 'Tên vật tư' }), el('input', { className: 'input', value: f.name, onInput: e => { f.name = e.target.value; } })),
      el('div', { className: 'grid-2' },
        el('div', { className: 'field' }, el('label', { text: 'Đơn vị' }), el('input', { className: 'input', value: f.unit, onInput: e => { f.unit = e.target.value; } })),
        el('div', { className: 'field' }, el('label', { text: 'Loại' }),
          el('select', { className: 'select', onChange: e => { f.kind = e.target.value; } },
            Object.entries(INV_KINDS).map(([k, lbl]) => el('option', { value: k, selected: f.kind === k, text: lbl }))
          )
        )
      ),
      el('div', { className: 'field' }, el('label', { text: 'Tồn tối thiểu (cảnh báo sắp hết)' }), el('input', { className: 'input num', type: 'number', step: 'any', min: 0, value: f.min_stock, onInput: e => { f.min_stock = e.target.value; } })),
      item ? el('label', { style: 'display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600' },
        el('input', { type: 'checkbox', checked: f.active, style: 'width:20px;height:20px', onChange: e => { f.active = e.target.checked; } }), 'Đang dùng'
      ) : null
    );
    const saveBtn = el('button', {
      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        if (!f.name.trim() || !f.unit.trim()) { app.showToast('Nhập tên và đơn vị vật tư', 'error'); return; }
        saveBtn.disabled = true; saveBtn.textContent = 'Đang lưu…';
        try {
          const rec = { name: f.name.trim(), unit: f.unit.trim(), kind: f.kind, min_stock: Number(f.min_stock) || 0, active: f.active };
          if (item) {
            const res = await sb.from('inv_items').update(rec).eq('id', item.id).eq('shop_id', shopId).select('id');
            checkMutated(res);
          } else {
            const { error } = await sb.from('inv_items').insert(Object.assign({ shop_id: shopId }, rec));
            if (error) throw error;
          }
          closeModal();
          app.showToast('Đã lưu vật tư', 'accent');
          await loadInventoryReport();
          if (onSaved) onSaved(); else renderInvTab();
        } catch (err) { showErr(err); saveBtn.disabled = false; saveBtn.textContent = 'Lưu'; }
      },
      text: 'Lưu'
    });
    openModal(item ? 'Sửa vật tư' : 'Thêm vật tư vào kho', body, [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), saveBtn], opener);
  }

  function openAdjustStockModal(item, opener) {
    let newQty = item.qty;
    let note = '';
    const diffEl = el('div', { className: 'alert alert-success', style: 'margin-top:8px', text: 'Chênh lệch: 0 ' + item.unit });
    const updateDiff = () => {
      const diff = (Number(newQty) || 0) - Number(item.qty);
      diffEl.textContent = 'Chênh lệch: ' + (diff > 0 ? '+' : '') + Number(diff.toFixed(3)) + ' ' + item.unit;
      diffEl.className = 'alert ' + (diff < 0 ? 'alert-error' : 'alert-success');
    };
    const body = el('div', null,
      el('p', { style: 'margin:0 0 8px', text: 'Tồn trên sổ: ' + item.qty + ' ' + item.unit }),
      el('div', { className: 'field' },
        el('label', { text: 'Số tồn thực tế (' + item.unit + ')' }),
        el('input', { className: 'input num', type: 'number', step: 'any', min: 0, value: newQty, onInput: e => { newQty = e.target.value; updateDiff(); } })
      ),
      diffEl,
      el('div', { className: 'field' },
        el('label', { text: 'Ghi chú kiểm kho' }),
        el('input', { className: 'input', placeholder: 'Ví dụ: Kiểm cuối tuần', onInput: e => { note = e.target.value; } })
      )
    );
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        okBtn.disabled = true; okBtn.textContent = 'Đang lưu…';
        try {
          const { error } = await sb.rpc('adjust_stock', { p_item: item.id, p_new_qty: Number(newQty) || 0, p_note: note.trim() });
          if (error) throw error;
          closeModal();
          app.showToast('Đã cập nhật kiểm kho ' + item.name, 'accent');
          await loadInventoryReport();
          renderInvTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Lưu kiểm kho'; }
      },
      text: 'Lưu kiểm kho'
    });
    openModal('Kiểm kho: ' + item.name, body, [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), okBtn], opener);
  }

  async function openStockMovesModal(item, opener) {
    const { data, error } = await sb.from('stock_moves').select('*').eq('shop_id', shopId).eq('inv_item_id', item.id).order('at', { ascending: false }).range(0, 49);
    if (error) { showErr(error); return; }
    openModal('Lịch sử kho: ' + item.name,
      (data && data.length) ? el('div', null, data.map(m => el('div', { className: 'line-row' },
        el('div', { className: 'line-main' },
          el('b', { text: MOVE_KINDS[m.kind] || m.kind }),
          el('small', { text: app.formatVnDateTime(m.at) + (m.note ? ' · ' + m.note : '') })
        ),
        el('b', { className: 'num', style: 'color:' + (m.qty < 0 ? 'var(--error)' : 'var(--accent)'), text: (m.qty > 0 ? '+' : '') + m.qty + ' ' + item.unit })
      ))) : el('div', { className: 'empty-state', text: 'Chưa có biến động kho nào.' }),
      [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })], opener
    );
  }

  /* ===== TAB: Định mức (gói tối thiểu: pro) ===== */
  async function loadAllRecipeFlags() {
    const { data } = await sb.from('recipes').select('menu_item_id,inv_item_id,qty').eq('shop_id', shopId);
    ST.allRecipes = data || [];
    ST.allRecipeMenuIds = new Set((data || []).map(r => r.menu_item_id));
  }
  async function loadRecipesForMenu(menuId) {
    const { data, error } = await sb.from('recipes').select('*').eq('shop_id', shopId).eq('menu_item_id', menuId);
    if (error) throw error;
    ST.recipes = data || [];
  }

  function renderRecipeTab() {
    const selMenu = ST.menuItems.find(m => m.id === ST.recipeMenuId) || null;
    const invMap = new Map(ST.invItems.map(i => [i.id, i]));
    let estCost = 0;
    for (const r of ST.recipes) {
      const iv = invMap.get(r.inv_item_id);
      if (iv) estCost += Number(r.qty) * Number(iv.avg_cost || 0);
    }

    const menuSelect = el('select', {
      className: 'select',
      onChange: async e => { ST.recipeMenuId = e.target.value; await loadRecipesForMenu(ST.recipeMenuId); renderRecipeTab(); }
    }, ST.menuItems.map(m => el('option', {
      value: m.id, selected: m.id === ST.recipeMenuId,
      text: m.name + (ST.allRecipeMenuIds.has(m.id) ? '' : ' (Chưa có định mức)')
    })));

    let newInvId = ST.invItems[0] ? ST.invItems[0].id : '';
    let newQty = '';
    const addRow = el('div', { className: 'g2x', style: 'margin-top:12px;align-items:end' },
      el('div', { className: 'field', style: 'margin:0' },
        el('div', { className: 'row-between', style: 'margin-bottom:4px' },
          el('label', { style: 'margin:0', text: 'Vật tư' }),
          el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openInvItemModal(null, e.currentTarget, () => renderRecipeTab()), text: '+ Tạo vật tư mới' })
        ),
        el('select', { className: 'select', onChange: e => { newInvId = e.target.value; } },
          ST.invItems.map(i => el('option', { value: i.id, text: i.name + ' (' + i.unit + (INV_KINDS[i.kind] ? ', ' + INV_KINDS[i.kind] : '') + ')' }))
        )
      ),
      el('div', { className: 'field', style: 'margin:0' },
        el('label', { text: 'Lượng cho 1 ' + (selMenu ? (selMenu.unit || 'đơn vị') : 'đơn vị') }),
        el('input', { className: 'input num', type: 'number', step: 'any', min: 0, placeholder: 'Ví dụ: 0.25', onInput: e => { newQty = e.target.value; } })
      ),
      el('button', {
        type: 'button', className: 'btn btn-primary',
        onClick: async () => {
          const q = Number(newQty);
          if (!ST.recipeMenuId || !newInvId || !(q > 0)) { app.showToast('Chọn vật tư và nhập lượng > 0', 'error'); return; }
          try {
            const { error } = await sb.from('recipes').insert({ shop_id: shopId, menu_item_id: ST.recipeMenuId, inv_item_id: newInvId, qty: q });
            if (error) throw error;
            app.showToast('Đã thêm định mức', 'accent');
            await Promise.all([loadRecipesForMenu(ST.recipeMenuId), loadAllRecipeFlags()]);
            renderRecipeTab();
          } catch (err) { showErr(err); }
        },
        text: 'Thêm vào định mức'
      })
    );

    contentHost.replaceChildren(
      renderMetaBar('recipe', async () => { await loadTabData('recipe'); renderRecipeTab(); }),
      el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:8px' },
          el('b', { text: 'Chọn món để cài định mức' }),
          ST.menuItems.length > 1 && selMenu ? el('button', {
            type: 'button', className: 'btn btn-sm',
            onClick: e => openCopyRecipeModal(selMenu, e.currentTarget),
            text: 'Sao chép từ món khác'
          }) : null
        ),
        ST.menuItems.length ? menuSelect : el('div', { className: 'empty-state', text: 'Hãy thêm món ở tab Menu trước.' })
      ),
      selMenu ? el('div', { className: 'card' },
        el('div', { style: 'font-weight:700;margin-bottom:6px', text: 'Thành phần cho 1 ' + (selMenu.unit || 'đơn vị') + ' ' + selMenu.name }),
        ST.recipes.length ? ST.recipes.map(r => {
          const iv = invMap.get(r.inv_item_id);
          const lineCost = iv ? Number(r.qty) * Number(iv.avg_cost || 0) : 0;
          const qInp = el('input', { className: 'input num', style: 'width:100px', type: 'number', step: 'any', value: r.qty });
          return el('div', { className: 'line-row' },
            el('div', { className: 'line-main' },
              el('b', { text: iv ? iv.name : r.inv_item_id }),
              el('small', { className: 'num', style: iv && !(Number(iv.avg_cost) > 0) ? 'color:var(--error)' : '', text: iv && !(Number(iv.avg_cost) > 0) ? 'Chưa có giá vốn, hãy nhập phiếu Mua vật tư này' : 'Tạm tính: ' + app.formatMoney(lineCost) + ' (' + (iv ? iv.unit : '') + ')' })
            ),
            qInp,
            el('button', {
              type: 'button', className: 'btn btn-sm',
              onClick: async () => {
                const q = Number(qInp.value);
                if (!(q > 0)) return;
                try {
                  const res = await sb.from('recipes').update({ qty: q }).eq('id', r.id).eq('shop_id', shopId).select('id');
                  checkMutated(res);
                  app.showToast('Đã cập nhật định mức', 'accent');
                  await loadRecipesForMenu(ST.recipeMenuId);
                  renderRecipeTab();
                } catch (err) { showErr(err); }
              },
              text: 'Lưu'
            }),
            el('button', {
              type: 'button', className: 'btn btn-sm btn-danger',
              onClick: async () => {
                try {
                  const res = await sb.from('recipes').delete().eq('id', r.id).eq('shop_id', shopId).select('id');
                  checkMutated(res);
                  await Promise.all([loadRecipesForMenu(ST.recipeMenuId), loadAllRecipeFlags()]);
                  renderRecipeTab();
                } catch (err) { showErr(err); }
              },
              text: 'Xóa'
            })
          );
        }) : el('div', { className: 'empty-state', text: 'Món này chưa có định mức vật tư.' }),
        ST.invItems.length ? addRow : el('div', { className: 'alert alert-warn', style: 'margin-top:10px', text: 'Hãy thêm vật tư ở tab Kho hoặc nhập phiếu Mua trước.' }),
        el('div', { className: 'grid-2', style: 'margin-top:14px;padding-top:12px;border-top:1px solid var(--border)' },
          el('div', { className: 'kpi-box' }, el('small', { text: 'Giá vốn dự kiến / 1 ' + (selMenu.unit || 'đv') }), el('b', { className: 'num', text: app.formatMoney(estCost) })),
          el('div', { className: 'kpi-box' }, el('small', { text: 'Lãi gộp dự kiến (giá bán ' + app.formatMoney(selMenu.price) + ')' }), el('b', { className: 'num', style: 'color:var(--accent)', text: app.formatMoney(selMenu.price - estCost) }))
        )
      ) : null,
      renderRecipeSummary(invMap)
    );
  }

  // Danh sách định mức của tất cả món (hiện ở cuối tab)
  function renderRecipeSummary(invMap) {
    const by = new Map();
    for (const r of (ST.allRecipes || [])) { if (!by.has(r.menu_item_id)) by.set(r.menu_item_id, []); by.get(r.menu_item_id).push(r); }
    const rows = ST.menuItems.map(m => {
      const list = by.get(m.id) || [];
      const cost = list.reduce((a, r) => { const iv = invMap.get(r.inv_item_id); return a + (iv ? Number(r.qty) * Number(iv.avg_cost || 0) : 0); }, 0);
      return { m, list, cost };
    });
    const done = rows.filter(x => x.list.length).length;
    return el('div', { className: 'card' },
      el('div', { className: 'row-between', style: 'margin-bottom:8px' },
        el('b', { text: 'Danh sách định mức đã nhập' }),
        el('small', { style: 'color:var(--text-sub)', text: done + '/' + rows.length + ' món có định mức' })),
      rows.length ? rows.map(({ m, list, cost }) => el('div', { className: 'line-row', style: 'cursor:pointer', onClick: async () => { ST.recipeMenuId = m.id; await loadRecipesForMenu(m.id); renderRecipeTab(); window.scrollTo(0, 0); } },
        el('div', { className: 'line-main' },
          el('b', { text: m.name }),
          el('small', { text: list.length ? list.map(r => { const iv = invMap.get(r.inv_item_id); return (iv ? iv.name : '?') + ' ' + Number(r.qty) + (iv ? ' ' + iv.unit : ''); }).join(' · ') : 'Chưa có định mức' })
        ),
        list.length ? el('div', { style: 'text-align:right' },
          el('div', { className: 'num', style: 'font-weight:700', text: 'Vốn ' + app.formatMoney(cost) }),
          el('small', { className: 'num', style: 'color:var(--accent)', text: 'Lãi ' + app.formatMoney(m.price - cost) })) : null
      )) : el('div', { className: 'empty-state', text: 'Chưa có món nào.' })
    );
  }

  function openCopyRecipeModal(targetMenu, opener) {
    const sources = ST.menuItems.filter(m => m.id !== targetMenu.id && ST.allRecipeMenuIds.has(m.id));
    if (!sources.length) { app.showToast('Chưa có món nào khác có định mức để sao chép', 'error'); return; }
    let srcId = sources[0].id;
    const sel = el('select', { className: 'select', onChange: e => { srcId = e.target.value; } },
      sources.map(m => el('option', { value: m.id, text: m.name }))
    );
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        okBtn.disabled = true; okBtn.textContent = 'Đang sao chép…';
        try {
          const { data: srcRows, error } = await sb.from('recipes').select('inv_item_id,qty').eq('shop_id', shopId).eq('menu_item_id', srcId);
          if (error) throw error;
          const existingInv = new Set(ST.recipes.map(r => r.inv_item_id));
          const toInsert = (srcRows || []).filter(r => !existingInv.has(r.inv_item_id)).map(r => ({
            shop_id: shopId, menu_item_id: targetMenu.id, inv_item_id: r.inv_item_id, qty: r.qty
          }));
          if (toInsert.length) {
            const ins = await sb.from('recipes').insert(toInsert);
            if (ins.error) throw ins.error;
          }
          closeModal();
          app.showToast('Đã sao chép ' + toInsert.length + ' dòng định mức', 'accent');
          await Promise.all([loadRecipesForMenu(targetMenu.id), loadAllRecipeFlags()]);
          renderRecipeTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Sao chép'; }
      },
      text: 'Sao chép'
    });
    openModal('Sao chép định mức sang ' + targetMenu.name, el('div', { className: 'field' }, el('label', { text: 'Chọn món nguồn' }), sel), [
      el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), okBtn
    ], opener);
  }

  /* ===== TAB: Thu chi (gói tối thiểu: pro) ===== */
  const CASH_CATS = [
    { id: 'luong', label: 'Trả lương nhân viên', dir: 'out' },
    { id: 'dien', label: 'Tiền điện', dir: 'out' },
    { id: 'nuoc', label: 'Tiền nước', dir: 'out' },
    { id: 'internet', label: 'Internet', dir: 'out' },
    { id: 'mat_bang', label: 'Mặt bằng', dir: 'out' },
    { id: 'tra_no_ncc', label: 'Trả nợ nhà cung cấp', dir: 'out' },
    { id: 'chi_khac', label: 'Chi khác', dir: 'out' },
    { id: 'rut_von', label: 'Rút vốn', dir: 'out' },
    { id: 'von', label: 'Bổ sung vốn', dir: 'in' },

  ];
  const AUTO_CATS = [

    { id: 'mua_hang', label: 'Tiền mua hàng', dir: 'out' }
  ];
  async function loadCashCats() {
    const { data } = await sb.from('cash_cats').select('*').eq('shop_id', shopId).order('created_at');
    ST.cashCats = data || [];
  }
  const allCashCats = () => CASH_CATS.concat((ST.cashCats || []).map(c => ({ id: 'x:' + c.label, label: c.label, dir: c.dir, custom: c })));
  const cashCatOf = id => allCashCats().concat(AUTO_CATS).find(x => x.id === id) || { id, label: String(id).replace(/^x:/, ''), dir: 'out' };
  async function loadCashEntries() {
    const { data, error } = await sb.from('cash_entries').select('*').eq('shop_id', shopId)
      .gte('at', ST.cashFrom + 'T00:00:00+07:00').lte('at', ST.cashTo + 'T23:59:59+07:00')
      .order('at', { ascending: false });
    if (error) throw error;
    ST.cashEntries = data || [];
    await Promise.all([loadCashCats(), app.hasPlan('pro') ? loadDebts() : Promise.resolve()]);
  }

    let totalIn = 0, totalOut = 0;
    for (const c of ST.cashEntries) { if (c.dir === 'in') totalIn += c.amount; else totalOut += c.amount; }

    contentHost.replaceChildren(
      renderMetaBar('cash', async () => { await loadCashEntries(); markLoaded('cash'); renderCashTab(); }),
      el('div', { className: 'card' },
        el('div', { className: 'hscroll', style: 'margin-bottom:8px' }, cashPresets.map(([lb, f, t]) => el('button', {
          type: 'button', className: 'chip', 'aria-pressed': String(!ST.cashCustom && ST.cashFrom === f && ST.cashTo === t),
          onClick: async () => { ST.cashCustom = false; ST.cashFrom = f; ST.cashTo = t; await loadCashEntries(); renderCashTab(); }, text: lb
        })), el('button', { type: 'button', className: 'chip', 'aria-pressed': String(!!ST.cashCustom), onClick: () => { ST.cashCustom = !ST.cashCustom; renderCashTab(); }, text: 'Chọn ngày' })),
        ST.cashCustom ? el('div', { className: 'grid-2', style: 'margin-bottom:8px' },
          el('div', { className: 'field', style: 'margin:0' }, el('label', { text: 'Từ ngày' }), el('input', { className: 'input', type: 'date', value: ST.cashFrom, onChange: async e => { ST.cashFrom = e.target.value; await loadCashEntries(); renderCashTab(); } })),
          el('div', { className: 'field', style: 'margin:0' }, el('label', { text: 'Đến ngày' }), el('input', { className: 'input', type: 'date', value: ST.cashTo, onChange: async e => { ST.cashTo = e.target.value; await loadCashEntries(); renderCashTab(); } }))
        ) : null,
        el('button', { type: 'button', className: 'btn btn-primary', style: 'width:100%', onClick: e => openCashModal(null, e.currentTarget), text: '+ Ghi thu / chi' })
      ),
      el('div', { className: 'kpi-row3', style: 'margin-bottom:12px' },
        el('div', { className: 'kpi-box' }, el('small', { text: 'Tổng thu' }), el('b', { className: 'num', style: 'color:var(--accent)', text: app.formatMoney(totalIn) })),
        el('div', { className: 'kpi-box' }, el('small', { text: 'Tổng chi' }), el('b', { className: 'num', style: 'color:var(--error)', text: app.formatMoney(totalOut) })),
        el('div', { className: 'kpi-box' }, el('small', { text: 'Chênh lệch' }), el('b', { className: 'num', text: app.formatMoney(totalIn - totalOut) }))
      ),

            el('div', { className: 'line-main' },
              el('b', { text: catObj.label + (c.supplier ? ' · ' + c.supplier : '') + (c.note ? ' · ' + c.note : '') }),
              el('small', { text: app.formatVnDateTime(c.at) + ' · ' + payMethodName(c.pay_method_id) })
            ),
            el('b', { className: 'num', style: 'color:' + (c.dir === 'in' ? 'var(--accent)' : 'var(--error)'), text: (c.dir === 'in' ? '+' : '−') + app.formatMoney(c.amount) }),
            c.ref_type ? el('span', { className: 'badge', text: 'Tự động' }) : kebab({ text: 'Sửa khoản này', fn: e => openCashModal(c, e.currentTarget) }, { text: 'Xóa', danger: true, fn: e => confirmModal('Xóa khoản thu chi?', 'Khoản này sẽ bị xóa khỏi sổ.', 'Xóa', async () => {
              const res = await sb.from('cash_entries').delete().eq('id', c.id).eq('shop_id', shopId).select('id');
              checkMutated(res);
              await loadCashEntries();
              renderCashTab();
            }, e.currentTarget) })
          );
        }) : el('div', { className: 'empty-state', text: 'Chưa có khoản thu chi tay nào trong khoảng ngày này.' })
      )
    );
  }

  function openNewCashCat(defDir, done) {
    const g = { label: '', dir: defDir === 'in' ? 'in' : 'out' };
    const body = el('div');
    const draw = () => body.replaceChildren(
      el('div', { className: 'field' }, el('label', { text: 'Tên loại' }), el('input', { className: 'input', maxlength: 40, placeholder: 'Ví dụ: Bảo hiểm, Sửa chữa, Tiền thưởng', value: g.label, onInput: e => { g.label = e.target.value; } })),
      el('div', { className: 'chips' },
        el('button', { type: 'button', className: 'chip', 'aria-pressed': String(g.dir === 'out'), onClick: () => { g.dir = 'out'; draw(); }, text: 'Khoản chi' }),
        el('button', { type: 'button', className: 'chip', 'aria-pressed': String(g.dir === 'in'), onClick: () => { g.dir = 'in'; draw(); }, text: 'Khoản thu' })));
    draw();
    const ok = el('button', { type: 'button', className: 'btn btn-primary', text: 'Thêm loại', onClick: async () => {
      const label = g.label.trim();
      if (!label) { app.showToast('Nhập tên loại', 'error'); return; }
      if (allCashCats().some(c => c.label.toLowerCase() === label.toLowerCase())) { app.showToast('Loại này đã có', 'error'); return; }
      ok.disabled = true;
      try {
        const { error } = await sb.from('cash_cats').insert({ shop_id: shopId, label, dir: g.dir });
        if (error) throw error;
        await done('x:' + label);
      } catch (err) { showErr(err); ok.disabled = false; }
    } });
    openModal('Thêm loại thu chi', body, [el('button', { type: 'button', className: 'btn', text: 'Quay lại', onClick: () => done(null) }), ok]);

  function openCashModal(entry, opener, saved) {
    const reopen = () => openCashModal(entry, opener, f);
    const f = Object.assign({
      at: entry ? toLocalDtValue(entry.at) : toLocalDtValue(null),
      cat: entry ? entry.cat : 'luong',
      amount: entry ? entry.amount : '',
      pay_method_id: entry ? entry.pay_method_id : (activePayMethods()[0] ? activePayMethods()[0].id : null),
      note: entry ? (entry.note || '') : '',
      supplier: entry ? (entry.supplier || '') : ''
    }, saved || {});
    const debtBySup = () => {
      const m = new Map();
      for (const p of (ST.debts || [])) m.set(p.place, (m.get(p.place) || 0) + (p.total - p.paid));
      return m;
    };
    const body = el('div');
    const draw = () => {
      body.replaceChildren(
        el('div', { className: 'field' },
          el('label', { text: 'Loại thu / chi' }),
          ['out', 'in'].map(d => el('div', null,
            el('div', { style: 'font-size:13px;font-weight:700;margin:8px 0 4px;color:' + (d === 'in' ? 'var(--accent)' : 'var(--error)'), text: d === 'in' ? 'Khoản thu' : 'Khoản chi' }),
            el('div', { className: 'chips' }, allCashCats().filter(c => c.dir === d).map(c => el('span', { style: 'display:inline-flex;gap:2px;align-items:center' },
              el('button', { type: 'button', className: 'chip', 'aria-pressed': String(f.cat === c.id), onClick: () => { f.cat = c.id; draw(); }, text: c.label }),
              c.custom ? el('button', { type: 'button', className: 'btn btn-sm', 'aria-label': 'Xóa loại ' + c.label, title: 'Xóa loại này', style: 'padding:2px 8px', text: '×', onClick: () => confirmModal('Xóa loại "' + c.label + '"?', 'Các khoản đã ghi vẫn giữ nguyên.', 'Xóa loại', async () => {
                const res = await sb.from('cash_cats').delete().eq('id', c.custom.id).eq('shop_id', shopId).select('id'); checkMutated(res);
                await loadCashCats(); if (f.cat === c.id) f.cat = 'chi_khac'; setTimeout(reopen, 0);
              }, null) }) : null
            )))
          )),
          el('button', { type: 'button', className: 'btn btn-sm', style: 'margin-top:10px', text: '+ Thêm loại mới', onClick: () => openNewCashCat(f.cat && cashCatOf(f.cat).dir, async (id) => { await loadCashCats(); if (id) f.cat = id; reopen(); }) })
        ),
        f.cat === 'tra_no_ncc' ? el('div', { className: 'field' },
          el('label', { text: 'Trả nợ cho nhà cung cấp nào' }),
          debtBySup().size ? el('div', { className: 'chips' }, [...debtBySup().entries()].map(([sp, left]) => el('button', {
            type: 'button', className: 'chip', 'aria-pressed': String(f.supplier === sp),
            onClick: () => { f.supplier = sp; f.amount = left; draw(); }, text: sp + ' · nợ ' + app.formatMoney(left)
          }))) : el('small', { style: 'color:var(--text-sub)', text: 'Hiện không có khoản nợ nhà cung cấp nào.' }),
          f.supplier && debtBySup().has(f.supplier) ? el('small', { style: 'display:block;margin-top:4px;color:var(--text-sub)', text: 'Có thể trả một phần hoặc trả hết. Hệ thống tự trừ vào phiếu nợ cũ nhất trước.' }) : null
        ) : null,
        el('div', { className: 'grid-2' },
          el('div', { className: 'field' }, el('label', { text: 'Số tiền (đ)' }), el('input', { className: 'input num', type: 'number', min: 1, value: f.amount, onInput: e => { f.amount = e.target.value; } })),
          el('div', { className: 'field' }, el('label', { text: 'Ngày giờ' }), el('input', { className: 'input', type: 'datetime-local', value: f.at, onChange: e => { f.at = e.target.value; } }))
        ),
        el('div', { className: 'field' },
          el('label', { text: 'Phương thức' }),
          el('div', { className: 'chips' }, activePayMethods().map(m => el('button', {
            type: 'button', className: 'chip', 'aria-pressed': String(f.pay_method_id === m.id),
            onClick: () => { f.pay_method_id = m.id; draw(); }, text: m.name
          })))
        ),
        el('div', { className: 'field' }, el('label', { text: 'Ghi chú' }), el('input', { className: 'input', value: f.note, onInput: e => { f.note = e.target.value; } }))
      );
    };
    draw();
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        const amt = Math.round(Number(f.amount));
        if (!(amt > 0)) { app.showToast('Số tiền phải lớn hơn 0', 'error'); return; }
        const catObj = cashCatOf(f.cat);
        if (catObj.id === 'tra_no_ncc' && !f.supplier) { app.showToast('Chọn nhà cung cấp cần trả nợ', 'error'); return; }
        okBtn.disabled = true; okBtn.textContent = 'Đang lưu…';
        try {
          const rec = { at: localDtToIso(f.at), dir: catObj.dir, cat: catObj.id, amount: amt, pay_method_id: f.pay_method_id, note: f.note.trim() || null, supplier: catObj.id === 'tra_no_ncc' ? f.supplier : null };
          if (entry) {
            const res = await sb.from('cash_entries').update(rec).eq('id', entry.id).eq('shop_id', shopId).select('id');
            checkMutated(res);
          } else {
            const { error } = await sb.from('cash_entries').insert(Object.assign({ shop_id: shopId }, rec));
            if (error) throw error;
          }
          closeModal();
          app.showToast('Đã lưu khoản thu chi', 'accent');
          await loadCashEntries();
          renderCashTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Lưu'; }

  }

  /* ===== TAB: Làm / Sản xuất (gói tối thiểu: pro, đặt cuối nhóm Pro) ===== */
  async function loadBatches() {
    const { data, error } = await sb.from('batches').select('*').eq('shop_id', shopId).order('at', { ascending: false }).range(0, 39);
    if (error) throw error;
    ST.batches = data || [];
  }

  function refocusSearch() {
    const n = contentHost.querySelector('input[type=search]');
    if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) {} }
  }

  function renderBatchTab() {
    const bf = ST.batchForm;
    const invMap = new Map(ST.invItems.map(i => [i.id, i]));
    let estTotal = 0;
    for (const inp of bf.inputs) {
      const iv = invMap.get(inp.inv_item_id);
      if (iv && Number(inp.qty) > 0) estTotal += Number(inp.qty) * Number(iv.avg_cost || 0);
    }
    const estUnit = Number(bf.out_qty) > 0 ? estTotal / Number(bf.out_qty) : 0;
    const estSpan = el('span', { className: 'num', style: 'font-size:14px;font-weight:600' });
    const updBatchEst = () => {
      let t = 0;
      for (const inp of bf.inputs) { const iv = ST.invItems.find(x => x.id === inp.inv_item_id); if (iv && Number(inp.qty) > 0) t += Number(inp.qty) * Number(iv.avg_cost || 0); }
      const u = Number(bf.out_qty) > 0 ? t / Number(bf.out_qty) : 0;
      estSpan.textContent = 'Giá vốn dự kiến: ' + app.formatMoney(t) + (u > 0 ? ' (' + app.formatMoney(u) + '/đv)' : '');
    };
    updBatchEst();

    const formCard = el('div', { className: 'card' },
      el('div', { className: 'row-between', style: 'margin-bottom:8px' },
        el('b', { text: ST.batchEditId ? 'Đang sửa mẻ sản xuất' : 'Ghi mẻ sản xuất (tùy chọn)' }),
        el('div', { style: 'display:flex;gap:6px' },
          ST.batchEditId ? el('button', { type: 'button', className: 'btn btn-sm', onClick: () => { resetBatchForm(); renderBatchTab(); }, text: 'Hủy sửa' }) : null,
          bf.out_item_id ? el('button', { type: 'button', className: 'btn btn-sm', onClick: () => fillFromLatestBatch(bf.out_item_id), text: 'Lấy theo mẻ gần nhất' }) : null
        )
      ),
      el('div', { className: 'grid-2' },
        el('div', { className: 'field' },
          el('div', { className: 'row-between', style: 'margin-bottom:4px' },
            el('label', { style: 'margin:0', text: 'Vật tư làm ra' }),
            el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openInvItemModal(null, e.currentTarget, () => renderBatchTab()), text: '+ Tạo mới' })
          ),
          el('select', { className: 'select', onChange: e => { bf.out_item_id = e.target.value; renderBatchTab(); } },
            el('option', { value: '', text: 'Chọn vật tư…' }),
            ST.invItems.map(i => el('option', { value: i.id, selected: i.id === bf.out_item_id, text: i.name + ' (' + INV_KINDS[i.kind] + ', ' + i.unit + ')' }))
          )
        ),
        el('div', { className: 'field' },
          el('label', { text: 'Số lượng thu được' }),
          el('input', { className: 'input num', type: 'number', step: 'any', min: 0, value: bf.out_qty, onInput: e => { bf.out_qty = e.target.value; updBatchEst(); } })
        )
      ),
      el('div', { className: 'grid-2' },
        el('div', { className: 'field' }, el('label', { text: 'Ngày giờ (trống = bây giờ)' }), el('input', { className: 'input', type: 'datetime-local', value: bf.at, onChange: e => { bf.at = e.target.value; } })),
        el('div', { className: 'field' }, el('label', { text: 'Ghi chú' }), el('input', { className: 'input', value: bf.note, onInput: e => { bf.note = e.target.value; } }))
      ),
      el('div', { style: 'font-weight:700;margin-top:12px;margin-bottom:6px', text: 'Nguyên liệu đã dùng' }),
      bf.inputs.map((inp, idx) => {
        const iv = invMap.get(inp.inv_item_id);
        const over = iv && (Number(inp.qty) || 0) > Number(iv.qty);
        return el('div', { className: 'line-row' },
          el('select', { className: 'select', style: 'flex:1 1 100%;min-width:0', onChange: e => { inp.inv_item_id = e.target.value; renderBatchTab(); } },
            el('option', { value: '', text: 'Chọn nguyên liệu…' }),
            ST.invItems.map(i => el('option', { value: i.id, selected: i.id === inp.inv_item_id, text: i.name + ' (còn ' + i.qty + ' ' + i.unit + ')' }))
          ),
          el('input', { className: 'input num', style: 'flex:1 1 120px;min-width:0', type: 'number', step: 'any', min: 0, placeholder: 'Lượng dùng', value: inp.qty, onInput: e => { inp.qty = e.target.value; updBatchEst(); } }),
          over ? el('span', { className: 'badge badge-err', text: 'Vượt tồn' }) : null,

      })

    const listCard = el('div', { className: 'card' },
      el('div', { style: 'font-weight:700;margin-bottom:8px', text: 'Mẻ gần đây (' + ST.batches.length + ')' }),
      ST.batches.length ? ST.batches.map(b => {
        const outIv = invMap.get(b.out_item_id);
        const unitCost = b.out_qty > 0 ? b.cost_total / b.out_qty : 0;
        return el('div', { className: 'line-row' },
          el('div', { className: 'line-main' },
            el('b', { text: (outIv ? outIv.name : 'Vật tư') + ' · ' + b.out_qty + ' ' + (outIv ? outIv.unit : '') }),
            el('small', { className: 'num', text: app.formatVnDateTime(b.at) + ' · Giá vốn: ' + app.formatMoney(unitCost) + '/' + (outIv ? outIv.unit : 'đv') })
          ),
          el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openBatchDetailModal(b, e.currentTarget), text: 'Xem' }),
          kebab({ text: 'Xóa', danger: true, fn: e => confirmModal('Xóa mẻ sản xuất?', 'Kho nguyên liệu và thành phẩm sẽ được hoàn lại.', 'Xóa mẻ', async () => {
            const { error } = await sb.rpc('delete_batch', { p_batch: b.id });
            if (error) throw error;
            app.showToast('Đã xóa mẻ', 'accent');
            await Promise.all([loadBatches(), loadInvItems()]);
            renderBatchTab();
          }, e.currentTarget) })
        );
      }) : el('div', { className: 'empty-state', text: 'Chưa có mẻ sản xuất nào.' })
    );

    contentHost.replaceChildren(
      renderMetaBar('batch', async () => { await loadTabData('batch'); renderBatchTab(); }),
      formCard, listCard
    );
  }

  function resetBatchForm() {
    ST.batchEditId = null;
    ST.batchForm = { at: '', out_item_id: '', out_qty: '', note: '', inputs: [{ inv_item_id: '', qty: '' }] };
  }

  async function fillFromLatestBatch(outItemId) {
    const prev = ST.batches.find(b => b.out_item_id === outItemId);
    if (!prev) { app.showToast('Chưa có mẻ trước cùng loại này', 'error'); return; }
    const { data, error } = await sb.from('batch_inputs').select('inv_item_id,qty').eq('batch_id', prev.id).eq('shop_id', shopId);
    if (error) { showErr(error); return; }
    ST.batchForm.out_qty = prev.out_qty;
    ST.batchForm.inputs = (data && data.length) ? data.map(d => ({ inv_item_id: d.inv_item_id, qty: d.qty })) : [{ inv_item_id: '', qty: '' }];
    renderBatchTab();
  }

  async function submitBatch(btn) {
    const bf = ST.batchForm;
    const outQty = Number(bf.out_qty);
    const inputs = bf.inputs.filter(i => i.inv_item_id && Number(i.qty) > 0).map(i => ({ inv_item_id: i.inv_item_id, qty: Number(i.qty) }));
    if (!bf.out_item_id || !(outQty > 0) || !inputs.length) {
      app.showToast('Chọn vật tư làm ra, số lượng > 0 và ít nhất 1 nguyên liệu', 'error');
      return;
    }
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      const { data, error } = await sb.rpc('save_batch', {
        p_shop: shopId, p_batch: ST.batchEditId || null, p_at: localDtToIso(bf.at),
        p_out_item: bf.out_item_id, p_out_qty: outQty, p_inputs: inputs, p_note: bf.note.trim()
      });
      if (error) throw error;
      app.showToast('Đã lưu mẻ · Giá vốn ' + app.formatMoney(data.unit_cost) + '/đv', 'accent');
      resetBatchForm();
      await Promise.all([loadBatches(), loadInvItems()]);

  /* ===== TAB: Khách (gói tối thiểu: proplus) ===== */
  async function loadCustomersWithStats() {
    await loadCustomersBase();
    const { data } = await sb.from('orders').select('customer_id,customer_name,customer_phone,address,total,ordered_at,status').eq('shop_id', shopId).neq('status', 'cancelled').order('ordered_at', { ascending: false }).limit(5000);
    const map = new Map(), byPhone = new Map(), phoneOf = new Map();
    const dig = v => String(v || '').replace(/\D/g, '');
    for (const c of ST.customers) if (dig(c.phone).length >= 8) phoneOf.set(dig(c.phone), c.id);
    const guests = new Map();
    for (const o of (data || [])) {
      const ph = dig(o.customer_phone);
      let cid = o.customer_id || (ph.length >= 8 ? phoneOf.get(ph) : null);
      if (cid) {
        const cur = map.get(cid) || { orders: 0, spent: 0, last: '' };
        cur.orders += 1; cur.spent += Number(o.total) || 0;
        if (!cur.last || o.ordered_at > cur.last) cur.last = o.ordered_at;
        map.set(cid, cur);
      } else if (ph.length >= 8) {
        const g = guests.get(ph) || { id: 'g:' + ph, guest: true, name: o.customer_name || 'Khách', phone: o.customer_phone, apt: '', address: o.address || '', grp: '', member: false, orders: 0, spent: 0, last: '' };
        g.orders += 1; g.spent += Number(o.total) || 0;
        if (!g.last || o.ordered_at > g.last) g.last = o.ordered_at;
        guests.set(ph, g);
      }
    }
    ST.custStats = map;
    ST.custGuests = [...guests.values()];
  }

  function openCustCsvImportModal(opener) {
    let rows = [];
    const prev = el('div', { style: 'margin-top:8px' });
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary', disabled: true,
      onClick: async () => {
        okBtn.disabled = true; okBtn.textContent = 'Đang nhập…';
        try {
          const { error } = await sb.from('customers').insert(rows.map(r => Object.assign({ shop_id: shopId }, r)));
          if (error) throw error;
          closeModal();
          app.showToast('Đã nhập ' + rows.length + ' khách hàng', 'accent');
          await loadCustomersWithStats();
          renderCustTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Nhập khách'; }
      },
      text: 'Nhập khách'
    });
    const parse = txt => {
      rows = [];
      txt.replace(/^\uFEFF/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((l, i) => {
        const c = l.split(';').map(x => x.trim().replace(/^"|"$/g, ''));
        if (i === 0 && /tên/i.test(c[0])) return;
        if (c[0]) rows.push({ name: c[0], grp: c[1] || null, apt: c[2] || null, phone: c[3] || null, member: false });
      });
      okBtn.disabled = !rows.length;
      prev.replaceChildren(el('div', { className: 'alert alert-success', text: 'Sẵn sàng nhập ' + rows.length + ' khách hàng.' }));
    };
    openModal('Nhập khách từ CSV', el('div', null,
      el('div', { className: 'field' }, el('label', { text: 'Định dạng: tên;nhóm;căn hộ;số điện thoại' }),
        el('input', { type: 'file', accept: '.csv,text/csv', className: 'input', onChange: async e => { if (e.target.files[0]) parse(await e.target.files[0].text()); } })
      ),
      el('textarea', { className: 'textarea', placeholder: 'Hoặc dán từng dòng…', onInput: e => parse(e.target.value) }),
      prev
    ), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' }), okBtn], opener);
  }

  /* ===== TAB: Khuyến mãi (gói tối thiểu: proplus) ===== */
  async function loadPromos() {
    if (!app.hasPlan('proplus')) return;
    const { data, error } = await sb.from('promotions').select('*').eq('shop_id', shopId).order('created_at', { ascending: false });
    if (error) throw error;
    ST.promos = data || [];
    const vr = await sb.from('customer_vouchers').select('id,promo_id,customer_id,issued_at,expires_at,used_order_id').eq('shop_id', shopId);
    ST.vouchers = vr.data || [];
  }

  function promoStatus(p) {
    if (!p.active) return { text: 'Tắt', cls: 'badge-muted' };
    const today = app.toVnYmd(new Date());
    if (p.from_date && p.from_date > today) return { text: 'Sắp chạy', cls: 'badge-warn' };
    if (p.to_date && p.to_date < today) return { text: 'Đã hết hạn', cls: 'badge-err' };
    return { text: 'Đang chạy', cls: '' };
  }

  async function patchPromo(p, patch) {
    try {
      const res = await sb.from('promotions').update(patch).eq('id', p.id).eq('shop_id', shopId).select('id');
      checkMutated(res);
      Object.assign(p, patch);
    } catch (err) { showErr(err); }
    renderPromoTab();
  }

  function audienceOf(p) { return p.kind === 'voucher' ? 'custom' : (p.audience || 'all'); }
  function promoVoucherStats(p) {
    const now = new Date().toISOString();
    const list = (ST.vouchers || []).filter(v => v.promo_id === p.id);
    return { issued: list.length, used: list.filter(v => v.used_order_id).length, open: list.filter(v => !v.used_order_id && (!v.expires_at || v.expires_at > now)).length };
  }
  function shortDM(iso) { return iso ? new Date(iso).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', timeZone: 'Asia/Ho_Chi_Minh' }) : ''; }

  function renderPromoTab() {
    const list = ST.promos.filter(p => p.kind !== 'loyalty');

    contentHost.replaceChildren(
      renderMetaBar('promo', async () => { await loadPromos(); markLoaded('promo'); renderPromoTab(); }),
      el('div', { className: 'row-between', style: 'margin-bottom:10px' },
        el('b', { text: 'Khuyến mãi' }),
        el('button', { type: 'button', className: 'btn btn-primary', onClick: e => openPromoModal(null, e.currentTarget), text: '+ Thêm chương trình' })
      ),
      list.length ? el('div', { className: 'card' }, list.map(p => {
        const st = promoStatus(p);
        const aud = audienceOf(p);
        const rl = Array.isArray(p.rules) ? p.rules : null;
        const valText = rl ? rl.length + ' dòng ưu đãi' : p.discount_type === 'percent' ? 'Giảm ' + p.value + '%' :
          p.discount_type === 'amount' ? 'Giảm ' + app.formatMoney(p.value) :
          'Tặng ' + p.value + ' món';
        let audText = aud === 'member' ? 'Chỉ thành viên' : aud === 'custom' ? 'Khách chỉ định' : 'Mọi người';
        if (aud === 'custom') { const s = promoVoucherStats(p); audText += ' (' + s.issued + ' người, đã dùng ' + s.used + ')'; }
        return el('div', { className: 'line-row promo-row' },
          el('div', { className: 'line-main' },
            el('b', { text: p.name }),
            el('small', { text: [audText, valText, p.min_qty > 0 ? 'từ ' + p.min_qty + ' phần' : '', p.min_money > 0 ? 'đơn từ ' + app.formatMoney(p.min_money) : '', (p.item_ids && p.item_ids.length) ? 'áp dụng ' + p.item_ids.length + ' món' : '', (p.description && p.description !== valText) ? p.description : '', (aud !== 'custom' && p.active && p.show_banner !== false) ? 'hiện ở banner' : ''].filter(Boolean).join(' · ') })
          ),
          el('span', { className: 'badge ' + st.cls, text: st.text }),
          kebab({ text: 'Sửa chương trình', fn: e => openPromoModal(p, e.currentTarget) },
            { text: p.active ? 'Tắt chương trình (đang chạy)' : 'Bật chương trình (đang tắt)', cls: p.active ? 'btn-primary' : '', fn: () => patchPromo(p, { active: !p.active }) },
            aud !== 'custom' ? { text: p.show_banner !== false ? 'Ẩn khỏi banner (đang hiện)' : 'Hiện trên banner (đang ẩn)', cls: p.show_banner !== false ? 'btn-primary' : '', fn: () => patchPromo(p, { show_banner: p.show_banner === false }) } : null,
            { text: 'Xóa', danger: true, fn: e => confirmModal('Xóa "' + p.name + '"?', 'Chương trình sẽ bị xóa hẳn' + (aud === 'custom' ? ', các phiếu đã phát cũng mất.' : '.'), 'Xóa', async () => {
            const res = await sb.from('promotions').delete().eq('id', p.id).eq('shop_id', shopId).select('id');
            checkMutated(res);
            await loadPromos();
            renderPromoTab();
          }, e.currentTarget) }
          )
        );
      })) : el('div', { className: 'card empty-state', text: 'Chưa có chương trình nào.' })
    );
  }

  // Một form chung: Dành cho (Mọi người / Thành viên / Khách chỉ định) + các dòng ưu đãi
  function openPromoModal(p, opener) {
    const legacyRule = q => ({ discount_type: q.discount_type, value: q.value, free_item_id: q.free_item_id || '', min_qty: q.min_qty || 0, min_money: q.min_money || 0, item_ids: Array.isArray(q.item_ids) ? q.item_ids.slice() : [] });
    const f = {
      name: p ? p.name : '', description: p ? (p.description || '') : '',
      audience: p ? audienceOf(p) : 'all',
      valid_days: p && p.kind === 'voucher' ? p.valid_days : 30,
      from_date: p ? (p.from_date || '') : '', to_date: p ? (p.to_date || '') : '',
      stack: p ? !!p.stack : false, show_banner: p ? p.show_banner !== false : true, active: p ? !!p.active : true,
      rules: p ? (Array.isArray(p.rules) && p.rules.length ? p.rules.map(legacyRule) : [legacyRule(p)]) : [{ discount_type: 'amount', value: 2000, free_item_id: '', min_qty: 2, min_money: 0, item_ids: [] }]
    };
    const picked = new Set();
    let custSearch = '';
    const issued = p && f.audience === 'custom' ? (ST.vouchers || []).filter(v => v.promo_id === p.id) : [];
    const lockAud = !!p;   // loại chương trình không đổi được sau khi tạo
    const lastOf = c => (ST.custStats && ST.custStats.get(c.id) ? ST.custStats.get(c.id).last : '') || '';
    const custList = () => {
      const q = fold(custSearch.trim());
      return ST.customers.filter(c => String(c.phone || '').replace(/\D/g, '').length >= 8)
        .filter(c => !q || fold(c.name).includes(q) || fold(c.phone).includes(q) || fold(c.apt).includes(q))
        .sort((a, b) => (lastOf(b) > lastOf(a) ? 1 : lastOf(b) < lastOf(a) ? -1 : 0));
    };
    const holdsOpen = cid => issued.some(v => v.customer_id === cid && !v.used_order_id && (!v.expires_at || v.expires_at > new Date().toISOString()));

    const body = el('div');
    const pickHost = el('div');
    const drawPicker = () => {
      const shown = custList();
      const sel = shown.filter(c => !holdsOpen(c.id));
      pickHost.replaceChildren(
        el('div', { className: 'row-between', style: 'margin:12px 0 6px' },
          el('b', { text: 'Chọn khách nhận phiếu (' + picked.size + ' người)' }),
          el('button', { type: 'button', className: 'btn btn-sm', text: picked.size >= sel.length && sel.length ? 'Bỏ chọn' : 'Chọn hết', onClick: () => { if (picked.size >= sel.length && sel.length) picked.clear(); else sel.forEach(c => picked.add(c.id)); drawPicker(); } })),
        el('input', { className: 'input', placeholder: 'Tìm theo tên hoặc SĐT', value: custSearch, onInput: e => { custSearch = e.target.value; drawPickList(); } }),
        el('div', { style: 'font-size:12.5px;opacity:.7;margin:4px 0' }, 'Khách gần đây nhất xếp trên. Chỉ hiện khách đã có SĐT trong danh sách Khách hàng.'),
        pickList
      );
      drawPickList();
    };
    const pickList = el('div', { style: 'max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:8px' });
    const drawPickList = () => {
      const shown = custList().slice(0, 60);
      pickList.replaceChildren(...(shown.length ? shown.map(c => {
        const has = holdsOpen(c.id);
        const last = lastOf(c);
        return el('label', { style: 'display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--border);font-weight:500' },
          el('input', { type: 'checkbox', checked: picked.has(c.id), disabled: has, style: 'width:20px;height:20px;flex:none', onChange: e => { if (e.target.checked) picked.add(c.id); else picked.delete(c.id); const t = pickHost.querySelector('b'); if (t) t.textContent = 'Chọn khách nhận phiếu (' + picked.size + ' người)'; } }),
          el('span', { style: 'flex:1;min-width:0' }, el('b', { text: c.name }), el('small', { style: 'display:block;opacity:.7', text: c.phone + (last ? ' · đặt gần nhất ' + shortDM(last) : '') + (has ? ' · đã có phiếu' : '') })));
      }) : [el('div', { style: 'padding:10px;opacity:.7', text: 'Chưa có khách phù hợp.' })]));
    };

    const issuedHost = el('div');
    const drawIssued = () => {
      if (!p || f.audience !== 'custom') { issuedHost.replaceChildren(); return; }
      const nowIso = new Date().toISOString();
      const nameOf = id => { const c = ST.customers.find(x => x.id === id); return c ? c.name : 'Khách'; };
      issuedHost.replaceChildren(
        el('div', { style: 'font-weight:700;margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--border)', text: 'Đã phát (' + issued.length + ')' }),
        issued.length ? issued.map(v => {
          const used = !!v.used_order_id; const exp = !used && v.expires_at && v.expires_at <= nowIso;
          return el('div', { className: 'line-row' },
            el('span', { style: 'flex:1', text: nameOf(v.customer_id) + (v.expires_at && !used ? ' · hạn ' + shortDM(v.expires_at) : '') }),
            el('span', { className: 'badge ' + (used || exp ? 'badge-muted' : ''), text: used ? 'Đã dùng' : exp ? 'Hết hạn' : 'Còn hạn' }),
            !used ? el('button', { type: 'button', className: 'btn btn-sm btn-danger', text: 'Thu hồi', style: 'margin-left:8px', onClick: async () => {
              try {
                const res = await sb.from('customer_vouchers').delete().eq('id', v.id).eq('shop_id', shopId).is('used_order_id', null).select('id');
                checkMutated(res);
                issued.splice(issued.indexOf(v), 1);
                ST.vouchers = (ST.vouchers || []).filter(x => x.id !== v.id);
                app.showToast('Đã thu hồi phiếu', 'accent');
                drawIssued(); drawPicker();
              } catch (err) { showErr(err); }
            } }) : null);
        }) : el('div', { style: 'opacity:.7', text: 'Chưa phát cho ai.' })
      );
    };

    const draw = () => {
      const custom = f.audience === 'custom';
      const visRules = custom ? f.rules.slice(0, 1) : f.rules;
      body.replaceChildren(
        el('div', { className: 'field' }, el('label', { text: 'Tên chương trình' + (custom ? '' : ' (dòng 1 trên banner)') }), el('input', { className: 'input', value: f.name, placeholder: custom ? 'Ví dụ: Tặng bạn thân thiết giảm 10k' : 'Ví dụ: Mua nhiều, giảm nhiều', onInput: e => { f.name = e.target.value; } })),
        el('div', { className: 'field' }, el('label', { text: 'Dành cho ai' }),
          el('select', { className: 'select', disabled: lockAud && f.audience === 'custom', onChange: e => { f.audience = e.target.value; if (f.audience === 'custom') f.rules = f.rules.slice(0, 1); draw(); } },
            el('option', { value: 'all', selected: f.audience === 'all', text: 'Mọi người', disabled: !!p && f.audience === 'custom' }),
            el('option', { value: 'member', selected: f.audience === 'member', text: 'Chỉ thành viên', disabled: !!p && f.audience === 'custom' }),
            el('option', { value: 'custom', selected: f.audience === 'custom', text: 'Khách chỉ định', disabled: !!p && f.audience !== 'custom' }))),
        el('div', { style: 'font-size:12.5px;opacity:.7;margin:-4px 0 8px', text: f.audience === 'all' ? 'Tự áp dụng cho mọi đơn đủ điều kiện.' : f.audience === 'member' ? 'Tự áp dụng khi khách đặt bằng SĐT của khách đã là thành viên.' : 'Mỗi khách được chọn nhận 1 phiếu, dùng 1 lần.' + (lockAud ? ' Loại này không đổi sang loại khác được.' : '') }),
        custom ? null : el('div', { className: 'field' }, el('label', { text: 'Mô tả (dòng 2 trên banner)' }), el('input', { className: 'input', value: f.description, placeholder: 'Ví dụ: 330ml mua 2 giảm 2k, mua 3 giảm 5k…', onInput: e => { f.description = e.target.value; } })),
        custom ? el('div', { className: 'field' }, el('label', { text: 'Số ngày hiệu lực từ lúc phát (0 = không giới hạn)' }), el('input', { className: 'input num', type: 'number', min: 0, value: f.valid_days, onInput: e => { f.valid_days = e.target.value; } }))
          : el('div', { className: 'grid-2' },
            el('div', { className: 'field' }, el('label', { text: 'Từ ngày' }), el('input', { className: 'input', type: 'date', value: f.from_date, onChange: e => { f.from_date = e.target.value; } })),
            el('div', { className: 'field' }, el('label', { text: 'Đến ngày' }), el('input', { className: 'input', type: 'date', value: f.to_date, onChange: e => { f.to_date = e.target.value; } }))),
        el('label', { style: 'display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:600' },
          el('input', { type: 'checkbox', checked: f.stack, style: 'width:20px;height:20px', onChange: e => { f.stack = e.target.checked; } }), 'Cộng dồn với chương trình khác'),
        el('div', { style: 'font-size:12.5px;opacity:.7;margin:2px 0 0 28px', text: 'Không tick: cùng nhóm món chỉ lấy dòng ưu đãi cao nhất khách đạt được. Nhóm món khác nhau thì tính riêng rồi cộng lại.' }),
        custom ? null : el('label', { style: 'display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600' },
          el('input', { type: 'checkbox', checked: f.show_banner, style: 'width:20px;height:20px', onChange: e => { f.show_banner = e.target.checked; } }), 'Hiện trên banner trang đặt hàng'),
        el('label', { style: 'display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600' },
          el('input', { type: 'checkbox', checked: f.active, style: 'width:20px;height:20px', onChange: e => { f.active = e.target.checked; } }), 'Đang bật'),
        el('div', { style: 'font-weight:700;margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--border)', text: custom ? 'Mức ưu đãi' : 'Các dòng ưu đãi (' + f.rules.length + ')' }),
        visRules.map((r, i) => el('div', { className: 'card', style: 'margin-bottom:10px;padding:12px' },
          custom ? null : el('div', { className: 'row-between', style: 'margin-bottom:8px' },
            el('b', { text: 'Dòng ' + (i + 1) }),
            f.rules.length > 1 ? el('button', { type: 'button', className: 'btn btn-sm btn-danger', text: 'Xóa dòng', onClick: () => { f.rules.splice(i, 1); draw(); } }) : null),
          el('div', { className: 'grid-2' },
            el('div', { className: 'field' }, el('label', { text: 'Kiểu ưu đãi' }),
              el('select', { className: 'select', onChange: e => { r.discount_type = e.target.value; if (r.discount_type === 'free_item' && !r.free_item_id && ST.menuItems[0]) r.free_item_id = ST.menuItems[0].id; draw(); } },
                el('option', { value: 'percent', selected: r.discount_type === 'percent', text: 'Giảm %' }),
                el('option', { value: 'amount', selected: r.discount_type === 'amount', text: 'Giảm số tiền' }),
                el('option', { value: 'free_item', selected: r.discount_type === 'free_item', text: 'Tặng món' }))),
            el('div', { className: 'field' }, el('label', { text: r.discount_type === 'percent' ? 'Phần trăm giảm (1–100)' : r.discount_type === 'amount' ? 'Số tiền giảm (đ)' : 'Số lượng tặng' }),
              el('input', { className: 'input num', type: 'number', min: 1, value: r.value, onInput: e => { r.value = e.target.value; } }))
          ),
          r.discount_type === 'free_item' ? el('div', { className: 'field' }, el('label', { text: 'Món tặng' }),
            el('select', { className: 'select', onChange: e => { r.free_item_id = e.target.value; } }, ST.menuItems.map(m => el('option', { value: m.id, selected: m.id === r.free_item_id, text: m.name })))) : null,
          el('div', { className: 'grid-2' },
            el('div', { className: 'field' }, el('label', { text: 'Số lượng tối thiểu' }), el('input', { className: 'input num', type: 'number', min: 0, value: r.min_qty, onInput: e => { r.min_qty = e.target.value; } })),
            el('div', { className: 'field' }, el('label', { text: 'Số tiền tối thiểu (đ)' }), el('input', { className: 'input num', type: 'number', min: 0, value: r.min_money, onInput: e => { r.min_money = e.target.value; } }))
          ),
          custom ? null : el('details', null,
            el('summary', { style: 'font-weight:600;cursor:pointer', text: 'Áp dụng cho món: ' + (r.item_ids.length ? r.item_ids.length + ' món' : 'cả giỏ hàng') }),
            el('div', { style: 'font-size:12.5px;opacity:.7;margin:4px 0', text: 'Không chọn món nào = áp dụng cả giỏ. Chọn món = chỉ tính số lượng và tiền của các món đã chọn.' }),
            ST.menuItems.map(m => el('label', { style: 'display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:500' },
              el('input', { type: 'checkbox', checked: r.item_ids.indexOf(m.id) >= 0, style: 'width:20px;height:20px', onChange: e => { r.item_ids = r.item_ids.filter(x => x !== m.id); if (e.target.checked) r.item_ids.push(m.id); } }), m.name))
          )
        )),
        custom ? null : el('button', { type: 'button', className: 'btn', style: 'width:100%', text: '+ Thêm dòng ưu đãi', onClick: () => { const last = f.rules[f.rules.length - 1]; f.rules.push(last ? Object.assign({}, last, { item_ids: last.item_ids.slice(), min_qty: (Number(last.min_qty) || 0) + 1 }) : { discount_type: 'amount', value: 2000, free_item_id: '', min_qty: 2, min_money: 0, item_ids: [] }); draw(); } }),
        custom ? pickHost : null,
        custom ? issuedHost : null
      );
      if (custom) {
        if (!ST.custStats) loadCustomersWithStats().then(() => { drawPicker(); }).catch(() => {});
        drawPicker(); drawIssued();
      }
    };
    draw();
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary', text: p ? 'Lưu' : (f.audience === 'custom' ? 'Lưu' : 'Lưu'),
      onClick: async () => {
        if (!f.name.trim()) { app.showToast('Nhập tên chương trình', 'error'); return; }
        const custom = f.audience === 'custom';
        const useRules = custom ? f.rules.slice(0, 1) : f.rules;
        const rules = useRules.map(r => {
          const o = { discount_type: r.discount_type, value: Math.round(Number(r.value) || 0), min_qty: Math.round(Number(r.min_qty) || 0), min_money: Math.round(Number(r.min_money) || 0), item_ids: r.item_ids.length ? r.item_ids : null };
          if (r.discount_type === 'free_item') o.free_item_id = r.free_item_id || null;
          return o;
        });
        okBtn.disabled = true; okBtn.textContent = 'Đang lưu…';
        try {
          const base = {
            name: f.name.trim(), description: custom ? null : (f.description.trim() || null),
            stack: f.stack, show_banner: custom ? false : f.show_banner, active: f.active, audience: f.audience
          };
          const rec = custom ? Object.assign(base, {
            from_date: null, to_date: null, rules: null,
            discount_type: rules[0].discount_type, value: rules[0].value, free_item_id: rules[0].free_item_id || null,
            item_ids: rules[0].item_ids, min_qty: rules[0].min_qty, min_money: rules[0].min_money,
            valid_days: Math.max(0, Math.round(Number(f.valid_days) || 0))
          }) : Object.assign(base, {
            from_date: f.from_date || null, to_date: f.to_date || null,
            discount_type: 'amount', value: 1, free_item_id: null, item_ids: null, min_qty: 0, min_money: 0, valid_days: 0, rules
          });
          let promoId;
          if (p) {
            const res = await sb.from('promotions').update(rec).eq('id', p.id).eq('shop_id', shopId).select('id');
            checkMutated(res);
            promoId = p.id;
          } else {
            const { data, error } = await sb.from('promotions').insert(Object.assign({ shop_id: shopId, kind: custom ? 'voucher' : 'promo' }, rec)).select('id').single();
            if (error) throw error;
            promoId = data.id;
          }
          let given = 0;
          if (custom && picked.size) {
            const now = new Date();
            const exp = rec.valid_days > 0 ? new Date(now.getTime() + rec.valid_days * 86400000).toISOString() : null;
            const rows = [...picked].map(cid => ({ shop_id: shopId, customer_id: cid, promo_id: promoId, issued_at: now.toISOString(), expires_at: exp }));
            const { error } = await sb.from('customer_vouchers').insert(rows);
            if (error) throw error;
            given = rows.length;
          }
          closeModal();
          app.showToast('Đã lưu chương trình' + (given ? ' và phát cho ' + given + ' khách' : ''), 'accent');
          await loadPromos();
          renderPromoTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Lưu'; }
      }
    });
    openModal(p ? 'Sửa chương trình' : 'Thêm chương trình', body, [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), okBtn], opener);
  }

  /* ===== TAB: Đánh giá (gói tối thiểu: proplus) ===== */
  const WANT_LABELS = { exchange: 'Đổi món', refund: 'Hoàn tiền', notify: 'Chỉ báo để quán biết' };
  const FIX_OPTIONS = ['Đổi món', 'Hoàn tiền', 'Giảm giá đơn sau', 'Xin lỗi, ghi nhận', 'Không xác nhận được lỗi'];

  async function loadFeedbacks() {
    const { data, error } = await sb.from('feedback').select('*, orders(code,customer_name,customer_phone)').eq('shop_id', shopId).order('created_at', { ascending: false }).range(0, 99);
    if (error) throw error;
    ST.feedbacks = data || [];
  }

  function renderFeedbackTab() {
    const all = ST.feedbacks;
    const avg = all.length ? (all.reduce((s, f) => s + f.rating, 0) / all.length).toFixed(1).replace('.', ',') : '—';
    const dist = [5, 4, 3, 2, 1].map(s => ({ s, n: all.filter(f => f.rating === s).length }));
    const shown = all.filter(f => ST.fbFilter === 'open' ? !f.handled : !!f.handled);

    const summaryCard = el('div', { className: 'card' },
      el('div', { className: 'row-between' },
        el('div', null,
          el('b', { className: 'num', style: 'font-size:26px;color:var(--accent)', text: avg + ' ★' }),
          el('div', { style: 'font-size:13.5px;color:var(--text-sub)', text: all.length + ' đánh giá' })
        ),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
          dist.map(d => el('span', { className: 'badge badge-muted num', text: d.s + '★: ' + d.n }))
        )
      )
    );

    const seg = el('div', { className: 'bh-seg' },
      el('button', { type: 'button', 'aria-pressed': String(ST.fbFilter === 'open'), onClick: () => { ST.fbFilter = 'open'; renderFeedbackTab(); }, text: 'Chưa xử lý (' + all.filter(f => !f.handled).length + ')' }),
      el('button', { type: 'button', 'aria-pressed': String(ST.fbFilter === 'done'), onClick: () => { ST.fbFilter = 'done'; renderFeedbackTab(); }, text: 'Đã xử lý (' + all.filter(f => f.handled).length + ')' })
    );

    contentHost.replaceChildren(
      renderMetaBar('feedback', async () => { await loadFeedbacks(); markLoaded('feedback'); renderFeedbackTab(); }),
      summaryCard,
      seg,
      shown.length ? shown.map(fb => {
        let selFix = fb.fix || FIX_OPTIONS[0];
        const ord = fb.orders || {};
        return el('div', { className: 'card' },
          el('div', { className: 'row-between' },
            el('b', { style: 'color:#D99A00;font-size:18px', text: '★'.repeat(fb.rating) + '☆'.repeat(5 - fb.rating) }),
            el('small', { style: 'color:var(--text-sub)', text: app.formatVnDateTime(fb.created_at) })
          ),
          el('div', { style: 'font-size:14px;margin-top:4px', text: (ord.code ? 'Đơn ' + ord.code + ' · ' : '') + (ord.customer_name || 'Khách') + (ord.customer_phone ? ' · ' + ord.customer_phone : '') }),
          fb.comment ? el('div', { style: 'margin-top:6px;font-style:italic', text: '“' + fb.comment + '”' }) : null,
          fb.want ? el('div', { style: 'font-size:13.5px;color:var(--text-sub);margin-top:4px', text: 'Khách mong muốn: ' + (WANT_LABELS[fb.want] || fb.want) }) : null,
          el('div', { style: 'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap' },
            el('select', { className: 'select', style: 'flex:1 1 180px', onChange: e => { selFix = e.target.value; } },
              FIX_OPTIONS.map(opt => el('option', { value: opt, selected: selFix === opt, text: opt }))
            ),
            el('button', {
              type: 'button', className: 'btn btn-primary',
              onClick: async () => {
                try {
                  const res = await sb.from('feedback').update({ fix: selFix, handled: true }).eq('id', fb.id).eq('shop_id', shopId).select('id');
                  checkMutated(res);
                  app.showToast('Đã cập nhật xử lý đánh giá', 'accent');
                  await loadFeedbacks();
                  renderFeedbackTab();
                } catch (err) { showErr(err); }
              },
              text: fb.handled ? 'Cập nhật xử lý' : 'Đã xử lý'
            })
          )
        );
      }) : el('div', { className: 'card empty-state', text: 'Không có đánh giá nào trong mục này.' })
    );
  }

  /* ===== KHỞI CHẠY BAN ĐẦU ===== */
  try {
    await Promise.all([loadShopFull(), loadPayMethods(), loadOnlineOrders(false)]);
    renderShopHeader();
    await loadTabData('sale');
    renderCurrentTab();
  } catch (err) {
    showErr(err);
  }
})();
</script>
</body>
</html>
