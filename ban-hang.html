  /* ===== TAB: Định mức (gói tối thiểu: pro) ===== */
  async function loadAllRecipeFlags() {
    const { data } = await sb.from('recipes').select('menu_item_id').eq('shop_id', shopId);
    ST.allRecipeMenuIds = new Set((data || []).map(r => r.menu_item_id));
  }
  async function loadRecipesForMenu(menuId) {
    const { data, error } = await sb.from('recipes').select('*').eq('shop_id', shopId).eq('menu_item_id', menuId);
    if (error) throw error;
    ST.recipes = data || [];
  }

  function renderRecipeTab() {
    const selMenu = ST.menuItems.find(m => m.id === ST.recipeMenuId) || null;
    const invMap = new Map(ST.invItems.map(i => [i.id, i]));
    let estCost = 0;
    for (const r of ST.recipes) {
      const iv = invMap.get(r.inv_item_id);
      if (iv) estCost += Number(r.qty) * Number(iv.avg_cost || 0);
    }

    const menuSelect = el('select', {
      className: 'select',
      onChange: async e => { ST.recipeMenuId = e.target.value; await loadRecipesForMenu(ST.recipeMenuId); renderRecipeTab(); }
    }, ST.menuItems.map(m => el('option', {
      value: m.id, selected: m.id === ST.recipeMenuId,
      text: m.name + (ST.allRecipeMenuIds.has(m.id) ? '' : ' (Chưa có định mức)')
    })));

    let newInvId = ST.invItems[0] ? ST.invItems[0].id : '';
    let newQty = '';
    const addRow = el('div', { className: 'grid-3', style: 'margin-top:12px;align-items:end' },
      el('div', { className: 'field', style: 'margin:0' },
        el('label', { text: 'Vật tư' }),
        el('select', { className: 'select', onChange: e => { newInvId = e.target.value; } },
          ST.invItems.map(i => el('option', { value: i.id, text: i.name + ' (' + i.unit + ')' }))
        )
      ),
      el('div', { className: 'field', style: 'margin:0' },
        el('label', { text: 'Lượng cho 1 ' + (selMenu ? (selMenu.unit || 'đơn vị') : 'đơn vị') }),
        el('input', { className: 'input num', type: 'number', step: 'any', min: 0, placeholder: 'Ví dụ: 0.25', onInput: e => { newQty = e.target.value; } })
      ),
      el('button', {
        type: 'button', className: 'btn btn-primary',
        onClick: async () => {
          const q = Number(newQty);
          if (!ST.recipeMenuId || !newInvId || !(q > 0)) { app.showToast('Chọn vật tư và nhập lượng > 0', 'error'); return; }
          try {
            const { error } = await sb.from('recipes').insert({ shop_id: shopId, menu_item_id: ST.recipeMenuId, inv_item_id: newInvId, qty: q });
            if (error) throw error;
            app.showToast('Đã thêm định mức', 'accent');
            await Promise.all([loadRecipesForMenu(ST.recipeMenuId), loadAllRecipeFlags()]);
            renderRecipeTab();
          } catch (err) { showErr(err); }
        },
        text: 'Thêm vào định mức'
      })
    );

    contentHost.replaceChildren(
      renderMetaBar('recipe', async () => { await loadTabData('recipe'); renderRecipeTab(); }),
      el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:8px' },
          el('b', { text: 'Chọn món để cài định mức' }),
          ST.menuItems.length > 1 && selMenu ? el('button', {
            type: 'button', className: 'btn btn-sm',
            onClick: e => openCopyRecipeModal(selMenu, e.currentTarget),
            text: 'Sao chép từ món khác'
          }) : null
        ),
        ST.menuItems.length ? menuSelect : el('div', { className: 'empty-state', text: 'Hãy thêm món ở tab Menu trước.' })
      ),
      selMenu ? el('div', { className: 'card' },
        el('div', { style: 'font-weight:700;margin-bottom:6px', text: 'Thành phần cho 1 ' + (selMenu.unit || 'đơn vị') + ' ' + selMenu.name }),
        ST.recipes.length ? ST.recipes.map(r => {
          const iv = invMap.get(r.inv_item_id);
          const lineCost = iv ? Number(r.qty) * Number(iv.avg_cost || 0) : 0;
          const qInp = el('input', { className: 'input num', style: 'width:100px', type: 'number', step: 'any', value: r.qty });
          return el('div', { className: 'line-row' },
            el('div', { className: 'line-main' },
              el('b', { text: iv ? iv.name : r.inv_item_id }),
              el('small', { className: 'num', text: 'Tạm tính: ' + app.formatMoney(lineCost) + ' (' + (iv ? iv.unit : '') + ')' })
            ),
            qInp,
            el('button', {
              type: 'button', className: 'btn btn-sm',
              onClick: async () => {
                const q = Number(qInp.value);
                if (!(q > 0)) return;
                try {
                  const res = await sb.from('recipes').update({ qty: q }).eq('id', r.id).eq('shop_id', shopId).select('id');
                  checkMutated(res);
                  app.showToast('Đã cập nhật định mức', 'accent');
                  await loadRecipesForMenu(ST.recipeMenuId);
                  renderRecipeTab();
                } catch (err) { showErr(err); }
              },
              text: 'Lưu'
            }),
            el('button', {
              type: 'button', className: 'btn btn-sm btn-danger',
              onClick: async () => {
                try {
                  const res = await sb.from('recipes').delete().eq('id', r.id).eq('shop_id', shopId).select('id');
                  checkMutated(res);
                  await Promise.all([loadRecipesForMenu(ST.recipeMenuId), loadAllRecipeFlags()]);
                  renderRecipeTab();
                } catch (err) { showErr(err); }
              },
              text: 'Xóa'
            })
          );
        }) : el('div', { className: 'empty-state', text: 'Món này chưa có định mức vật tư.' }),
        ST.invItems.length ? addRow : el('div', { className: 'alert alert-warn', style: 'margin-top:10px', text: 'Hãy thêm vật tư ở tab Kho hoặc nhập phiếu Mua trước.' }),
        el('div', { className: 'grid-2', style: 'margin-top:14px;padding-top:12px;border-top:1px solid var(--border)' },
          el('div', { className: 'kpi-box' }, el('small', { text: 'Giá vốn dự kiến / 1 ' + (selMenu.unit || 'đv') }), el('b', { className: 'num', text: app.formatMoney(estCost) })),
          el('div', { className: 'kpi-box' }, el('small', { text: 'Lãi gộp dự kiến (giá bán ' + app.formatMoney(selMenu.price) + ')' }), el('b', { className: 'num', style: 'color:var(--accent)', text: app.formatMoney(selMenu.price - estCost) }))
        )
      ) : null
    );
  }

  function openCopyRecipeModal(targetMenu, opener) {
    const sources = ST.menuItems.filter(m => m.id !== targetMenu.id && ST.allRecipeMenuIds.has(m.id));
    if (!sources.length) { app.showToast('Chưa có món nào khác có định mức để sao chép', 'error'); return; }
    let srcId = sources[0].id;
    const sel = el('select', { className: 'select', onChange: e => { srcId = e.target.value; } },
      sources.map(m => el('option', { value: m.id, text: m.name }))
    );
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        okBtn.disabled = true; okBtn.textContent = 'Đang sao chép…';
        try {
          const { data: srcRows, error } = await sb.from('recipes').select('inv_item_id,qty').eq('shop_id', shopId).eq('menu_item_id', srcId);
          if (error) throw error;
          const existingInv = new Set(ST.recipes.map(r => r.inv_item_id));
          const toInsert = (srcRows || []).filter(r => !existingInv.has(r.inv_item_id)).map(r => ({
            shop_id: shopId, menu_item_id: targetMenu.id, inv_item_id: r.inv_item_id, qty: r.qty
          }));
          if (toInsert.length) {
            const ins = await sb.from('recipes').insert(toInsert);
            if (ins.error) throw ins.error;
          }
          closeModal();
          app.showToast('Đã sao chép ' + toInsert.length + ' dòng định mức', 'accent');
          await Promise.all([loadRecipesForMenu(targetMenu.id), loadAllRecipeFlags()]);
          renderRecipeTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Sao chép'; }
      },
      text: 'Sao chép'
    });
    openModal('Sao chép định mức sang ' + targetMenu.name, el('div', { className: 'field' }, el('label', { text: 'Chọn món nguồn' }), sel), [
      el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), okBtn
    ], opener);
  }

  /* ===== TAB: Thu chi (gói tối thiểu: pro) ===== */
  const CASH_CATS = [
    { id: 'von', label: 'Vốn đầu tư', dir: 'in' },
    { id: 'rut_von', label: 'Rút vốn', dir: 'out' },
    { id: 'thu_khac', label: 'Thu khác', dir: 'in' },
    { id: 'chi_khac', label: 'Chi khác', dir: 'out' }
  ];
  async function loadCashEntries() {
    const { data, error } = await sb.from('cash_entries').select('*').eq('shop_id', shopId)
      .gte('at', ST.cashFrom + 'T00:00:00+07:00').lte('at', ST.cashTo + 'T23:59:59+07:00')
      .order('at', { ascending: false });
    if (error) throw error;
    ST.cashEntries = data || [];
  }

  function renderCashTab() {
    let totalIn = 0, totalOut = 0;
    for (const c of ST.cashEntries) { if (c.dir === 'in') totalIn += c.amount; else totalOut += c.amount; }

    contentHost.replaceChildren(
      renderMetaBar('cash', async () => { await loadCashEntries(); markLoaded('cash'); renderCashTab(); }),
      el('div', { className: 'card' },
        el('div', { className: 'grid-3', style: 'align-items:end' },
          el('div', { className: 'field', style: 'margin:0' }, el('label', { text: 'Từ ngày' }), el('input', { className: 'input', type: 'date', value: ST.cashFrom, onChange: async e => { ST.cashFrom = e.target.value; await loadCashEntries(); renderCashTab(); } })),
          el('div', { className: 'field', style: 'margin:0' }, el('label', { text: 'Đến ngày' }), el('input', { className: 'input', type: 'date', value: ST.cashTo, onChange: async e => { ST.cashTo = e.target.value; await loadCashEntries(); renderCashTab(); } })),
          el('button', { type: 'button', className: 'btn btn-primary', onClick: e => openCashModal(null, e.currentTarget), text: '+ Ghi thu / chi' })
        )
      ),
      el('div', { className: 'grid-3', style: 'margin-bottom:12px' },
        el('div', { className: 'kpi-box' }, el('small', { text: 'Tổng thu' }), el('b', { className: 'num', style: 'color:var(--accent)', text: app.formatMoney(totalIn) })),
        el('div', { className: 'kpi-box' }, el('small', { text: 'Tổng chi' }), el('b', { className: 'num', style: 'color:var(--error)', text: app.formatMoney(totalOut) })),
        el('div', { className: 'kpi-box' }, el('small', { text: 'Chênh lệch' }), el('b', { className: 'num', text: app.formatMoney(totalIn - totalOut) }))
      ),
      el('div', { className: 'card' },
        ST.cashEntries.length ? ST.cashEntries.map(c => {
          const catObj = CASH_CATS.find(x => x.id === c.cat);
          return el('div', { className: 'line-row' },
            el('div', { className: 'line-main' },
              el('b', { text: (catObj ? catObj.label : c.cat) + (c.note ? ' · ' + c.note : '') }),
              el('small', { text: app.formatVnDateTime(c.at) + ' · ' + payMethodName(c.pay_method_id) })
            ),
            el('b', { className: 'num', style: 'color:' + (c.dir === 'in' ? 'var(--accent)' : 'var(--error)'), text: (c.dir === 'in' ? '+' : '−') + app.formatMoney(c.amount) }),
            el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openCashModal(c, e.currentTarget), text: 'Sửa' }),
            el('button', { type: 'button', className: 'btn btn-sm btn-danger', onClick: e => confirmModal('Xóa khoản thu chi?', 'Khoản này sẽ bị xóa khỏi sổ.', 'Xóa', async () => {
              const res = await sb.from('cash_entries').delete().eq('id', c.id).eq('shop_id', shopId).select('id');
              checkMutated(res);
              await loadCashEntries();
              renderCashTab();
            }, e.currentTarget), text: 'Xóa' })
          );
        }) : el('div', { className: 'empty-state', text: 'Chưa có khoản thu chi tay nào trong khoảng ngày này.' })
      )
    );
  }

  function openCashModal(entry, opener) {
    const f = {
      at: entry ? toLocalDtValue(entry.at) : toLocalDtValue(null),
      cat: entry ? entry.cat : 'von',
      amount: entry ? entry.amount : '',
      pay_method_id: entry ? entry.pay_method_id : (activePayMethods()[0] ? activePayMethods()[0].id : null),
      note: entry ? (entry.note || '') : ''
    };
    const body = el('div');
    const draw = () => {
      body.replaceChildren(
        el('div', { className: 'field' },
          el('label', { text: 'Loại thu / chi' }),
          el('div', { className: 'chips' }, CASH_CATS.map(c => el('button', {
            type: 'button', className: 'chip', 'aria-pressed': String(f.cat === c.id),
            onClick: () => { f.cat = c.id; draw(); }, text: c.label
          })))
        ),
        el('div', { className: 'grid-2' },
          el('div', { className: 'field' }, el('label', { text: 'Số tiền (đ)' }), el('input', { className: 'input num', type: 'number', min: 1, value: f.amount, onInput: e => { f.amount = e.target.value; } })),
          el('div', { className: 'field' }, el('label', { text: 'Ngày giờ' }), el('input', { className: 'input', type: 'datetime-local', value: f.at, onChange: e => { f.at = e.target.value; } }))
        ),
        el('div', { className: 'field' },
          el('label', { text: 'Phương thức' }),
          el('div', { className: 'chips' }, activePayMethods().map(m => el('button', {
            type: 'button', className: 'chip', 'aria-pressed': String(f.pay_method_id === m.id),
            onClick: () => { f.pay_method_id = m.id; draw(); }, text: m.name
          })))
        ),
        el('div', { className: 'field' }, el('label', { text: 'Ghi chú' }), el('input', { className: 'input', value: f.note, onInput: e => { f.note = e.target.value; } }))
      );
    };
    draw();
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        const amt = Math.round(Number(f.amount));
        if (!(amt > 0)) { app.showToast('Số tiền phải lớn hơn 0', 'error'); return; }
        const catObj = CASH_CATS.find(c => c.id === f.cat) || CASH_CATS[0];
        okBtn.disabled = true; okBtn.textContent = 'Đang lưu…';
        try {
          const rec = { at: localDtToIso(f.at), dir: catObj.dir, cat: catObj.id, amount: amt, pay_method_id: f.pay_method_id, note: f.note.trim() || null };
          if (entry) {
            const res = await sb.from('cash_entries').update(rec).eq('id', entry.id).eq('shop_id', shopId).select('id');
            checkMutated(res);
          } else {
            const { error } = await sb.from('cash_entries').insert(Object.assign({ shop_id: shopId }, rec));
            if (error) throw error;
          }
          closeModal();
          app.showToast('Đã lưu khoản thu chi', 'accent');
          await loadCashEntries();
          renderCashTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Lưu'; }
      },
      text: 'Lưu'
    });
    openModal(entry ? 'Sửa thu chi' : 'Ghi thu / chi', body, [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), okBtn], opener);
  }

  function resetBatchForm() {
    ST.batchEditId = null;
    ST.batchForm = { at: '', out_item_id: '', out_qty: '', note: '', inputs: [{ inv_item_id: '', qty: '' }] };
  }

  async function fillFromLatestBatch(outItemId) {
    const prev = ST.batches.find(b => b.out_item_id === outItemId);
    if (!prev) { app.showToast('Chưa có mẻ trước cùng loại này', 'error'); return; }
    const { data, error } = await sb.from('batch_inputs').select('inv_item_id,qty').eq('batch_id', prev.id).eq('shop_id', shopId);
    if (error) { showErr(error); return; }
    ST.batchForm.out_qty = prev.out_qty;
    ST.batchForm.inputs = (data && data.length) ? data.map(d => ({ inv_item_id: d.inv_item_id, qty: d.qty })) : [{ inv_item_id: '', qty: '' }];
    renderBatchTab();
  }

  async function submitBatch(btn) {
    const bf = ST.batchForm;
    const outQty = Number(bf.out_qty);
    const inputs = bf.inputs.filter(i => i.inv_item_id && Number(i.qty) > 0).map(i => ({ inv_item_id: i.inv_item_id, qty: Number(i.qty) }));
    if (!bf.out_item_id || !(outQty > 0) || !inputs.length) {
      app.showToast('Chọn vật tư làm ra, số lượng > 0 và ít nhất 1 nguyên liệu', 'error');
      return;
    }
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      const { data, error } = await sb.rpc('save_batch', {
        p_shop: shopId, p_batch: ST.batchEditId || null, p_at: localDtToIso(bf.at),
        p_out_item: bf.out_item_id, p_out_qty: outQty, p_inputs: inputs, p_note: bf.note.trim()
      });
      if (error) throw error;
      app.showToast('Đã lưu mẻ · Giá vốn ' + app.formatMoney(data.unit_cost) + '/đv', 'accent');
      resetBatchForm();
      await Promise.all([loadBatches(), loadInvItems()]);
      renderBatchTab();
    } catch (err) { showErr(err); btn.disabled = false; btn.textContent = 'Lưu mẻ sản xuất'; }
  }

  /* ===== TAB: Khách (gói tối thiểu: proplus) ===== */
  async function loadCustomersWithStats() {
    await loadCustomersBase();
    const { data } = await sb.from('orders').select('customer_id,total,ordered_at,status').eq('shop_id', shopId).not('customer_id', 'is', null).neq('status', 'cancelled');
    const map = new Map();
    for (const o of (data || [])) {
      const cur = map.get(o.customer_id) || { orders: 0, spent: 0, last: '' };
      cur.orders += 1; cur.spent += Number(o.total) || 0;
      if (!cur.last || o.ordered_at > cur.last) cur.last = o.ordered_at;
      map.set(o.customer_id, cur);
    }
    ST.custStats = map;
  }

  async function openCustomerDetailModal(c, opener) {
    const [ordRes, vouRes] = await Promise.all([
      sb.from('orders').select('code,ordered_at,total,status').eq('shop_id', shopId).eq('customer_id', c.id).order('ordered_at', { ascending: false }).range(0, 19),
      sb.from('customer_vouchers').select('*').eq('shop_id', shopId).eq('customer_id', c.id).order('issued_at', { ascending: false })
    ]);
    const orders = ordRes.data || [];
    const vouchers = vouRes.data || [];
    const activeVouchers = ST.promos.filter(p => p.kind === 'voucher' && p.active);
    let selPromoId = activeVouchers[0] ? activeVouchers[0].id : '';
    const promoMap = new Map(ST.promos.map(p => [p.id, p]));
    const todayIso = new Date().toISOString();

    const grantRow = activeVouchers.length ? el('div', { style: 'display:flex;gap:8px;margin-top:8px;flex-wrap:wrap' },
      el('select', { className: 'select', style: 'flex:1', onChange: e => { selPromoId = e.target.value; } },
        activeVouchers.map(p => el('option', { value: p.id, text: p.name }))
      ),
      el('button', {
        type: 'button', className: 'btn btn-primary',
        onClick: async () => {
          const pr = promoMap.get(selPromoId);
          if (!pr) return;
          const now = new Date();
          const exp = pr.valid_days > 0 ? new Date(now.getTime() + pr.valid_days * 86400000).toISOString() : null;
          try {
            const { error } = await sb.from('customer_vouchers').insert({
              shop_id: shopId, customer_id: c.id, promo_id: pr.id, issued_at: now.toISOString(), expires_at: exp
            });
            if (error) throw error;
            app.showToast('Đã phát voucher ' + pr.name, 'accent');
            openCustomerDetailModal(c, opener);
          } catch (err) { showErr(err); }
        },
        text: 'Phát voucher'
      })
    ) : el('small', { style: 'color:var(--text-sub)', text: 'Chưa có chương trình voucher nào đang bật ở tab Khuyến mãi.' });

    openModal(c.name + (c.code ? ' (' + c.code + ')' : ''), el('div', null,
      el('div', { style: 'font-weight:700', text: 'Voucher của khách' }),
      grantRow,
      vouchers.length ? el('div', { style: 'margin-top:8px' }, vouchers.map(v => {
        const pr = promoMap.get(v.promo_id);
        const st = v.used_order_id ? 'Đã dùng' : (v.expires_at && v.expires_at < todayIso ? 'Hết hạn' : 'Còn hạn');
        return el('div', { className: 'line-row' },
          el('span', { text: pr ? pr.name : 'Voucher' }),
          el('span', { className: 'badge ' + (st === 'Còn hạn' ? '' : 'badge-muted'), text: st })
        );
      })) : el('div', { style: 'font-size:13.5px;color:var(--text-sub);margin-top:6px', text: 'Chưa có voucher.' }),
      el('div', { style: 'font-weight:700;margin-top:16px', text: 'Đơn gần đây (' + orders.length + ')' }),
      orders.length ? orders.map(o => el('div', { className: 'line-row' },
        el('span', { className: 'num', text: o.code + ' · ' + app.formatVnDateTime(o.ordered_at) }),
        el('b', { className: 'num', text: app.formatMoney(o.total) })
      )) : el('div', { style: 'font-size:13.5px;color:var(--text-sub);margin-top:6px', text: 'Chưa có đơn nào.' })
    ), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })], opener);
  }

  function openCustCsvImportModal(opener) {
    let rows = [];
    const prev = el('div', { style: 'margin-top:8px' });
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary', disabled: true,
      onClick: async () => {
        okBtn.disabled = true; okBtn.textContent = 'Đang nhập…';
        try {
          const { error } = await sb.from('customers').insert(rows.map(r => Object.assign({ shop_id: shopId }, r)));
          if (error) throw error;
          closeModal();
          app.showToast('Đã nhập ' + rows.length + ' khách hàng', 'accent');
          await loadCustomersWithStats();
          renderCustTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Nhập khách'; }
      },
      text: 'Nhập khách'
    });
    const parse = txt => {
      rows = [];
      txt.replace(/^\uFEFF/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((l, i) => {
        const c = l.split(';').map(x => x.trim().replace(/^"|"$/g, ''));
        if (i === 0 && /tên/i.test(c[0])) return;
        if (c[0]) rows.push({ name: c[0], grp: c[1] || null, apt: c[2] || null, phone: c[3] || null, member: false });
      });
      okBtn.disabled = !rows.length;
      prev.replaceChildren(el('div', { className: 'alert alert-success', text: 'Sẵn sàng nhập ' + rows.length + ' khách hàng.' }));
    };
    openModal('Nhập khách từ CSV', el('div', null,
      el('div', { className: 'field' }, el('label', { text: 'Định dạng: tên;nhóm;căn hộ;số điện thoại' }),
        el('input', { type: 'file', accept: '.csv,text/csv', className: 'input', onChange: async e => { if (e.target.files[0]) parse(await e.target.files[0].text()); } })
      ),
      el('textarea', { className: 'textarea', placeholder: 'Hoặc dán từng dòng…', onInput: e => parse(e.target.value) }),
      prev
    ), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' }), okBtn], opener);
  }

  /* ===== TAB: Khuyến mãi (gói tối thiểu: proplus) ===== */
  async function loadPromos() {
    if (!app.hasPlan('proplus')) return;
    const { data, error } = await sb.from('promotions').select('*').eq('shop_id', shopId).order('created_at', { ascending: false });
    if (error) throw error;
    ST.promos = data || [];
  }

  function promoStatus(p) {
    if (!p.active) return { text: 'Tắt', cls: 'badge-muted' };
    const today = app.toVnYmd(new Date());
    if (p.from_date && p.from_date > today) return { text: 'Sắp chạy', cls: 'badge-warn' };
    if (p.to_date && p.to_date < today) return { text: 'Đã hết hạn', cls: 'badge-err' };
    return { text: 'Đang chạy', cls: '' };
  }

  function renderPromoTab() {
    const seg = el('div', { className: 'bh-seg' },
      el('button', { type: 'button', 'aria-pressed': String(ST.promoKind === 'promo'), onClick: () => { ST.promoKind = 'promo'; renderPromoTab(); }, text: 'Khuyến mãi' }),
      el('button', { type: 'button', 'aria-pressed': String(ST.promoKind === 'voucher'), onClick: () => { ST.promoKind = 'voucher'; renderPromoTab(); }, text: 'Voucher' }),
      el('button', { type: 'button', 'aria-pressed': String(ST.promoKind === 'loyalty'), onClick: () => { ST.promoKind = 'loyalty'; renderPromoTab(); }, text: 'Tích đơn' })
    );
    const list = ST.promos.filter(p => p.kind === ST.promoKind);

    contentHost.replaceChildren(
      renderMetaBar('promo', async () => { await loadPromos(); markLoaded('promo'); renderPromoTab(); }),
      el('div', { className: 'row-between', style: 'margin-bottom:10px' },
        seg,
        el('button', { type: 'button', className: 'btn btn-primary', onClick: e => openPromoModal(null, e.currentTarget), text: '+ Thêm chương trình' })
      ),
      list.length ? el('div', { className: 'card' }, list.map(p => {
        const st = promoStatus(p);
        const valText = p.discount_type === 'percent' ? 'Giảm ' + p.value + '%' :
          p.discount_type === 'amount' ? 'Giảm ' + app.formatMoney(p.value) :
          'Tặng ' + p.value + ' món';
        return el('div', { className: 'line-row' },
          el('div', { className: 'line-main' },
            el('b', { text: p.name }),
            el('small', { text: valText + (p.description ? ' · ' + p.description : '') })
          ),
          el('span', { className: 'badge ' + st.cls, text: st.text }),
          el('button', {
            type: 'button', className: 'btn btn-sm',
            onClick: async () => {
              try {
                const res = await sb.from('promotions').update({ active: !p.active }).eq('id', p.id).eq('shop_id', shopId).select('id');
                checkMutated(res);
                p.active = !p.active;
                renderPromoTab();
              } catch (err) { showErr(err); }
            },
            text: p.active ? 'Tắt' : 'Bật'
          }),
          el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openPromoModal(p, e.currentTarget), text: 'Sửa' }),
          el('button', { type: 'button', className: 'btn btn-sm btn-danger', onClick: e => confirmModal('Xóa "' + p.name + '"?', 'Chương trình sẽ bị xóa hẳn.', 'Xóa', async () => {
            const res = await sb.from('promotions').delete().eq('id', p.id).eq('shop_id', shopId).select('id');
            checkMutated(res);
            await loadPromos();
            renderPromoTab();
          }, e.currentTarget), text: 'Xóa' })
        );
      })) : el('div', { className: 'card empty-state', text: 'Chưa có chương trình nào trong mục này.' })
    );
  }

  function openPromoModal(p, opener) {
    const f = {
      kind: p ? p.kind : ST.promoKind,
      name: p ? p.name : '',
      description: p ? (p.description || '') : '',
      discount_type: p ? p.discount_type : 'percent',
      value: p ? p.value : 10,
      free_item_id: p ? (p.free_item_id || '') : (ST.menuItems[0] ? ST.menuItems[0].id : ''),
      from_date: p ? (p.from_date || '') : '',
      to_date: p ? (p.to_date || '') : '',
      stack: p ? !!p.stack : true,
      item_ids: p && Array.isArray(p.item_ids) ? p.item_ids.slice() : [],
      min_qty: p ? (p.min_qty || 0) : 0,
      min_money: p ? (p.min_money || 0) : 0,
      valid_days: p ? (p.valid_days || 30) : 30,
      loyalty_goal: p ? (p.loyalty_goal || 10) : 10,
      active: p ? !!p.active : true
    };
    const body = el('div');
    const draw = () => {
      body.replaceChildren(
        el('div', { className: 'field' }, el('label', { text: 'Tên chương trình' }), el('input', { className: 'input', value: f.name, onInput: e => { f.name = e.target.value; } })),
        el('div', { className: 'field' }, el('label', { text: 'Mô tả' }), el('input', { className: 'input', value: f.description, onInput: e => { f.description = e.target.value; } })),
        el('div', { className: 'grid-2' },
          el('div', { className: 'field' }, el('label', { text: 'Kiểu ưu đãi' }),
            el('select', { className: 'select', onChange: e => { f.discount_type = e.target.value; draw(); } },
              el('option', { value: 'percent', selected: f.discount_type === 'percent', text: 'Giảm %' }),
              el('option', { value: 'amount', selected: f.discount_type === 'amount', text: 'Giảm số tiền' }),
              el('option', { value: 'free_item', selected: f.discount_type === 'free_item', text: 'Tặng món' })
            )
          ),
          el('div', { className: 'field' }, el('label', { text: f.discount_type === 'percent' ? 'Phần trăm (1–100)' : f.discount_type === 'amount' ? 'Số tiền giảm (đ)' : 'Số lượng tặng' }),
            el('input', { className: 'input num', type: 'number', min: 1, value: f.value, onInput: e => { f.value = e.target.value; } })
          )
        ),
        f.discount_type === 'free_item' ? el('div', { className: 'field' },
          el('label', { text: 'Món tặng' }),
          el('select', { className: 'select', onChange: e => { f.free_item_id = e.target.value; } },
            ST.menuItems.map(m => el('option', { value: m.id, selected: m.id === f.free_item_id, text: m.name }))
          )
        ) : null,
        f.kind === 'promo' ? el('div', { className: 'field' },
          el('label', { text: 'Áp dụng cho món nào' }),
          el('div', { style: 'font-size:12.5px;opacity:.7;margin-bottom:2px', text: 'Không chọn món nào = áp dụng cả giỏ hàng. Chọn món = chỉ tính số lượng và tiền của các món đã chọn.' }),
          ST.menuItems.map(m => el('label', { style: 'display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:500' },
            el('input', { type: 'checkbox', checked: f.item_ids.indexOf(m.id) >= 0, style: 'width:20px;height:20px', onChange: e => {
              f.item_ids = f.item_ids.filter(x => x !== m.id); if (e.target.checked) f.item_ids.push(m.id); } }), m.name))
        ) : null,
        el('div', { className: 'grid-2' },
          el('div', { className: 'field' }, el('label', { text: 'Từ ngày' }), el('input', { className: 'input', type: 'date', value: f.from_date, onChange: e => { f.from_date = e.target.value; } })),
          el('div', { className: 'field' }, el('label', { text: 'Đến ngày' }), el('input', { className: 'input', type: 'date', value: f.to_date, onChange: e => { f.to_date = e.target.value; } }))
        ),
        el('div', { className: 'grid-2' },
          el('div', { className: 'field' }, el('label', { text: 'Tối thiểu số lượng' }), el('input', { className: 'input num', type: 'number', min: 0, value: f.min_qty, onInput: e => { f.min_qty = e.target.value; } })),
          el('div', { className: 'field' }, el('label', { text: 'Tối thiểu số tiền (đ)' }), el('input', { className: 'input num', type: 'number', min: 0, value: f.min_money, onInput: e => { f.min_money = e.target.value; } }))
        ),
        f.kind === 'voucher' ? el('div', { className: 'field' }, el('label', { text: 'Số ngày hiệu lực từ lúc phát' }), el('input', { className: 'input num', type: 'number', min: 0, value: f.valid_days, onInput: e => { f.valid_days = e.target.value; } })) : null,
        f.kind === 'loyalty' ? el('div', { className: 'field' }, el('label', { text: 'Mục tiêu tích (số đơn vị)' }), el('input', { className: 'input num', type: 'number', min: 1, value: f.loyalty_goal, onInput: e => { f.loyalty_goal = e.target.value; } })) : null,
        el('label', { style: 'display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600' },
          el('input', { type: 'checkbox', checked: f.stack, style: 'width:20px;height:20px', onChange: e => { f.stack = e.target.checked; } }), 'Cộng dồn với chương trình khác'
        ),
        el('label', { style: 'display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600' },
          el('input', { type: 'checkbox', checked: f.active, style: 'width:20px;height:20px', onChange: e => { f.active = e.target.checked; } }), 'Đang bật'
        )
      );
    };
    draw();
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        if (!f.name.trim()) { app.showToast('Nhập tên chương trình', 'error'); return; }
        okBtn.disabled = true; okBtn.textContent = 'Đang lưu…';
        try {
          const rec = {
            kind: f.kind, name: f.name.trim(), description: f.description.trim() || null,
            discount_type: f.discount_type, value: Math.round(Number(f.value) || 0),
            free_item_id: f.discount_type === 'free_item' ? (f.free_item_id || null) : null,
            item_ids: f.kind === 'promo' && f.item_ids.length ? f.item_ids : null,
            from_date: f.from_date || null, to_date: f.to_date || null,
            stack: f.stack, min_qty: Math.round(Number(f.min_qty) || 0), min_money: Math.round(Number(f.min_money) || 0),
            valid_days: f.kind === 'voucher' ? Math.round(Number(f.valid_days) || 0) : 0,
            loyalty_goal: f.kind === 'loyalty' ? Math.round(Number(f.loyalty_goal) || 0) : 0,
            active: f.active
          };
          if (p) {
            const res = await sb.from('promotions').update(rec).eq('id', p.id).eq('shop_id', shopId).select('id');
            checkMutated(res);
          } else {
            const { error } = await sb.from('promotions').insert(Object.assign({ shop_id: shopId }, rec));
            if (error) throw error;
          }
          closeModal();
          app.showToast('Đã lưu chương trình', 'accent');
          await loadPromos();
          renderPromoTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Lưu'; }
      },
      text: 'Lưu'
    });
    openModal(p ? 'Sửa chương trình' : 'Thêm chương trình', body, [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), okBtn], opener);
  }

  /* ===== TAB: Đánh giá (gói tối thiểu: proplus) ===== */
  const WANT_LABELS = { exchange: 'Đổi món', refund: 'Hoàn tiền', notify: 'Chỉ báo để tiệm biết' };
  const FIX_OPTIONS = ['Đổi món', 'Hoàn tiền', 'Giảm giá đơn sau', 'Xin lỗi, ghi nhận', 'Không xác nhận được lỗi'];

  async function loadFeedbacks() {
    const { data, error } = await sb.from('feedback').select('*, orders(code,customer_name,customer_phone)').eq('shop_id', shopId).order('created_at', { ascending: false }).range(0, 99);
    if (error) throw error;
    ST.feedbacks = data || [];
  }

  function renderFeedbackTab() {
    const all = ST.feedbacks;
    const avg = all.length ? (all.reduce((s, f) => s + f.rating, 0) / all.length).toFixed(1).replace('.', ',') : '—';
    const dist = [5, 4, 3, 2, 1].map(s => ({ s, n: all.filter(f => f.rating === s).length }));
    const shown = all.filter(f => ST.fbFilter === 'open' ? !f.handled : !!f.handled);

    const summaryCard = el('div', { className: 'card' },
      el('div', { className: 'row-between' },
        el('div', null,
          el('b', { className: 'num', style: 'font-size:26px;color:var(--accent)', text: avg + ' ★' }),
          el('div', { style: 'font-size:13.5px;color:var(--text-sub)', text: all.length + ' đánh giá' })
        ),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
          dist.map(d => el('span', { className: 'badge badge-muted num', text: d.s + '★: ' + d.n }))
        )
      )
    );

    const seg = el('div', { className: 'bh-seg' },
      el('button', { type: 'button', 'aria-pressed': String(ST.fbFilter === 'open'), onClick: () => { ST.fbFilter = 'open'; renderFeedbackTab(); }, text: 'Chưa xử lý (' + all.filter(f => !f.handled).length + ')' }),
      el('button', { type: 'button', 'aria-pressed': String(ST.fbFilter === 'done'), onClick: () => { ST.fbFilter = 'done'; renderFeedbackTab(); }, text: 'Đã xử lý (' + all.filter(f => f.handled).length + ')' })
    );

    contentHost.replaceChildren(
      renderMetaBar('feedback', async () => { await loadFeedbacks(); markLoaded('feedback'); renderFeedbackTab(); }),
      summaryCard,
      seg,
      shown.length ? shown.map(fb => {
        let selFix = fb.fix || FIX_OPTIONS[0];
        const ord = fb.orders || {};
        return el('div', { className: 'card' },
          el('div', { className: 'row-between' },
            el('b', { style: 'color:#D99A00;font-size:18px', text: '★'.repeat(fb.rating) + '☆'.repeat(5 - fb.rating) }),
            el('small', { style: 'color:var(--text-sub)', text: app.formatVnDateTime(fb.created_at) })
          ),
          el('div', { style: 'font-size:14px;margin-top:4px', text: (ord.code ? 'Đơn ' + ord.code + ' · ' : '') + (ord.customer_name || 'Khách') + (ord.customer_phone ? ' · ' + ord.customer_phone : '') }),
          fb.comment ? el('div', { style: 'margin-top:6px;font-style:italic', text: '“' + fb.comment + '”' }) : null,
          fb.want ? el('div', { style: 'font-size:13.5px;color:var(--text-sub);margin-top:4px', text: 'Khách mong muốn: ' + (WANT_LABELS[fb.want] || fb.want) }) : null,
          el('div', { style: 'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap' },
            el('select', { className: 'select', style: 'flex:1 1 180px', onChange: e => { selFix = e.target.value; } },
              FIX_OPTIONS.map(opt => el('option', { value: opt, selected: selFix === opt, text: opt }))
            ),
            el('button', {
              type: 'button', className: 'btn btn-primary',
              onClick: async () => {
                try {
                  const res = await sb.from('feedback').update({ fix: selFix, handled: true }).eq('id', fb.id).eq('shop_id', shopId).select('id');
                  checkMutated(res);
                  app.showToast('Đã cập nhật xử lý đánh giá', 'accent');
                  await loadFeedbacks();
                  renderFeedbackTab();
                } catch (err) { showErr(err); }
              },
              text: fb.handled ? 'Cập nhật xử lý' : 'Đã xử lý'
            })
          )
        );
      }) : el('div', { className: 'card empty-state', text: 'Không có đánh giá nào trong mục này.' })
    );
  }

  /* ===== KHỞI CHẠY BAN ĐẦU ===== */
  try {
    await Promise.all([loadShopFull(), loadPayMethods(), loadOnlineOrders(false)]);
    await loadTabData('sale');
    renderCurrentTab();
  } catch (err) {
    showErr(err);
  }
})();
</script>
</body>
</html>
