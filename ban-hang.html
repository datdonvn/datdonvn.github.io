<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon-banhang-180.png">
<link rel="apple-touch-icon" href="icon-banhang-180.png">
<title>Bán hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body { overflow-x: hidden; font-family: "Be Vietnam Pro", var(--font, system-ui, sans-serif); }
.num { font-variant-numeric: tabular-nums; }

/* Bố cục chung của trang Bán hàng */
.bh-wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 12px 14px calc(150px + env(safe-area-inset-bottom));
}
@media (min-width: 900px) {
  .bh-wrap { padding-bottom: 110px; }
}

/* Thanh thẻ chức năng: điện thoại ở đáy, màn rộng ≥ 900px ở đầu trang */
.bh-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 12;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.bh-nav-in {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
}
.bh-nav button {
  flex: 1;
  min-height: 56px;
  padding: 6px 4px;
  border: 0;
  background: transparent;
  color: var(--text-sub);
  font-family: inherit; font-size: 12.5px; font-weight: 600; line-height: 1.2; white-space: nowrap;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  position: relative;
  cursor: pointer;
}
.bh-nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.bh-nav .bh-badge {
  position: absolute;
  top: 4px;
  right: calc(50% - 22px);
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--error);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
}
@media (min-width: 900px) {
  .bh-nav {
    position: sticky;
    top: 0;
    bottom: auto;
    border-top: 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .bh-nav-in {
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px 14px;
  }
  .bh-nav button {
    flex: 0 0 auto;
    min-height: 44px;
    flex-direction: row;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
  }
  .bh-nav button[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .bh-nav .bh-badge { position: static; margin-left: 2px; }
}

/* Thanh phụ làm mới & thời điểm tải */
.bh-meta-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--text-sub);
  flex-wrap: wrap;
}
.bh-seg {
  display: inline-flex;
  background: var(--accent-soft);
  padding: 3px;
  border-radius: 12px;
  gap: 3px;
  margin-bottom: 12px;
  max-width: 100%;
  overflow-x: auto;
}
.bh-seg button {
  min-height: 40px;
  padding: 6px 14px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text-sub);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
.bh-seg button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--accent);
}

/* Lưới nút chọn nhanh (chips) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}

/* Lưới sản phẩm bán hàng */
.pos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.pos-tile {
  min-height: 74px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 4px;
  position: relative;
}
.pos-tile.in-cart { border-color: var(--accent); background: var(--accent-soft); }
.pos-tile b { font-size: 14.5px; line-height: 1.25; word-break: break-word; }
.pos-tile span { font-size: 13.5px; color: var(--accent); font-weight: 700; }
.pos-tile .qty-pill {
  position: absolute;
  top: 6px;
  right: 6px;
  min-width: 24px;
  height: 24px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 12px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

/* Dòng đơn hàng / phiếu mua */
.line-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.line-row:first-child { border-top: 0; }
.line-main { flex: 1 1 140px; min-width: 0; }
.line-main b { display: block; font-size: 15px; }
.line-main small { color: var(--text-sub); font-size: 13px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}
.stepper output { min-width: 28px; text-align: center; font-weight: 700; }

/* Thanh tổng cố định đáy */
.sticky-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(58px + env(safe-area-inset-bottom));
  z-index: 10;
  padding: 0 12px 8px;
  pointer-events: none;
}
@media (min-width: 900px) {
  .sticky-bar { bottom: 12px; }
}
.sticky-bar-in {
  max-width: 932px;
  margin: 0 auto;
  background: var(--accent);
  color: var(--accent-text);
  border-radius: 16px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
  pointer-events: auto;
}
.sticky-bar-in .sum { flex: 1; min-width: 0; line-height: 1.25; }
.sticky-bar-in .sum small { display: block; font-size: 13px; opacity: 0.88; }
.sticky-bar-in .sum b { font-size: 20px; color: var(--yellow); }
.sticky-bar-in .btn-save {
  min-height: 46px;
  padding: 0 22px;
  border-radius: 999px;
  border: 0;
  background: var(--yellow);
  color: #14231B;
  font-weight: 700;
  font-size: 15.5px;
  cursor: pointer;
  white-space: nowrap;
}
.sticky-bar-in .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

/* Thẻ & Bảng */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--accent-soft);
  color: var(--accent);
}
.badge-warn { background: var(--warn-bg); color: var(--warn-text); }
.badge-err { background: var(--error-bg); color: var(--error); }
.badge-muted { background: var(--surface-alt); color: var(--text-sub); }

.ocard { border-left: 4px solid var(--border); }
.ocard.st-new { border-left-color: var(--error); }
.ocard.st-preparing { border-left-color: var(--yellow); }
.ocard.st-delivering { border-left-color: var(--accent); }
.ocard.st-done { border-left-color: var(--accent); }

.kpi-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
}
.kpi-box small { display: block; color: var(--text-sub); font-size: 13px; }
.kpi-box b { display: block; font-size: 19px; margin-top: 2px; }

.table-scroll { overflow-x: auto; }
table.bh-tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.bh-tbl th, table.bh-tbl td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}
table.bh-tbl th { font-size: 13px; color: var(--text-sub); font-weight: 600; }
table.bh-tbl .r { text-align: right; white-space: nowrap; }

.input, .select, .textarea { min-height: 44px; font-size: 16px; }
/* iPhone: ô giờ/ngày có độ rộng riêng nên bị tràn khung, ép về đúng khung */
input[type=time].input, input[type=date].input { display: block; width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; -webkit-appearance: none; appearance: none; text-align: left; }
input[type=time].input::-webkit-date-and-time-value, input[type=date].input::-webkit-date-and-time-value { text-align: left; }
.btn { min-height: 44px; }
.btn-sm { min-height: 44px; padding: 8px 12px; }

/* Hộp thoại */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.52);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-sheet {
  width: 100%;
  max-width: 620px;
  max-height: 90dvh;
  background: var(--bg);
  border-radius: 18px 18px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 16px; }
  .modal-sheet { border-radius: 18px; }
}
.modal-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.modal-hd h2 { margin: 0; font-size: 17px; }
.modal-close {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 0;
  background: var(--surface-alt);
  color: var(--text);
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
}
.modal-body { padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; flex: 1; }
.modal-ft { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.empty-state { text-align: center; padding: 28px 14px; color: var(--text-sub); }
.empty-state b { display: block; color: var(--text); margin-bottom: 4px; }
.low-row { background: var(--warn-bg); }
.img-preview { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); margin-top: 6px; }
</style>
</head>
<body>
<div id="dd-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="thuonghieu.js"></script>
<script src="chung.js"></script>
<script>
'use strict';

(async function () {
  const app = await DatdonApp.start({ page: 'ban-hang' });
  const sb = app.sb;
  const shopId = app.shop.id;
  const el = app.el;

  /* ===== HỖ TRỢ CHUNG, HỘP THOẠI & ÂM THANH ===== */
  const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
  const toLocalDtValue = iso => {
    const d = iso ? new Date(iso) : new Date();
    const vn = new Date(d.getTime() + 7 * 3600000);
    return vn.getUTCFullYear() + '-' + app.pad2(vn.getUTCMonth() + 1) + '-' + app.pad2(vn.getUTCDate()) +
      'T' + app.pad2(vn.getUTCHours()) + ':' + app.pad2(vn.getUTCMinutes());
  };
  const localDtToIso = val => val ? (val.length === 16 ? val + ':00+07:00' : val + '+07:00') : null;
  const checkMutated = ({ data, error }) => {
    if (error) throw error;
    if (!data || !data.length) throw new Error('Không có quyền hoặc dữ liệu đã thay đổi, hãy làm mới trang');
    return data;
  };
  const showErr = err => app.showToast(app.translateServerError(err), 'error');

  // Âm thanh báo đơn mới bằng Web Audio (chỉ phát sau lần chạm đầu tiên)
  let audioUnlocked = false;
  let audioCtx = null;
  document.addEventListener('pointerdown', () => {
    audioUnlocked = true;
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
  }, { once: true });
  function playTing() {
    if (!ST.soundOn || !audioUnlocked || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.14);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.36);
    } catch (e) {}
  }

  // Hộp thoại chuẩn aria-modal, đóng bằng Esc, trả focus
  const modalRoot = el('div');
  document.body.append(modalRoot);
  let lastOpener = null;
  function closeModal() {
    modalRoot.replaceChildren();
    if (lastOpener && typeof lastOpener.focus === 'function') lastOpener.focus();
    lastOpener = null;
  }
  function openModal(title, body, footer, opener) {
    lastOpener = opener || document.activeElement;
    const sheet = el('div', { className: 'modal-sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      el('div', { className: 'modal-hd' },
        el('h2', { text: title }),
        el('button', { type: 'button', className: 'modal-close', 'aria-label': 'Đóng', onClick: closeModal, text: '×' })
      ),
      el('div', { className: 'modal-body' }, body),
      footer ? el('div', { className: 'modal-ft' }, footer) : null
    );
    const backdrop = el('div', { className: 'modal-backdrop', onClick: e => { if (e.target === backdrop) closeModal(); } }, sheet);
    modalRoot.replaceChildren(backdrop);
    const first = sheet.querySelector('button, input, select, textarea');
    if (first) first.focus();
  }
  function confirmModal(title, msg, okLabel, onOk, opener) {
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-danger',
      onClick: async () => {
        okBtn.disabled = true; okBtn.textContent = 'Đang xử lý…';
        try { await onOk(); closeModal(); } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = okLabel; }
      },
      text: okLabel
    });
    openModal(title, el('p', { style: 'margin:0', text: msg }), [
      el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy bỏ' }),
      okBtn
    ], opener);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalRoot.children.length) closeModal(); });

  /* ===== DANH SÁCH TAB THEO GÓI ===== */
  const ALL_TABS = [
    { id: 'sale', label: 'Bán', minPlan: 'standard' },
    { id: 'online', label: 'Đơn online', minPlan: 'standard' },
    { id: 'menu', label: 'Menu', minPlan: 'standard' },
    { id: 'settings', label: 'Cài đặt', minPlan: 'standard' },
    { id: 'buy', label: 'Mua', minPlan: 'pro' },
    { id: 'inv', label: 'Kho', minPlan: 'pro' },
    { id: 'recipe', label: 'Định mức', minPlan: 'pro' },
    { id: 'cash', label: 'Thu chi', minPlan: 'pro' },
    { id: 'batch', label: 'Làm', minPlan: 'pro' },
    { id: 'cust', label: 'Khách', minPlan: 'proplus' },
    { id: 'promo', label: 'Khuyến mãi', minPlan: 'proplus' },
    { id: 'feedback', label: 'Đánh giá', minPlan: 'proplus' }
  ];
  const TABS = ALL_TABS.filter(t => app.hasPlan(t.minPlan));

  /* ===== TRẠNG THÁI CHUNG ===== */
  const DRAFT_KEY = 'dd_pos_draft_' + shopId;
  const savedDraft = app.storageGet(DRAFT_KEY, null);
  const ST = {
    tab: 'sale',
    loadedAt: {},
    shop: Object.assign({}, app.shop),
    payMethods: [],
    menuItems: [],
    invItems: [],
    customers: [],
    promos: [],
    soundOn: app.storageGet('dd_sound_on', true),
    // Bán (Standard)
    saleSub: 'pos', // 'pos' | 'eod'
    saleSearch: '',
    salePlaces: app.storageGet('dd_sale_places_' + shopId, ['Tại quầy', 'Zalo', 'Giao hàng']),
    sale: savedDraft || {
      editId: null, editCode: '', items: [],
      place: app.storageGet('dd_last_place_' + shopId, 'Tại quầy'),
      customer_name: '', customer_phone: '', customer_id: null, note: '',
      at: '', discount: 0,
      pay_method_id: app.storageGet('dd_last_pay_' + shopId, null),
      unpaid: false, paidCustom: null
    },
    manualOrders: [],
    eodDate: app.toVnYmd(new Date()),
    eodData: null,
    eodUnpaid: [],
    // Đơn online (Standard)
    onlineFilter: 'new',
    onlineOrders: [],
    onlineOffset: 0,
    onlineHasMore: false,
    // Mua (Pro)
    buySub: 'form', // 'form' | 'debt'
    buyEditId: null,
    buyForm: {
      at: '', place: '', pay_method_id: null, on_credit: false, due_date: '', note: '',
      lines: [{ grp: 'nl', name: '', unit: 'kg', qty: '', cost: '', inv_item_id: null }]
    },
    purchases: [],
    debts: [],
    // Kho (Pro)
    invSummary: null,
    invSearch: '',
    invKind: 'all',
    invLowOnly: false,
    // Định mức (Pro)
    recipeMenuId: '',
    recipes: [],
    allRecipeMenuIds: new Set(),
    // Sản xuất (Pro)
    batchEditId: null,
    batchForm: { at: '', out_item_id: '', out_qty: '', note: '', inputs: [{ inv_item_id: '', qty: '' }] },
    batches: [],
    // Thu chi (Pro)
    cashFrom: app.toVnYmd(new Date()).slice(0, 8) + '01',
    cashTo: app.toVnYmd(new Date()),
    cashEntries: [],
    // Khách (Pro plus)
    custSearch: '',
    custGrp: '',
    custMemberOnly: false,
    custStats: new Map(),
    // Khuyến mãi (Pro plus)
    promoKind: 'promo',
    // Đánh giá (Pro plus)
    fbFilter: 'open',
    feedbacks: []
  };

  /* ===== NẠP DỮ LIỆU NỀN & KHỞI TẠO KHUNG ===== */
  async function loadPayMethods() {
    const { data, error } = await sb.from('payment_methods').select('*').eq('shop_id', shopId).order('sort', { ascending: true });
    if (error) throw error;
    ST.payMethods = data || [];
    const actives = ST.payMethods.filter(p => p.active);
    if (!ST.sale.pay_method_id && actives.length) ST.sale.pay_method_id = actives[0].id;
    if (!ST.buyForm.pay_method_id && actives.length) ST.buyForm.pay_method_id = actives[0].id;
  }
  async function loadShopFull() {
    const { data, error } = await sb.from('shops').select('*').eq('id', shopId).single();
    if (!error && data) ST.shop = data;
  }
  async function loadMenu() {
    const { data, error } = await sb.from('menu_items').select('*').eq('shop_id', shopId).order('sort', { ascending: true }).order('name', { ascending: true });
    if (error) throw error;
    ST.menuItems = data || [];
    ST.loadedAt.menu = new Date();
  }
  async function loadInvItems() {
    if (!app.hasPlan('pro')) return;
    const { data, error } = await sb.from('inv_items').select('*').eq('shop_id', shopId).order('name', { ascending: true });
    if (error) throw error;
    ST.invItems = data || [];
  }
  async function loadCustomersBase() {
    if (!app.hasPlan('proplus')) return;
    const { data, error } = await sb.from('customers').select('*').eq('shop_id', shopId).order('created_at', { ascending: false });
    if (error) throw error;
    ST.customers = data || [];
  }

  const root = document.getElementById('dd-root');
  const navHost = el('div');
  const contentHost = el('div', { className: 'bh-wrap' });
  const stickyHost = el('div');
  const wrapOuter = el('div', { className: 'dd-wrap' }, navHost, contentHost, stickyHost);
  root.replaceChildren(wrapOuter);

  function markLoaded(tab) { ST.loadedAt[tab] = new Date(); }
  function renderMetaBar(tab, onRefresh, extraRight) {
    const t = ST.loadedAt[tab];
    const txt = t ? 'Cập nhật lúc ' + app.pad2(t.getHours()) + ':' + app.pad2(t.getMinutes()) : 'Chưa tải';
    return el('div', { className: 'bh-meta-bar' },
      el('span', { text: txt }),
      el('div', { style: 'display:flex;gap:8px;align-items:center' },
        extraRight || null,
        el('button', { type: 'button', className: 'btn btn-sm', onClick: onRefresh, text: 'Làm mới' })
      )
    );
  }

  function renderNav() {
    const newOnlineCount = ST.onlineOrders.filter(o => o.status === 'new').length;
    document.title = newOnlineCount > 0 ? '(' + newOnlineCount + ') Đơn mới – ' + ST.shop.name : 'Bán hàng – ' + ST.shop.name;

    const isWide = window.innerWidth >= 900;
    const visible = (!isWide && TABS.length > 5) ? TABS.slice(0, 4) : TABS;
    const overflow = (!isWide && TABS.length > 5) ? TABS.slice(4) : [];

    const makeBtn = t => el('button', {
      type: 'button',
      'aria-current': ST.tab === t.id ? 'page' : null,
      onClick: () => switchTab(t.id)
    },
      el('span', { text: t.label }),
      t.id === 'online' && newOnlineCount > 0 ? el('span', { className: 'bh-badge num', text: String(newOnlineCount) }) : null
    );

    const navBtns = visible.map(makeBtn);
    if (overflow.length) {
      const inOverflow = overflow.some(t => t.id === ST.tab);
      navBtns.push(el('button', {
        type: 'button',
        'aria-current': inOverflow ? 'page' : null,
        onClick: e => openModal('Chức năng khác',
          el('div', { style: 'display:grid;gap:8px' },
            overflow.map(t => el('button', {
              type: 'button',
              className: 'btn' + (ST.tab === t.id ? ' btn-primary' : ''),
              style: 'width:100%;justify-content:flex-start',
              onClick: () => { closeModal(); switchTab(t.id); },
              text: t.label
            }))
          ), null, e.currentTarget),
        text: 'Thêm'
      }));
    }
    navHost.replaceChildren(el('nav', { className: 'bh-nav', 'aria-label': 'Chức năng bán hàng' },
      el('div', { className: 'bh-nav-in' }, navBtns)
    ));
  }
  window.addEventListener('resize', () => renderNav());

  async function switchTab(id) {
    ST.tab = id;
    stickyHost.replaceChildren();
    renderNav();
    await loadTabData(id);
    renderCurrentTab();
    window.scrollTo({ top: 0 });
  }

  async function loadTabData(id) {
    try {
      if (id === 'sale') {
        await Promise.all([loadMenu(), loadManualOrders(), app.hasPlan('proplus') ? loadCustomersBase() : Promise.resolve()]);
        if (ST.saleSub === 'eod') await loadEod();
        markLoaded('sale');
      } else if (id === 'online') {
        await loadOnlineOrders(false);
        markLoaded('online');
      } else if (id === 'menu') {
        await loadMenu();
        markLoaded('menu');
      } else if (id === 'settings') {
        await Promise.all([loadShopFull(), loadPayMethods()]);
        markLoaded('settings');
      } else if (id === 'buy' && app.hasPlan('pro')) {
        await Promise.all([loadInvItems(), loadPurchases(), loadDebts()]);
        markLoaded('buy');
      } else if (id === 'inv' && app.hasPlan('pro')) {
        await loadInventoryReport();
        markLoaded('inv');
      } else if (id === 'recipe' && app.hasPlan('pro')) {
        await Promise.all([loadMenu(), loadInvItems(), loadAllRecipeFlags()]);
        if (!ST.recipeMenuId && ST.menuItems.length) ST.recipeMenuId = ST.menuItems[0].id;
        if (ST.recipeMenuId) await loadRecipesForMenu(ST.recipeMenuId);
        markLoaded('recipe');
      } else if (id === 'batch' && app.hasPlan('pro')) {
        await Promise.all([loadInvItems(), loadBatches()]);
        markLoaded('batch');
      } else if (id === 'cash' && app.hasPlan('pro')) {
        await loadCashEntries();
        markLoaded('cash');
      } else if (id === 'cust' && app.hasPlan('proplus')) {
        await Promise.all([loadCustomersWithStats(), loadPromos()]);
        markLoaded('cust');
      } else if (id === 'promo' && app.hasPlan('proplus')) {
        await Promise.all([loadPromos(), loadMenu()]);
        markLoaded('promo');
      } else if (id === 'feedback' && app.hasPlan('proplus')) {
        await loadFeedbacks();
        markLoaded('feedback');
      }
    } catch (err) { showErr(err); }
  }

  function renderCurrentTab() {
    stickyHost.replaceChildren();
    const map = {
      sale: renderSaleTab,
      online: renderOnlineTab,
      menu: renderMenuTab,
      settings: renderSettingsTab,
      buy: renderBuyTab,
      inv: renderInvTab,
      recipe: renderRecipeTab,
      batch: renderBatchTab,
      cash: renderCashTab,
      cust: renderCustTab,
      promo: renderPromoTab,
      feedback: renderFeedbackTab
    };
    const fn = map[ST.tab];
    if (fn) fn();
    renderNav();
  }

  function activePayMethods() { return ST.payMethods.filter(p => p.active); }
  function payMethodName(id) {
    const m = ST.payMethods.find(p => p.id === id);
    return m ? m.name : 'Chưa chọn';
  }

  /* ===== TAB: Bán (gói tối thiểu: standard) ===== */
  function saveDraft() {
    if (!ST.sale.editId) app.storageSet(DRAFT_KEY, ST.sale);
  }
  async function loadManualOrders() {
    const { data, error } = await sb.from('orders')
      .select('*, order_items(id,item_id,name,unit,price,qty)')
      .eq('shop_id', shopId)
      .eq('source', 'manual')
      .order('ordered_at', { ascending: false })
      .range(0, 39);
    if (error) throw error;
    ST.manualOrders = data || [];
  }
  async function loadEod() {
    const { data, error } = await sb.rpc('report_sales_by_method', { p_shop: shopId, p_from: ST.eodDate, p_to: ST.eodDate });
    if (error) throw error;
    ST.eodData = data;
    const { data: unpaidList } = await sb.from('orders')
      .select('id,code,customer_name,customer_phone,total,paid,pay_status,pay_method_id,ordered_at,source')
      .eq('shop_id', shopId)
      .neq('status', 'cancelled')
      .neq('pay_status', 'paid')
      .gte('ordered_at', ST.eodDate + 'T00:00:00+07:00')
      .lte('ordered_at', ST.eodDate + 'T23:59:59+07:00')
      .order('ordered_at', { ascending: false });
    ST.eodUnpaid = unpaidList || [];
  }

  function saleTotals() {
    const subtotal = ST.sale.items.reduce((s, it) => s + it.price * it.qty, 0);
    const disc = Math.max(0, Math.min(subtotal, Number(ST.sale.discount) || 0));
    const total = Math.max(0, subtotal - disc);
    const count = ST.sale.items.reduce((s, it) => s + it.qty, 0);
    return { subtotal, disc, total, count };
  }

  function addSaleItem(mi) {
    const ex = ST.sale.items.find(x => x.item_id === mi.id);
    if (ex) ex.qty = Math.min(999, ex.qty + 1);
    else ST.sale.items.push({ item_id: mi.id, name: mi.name, unit: mi.unit || 'phần', price: mi.price, qty: 1 });
    ST.sale.paidCustom = null;
    saveDraft();
    renderSaleTab();
  }

  function renderSaleTab() {
    const subSeg = el('div', { className: 'bh-seg', role: 'group', 'aria-label': 'Chế độ bán hàng' },

      el('button', { type: 'button', 'aria-pressed': String(ST.saleSub === 'eod'), onClick: async () => { ST.saleSub = 'eod'; await loadEod(); renderSaleTab(); }, text: 'Cuối ngày' })
    );

    const s = ST.sale;

    const q = fold(ST.saleSearch.trim());

    const cats = new Map();

          el('small', { className: 'num', text: app.formatMoney(it.price) + ' × ' + it.qty + ' = ' + app.formatMoney(it.price * it.qty) })
        ),
        el('div', { className: 'stepper' },

    );

    const paidVal = s.unpaid ? 0 : (s.paidCustom != null ? s.paidCustom : tot.total);

    const infoCard = el('div', { className: 'card' },
      el('div', { style: 'font-weight:700;margin-bottom:8px', text: 'Thông tin đơn & thanh toán' }),

      el('div', { className: 'grid-2' },

          el('input', {
            id: 'sl-place', className: 'input', list: placeListId, value: s.place || '',

          el('datalist', { id: placeListId }, ST.salePlaces.map(p => el('option', { value: p })))
        ),
        el('div', { className: 'field' },
          el('label', { for: 'sl-at', text: 'Giờ bán (để trống = bây giờ)' }),
          el('input', {
            id: 'sl-at', className: 'input', type: 'datetime-local', value: s.at || '',
            onChange: e => { s.at = e.target.value; saveDraft(); }
          })
        )
      ),
      el('div', { className: 'grid-2' },
        el('div', { className: 'field' },
          el('label', { for: 'sl-cname', text: 'Tên khách (không bắt buộc)' }),
          el('input', {
            id: 'sl-cname', className: 'input', value: s.customer_name || '', placeholder: 'Khách lẻ',
            onInput: e => { s.customer_name = e.target.value; saveDraft(); }

        ),

          el('label', { for: 'sl-cphone', text: 'Số điện thoại (không bắt buộc)' }),

      ),

          el('label', { for: 'sl-disc', text: 'Giảm giá tay (đ)' }),
          el('input', {
            id: 'sl-disc', className: 'input num', type: 'number', min: 0, value: s.discount || 0,
            onInput: e => { s.discount = Math.max(0, Math.round(Number(e.target.value) || 0)); s.paidCustom = null; saveDraft(); updateSaleSticky(); }
          })
        ),
        el('div', { className: 'field' },
          el('label', { for: 'sl-paid', text: 'Số tiền thu (đ)' }),
          el('input', {
            id: 'sl-paid', className: 'input num', type: 'number', min: 0, disabled: s.unpaid, value: paidVal,
            onInput: e => { s.paidCustom = Math.max(0, Math.round(Number(e.target.value) || 0)); saveDraft(); }

            onClick: () => { s.unpaid = false; s.pay_method_id = m.id; app.storageSet('dd_last_pay_' + shopId, m.id); saveDraft(); renderSaleTab(); },

          })

      )
    );

    // Danh sách 40 đơn tay gần đây nhóm theo ngày
    const grouped = new Map();
    for (const o of ST.manualOrders) {

      if (!grouped.has(day)) grouped.set(day, []);
      grouped.get(day).push(o);

    const recentCard = el('div', { className: 'card' },

            if (error) throw error;

    contentHost.replaceChildren(

      menuBox,

      recentCard

    updateSaleSticky();

  function renderSaleCustomerPicker() {
    const s = ST.sale;
    const picked = s.customer_id ? ST.customers.find(c => c.id === s.customer_id) : null;
    if (picked) {
      return el('div', { className: 'alert alert-success row-between', style: 'margin-bottom:10px' },
        el('span', { text: 'Khách: ' + picked.name + (picked.apt ? ' (' + picked.apt + ')' : '') + (picked.phone ? ' · ' + picked.phone : '') }),
        el('button', { type: 'button', className: 'btn btn-sm', onClick: () => { s.customer_id = null; saveDraft(); renderSaleTab(); }, text: 'Bỏ chọn' })
      );
    }
    const resBox = el('div');
    const inp = el('input', {
      className: 'input', type: 'search', placeholder: 'Tìm khách theo tên, SĐT, căn hộ…',
      onInput: e => {
        const q = fold(e.target.value.trim());
        if (!q) { resBox.replaceChildren(); return; }
        const hits = ST.customers.filter(c => fold(c.name).includes(q) || fold(c.phone).includes(q) || fold(c.apt).includes(q)).slice(0, 6);
        resBox.replaceChildren(el('div', { style: 'margin-top:6px;display:grid;gap:4px' },
          hits.length ? hits.map(c => el('button', {
            type: 'button', className: 'btn btn-sm', style: 'justify-content:space-between;width:100%',
            onClick: () => {
              s.customer_id = c.id; s.customer_name = c.name; s.customer_phone = c.phone || '';
              saveDraft(); renderSaleTab();
            }
          }, el('span', { text: c.name + (c.apt ? ' · ' + c.apt : '') }), el('small', { text: c.phone || '' })))
          : el('small', { style: 'color:var(--text-sub)', text: 'Không thấy khách khớp.' })
        ));
      }
    });

      el('div', { className: 'row-between', style: 'margin-bottom:4px' },
        el('label', { style: 'margin:0', text: 'Chọn khách hàng' }),
        el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openCustomerModal(null, c => {
          s.customer_id = c.id; s.customer_name = c.name; s.customer_phone = c.phone || '';
          saveDraft(); renderSaleTab();
        }, e.currentTarget), text: '+ Khách mới' })
      ),

  function updateSaleSticky() {
    if (ST.tab !== 'sale' || ST.saleSub !== 'pos') { stickyHost.replaceChildren(); return; }
    const tot = saleTotals();
    const saveBtn = el('button', {
      type: 'button', className: 'btn-save', disabled: !tot.count,
      onClick: () => submitSaleOrder(saveBtn),
      text: ST.sale.editId ? 'Cập nhật đơn' : 'Lưu đơn'
    });
    stickyHost.replaceChildren(el('div', { className: 'sticky-bar' },
      el('div', { className: 'sticky-bar-in' },
        el('div', { className: 'sum' },
          el('small', { text: tot.count + ' món' + (tot.disc ? ' · giảm ' + app.formatMoney(tot.disc) : '') }),
          el('b', { className: 'num', text: app.formatMoney(tot.total) })
        ),
        saveBtn
      )
    ));
  }

  function resetSaleForm() {
    const keepPlace = ST.sale.place || 'Tại quầy';
    const keepPay = ST.sale.pay_method_id;
    ST.sale = {
      editId: null, editCode: '', items: [],
      place: keepPlace, customer_name: '', customer_phone: '', customer_id: null, note: '',
      at: '', discount: 0, pay_method_id: keepPay, unpaid: false, paidCustom: null
    };
    app.storageSet(DRAFT_KEY, null);
  }

  function startEditManualOrder(o) {
    ST.sale = {
      editId: o.id,
      editCode: o.code,
      items: (o.order_items || []).map(it => ({ item_id: it.item_id, name: it.name, unit: it.unit || 'phần', price: it.price, qty: it.qty })),
      place: o.place || 'Tại quầy',
      customer_name: o.customer_name || '',
      customer_phone: o.customer_phone || '',
      customer_id: o.customer_id || null,
      note: o.note || '',
      at: toLocalDtValue(o.ordered_at),
      discount: o.discount || 0,
      pay_method_id: o.pay_method_id,
      unpaid: o.pay_status === 'unpaid',
      paidCustom: o.paid
    };
    renderSaleTab();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function submitSaleOrder(btn) {
    const s = ST.sale;
    const tot = saleTotals();
    if (!s.items.length) return;
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      const place = (s.place || '').trim() || 'Tại quầy';
      if (!ST.salePlaces.includes(place)) {
        ST.salePlaces = [place].concat(ST.salePlaces).slice(0, 10);
        app.storageSet('dd_sale_places_' + shopId, ST.salePlaces);
      }
      app.storageSet('dd_last_place_' + shopId, place);
      const paidAmt = s.unpaid ? 0 : (s.paidCustom != null ? s.paidCustom : tot.total);
      const { data, error } = await sb.rpc('save_order', {
        p_shop: shopId,
        p_order: s.editId || null,
        p_at: localDtToIso(s.at),
        p_customer_name: (s.customer_name || '').trim(),
        p_customer_phone: (s.customer_phone || '').trim(),
        p_address: '',
        p_note: (s.note || '').trim(),
        p_customer_id: app.hasPlan('proplus') ? (s.customer_id || null) : null,
        p_place: place,
        p_items: s.items.map(it => ({ item_id: it.item_id, qty: it.qty })),

  /* ===== TAB: Đơn online (gói tối thiểu: standard) ===== */
  const ONLINE_STATES = [
    { id: 'new', label: 'Mới' },
    { id: 'preparing', label: 'Đang làm' },
    { id: 'delivering', label: 'Đang giao' },
    { id: 'done', label: 'Xong' },
    { id: 'cancelled', label: 'Đã hủy' },
    { id: 'all', label: 'Tất cả' }
  ];
  const NEXT_ACTION = {
    new: { next: 'preparing', label: 'Nhận đơn' },
    preparing: { next: 'delivering', label: 'Giao hàng' },
    delivering: { next: 'done', label: 'Hoàn tất' }
  };

  async function loadOnlineOrders(append) {
    const from = append ? ST.onlineOffset : 0;
    const to = from + 49;
    const { data, error } = await sb.from('orders')
      .select('*, order_items(id,item_id,name,unit,price,qty)')
      .eq('shop_id', shopId)
      .eq('source', 'online')
      .order('created_at', { ascending: false })
      .range(from, to);
    if (error) throw error;
    const list = data || [];
    if (append) {
      const seen = new Set(ST.onlineOrders.map(o => o.id));
      ST.onlineOrders = ST.onlineOrders.concat(list.filter(o => !seen.has(o.id)));
    } else {
      ST.onlineOrders = list;
    }
    ST.onlineOffset = ST.onlineOrders.length;
    ST.onlineHasMore = list.length === 50;
  }

  function renderOnlineTab() {
    const counts = { all: ST.onlineOrders.length };
    for (const o of ST.onlineOrders) counts[o.status] = (counts[o.status] || 0) + 1;
    const shown = ST.onlineFilter === 'all' ? ST.onlineOrders : ST.onlineOrders.filter(o => o.status === ST.onlineFilter);

    const soundToggle = el('button', {
      type: 'button', className: 'btn btn-sm',
      onClick: () => { ST.soundOn = !ST.soundOn; app.storageSet('dd_sound_on', ST.soundOn); renderOnlineTab(); },
      text: ST.soundOn ? 'Âm báo: Bật' : 'Âm báo: Tắt'
    });

    const filterRow = el('div', { className: 'chips', style: 'margin-bottom:12px' },
      ONLINE_STATES.map(st => el('button', {
        type: 'button', className: 'chip', 'aria-pressed': String(ST.onlineFilter === st.id),
        onClick: () => { ST.onlineFilter = st.id; renderOnlineTab(); },
        text: st.label + (counts[st.id] ? ' (' + counts[st.id] + ')' : '')
      }))
    );

    const cards = shown.length ? shown.map(o => {
      const next = NEXT_ACTION[o.status];
      const payLabel = o.pay_status === 'paid' ? 'Đã thanh toán' : (o.pay_status === 'checking' ? 'Chờ xác nhận CK' : 'Chưa thanh toán');
      const payCls = o.pay_status === 'paid' ? '' : (o.pay_status === 'checking' ? 'badge-warn' : 'badge-err');
      return el('div', { className: 'card ocard st-' + o.status },
        el('div', { className: 'row-between' },
          el('b', { className: 'num', style: 'font-size:17px', text: o.code }),
          el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' },
            el('span', { className: 'badge ' + (o.status === 'new' ? 'badge-err' : o.status === 'cancelled' ? 'badge-muted' : ''), text: (ONLINE_STATES.find(x => x.id === o.status) || {}).label || o.status }),
            el('span', { className: 'badge ' + payCls, text: payLabel })
          )
        ),
        el('div', { style: 'font-size:13.5px;color:var(--text-sub);margin-top:4px', text: 'Đặt lúc ' + app.formatVnDateTime(o.ordered_at || o.created_at) + (o.deliver_at ? ' · Hẹn giao ' + app.formatVnDateTime(o.deliver_at) : '') }),
        el('div', { style: 'margin-top:6px;font-weight:600' },
          (o.customer_name || 'Khách') + ' · ',
          o.customer_phone ? el('a', { href: 'tel:' + o.customer_phone, style: 'color:var(--accent)', text: o.customer_phone }) : null
        ),
        (o.place || o.address) ? el('div', { style: 'font-size:14px;color:var(--text-sub)', text: [o.place, o.address].filter(Boolean).join(' – ') + (o.delivery_fee > 0 ? ' (phí giao ' + app.formatMoney(o.delivery_fee) + ')' : '') }) : null,
        o.note ? el('div', { style: 'font-size:14px;font-style:italic;margin-top:4px', text: 'Ghi chú: ' + o.note }) : null,
        el('div', { style: 'margin-top:8px;border-top:1px solid var(--border);padding-top:8px' },
          (o.order_items || []).map(it => el('div', { className: 'row-between', style: 'padding:2px 0;font-size:14.5px' },
            el('span', { text: it.qty + ' × ' + it.name }),
            el('span', { className: 'num', text: app.formatMoney(it.price * it.qty) })
          )),
          o.discount > 0 ? el('div', { className: 'row-between', style: 'font-size:14px;color:var(--accent)' },
            el('span', { text: 'Giảm giá' }), el('span', { className: 'num', text: '−' + app.formatMoney(o.discount) })
          ) : null,
          el('div', { className: 'row-between', style: 'font-weight:700;font-size:16px;margin-top:4px' },
            el('span', { text: 'Tổng (' + payMethodName(o.pay_method_id) + ')' }),
            el('span', { className: 'num', text: app.formatMoney(o.total) })
          )
        ),
        el('div', { className: 'toolbar', style: 'margin-top:10px;display:flex;gap:8px;flex-wrap:wrap' },
          next ? el('button', {
            type: 'button', className: 'btn btn-primary', style: 'flex:1',
            onClick: () => updateOnlineStatus(o, next.next),
            text: next.label
          }) : null,
          o.status !== 'done' && o.status !== 'cancelled' ? el('button', {
            type: 'button', className: 'btn btn-danger',
            onClick: e => confirmModal('Hủy đơn ' + o.code + '?', 'Đơn sẽ chuyển sang trạng thái Đã hủy.', 'Xác nhận hủy', () => updateOnlineStatus(o, 'cancelled'), e.currentTarget),
            text: 'Hủy đơn'
          }) : null,
          o.status !== 'cancelled' && o.pay_status !== 'paid' ? el('button', {
            type: 'button', className: 'btn',
            onClick: e => openConfirmPaymentModal(o, async () => { await loadOnlineOrders(false); renderOnlineTab(); }, e.currentTarget),
            text: 'Đã nhận tiền'
          }) : null,
          o.status !== 'cancelled' && o.pay_status === 'unpaid' ? el('button', {
            type: 'button', className: 'btn btn-sm',
            onClick: async () => {
              try {
                const { error } = await sb.rpc('set_order_payment', { p_order: o.id, p_pay_method: o.pay_method_id, p_pay_status: 'checking', p_paid: 0 });
                if (error) throw error;
                o.pay_status = 'checking';
                app.showToast('Đã đánh dấu chờ xác nhận CK', 'accent');
                renderOnlineTab();
              } catch (err) { showErr(err); }
            },
            text: 'Chờ xác nhận CK'
          }) : null
        )
      );
    }) : [el('div', { className: 'card empty-state', text: 'Không có đơn online nào trong mục này.' })];

    const moreBtn = ST.onlineHasMore ? el('button', {
      type: 'button', className: 'btn', style: 'width:100%',
      onClick: async () => { await loadOnlineOrders(true); renderOnlineTab(); },
      text: 'Xem thêm đơn cũ'
    }) : null;

    contentHost.replaceChildren(
      renderMetaBar('online', async () => { await loadOnlineOrders(false); markLoaded('online'); renderOnlineTab(); }, soundToggle),
      filterRow,
      ...cards,
      moreBtn
    );
  }

  async function updateOnlineStatus(order, newStatus) {
    const prev = order.status;
    order.status = newStatus; // Cập nhật lạc quan
    renderOnlineTab();
    try {
      const res = await sb.from('orders').update({ status: newStatus }).eq('id', order.id).eq('shop_id', shopId).select('id');
      checkMutated(res);
      app.showToast('Đã chuyển đơn ' + order.code + ' sang ' + ((ONLINE_STATES.find(x => x.id === newStatus) || {}).label || newStatus), 'accent');
      renderNav();
    } catch (err) {
      order.status = prev; // Hoàn tác khi lỗi
      showErr(err);
      renderOnlineTab();
    }
  }

  // Thời gian thực cho đơn online + dự phòng 30 giây
  const onlineChannel = sb.channel('orders-' + shopId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders', filter: 'shop_id=eq.' + shopId }, async payload => {
      if (payload.new && payload.new.source === 'online') {
        playTing();
        app.showToast('Có đơn online mới: ' + payload.new.code, 'accent');
        await loadOnlineOrders(false);
        renderNav();
        if (ST.tab === 'online') renderOnlineTab();
      }
    })
    .subscribe();
  const pollOnlineTimer = setInterval(async () => {
    if (document.visibilityState !== 'visible') return;
    try {
      const prevNew = ST.onlineOrders.filter(o => o.status === 'new').length;
      await loadOnlineOrders(false);
      const currNew = ST.onlineOrders.filter(o => o.status === 'new').length;
      if (currNew > prevNew) playTing();
      renderNav();
      if (ST.tab === 'online') renderOnlineTab();
    } catch (e) {}
  }, 30000);
  window.addEventListener('beforeunload', () => {
    clearInterval(pollOnlineTimer);
    try { sb.removeChannel(onlineChannel); } catch (e) {}
  });

        if (Number.isNaN(price) || price < 0) { app.showToast('Giá bán phải là số ≥ 0', 'error'); return; }
        if (f.image_url && !f.image_url.startsWith('https://')) { app.showToast('Link ảnh phải bắt đầu bằng https://', 'error'); return; }
        saveBtn.disabled = true; saveBtn.textContent = 'Đang lưu…';
        try {
          const rec = {
            name, price, unit: f.unit.trim() || 'phần',
            category: f.category.trim() || null,
            description: f.description.trim() || null,
            image_url: f.image_url || null,
            sort: Math.round(Number(f.sort) || 0),
            active: f.active
          };
          if (item) {
            const res = await sb.from('menu_items').update(rec).eq('id', item.id).eq('shop_id', shopId).select('id');
            checkMutated(res);
          } else {
            const { error } = await sb.from('menu_items').insert(Object.assign({ shop_id: shopId }, rec));
            if (error) throw error;
          }
          closeModal();
          app.showToast(item ? 'Đã cập nhật món' : 'Đã thêm món mới', 'accent');
          await loadMenu();
          renderMenuTab();
        } catch (err) { showErr(err); saveBtn.disabled = false; saveBtn.textContent = 'Lưu món'; }
      },
      text: 'Lưu món'
    });
    openModal(item ? 'Sửa món' : 'Thêm món mới', body, [
      el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }),
      saveBtn
    ], opener);
  }

  function openMenuCsvImportModal(opener) {
    let parsed = [];
    const prevBox = el('div', { style: 'margin-top:10px' });
    const impBtn = el('button', {
      type: 'button', className: 'btn btn-primary', disabled: true,
      onClick: async () => {
        const valid = parsed.filter(r => !r.err);
        if (!valid.length) return;
        impBtn.disabled = true; impBtn.textContent = 'Đang nhập…';
        try {
          const rows = valid.map((r, idx) => ({
            shop_id: shopId, name: r.name, price: r.price, unit: r.unit || 'phần',
            category: r.category || null, description: r.description || null, active: true, sort: (ST.menuItems.length + idx) * 10
          }));
          const { error } = await sb.from('menu_items').insert(rows);
          if (error) throw error;
          closeModal();
          app.showToast('Đã nhập ' + rows.length + ' món', 'accent');
          await loadMenu();
          renderMenuTab();
        } catch (err) { showErr(err); impBtn.disabled = false; impBtn.textContent = 'Nhập các dòng hợp lệ'; }
      },
      text: 'Nhập các dòng hợp lệ'
    });

    const parseText = txt => {
      const lines = txt.replace(/^\uFEFF/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      parsed = [];
      lines.forEach((line, idx) => {
        const cols = line.split(';').map(c => c.trim().replace(/^"|"$/g, ''));
        if (idx === 0 && /tên/i.test(cols[0]) && /giá/i.test(cols[1] || '')) return;
        const name = cols[0] || '';
        const price = Math.round(Number((cols[1] || '').replace(/[^\d-]/g, '')));
        const unit = cols[2] || 'phần';
        const category = cols[3] || '';
        const description = cols[4] || '';
        let err = '';
        if (!name) err = 'Thiếu tên món';
        else if (Number.isNaN(price) || price < 0) err = 'Giá không hợp lệ';
        parsed.push({ lineNo: idx + 1, name, price, unit, category, description, err });
      });
      const okCount = parsed.filter(r => !r.err).length;
      const errCount = parsed.length - okCount;
      impBtn.disabled = okCount === 0;
      prevBox.replaceChildren(
        el('div', { className: 'alert ' + (errCount ? 'alert-warn' : 'alert-success'), text: 'Hợp lệ: ' + okCount + ' dòng · Lỗi: ' + errCount + ' dòng' }),
        el('div', { className: 'table-scroll', style: 'max-height:220px;overflow-y:auto;margin-top:8px' },
          el('table', { className: 'bh-tbl' },
            el('tbody', null, parsed.map(r => el('tr', { className: r.err ? 'low-row' : '' },
              el('td', { text: 'Dòng ' + r.lineNo }),
              el('td', { text: r.name || '—' }),
              el('td', { className: 'r num', text: r.err ? r.err : app.formatMoney(r.price) })
            )))
          )
        )
      );
    };

    const fileInp = el('input', {
      type: 'file', accept: '.csv,text/csv', className: 'input',
      onChange: async e => {
        const f = e.target.files && e.target.files[0];
        if (f) parseText(await f.text());
      }
    });
    const ta = el('textarea', {
      className: 'textarea', placeholder: 'Hoặc dán trực tiếp mỗi dòng: tên;giá;đơn vị;nhóm;mô tả',
      onInput: e => parseText(e.target.value)
    });
    openModal('Nhập menu từ CSV', el('div', null,
      el('div', { className: 'field' }, el('label', { text: 'Chọn file CSV (ngăn bằng dấu ;)' }), fileInp),
      el('div', { className: 'field' }, el('label', { text: 'Hoặc dán nội dung CSV' }), ta),
      prevBox
    ), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' }), impBtn], opener);
  }

  /* ===== TAB: Cài đặt (gói tối thiểu: standard) ===== */
  function renderSettingsTab() {

    };

    const orderLink = new URL('index.html?shop=' + encodeURIComponent(sh.slug), location.href).href;

    // 1. Link đặt hàng
    const linkCard = el('div', { className: 'card' },

        }),

      )
    );


    // 1b. Logo & màu riêng của tiệm
    const SUPA = (window.DATDON && window.DATDON.SUPABASE_URL) || '';
    const br = { theme: sh.theme || 'xanh-la', logo: sh.logo_url || null, blob: null, preview: sh.logo_url || null, removed: false };
    const logoImg = el('img', { style: 'width:72px;height:72px;border-radius:16px;object-fit:cover;background:var(--accent-soft);border:1px solid var(--border);flex:none', alt: 'Logo' });
    const logoHint = el('div', { style: 'font-size:12.5px;opacity:.7', text: '' });
    const drawLogo = () => {
      if (br.preview) { logoImg.src = br.preview; logoImg.style.visibility = 'visible'; } else { logoImg.removeAttribute('src'); logoImg.style.visibility = 'hidden'; }
      logoHint.textContent = br.preview ? 'Logo hiện ở đầu trang đặt hàng và là icon khi khách thêm vào màn hình chính.' : 'Chưa có logo. Trang đặt hàng dùng icon chung của datdon.';
    };
    const fileInput = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp', style: 'display:none' });
    // Cắt vuông, thu nhỏ còn khoảng 256px, giữ dưới 200KB
    const makeSquare = file => new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file); const im = new Image();
      im.onload = async () => {
        try {
          const side = Math.min(im.naturalWidth, im.naturalHeight);
          const sx = (im.naturalWidth - side) / 2, sy = (im.naturalHeight - side) / 2;
          let out = 256, blob = null;
          while (out >= 96) {
            const cv = document.createElement('canvas'); cv.width = out; cv.height = out;
            cv.getContext('2d').drawImage(im, sx, sy, side, side, 0, 0, out, out);
            blob = await new Promise(r => cv.toBlob(r, 'image/png'));
            if (blob && blob.size <= 190 * 1024) break;
            out = Math.round(out * 0.75);
          }
          URL.revokeObjectURL(url);
          if (!blob || blob.size > 200 * 1024) reject(new Error('Ảnh quá nặng, chọn ảnh khác')); else resolve(blob);
        } catch (e) { reject(e); }
      };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Không đọc được ảnh này')); };
      im.src = url;
    });
    fileInput.addEventListener('change', async () => {
      const f = fileInput.files && fileInput.files[0]; fileInput.value = '';
      if (!f) return;
      try {
        br.blob = await makeSquare(f); br.removed = false;
        br.preview = URL.createObjectURL(br.blob); drawLogo();
      } catch (err) { app.showToast(err.message || 'Không dùng được ảnh này', 'error'); }

    const themeBox = el('div', { style: 'display:flex;flex-wrap:wrap;gap:10px;margin-top:8px' });

        type: 'button', 'aria-pressed': String(br.theme === k), title: T[k].name,
        style: 'display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:2px;font:inherit;font-size:12px',
        onClick: () => { br.theme = k; drawThemes(); }
      },
        el('span', { style: 'width:40px;height:40px;border-radius:50%;background:' + T[k].c + ';display:block;border:3px solid ' + (br.theme === k ? 'var(--text)' : 'transparent') + ';box-sizing:border-box' }),

    const brBtn = el('button', {

          await loadShopFull();
          app.showToast('Đã lưu logo và màu', 'accent');

            el('button', { type: 'button', className: 'btn btn-sm', onClick: () => { br.blob = null; br.removed = true; br.preview = null; drawLogo(); }, text: 'Bỏ logo' })
          ),

      ),
      el('div', { style: 'font-size:12.5px;opacity:.7;margin-top:8px', text: 'Kích thước: ảnh vuông, từ 256 × 256 điểm ảnh trở lên (ảnh không vuông sẽ được cắt giữa thành hình vuông). Định dạng PNG, JPG hoặc WebP. Dung lượng tối đa 200KB sau khi app tự thu nhỏ, nên ảnh gốc to cũng không sao. Nên dùng logo nền đặc, không nền trong suốt, để icon trên điện thoại đẹp.' }),
      el('div', { className: 'field', style: 'margin-top:14px' }, el('label', { text: 'Màu chủ đạo của trang đặt hàng' }), themeBox),

    // 2. Hồ sơ tiệm

          text: '+ Thêm nơi giao'

    drawPlaces();

    const stBtn = el('button', {

        return el('div', { className: 'line-row' },

            onClick: async () => {

    { id: 'bb', label: 'Bao bì' },
    { id: 'dc', label: 'Dụng cụ' }
  ];

    { id: 'gh', label: 'Giao hàng' },
    { id: 'qc', label: 'Quảng cáo' },

    { id: 'ht', label: 'Hoàn tiền' }
  ];

  async function loadPurchases() {
    const { data, error } = await sb.from('purchases').select('*').eq('shop_id', shopId).order('at', { ascending: false }).range(0, 59);
    if (error) throw error;
    ST.purchases = data || [];
  }
  async function loadDebts() {
    const { data, error } = await sb.from('purchases').select('*').eq('shop_id', shopId).eq('on_credit', true).order('due_date', { ascending: true });
    if (error) throw error;
    ST.debts = (data || []).filter(p => (p.total - p.paid) > 0);
  }

          el('small', { text: app.formatVnDateTime(p.at) + ' · ' + p.place })
        ),
        p.on_credit ? el('span', { className: 'badge ' + (p.paid < p.total ? 'badge-warn' : ''), text: p.paid < p.total ? 'Trả sau' : 'Đã trả đủ' }) : null,
        el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openPurchaseDetailModal(p, e.currentTarget), text: 'Xem' }),
        el('button', { type: 'button', className: 'btn btn-sm btn-danger', onClick: e => confirmModal('Xóa phiếu ' + p.code + '?', 'Kho sẽ được hoàn lại tương ứng.', 'Xóa phiếu', async () => {

          if (error) throw error;

      )) : el('div', { className: 'empty-state', text: 'Chưa có phiếu mua nào.' })
    );

    contentHost.replaceChildren(
      renderMetaBar('buy', async () => { await loadTabData('buy'); renderBuyTab(); }),
      seg, formCard, listCard
    );
    updateBuySticky();

  function updateBuySticky() {
    if (ST.tab !== 'buy' || ST.buySub !== 'form') { stickyHost.replaceChildren(); return; }
    const total = ST.buyForm.lines.reduce((s, l) => s + (Math.round(Number(l.cost)) || 0), 0);
    const saveBtn = el('button', {
      type: 'button', className: 'btn-save',
      onClick: () => submitPurchase(saveBtn),
      text: ST.buyEditId ? 'Cập nhật phiếu' : 'Lưu phiếu mua'
    });
    stickyHost.replaceChildren(el('div', { className: 'sticky-bar' },
      el('div', { className: 'sticky-bar-in' },
        el('div', { className: 'sum' },
          el('small', { text: ST.buyForm.lines.length + ' dòng hàng' }),
          el('b', { className: 'num', text: app.formatMoney(total) })
        ),
        saveBtn
      )
    ));
  }

  function resetBuyForm() {
    ST.buyEditId = null;
    ST.buyForm = {
      at: '', place: '', pay_method_id: activePayMethods()[0] ? activePayMethods()[0].id : null,
      on_credit: false, due_date: '', note: '',
      lines: [{ grp: 'nl', name: '', unit: 'kg', qty: '', cost: '', inv_item_id: null }]
    };
  }

  async function submitPurchase(btn) {
    const bf = ST.buyForm;
    if (!bf.place.trim()) { app.showToast('Nhập nơi mua / nhà cung cấp', 'error'); return; }
    const lines = [];
    for (const l of bf.lines) {
      const qty = Number(l.qty);
      const cost = Math.round(Number(l.cost));
      if (!l.name.trim() || !(qty > 0) || Number.isNaN(cost) || cost < 0) {
        app.showToast('Kiểm tra lại tên hàng, số lượng (>0) và thành tiền (≥0)', 'error');
        return;
      }
      lines.push({ grp: l.grp, name: l.name.trim(), unit: l.unit.trim() || 'cái', qty, cost, inv_item_id: l.inv_item_id || null });
    }
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      const { data, error } = await sb.rpc('save_purchase', {
        p_shop: shopId, p_purchase: ST.buyEditId || null, p_at: localDtToIso(bf.at),
        p_place: bf.place.trim(), p_pay_method: bf.on_credit ? null : bf.pay_method_id,
        p_on_credit: bf.on_credit, p_due: bf.on_credit && bf.due_date ? bf.due_date : null,
        p_note: bf.note.trim(), p_lines: lines
      });
      if (error) throw error;
      app.showToast('Đã lưu phiếu ' + data.code + ' · ' + app.formatMoney(data.total), 'accent');
      resetBuyForm();
      await Promise.all([loadPurchases(), loadDebts(), loadInvItems()]);
      renderBuyTab();
    } catch (err) { showErr(err); btn.disabled = false; btn.textContent = 'Lưu phiếu mua'; }
  }

    const { data: lines, error } = await sb.from('purchase_lines').select('*').eq('purchase_id', p.id).eq('shop_id', shopId);
    if (error) { showErr(error); return; }

      el('div', { style: 'font-size:14px;color:var(--text-sub);margin-bottom:8px', text: app.formatVnDateTime(p.at) + ' · ' + p.place + (p.note ? ' · ' + p.note : '') }),
      (lines || []).map(l => el('div', { className: 'line-row' },
        el('div', { className: 'line-main' },
          el('b', { text: l.name }),
          el('small', { className: 'num', text: l.qty + ' ' + l.unit })
        ),
        el('b', { className: 'num', text: app.formatMoney(l.cost) })
      )),
      el('div', { className: 'row-between', style: 'font-weight:700;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)' },

      )
    );
    openModal('Chi tiết phiếu ' + p.code, body, [

      el('button', {
        type: 'button', className: 'btn btn-primary',
        onClick: () => {
          ST.buyEditId = p.id;
          ST.buyForm = {
            at: toLocalDtValue(p.at), place: p.place, pay_method_id: p.pay_method_id,
            on_credit: p.on_credit, due_date: p.due_date || '', note: p.note || '',
            lines: (lines || []).map(l => ({ grp: l.grp, name: l.name, unit: l.unit, qty: l.qty, cost: l.cost, inv_item_id: l.inv_item_id }))
          };
          closeModal();
          renderBuyTab();
          window.scrollTo({ top: 0, behavior: 'smooth' });

        text: 'Sửa phiếu'
      })

  function renderDebtView(seg) {
    stickyHost.replaceChildren();
    const today = app.toVnYmd(new Date());
    const byPlace = new Map();
    let grandTotal = 0;
    for (const p of ST.debts) {
      const left = p.total - p.paid;
      grandTotal += left;
      if (!byPlace.has(p.place)) byPlace.set(p.place, { total: 0, list: [] });
      byPlace.get(p.place).total += left;
      byPlace.get(p.place).list.push(p);
    }

    contentHost.replaceChildren(
      renderMetaBar('buy', async () => { await loadDebts(); renderBuyTab(); }),
      seg,
      el('div', { className: 'card row-between' },
        el('span', { style: 'font-weight:700', text: 'Tổng nợ nhà cung cấp' }),
        el('b', { className: 'num', style: 'font-size:20px;color:var(--error)', text: app.formatMoney(grandTotal) })
      ),
      byPlace.size ? [...byPlace.entries()].map(([place, grp]) => el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:6px' },
          el('b', { text: place }),
          el('b', { className: 'num', style: 'color:var(--error)', text: app.formatMoney(grp.total) })
        ),
        grp.list.map(p => {
          const left = p.total - p.paid;
          const overdue = p.due_date && p.due_date < today;
          return el('div', { className: 'line-row' },
            el('div', { className: 'line-main' },
              el('b', { className: 'num', text: p.code + ' · Còn nợ ' + app.formatMoney(left) }),
              el('small', { text: 'Tổng ' + app.formatMoney(p.total) + ' · Đã trả ' + app.formatMoney(p.paid) + (p.due_date ? ' · Hẹn ' + p.due_date.split('-').reverse().join('/') : '') })
            ),
            overdue ? el('span', { className: 'badge badge-err', text: 'Quá hạn' }) : null,
            el('button', { type: 'button', className: 'btn btn-primary btn-sm', onClick: e => openPayDebtModal(p, e.currentTarget), text: 'Trả nợ' }),
            el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openDebtHistoryModal(p, e.currentTarget), text: 'Lịch sử' })
          );
        })
      )) : el('div', { className: 'card empty-state', text: 'Không còn khoản nợ nhà cung cấp nào.' })
    );
  }

  function openPayDebtModal(p, opener) {
    const left = p.total - p.paid;
    let amount = left;
    let methodId = activePayMethods()[0] ? activePayMethods()[0].id : null;
    let note = '';
    const body = el('div');
    const draw = () => {
      body.replaceChildren(
        el('div', { className: 'field' },
          el('label', { text: 'Số tiền trả (tối đa ' + app.formatMoney(left) + ')' }),
          el('input', { className: 'input num', type: 'number', min: 1, max: left, value: amount, onInput: e => { amount = Math.round(Number(e.target.value) || 0); } })
        ),
        el('div', { className: 'field' },
          el('label', { text: 'Phương thức trả' }),
          el('div', { className: 'chips' }, activePayMethods().map(m => el('button', {
            type: 'button', className: 'chip', 'aria-pressed': String(methodId === m.id),
            onClick: () => { methodId = m.id; draw(); }, text: m.name
          })))
        ),
        el('div', { className: 'field' },
          el('label', { text: 'Ghi chú' }),
          el('input', { className: 'input', value: note, onInput: e => { note = e.target.value; } })
        )
      );
    };
    draw();
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        if (!(amount > 0) || amount > left) { app.showToast('Số tiền không hợp lệ', 'error'); return; }
        okBtn.disabled = true; okBtn.textContent = 'Đang lưu…';
        try {
          const { error } = await sb.rpc('pay_debt', { p_purchase: p.id, p_amount: amount, p_pay_method: methodId, p_at: null, p_note: note.trim() });
          if (error) throw error;
          closeModal();
          app.showToast('Đã ghi nhận trả nợ ' + app.formatMoney(amount), 'accent');
          await Promise.all([loadDebts(), loadPurchases()]);
          renderBuyTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Xác nhận trả'; }
      },
      text: 'Xác nhận trả'
    });
    openModal('Trả nợ phiếu ' + p.code, body, [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), okBtn], opener);
  }

  async function openDebtHistoryModal(p, opener) {
    const { data, error } = await sb.from('debt_payments').select('*').eq('purchase_id', p.id).eq('shop_id', shopId).order('at', { ascending: false });
    if (error) { showErr(error); return; }
    openModal('Lịch sử trả nợ ' + p.code,
      (data && data.length) ? el('div', null, data.map(d => el('div', { className: 'line-row' },
        el('div', { className: 'line-main' },
          el('b', { className: 'num', text: app.formatMoney(d.amount) }),
          el('small', { text: app.formatVnDateTime(d.at) + ' · ' + payMethodName(d.pay_method_id) + (d.note ? ' · ' + d.note : '') })
        )
      ))) : el('div', { className: 'empty-state', text: 'Chưa có lần trả nợ nào.' }),
      [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })], opener
    );
  }

  /* ===== TAB: Kho (gói tối thiểu: pro) ===== */
  const INV_KINDS = { nl: 'Nguyên liệu', bb: 'Bao bì', btp: 'Bán thành phẩm' };
  const MOVE_KINDS = { buy: 'Mua', batch_in: 'Làm ra', batch_out: 'Dùng để làm', sale: 'Bán', adjust: 'Kiểm kho' };

  async function loadInventoryReport() {
    const [rep, list] = await Promise.all([
      sb.rpc('report_inventory', { p_shop: shopId }),
      sb.from('inv_items').select('*').eq('shop_id', shopId).order('name', { ascending: true })
    ]);
    if (rep.error) throw rep.error;
    if (list.error) throw list.error;
    ST.invSummary = rep.data;
    ST.invItems = list.data || [];
  }

  function renderInvTab() {
    const sum = ST.invSummary || { total_value: 0, low_count: 0 };
    const q = fold(ST.invSearch.trim());
    const items = ST.invItems.filter(it => {
      if (ST.invKind !== 'all' && it.kind !== ST.invKind) return false;
      if (ST.invLowOnly && !(it.qty <= it.min_stock)) return false;
      if (q && !fold(it.name).includes(q)) return false;
      return true;
    });

    contentHost.replaceChildren(
      renderMetaBar('inv', async () => { await loadInventoryReport(); markLoaded('inv'); renderInvTab(); }),
      el('div', { className: 'grid-2', style: 'margin-bottom:12px' },
        el('div', { className: 'kpi-box' }, el('small', { text: 'Tổng giá trị kho' }), el('b', { className: 'num', text: app.formatMoney(sum.total_value) })),
        el('div', { className: 'kpi-box' }, el('small', { text: 'Vật tư sắp hết' }), el('b', { className: 'num', style: sum.low_count > 0 ? 'color:var(--error)' : '', text: String(sum.low_count) }))
      ),
      el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:10px' },
          el('input', { className: 'input', style: 'flex:1 1 180px', type: 'search', placeholder: 'Tìm tên vật tư…', value: ST.invSearch, onInput: e => { ST.invSearch = e.target.value; renderInvTab(); } }),
          el('button', { type: 'button', className: 'btn btn-primary', onClick: e => openInvItemModal(null, e.currentTarget), text: '+ Thêm vào kho' })
        ),

  function openInvItemModal(item, opener) {

      el('div', { className: 'grid-2' },
        el('div', { className: 'field' }, el('label', { text: 'Đơn vị' }), el('input', { className: 'input', value: f.unit, onInput: e => { f.unit = e.target.value; } })),
        el('div', { className: 'field' }, el('label', { text: 'Loại' }),
          el('select', { className: 'select', onChange: e => { f.kind = e.target.value; } },

      item ? el('label', { style: 'display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600' },

    );
    const saveBtn = el('button', {
      type: 'button', className: 'btn btn-primary',

        saveBtn.disabled = true; saveBtn.textContent = 'Đang lưu…';
        try {
          const rec = { name: f.name.trim(), unit: f.unit.trim(), kind: f.kind, min_stock: Number(f.min_stock) || 0, active: f.active };
          if (item) {

            checkMutated(res);
          } else {
            const { error } = await sb.from('inv_items').insert(Object.assign({ shop_id: shopId }, rec));
            if (error) throw error;

  function openAdjustStockModal(item, opener) {
    let newQty = item.qty;
    let note = '';
    const diffEl = el('div', { className: 'alert alert-success', style: 'margin-top:8px', text: 'Chênh lệch: 0 ' + item.unit });
    const updateDiff = () => {
      const diff = (Number(newQty) || 0) - Number(item.qty);
      diffEl.textContent = 'Chênh lệch: ' + (diff > 0 ? '+' : '') + Number(diff.toFixed(3)) + ' ' + item.unit;
      diffEl.className = 'alert ' + (diff < 0 ? 'alert-error' : 'alert-success');
    };
    const body = el('div', null,
      el('p', { style: 'margin:0 0 8px', text: 'Tồn trên sổ: ' + item.qty + ' ' + item.unit }),
      el('div', { className: 'field' },
        el('label', { text: 'Số tồn thực tế (' + item.unit + ')' }),
        el('input', { className: 'input num', type: 'number', step: 'any', min: 0, value: newQty, onInput: e => { newQty = e.target.value; updateDiff(); } })
      ),
      diffEl,
      el('div', { className: 'field' },
        el('label', { text: 'Ghi chú kiểm kho' }),
        el('input', { className: 'input', placeholder: 'Ví dụ: Kiểm cuối tuần', onInput: e => { note = e.target.value; } })
      )
    );
    const okBtn = el('button', {
      type: 'button', className: 'btn btn-primary',
      onClick: async () => {
        okBtn.disabled = true; okBtn.textContent = 'Đang lưu…';
        try {
          const { error } = await sb.rpc('adjust_stock', { p_item: item.id, p_new_qty: Number(newQty) || 0, p_note: note.trim() });
          if (error) throw error;
          closeModal();
          app.showToast('Đã cập nhật kiểm kho ' + item.name, 'accent');
          await loadInventoryReport();
          renderInvTab();
        } catch (err) { showErr(err); okBtn.disabled = false; okBtn.textContent = 'Lưu kiểm kho'; }
      },
      text: 'Lưu kiểm kho'
    });
    openModal('Kiểm kho: ' + item.name, body, [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Hủy' }), okBtn], opener);
  }

  async function openStockMovesModal(item, opener) {
    const { data, error } = await sb.from('stock_moves').select('*').eq('shop_id', shopId).eq('inv_item_id', item.id).order('at', { ascending: false }).range(0, 49);
    if (error) { showErr(error); return; }
    openModal('Lịch sử kho: ' + item.name,
      (data && data.length) ? el('div', null, data.map(m => el('div', { className: 'line-row' },
        el('div', { className: 'line-main' },
          el('b', { text: MOVE_KINDS[m.kind] || m.kind }),
          el('small', { text: app.formatVnDateTime(m.at) + (m.note ? ' · ' + m.note : '') })
        ),
        el('b', { className: 'num', style: 'color:' + (m.qty < 0 ? 'var(--error)' : 'var(--accent)'), text: (m.qty > 0 ? '+' : '') + m.qty + ' ' + item.unit })
      ))) : el('div', { className: 'empty-state', text: 'Chưa có biến động kho nào.' }),
      [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' })], opener
    );
