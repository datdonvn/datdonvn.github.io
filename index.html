<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4D3A">
<title>Đặt hàng</title>
<link rel="manifest" href="manifest-datdon.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="thuonghieu.js"></script>
<script src="qrcode.js"></script>
<script src="vietqr.js"></script>
<style>
:root {
  --bg: #EDF2EA;
  --surface: #FFFFFF;
  --text: #14231B;
  --text-sub: #5E6F65;
  --border: #D3DDD4;
  --accent: #1E4D3A;
  --accent-hover: #2C6B51;
  --accent-soft: #DDE9DF;
  --accent-text: #FFFFFF;
  --yellow: #F4C430;
  --error: #B23A1E;
  --error-bg: #FBE9E4;
  --warn-bg: #FBF1DF;
  --warn-text: #8A520D;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(20, 35, 27, 0.06), 0 6px 18px rgba(20, 35, 27, 0.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1713;
    --surface: #18231D;
    --text: #EAF1EC;
    --text-sub: #9EB0A5;
    --border: #2B3B32;
    --accent: #3B8B6A;
    --accent-hover: #49A27D;
    --accent-soft: #1E352A;
    --accent-text: #FFFFFF;
    --yellow: #F4C430;
    --error: #F07A5E;
    --error-bg: #361C16;
    --warn-bg: #352915;
    --warn-text: #F2C97D;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; overflow-x: clip; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.5 "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* Bố cục chính */
.wrap {
  max-width: 600px;
  margin: 0 auto;
  padding: 0 14px calc(146px + env(safe-area-inset-bottom));
}
.shop-header {
  background: var(--accent);
  color: var(--accent-text);
  padding: calc(14px + env(safe-area-inset-top)) 16px 16px;
}
.shop-header-in {
  max-width: 600px;
  margin: 0 auto;
}
.shop-banner { background: var(--surface); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top); }
.shop-banner img { display: block; width: 100%; max-width: 600px; margin: 0 auto; aspect-ratio: 1200 / 450; object-fit: cover; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.shop-foot { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 13.5px; color: var(--text-sub); }
.shop-tagline { text-align: center; margin-bottom: 12px; }
.shop-contact { text-align: left; display: flex; flex-direction: column; gap: 3px; }
.shop-contact a { color: var(--accent); font-weight: 600; text-decoration: none; }
.shop-brand { display: flex; align-items: center; gap: 12px; }
span.shop-logo.shop-mono { display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,.2); color: #fff; font-weight: 700; font-size: 22px; }
.promo-dots { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.promo-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background .15s, width .15s; }
.promo-dots i.on { background: var(--accent); width: 18px; border-radius: 4px; }
.shop-logo { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: #fff; flex: none; }
.shop-name {
  margin: 0;
  font-size: 21px;
  font-weight: 700;
  line-height: 1.25;
}
.shop-meta {
  margin-top: 6px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-size: 14px;
  opacity: 0.92;
}
.shop-meta a {
  color: var(--yellow);
  font-weight: 600;
  text-decoration: none;
}

.status-banner {
  margin: 12px 0 0;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
  font-size: 14.5px;
}
.status-banner.off { background: var(--error-bg); color: var(--error); }
.off-tag { color: var(--error); font-weight: 600; }
.status-banner.stop { background: var(--error-bg); color: var(--error); }

/* Dải khuyến mãi */
.promos {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  margin: 12px 0 0;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}
.promo-card {
  flex: 0 0 85%;
  scroll-snap-align: start;
  background: var(--accent);
  color: var(--accent-text);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.promos.one .promo-card { flex-basis: 100%; }
.promo-card b { display: block; font-size: 15.5px; }
.promo-card span { display: block; font-size: 13.5px; opacity: 0.92; margin-top: 3px; }
.promo-card .promo-exp {
  display: inline-block;
  margin-top: 6px;
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.2);
  font-size: 12px;
  font-weight: 600;
}

/* Thanh chọn nhóm món dính trên */
.cat-bar {
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--bg);
  padding: 10px 0 8px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.cat-pill {
  flex: none;
  min-height: 44px;
  padding: 0 15px;
  border-radius: 999px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text-sub);
  white-space: nowrap;
}
.cat-pill[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}

/* Danh sách món */
.cat-title {
  margin: 16px 0 8px;
  font-size: 17px;
  font-weight: 700;
  scroll-margin-top: 66px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 12px;
}
.menu-item {
  display: flex;
  gap: 12px;
  align-items: center;
}
.item-img {
  width: 76px;
  height: 76px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--accent-soft);
}
.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 700; font-size: 16px; line-height: 1.3; word-break: break-word; }
.item-desc { color: var(--text-sub); font-size: 13.5px; margin-top: 3px; line-height: 1.35; }
.item-price-row { margin-top: 6px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.item-price { font-weight: 700; font-size: 16.5px; color: var(--accent); }
.item-unit { font-size: 13px; color: var(--text-sub); }
.item-act { flex-shrink: 0; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 15.5px;
  background: var(--accent);
  color: var(--accent-text);
  transition: opacity 0.15s, transform 0.1s;
}
.btn:hover:not(:disabled) { background: var(--accent-hover); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-ghost {
  background: var(--surface);
  color: var(--accent);
  border: 1.5px solid var(--border);
}
.btn-ghost:hover:not(:disabled) { background: var(--accent-soft); }
.btn-danger {
  background: var(--error-bg);
  color: var(--error);
  border: 1.5px solid var(--error);
}
.btn-danger:hover:not(:disabled) { opacity: 0.9; background: var(--error-bg); }
.btn-block { width: 100%; }
.btn-add { min-width: 78px; border-radius: 999px; padding: 0 16px; }

.stepper {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  user-select: none;
}
.stepper button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 22px;
  font-weight: 700;
  display: grid;
  place-items: center;
}
.stepper button.plus { background: var(--accent); color: var(--accent-text); }
.stepper button:disabled { opacity: 0.35; }
.stepper output { min-width: 28px; text-align: center; font-weight: 700; font-size: 17px; }

/* Thanh giỏ hàng nổi */
.cart-bar {
  position: fixed;
  transform: translate3d(0, 0, 0);
  -webkit-transform: translate3d(0, 0, 0);
  left: 0;
  right: 0;
  bottom: calc(60px + env(safe-area-inset-bottom));
  z-index: 6;
  padding: 0 12px 8px;
  pointer-events: none;
}
.cart-bar-in {
  max-width: 576px;
  margin: 0 auto;
  background: var(--accent);
  color: var(--accent-text);
  border-radius: 16px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
  pointer-events: auto;
}
.cart-sum { flex: 1; min-width: 0; line-height: 1.25; }
.cart-sum small { display: block; font-size: 13px; opacity: 0.88; }
.cart-sum b { font-size: 20px; color: var(--yellow); }
.cart-bar .btn-view {
  background: var(--yellow);
  color: #14231B;
  border-radius: 999px;
  padding: 0 20px;
  min-height: 44px;
  font-weight: 700;
  font-size: 15.5px;
  white-space: nowrap;
}
.cart-bar .btn-view:disabled { opacity: 0.5; }

/* Thanh điều hướng đáy */
.bottom-nav {
  position: fixed;
  transform: translate3d(0, 0, 0);
  -webkit-transform: translate3d(0, 0, 0);
  will-change: transform;

  left: 0;
  right: 0;
  bottom: 0;
  z-index: 7;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav-in {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
}
.bottom-nav button {
  flex: 1;
  min-height: 58px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-sub);
}
.bottom-nav button[aria-selected="true"] { color: var(--accent); }
.bottom-nav svg { width: 22px; height: 22px; }

/* Form & Lựa chọn */
.field { margin-top: 12px; }
.field label { display: block; font-weight: 600; font-size: 14.5px; margin-bottom: 5px; }
.field .opt { font-weight: 400; color: var(--text-sub); font-size: 13px; }
.input, .select, .textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); outline: none; }
.textarea { min-height: 76px; resize: vertical; }

.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.scope-btn { padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 600; }
.scope-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.choice-btn {
  flex: 1 1 130px;
  min-height: 44px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface);
  text-align: left;
  font-weight: 600;
  font-size: 14.5px;
}
.choice-btn small { display: block; font-weight: 400; color: var(--text-sub); font-size: 12.5px; margin-top: 2px; }
.choice-btn[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.day-pills { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 4px; }
.day-pills button {
  flex: none;
  min-height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 14px;
  font-weight: 600;
}
.day-pills button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}

/* Thông báo & Nhãn */
.msg {
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  margin: 10px 0;
  font-size: 14.5px;
  font-weight: 500;
}
.msg-ok { background: var(--accent-soft); color: var(--accent); }
.msg-err { background: var(--error-bg); color: var(--error); }
.msg-warn { background: var(--warn-bg); color: var(--warn-text); }

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  background: var(--accent-soft);
  color: var(--accent);
}
.badge-wait { background: var(--warn-bg); color: var(--warn-text); }
.badge-bad { background: var(--error-bg); color: var(--error); }
.badge-prep { background: #DCEAFB; color: #1C4E8F; }
.badge-ship { background: #EADFF8; color: #5B2C95; }
.badge-done { background: #D5EEDB; color: #1B6B33; }
@media (prefers-color-scheme: dark) {
  .badge-prep { background: #1A2D45; color: #8DBBF2; }
  .badge-ship { background: #2D2140; color: #C7A6F0; }
  .badge-done { background: #17331F; color: #7FD39A; }
}

.row-kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 15px; }
.row-kv.disc { color: var(--accent); font-weight: 600; }
.row-kv.total { font-weight: 700; font-size: 18px; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 10px; }

.pay-note {
  margin-top: 10px;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  border: 1px dashed var(--accent);
  font-size: 14.5px;
  white-space: pre-line;
}

/* Hộp thoại trượt lên / giữa */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-sheet {
  width: 100%;
  max-width: 600px;
  max-height: 92dvh;
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 16px; }
  .modal-sheet { border-radius: 20px; max-height: 88dvh; }
}
.modal-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.modal-hd h2 { margin: 0; font-size: 18px; font-weight: 700; }
.modal-close {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg);
  font-size: 22px;
  font-weight: 700;
  display: grid;
  place-items: center;
}
.modal-body {
  padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
  overflow-y: auto;
  flex: 1;
}
.modal-ft {
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
}

/* Đánh giá sao */
.stars { display: flex; gap: 4px; margin: 8px 0; }
.stars button {
  width: 46px;
  height: 46px;
  font-size: 32px;
  line-height: 1;
  color: var(--border);
}
.stars button.on { color: #D99A00; }

/* Toast */
.toast {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  max-width: calc(100% - 28px);
  padding: 12px 18px;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
  font-size: 14.5px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}
.toast.err { background: var(--error); color: #FFFFFF; }

.order-code-big {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--accent);
}
.empty-box {
  text-align: center;
  padding: 36px 16px;
  color: var(--text-sub);
}
.empty-box b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

<div id="app-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>

<script>
'use strict';
// Bỏ qua null/false và trải mảng khi vẽ giao diện (tránh hiện chữ "null" hoặc "[object ...]")
['replaceChildren', 'append', 'prepend'].forEach(function (fn) {
  const orig = Element.prototype[fn];
  if (!orig || orig.__dd) return;
  const wrapped = function (...a) { return orig.apply(this, a.flat(Infinity).filter((x) => x !== null && x !== undefined && x !== false)); };
  wrapped.__dd = true;
  Element.prototype[fn] = wrapped;
});

/* ===== TIỆN ÍCH CƠ BẢN & GỌI RPC ===== */
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'className') node.className = v;
      else if (k === 'text') node.textContent = String(v);
      else if (k === 'value') node.value = v;
      else if (k === 'checked') node.checked = Boolean(v);
      else if (k === 'disabled') node.disabled = Boolean(v);
      else if (k.startsWith('on') && typeof v === 'function') {
        node.addEventListener(k.slice(2).toLowerCase(), v);
      } else {
        node.setAttribute(k, v === true ? '' : String(v));
      }
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}

function formatMoney(n) {
  const num = Math.round(Number(n) || 0);
  return num.toLocaleString('vi-VN').replace(/,/g, '.') + 'đ';
}

function pad2(n) { return String(n).padStart(2, '0'); }

function formatVnDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const vn = new Date(d.getTime() + 7 * 3600000);
  return pad2(vn.getUTCDate()) + '/' + pad2(vn.getUTCMonth() + 1) + '/' + vn.getUTCFullYear() + ' ' +
    pad2(vn.getUTCHours()) + ':' + pad2(vn.getUTCMinutes());
}

function formatYmdShort(ymd) {
  const m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
}

function storageGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw == null ? fallback : JSON.parse(raw);
  } catch (e) { return fallback; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

function normalizePhone(raw) {
  return String(raw || '').replace(/[^\d+]/g, '').replace(/^\+84/, '0');
}
function isValidPhone(raw) {
  const p = normalizePhone(raw);
  return /^0\d{9}$/.test(p) || /^\+?\d{8,15}$/.test(p);
}

let toastTimer = null;
function showToast(msg, type) {
  const root = document.getElementById('toast-root');
  root.replaceChildren(el('div', { className: 'toast' + (type === 'error' ? ' err' : ''), role: 'status', text: msg }));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => root.replaceChildren(), 3200);
}

async function rpc(name, args) {
  const cfg = window.DATDON || {};
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_KEY) {
    throw new Error('Thiếu cấu hình kết nối (config.js).');
  }
  const res = await fetch(cfg.SUPABASE_URL + '/rest/v1/rpc/' + name, {
    method: 'POST',
    headers: {
      'apikey': cfg.SUPABASE_KEY,
      'Authorization': 'Bearer ' + cfg.SUPABASE_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(args || {})
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.message) || 'Có lỗi xảy ra, vui lòng thử lại');
  return data;
}

/* ===== GIỜ VIỆT NAM & LỊCH GIAO ===== */
const VN_OFFSET = 7 * 3600000;
function getVnNow() {
  const d = new Date(Date.now() + VN_OFFSET);
  return {
    y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(),
    min: d.getUTCHours() * 60 + d.getUTCMinutes(), wd: d.getUTCDay()
  };
}
function parseHm(str) {
  const m = String(str || '').match(/^(\d{1,2}):(\d{2})/);
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}
const NEEDS = {
  apt: { label: 'Giao tận căn', field: 'Số căn hộ', ph: 'Ví dụ: A0605', err: 'Vui lòng nhập số căn hộ.' },
  spot: { label: 'Cổng/Sảnh/Địa chỉ cụ thể', field: 'Cổng / Sảnh / Địa chỉ cụ thể', ph: 'Ví dụ: Cổng 2, Sảnh B', err: 'Vui lòng nhập cổng, sảnh hoặc địa chỉ nhận hàng.' }
};
const needKey = pl => (pl && pl.needs === 'apt') ? 'apt' : 'spot';
const isOutside = () => ST.profile.scope === 'out';
function fold(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }
function hmText(min) { return pad2(Math.floor(min / 60)) + ':' + pad2(min % 60); }
function vnIso(y, m, d, min) {
  const dt = new Date(Date.UTC(y, m, d, 0, min));
  return dt.getUTCFullYear() + '-' + pad2(dt.getUTCMonth() + 1) + '-' + pad2(dt.getUTCDate()) +
    'T' + pad2(dt.getUTCHours()) + ':' + pad2(dt.getUTCMinutes()) + ':00+07:00';
}
function dayTitle(offset) {
  if (offset === 0) return 'Hôm nay';
  if (offset === 1) return 'Ngày mai';
  const n = getVnNow();
  const dt = new Date(Date.UTC(n.y, n.m, n.d + offset));
  const wds = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  return wds[dt.getUTCDay()] + ' ' + pad2(dt.getUTCDate()) + '/' + pad2(dt.getUTCMonth() + 1);
}
// Giờ hoạt động áp theo nơi giao đang chọn (nơi giao đã gộp sẵn giờ quán/khu vực/riêng); ngày nghỉ chung cả hệ thống
function effShop(shop, plName) {
  const places = Array.isArray(shop.places) ? shop.places : [];
  const name = plName !== undefined ? plName : (ST.profile.place || (places[0] && places[0].name));
  const pl = places.find(x => x.name === name);
  return pl && Array.isArray(pl.slots) ? Object.assign({}, shop, { open_slots: pl.slots, open_from: null, open_to: null }) : shop;
}
function placeOpenNow(shop, pl) {
  const sh = effShop(shop, pl.name), n = getVnNow();
  if (isClosedDay(sh, n.y, n.m, n.d)) return false;
  const r = shopSlots(sh);
  return !r.length || r.some(x => n.min >= x[0] && n.min <= x[1]);
}
function shopSlots(shop) {
  let arr = Array.isArray(shop.open_slots) ? shop.open_slots : [];
  if (!arr.length && shop.open_from && shop.open_to) arr = [{ from: shop.open_from, to: shop.open_to }];
  const out = [];
  arr.forEach(x => {
    const f = parseHm(x.from), t = parseHm(x.to);
    if (f == null || t == null || f === t) return;
    if (f < t) out.push([f, t]); else { out.push([f, 1439]); out.push([0, t]); }
  });
  return out.sort((a, b) => a[0] - b[0]);
}
function isClosedDay(shop, y, m, d) {
  const key = y + '-' + pad2(m + 1) + '-' + pad2(d);
  return Array.isArray(shop.closed_dates) && shop.closed_dates.indexOf(key) >= 0;
}
function advMin(shop) { return Math.max(0, Number(shop.advance_min_minutes) || 0); }
function advMax() { return 7 * 1440; } // khách hẹn trước tối đa 7 ngày
function fmtMinutes(m) {
  if (m >= 1440 && m % 1440 === 0) return (m / 1440) + ' ngày';
  if (m >= 60 && m % 60 === 0) return (m / 60) + ' giờ';
  if (m >= 60) return Math.floor(m / 60) + ' giờ ' + (m % 60) + ' phút';
  return m + ' phút';
}
// Các ngày/khung giờ khách chọn được khi đặt trước: từ giờ hoạt động sớm nhất sau thời gian chuẩn bị,
// đến hết ngày của (bây giờ + đặt trước tối đa), nhưng luôn gồm ít nhất ngày hoạt động gần nhất.
function buildDeliveryDays(shop) {
  shop = effShop(shop);
  const lead = advMin(shop), maxM = advMax();
  const slotsDef = shopSlots(shop);
  const ranges = slotsDef.length ? slotsDef : [[0, 23 * 60 + 45]];
  const n = getVnNow();
  const earliest = n.min + lead; // phút kể từ 00:00 hôm nay
  const days = [];
  for (let offset = 0; offset <= 45; offset++) {
    const dt = new Date(Date.UTC(n.y, n.m, n.d + offset));
    if (isClosedDay(shop, dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate())) continue;
    const minStart = Math.max(0, offset === 0 ? Math.ceil((earliest + (lead > 0 ? 0 : 15)) / 15) * 15 : earliest - offset * 1440);
    const slots = [];
    ranges.forEach(r => {
      for (let m = Math.ceil(Math.max(r[0], minStart) / 15) * 15; m <= Math.min(r[1], 23 * 60 + 45); m += 15) {
        slots.push({ label: hmText(m), iso: vnIso(n.y, n.m, n.d + offset, m) });
      }
    });
    if (slots.length) days.push({ offset, label: dayTitle(offset), slots });
  }
  if (!days.length) return days;
  const lastOffset = Math.max(Math.floor((n.min + maxM) / 1440), days[0].offset);
  return days.filter(d => d.offset <= lastOffset);
}
function slotsText(shop) {
  shop = effShop(shop);
  const arr = Array.isArray(shop.open_slots) && shop.open_slots.length ? shop.open_slots : (shop.open_from && shop.open_to ? [{ from: shop.open_from, to: shop.open_to }] : []);
  return arr.map(x => x.from + '–' + x.to).join(', ');
}
function getShopStatus(shop) {
  shop = effShop(shop);
  if (!shop.accepting) {
    return { cls: 'stop', text: 'Quán đang tạm ngưng nhận đơn. Bạn vẫn xem được thực đơn và quay lại sau nhé.' };
  }
  const n = getVnNow();
  const ranges = shopSlots(shop);
  const closedToday = isClosedDay(shop, n.y, n.m, n.d);
  if (!ranges.length && !closedToday) return { cls: '', text: 'Quán đang nhận đơn.' };
  if (!closedToday) {
    const cur = ranges.find(r => n.min >= r[0] && n.min < r[1]);
    if (cur) {
      let end = cur[1];
      if (end >= 1439) end = 1440;
      return { cls: '', text: 'Đang nhận đơn đến ' + (end === 1440 ? '24:00' : hmText(end)) + (advMin(shop) > 0 ? '. Cần đặt trước ' + fmtMinutes(advMin(shop)) + ', bạn chọn giờ giao bên dưới.' : '') };
    }
  }
  const days = buildDeliveryDays(shop);
  const lead = closedToday ? 'Hôm nay quán nghỉ.' : 'Ngoài giờ nhận đơn' + (slotsText(shop) ? ' (quán nhận đơn ' + slotsText(shop) + ').' : '.');
  if (!days.length) return { cls: 'off', text: lead + ' Bạn quay lại sau nhé.' };
  const earliest = days[0].slots[0].label + ' ' + days[0].label.toLowerCase();
  return { cls: 'off', text: lead + ' Bạn vẫn đặt trước được, giao sớm nhất lúc ' + earliest };
}
// Đang trong giờ nhận đơn (để cho chọn "Càng sớm càng tốt")
function isOpenNow(shop) {
  shop = effShop(shop);
  if (!shop.accepting) return false;
  if (advMin(shop) > 0) return false;
  const n = getVnNow();
  if (isClosedDay(shop, n.y, n.m, n.d)) return false;
  const ranges = shopSlots(shop);
  if (!ranges.length) return true;
  return ranges.some(r => n.min >= r[0] && n.min <= r[1]);
}

function openDialog(title, bodyNode, footerNode, opener) {
  ST.lastModalOpener = opener || document.activeElement;
  const root = document.getElementById('modal-root');
  const close = () => closeDialog();
  const sheet = el('div', {
    className: 'modal-sheet',
    role: 'dialog',
    'aria-modal': 'true',
    'aria-label': title
  },
    el('div', { className: 'modal-hd' },

      el('button', { className: 'modal-close', type: 'button', 'aria-label': 'Đóng', onClick: close, text: '×' })

    footerNode ? el('div', { className: 'modal-ft' }, footerNode) : null
  );
  const backdrop = el('div', {
    className: 'modal-backdrop',
    onClick: e => { if (e.target === backdrop) close(); }
  }, sheet);
  root.replaceChildren(backdrop);
  const focusable = sheet.querySelector('button, input, select, textarea');
  if (focusable) focusable.focus();
}

function closeDialog() {
  ST.co.open = false;
  clearInterval(ST.countdownTimer);

  const body = el('p', { style: 'margin:0;line-height:1.5', text: message });
  const btnCancel = el('button', { className: 'btn btn-ghost', type: 'button', onClick: closeDialog, text: 'Quay lại' });

    className: 'btn btn-danger',
    type: 'button',
    onClick: async () => {
      btnOk.disabled = true;
      btnOk.textContent = 'Đang xử lý…';

    },
    text: confirmLabel
  });
  const ft = el('div', { style: 'display:flex;gap:10px;justify-content:flex-end' }, btnCancel, btnOk);

}

async function loadShop(silent) {
  if (!SLUG) {
    renderNotFound('Đường link thiếu mã quán (?shop=...). Vui lòng hỏi lại quán để lấy đúng link đặt hàng.');
    return false;
  }
  if (!silent) {
    document.getElementById('app-root').replaceChildren(
      el('div', { className: 'wrap' }, el('div', { className: 'empty-box', text: 'Đang tải thực đơn…' }))
    );
  }
  try {
    const data = await rpc('get_public_shop', { p_slug: SLUG });
    if (!data) {
      renderNotFound('Quán không tồn tại hoặc đang tạm đóng. Bạn kiểm tra lại đường link hoặc liên hệ quán nhé.');
      return false;
    }
    ST.shop = data;
    ST.lastMenuAt = Date.now();
    document.title = data.name + ' – Đặt hàng';
    if (window.DDBrand) DDBrand.apply(data);
    // Bỏ món không còn bán khỏi giỏ
    const validIds = new Set((data.items || []).map(i => i.id));
    for (const id of Object.keys(ST.cart)) {
      if (!validIds.has(id)) delete ST.cart[id];
    }
    // Mặc định phương thức thanh toán đầu tiên
    if (!ST.co.payMethodId && data.payment_methods && data.payment_methods.length) {
      ST.co.payMethodId = data.payment_methods[0].id;
    }
    if (!hasMemberTab() && ST.tab === 'member') ST.tab = 'menu';
    renderApp();
    return true;
  } catch (err) {
    if (!silent) {
      document.getElementById('app-root').replaceChildren(
        el('div', { className: 'wrap' },
          el('div', { className: 'card empty-box' },
            el('b', { text: 'Không tải được thực đơn' }),
            el('p', { text: err.message }),
            el('button', { className: 'btn', type: 'button', onClick: () => loadShop(false), text: 'Thử lại' })
          )
        )
      );
    }
    return false;
  }
}

        const cw = strip.firstChild ? strip.firstChild.getBoundingClientRect().width + 10 : 1;
        const idx = Math.min(promos.length - 1, Math.round(strip.scrollLeft / cw));
        [...dots.children].forEach((d, i) => d.classList.toggle('on', i === idx));
      }, { passive: true });
      wrap.append(dots);
    }
  }

  if (!items.length) {
    wrap.append(el('div', { className: 'card empty-box', style: 'margin-top:14px' },
      el('b', { text: 'Thực đơn đang cập nhật' }),
      el('p', { text: 'Hiện quán chưa mở bán món nào. Bạn vui lòng quay lại sau nhé.' })
    ));
    return wrap;
  }

  // Nhóm theo category
  const groups = new Map();
  for (const it of items) {
    const cat = (it.category || '').trim() || 'Khác';
    if (!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(it);
  }
  const catNames = [...groups.keys()];
  if (!ST.activeCat || !groups.has(ST.activeCat)) ST.activeCat = catNames[0];

  if (catNames.length > 1) {
    wrap.append(el('div', { className: 'cat-bar', role: 'group', 'aria-label': 'Nhóm món' },
      catNames.map((cat, idx) => el('button', {
        type: 'button',
        className: 'cat-pill',
        'aria-pressed': String(ST.activeCat === cat),
        onClick: () => {
          ST.activeCat = cat;
          const target = document.getElementById('cat-sec-' + idx);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          renderApp();
        },
        text: cat
      }))
    ));
  }

  catNames.forEach((cat, idx) => {
    wrap.append(el('h2', { className: 'cat-title', id: 'cat-sec-' + idx, text: cat }));
    for (const it of groups.get(cat)) {
      const qty = ST.cart[it.id] || 0;
      const safeImg = it.image_url && String(it.image_url).startsWith('https://') ? it.image_url : null;
      const imgEl = safeImg ? el('img', {
        className: 'item-img',
        src: safeImg,
        alt: it.name,
        loading: 'lazy',
        onError: e => { e.target.classList.add('hidden'); }
      }) : null;

      const actionEl = it.sold_out
        ? el('span', { style: 'font-weight:700;font-size:13.5px;color:var(--error,#b3261e);white-space:nowrap', text: 'Hết hàng' })
        : qty === 0
        ? el('button', {
            type: 'button',
            className: 'btn btn-add',
            disabled: !shop.accepting,
            onClick: () => setCartQty(it.id, 1),
            text: 'Thêm'
          })
        : el('div', { className: 'stepper', role: 'group', 'aria-label': 'Số lượng ' + it.name },
            el('button', { type: 'button', 'aria-label': 'Giảm ' + it.name, onClick: () => setCartQty(it.id, qty - 1), text: '−' }),
            el('output', { className: 'num', text: String(qty) }),
            el('button', { type: 'button', className: 'plus', disabled: qty >= 99, 'aria-label': 'Tăng ' + it.name, onClick: () => setCartQty(it.id, qty + 1), text: '+' })
          );

      wrap.append(el('article', { className: 'card menu-item', style: it.sold_out ? 'opacity:.55' : null },
        imgEl,
        el('div', { className: 'item-info' },
          el('div', { className: 'item-name', text: it.name }),
          it.description ? el('div', { className: 'item-desc', text: it.description }) : null,
          el('div', { className: 'item-price-row' },
            el('span', { className: 'item-price num', text: formatMoney(it.price) }),
            it.unit ? el('span', { className: 'item-unit', text: '/ ' + it.unit }) : null
          )
        ),
        el('div', { className: 'item-act' }, actionEl)
      ));
    }
  });

  return wrap;
}

function setCartQty(itemId, qty) {
  const n = Math.max(0, Math.min(99, qty));
  if (n === 0) delete ST.cart[itemId];
  else ST.cart[itemId] = n;
  ST.co.quote = null;
  renderApp();
  if (!ST.adding && cartCount() > 0 && isValidPhone(ST.profile.phone)) {
    scheduleQuote();
  }
}

/* ===== THÊM MÓN VÀO ĐƠN ĐANG CHỜ (theo v1: món gộp vào cùng đơn, đơn quay lại chờ xác nhận) ===== */
function startAdd(code, phone) {
  closeDialog();
  ST.cartKeep = ST.cart;
  ST.cart = {};
  ST.adding = { code, phone, busy: false };
  switchTab('menu');
}
function stopAdd() {
  if (!ST.adding) return;
  ST.adding = null;
  ST.cart = ST.cartKeep || {};
  ST.cartKeep = null;
}
async function submitAdd(btn) {
  const a = ST.adding;
  if (!a || a.busy) return;
  a.busy = true;
  btn.disabled = true; btn.textContent = 'Đang gửi…';
  try {
    await rpc('add_order_items', { p_slug: SLUG, p_code: a.code, p_phone: a.phone, p_items: cartEntries().map(e => ({ item_id: e.item.id, qty: e.qty })) });
    const code = a.code;
    stopAdd();
    showToast('Đã thêm món vào đơn ' + code + '. Quán sẽ xác nhận lại đơn của bạn.');
    ST.tracked = {};
    switchTab('orders');
  } catch (err) {
    a.busy = false;
    showToast(err.message || 'Không thêm được món, bạn thử lại nhé.', 'error');
    if (/hết|không còn/i.test(err.message || '')) await loadShop(true);
    renderApp();
  }
}

// Nút "Thêm món" trên đơn đang chờ (đổi cách thanh toán do makePayBlock lo).

/* ===== BÁO GIÁ & VOUCHER (DEBOUNCE 400MS) ===== */
function scheduleQuote() {
  clearTimeout(ST.co.quoteTimer);
  const items = cartEntries().map(e => ({ item_id: e.item.id, qty: e.qty }));
  if (!items.length) {
    ST.co.quote = null;
    ST.co.quoteLoading = false;
    return;
  }
  ST.co.quoteLoading = true;
  if (ST.co.open) renderCheckoutContent();
  ST.co.quoteTimer = setTimeout(async () => {
    const seq = ++ST.co.quoteSeq;
    const phone = normalizePhone(ST.profile.phone);
    try {
      const q = await rpc('quote_order', {
        p_slug: SLUG,
        p_phone: isValidPhone(phone) ? phone : '',
        p_items: items,
        p_voucher: ST.co.voucherId || null
      });
      if (seq !== ST.co.quoteSeq) return;
      ST.co.quote = q;
      ST.co.quoteLoading = false;
    } catch (err) {
      if (seq !== ST.co.quoteSeq) return;
      ST.co.quoteLoading = false;
      ST.co.quote = null;
    }
    if (ST.co.open) renderCheckoutContent();
    else renderApp();
  }, 400);
}

async function fetchMyVouchers(phone) {
  const clean = normalizePhone(phone);
  if (!isValidPhone(clean)) {
    ST.co.vouchers = [];
    ST.co.vouchersPhone = '';
    ST.co.voucherId = null;
    return;
  }
  if (ST.co.vouchersPhone === clean) return;
  ST.co.vouchersPhone = clean;
  try {
    const list = await rpc('my_vouchers', { p_slug: SLUG, p_phone: clean });
    if (ST.co.vouchersPhone !== clean) return;
    ST.co.vouchers = Array.isArray(list) ? list : [];
    if (ST.co.voucherId && !ST.co.vouchers.some(v => v.id === ST.co.voucherId)) {
      ST.co.voucherId = null;
    }
    if (ST.co.open) renderCheckoutContent();
  } catch (e) {
    ST.co.vouchers = [];
  }
}

/* ===== HỘP XÁC NHẬN ĐƠN ===== */
let checkoutRefs = null;
function openCheckoutModal(opener) {
  ST.co.open = true;
  ST.co.error = '';
  const shop = ST.shop;
  const places = Array.isArray(shop.places) ? shop.places : [];
  if (places.length && !places.some(p => p.name === ST.profile.place)) {
    ST.profile.place = places[0].name;
  }
  const days = buildDeliveryDays(shop);
  if (!isOpenNow(shop)) ST.co.asap = false;
  if (!ST.co.asap && days.length && !ST.co.deliverAt) {
    ST.co.dayIdx = 0;
    ST.co.deliverAt = days[0].slots[0].iso;
  }
  const body = el('div', { id: 'co-body' });
  const footer = el('div', { id: 'co-footer' });
  openDialog('Xác nhận đơn', body, footer, opener);
  checkoutRefs = { body, footer };
  renderCheckoutContent();
  scheduleQuote();
  if (isValidPhone(ST.profile.phone)) fetchMyVouchers(ST.profile.phone);
}

function placeField(places, selPlace, shop) {
  const feeText = pl => (pl.fee > 0 ? 'Phí giao ' + formatMoney(pl.fee) : 'Miễn phí');
  const subText = pl => [pl.promise ? 'Giao trong khoảng ' + pl.promise : ''].filter(Boolean).join(' · ');
  const subEl = pl => el('small', {}, subText(pl), placeOpenNow(shop, pl) ? null : el('span', { className: 'off-tag', text: ' · Ngoài giờ hoạt động' }));
  const pick = pl => { ST.profile.place = pl.name; ST.co.deliverAt = null; ST.co.dayIdx = 0; ST.co.placeOpen = false; ST.co.placeQ = ''; renderCheckoutContent(); };
  const scopeBtn = (v, txt) => el('button', { type: 'button', className: 'scope-btn', 'aria-pressed': String((ST.profile.scope === 'out') === (v === 'out')), onClick: () => { ST.profile.scope = v; saveProfile(); renderCheckoutContent(); }, text: txt });
  const wrap = el('div', { className: 'field' }, el('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px' },

  if (places.length <= 6) {
    wrap.append(el('div', { className: 'choices' }, places.map(pl => el('button', {
      type: 'button', className: 'choice-btn', 'aria-pressed': String(ST.profile.place === pl.name), onClick: () => pick(pl)
    }, pl.name, subEl(pl)))));
  } else {
    const q = fold(ST.co.placeQ || '');
    const shown = places.filter(pl => !q || fold(pl.name).includes(q) || fold(pl.address || '').includes(q));
    wrap.append(el('button', { type: 'button', className: 'choice-btn', style: 'width:100%;text-align:left', 'aria-pressed': 'true', onClick: () => { ST.co.placeOpen = !ST.co.placeOpen; renderCheckoutContent(); } },
      selPlace ? selPlace.name : 'Chọn nơi giao', el('small', {}, (selPlace ? subText(selPlace) : ''), selPlace && !placeOpenNow(shop, selPlace) ? el('span', { className: 'off-tag', text: ' · Ngoài giờ hoạt động' }) : null, ' · ' + (ST.co.placeOpen ? 'Thu gọn' : 'Bấm để đổi nơi giao'))));
    if (ST.co.placeOpen) {
      wrap.append(el('input', { id: 'co-placeq', className: 'input', style: 'margin-top:8px', placeholder: 'Gõ tên nơi giao để tìm', value: ST.co.placeQ || '', onInput: e => { ST.co.placeQ = e.target.value; renderCheckoutContent(); } }));
      wrap.append(el('div', { style: 'max-height:220px;overflow:auto;margin-top:6px;border:1px solid var(--border);border-radius:10px' },
        shown.length ? shown.map(pl => el('button', { type: 'button', className: 'choice-btn', style: 'width:100%;text-align:left;border:0;border-top:1px solid var(--border);border-radius:0', 'aria-pressed': String(ST.profile.place === pl.name), onClick: () => pick(pl) },
          pl.name, subEl(pl)))
          : [el('div', { style: 'padding:10px;color:var(--text-sub)', text: 'Không tìm thấy nơi giao phù hợp.' })]));
    }
  }
  if (selPlace) {
    const lines = [isOutside() ? 'Chọn chung cư gần nhất' : selPlace.address, selPlace.min_qty > 0 ? 'Tối thiểu ' + selPlace.min_qty + ' sản phẩm' : ''].filter(Boolean);
    if (lines.length) wrap.append(el('div', { style: 'font-size:12.5px;color:var(--text-sub);margin-top:6px', text: lines.join(' · ') }));
  }
  return wrap;
}

// Vẽ lại form xác nhận đơn nhưng giữ con trỏ đang nhập (tránh nhảy con trỏ khi vừa gõ vừa vẽ lại)
function renderCheckoutContent() {
  const a = document.activeElement;
  const id = a && a.id && /^co-/.test(a.id) ? a.id : null;
  let s0 = null, e0 = null;
  if (id) { try { s0 = a.selectionStart; e0 = a.selectionEnd; } catch (_) {} }
  const st = checkoutRefs && checkoutRefs.body ? checkoutRefs.body.scrollTop : null;
  renderCheckoutContentInner();
  if (id) {
    const n = document.getElementById(id);
    if (n && n !== a) {
      try { n.focus({ preventScroll: true }); } catch (_) { n.focus(); }
      if (s0 !== null) { try { n.setSelectionRange(s0, e0); } catch (_) {} }
    }
  }
  if (st !== null && checkoutRefs && checkoutRefs.body) checkoutRefs.body.scrollTop = st;
}
function renderCheckoutContentInner() {
  if (!ST.co.open || !checkoutRefs) return;
  const shop = ST.shop;
  const entries = cartEntries();
  if (!entries.length) { closeDialog(); renderApp(); return; }

  const places = Array.isArray(shop.places) ? shop.places : [];

  const cartQty = cartEntries().reduce((t, e) => t + e.qty, 0);
  const minQty = selPlace ? Math.max(0, Number(selPlace.min_qty) || 0) : 0;

  const methods = Array.isArray(shop.payment_methods) ? shop.payment_methods : [];
  const selMethod = methods.find(m => m.id === ST.co.payMethodId) || methods[0] || null;
  if (selMethod && !ST.co.payMethodId) ST.co.payMethodId = selMethod.id;

  const q = ST.co.quote;
  const sub = q ? q.subtotal : cartSubtotal();
  const disc = q ? (q.discount || 0) : 0;

      days.length > 1 ? el('div', { className: 'day-pills' },
        days.map((d, idx) => el('button', {
          type: 'button', 'aria-pressed': String(ST.co.dayIdx === idx),
          onClick: () => { ST.co.dayIdx = idx; ST.co.deliverAt = d.slots[0].iso; renderCheckoutContent(); },
          text: d.label
        }))
      ) : null,
      el('div', { className: 'field' },
        el('label', { for: 'co-slot', text: 'Khung giờ' }),
        el('select', {
          id: 'co-slot', className: 'select',
          onChange: e => { ST.co.deliverAt = e.target.value; }
        }, (days[ST.co.dayIdx] || days[0]).slots.map(s => el('option', {
          value: s.iso, selected: s.iso === ST.co.deliverAt, text: s.label
        })))
      )
    ) : null
  );

  // Thanh toán
  const isCash = selMethod && /tiền mặt/i.test(selMethod.name);
  const payCard = methods.length ? el('div', { className: 'card' },
    el('div', { style: 'font-weight:700;margin-bottom:8px', text: 'Thanh toán' }),
    el('div', { className: 'choices' },
      methods.map(m => el('button', {
        type: 'button', className: 'choice-btn', 'aria-pressed': String(ST.co.payMethodId === m.id),
        onClick: () => { ST.co.payMethodId = m.id; renderCheckoutContent(); },
        text: m.name
      }))
    )
  ) : null;

  checkoutRefs.body.replaceChildren(
    ST.co.error ? el('div', { className: 'msg msg-err', role: 'alert', text: ST.co.error }) : null,
    summaryCard,
    voucherCard,
    infoCard,
    timeCard,
    payCard
  );

  // Nút đặt đơn ở chân hộp thoại
  const minWarn = belowMin
    ? el('div', { className: 'msg msg-warn', style: 'margin:0 0 8px', text: 'Quán cần tối thiểu ' + formatMoney(minOrder) })
    : null;
  const submitBtn = el('button', {
    type: 'button',
    className: 'btn btn-block',
    disabled: ST.co.submitting || belowMin || belowQty || !shop.accepting || (ST.co.asap ? !isOpenNow(shop) : !ST.co.deliverAt),
    onClick: submitOrder,
    text: ST.co.submitting ? 'Đang gửi đơn…' : ('Đặt đơn · ' + formatMoney(quotedTotal))
  });
  const qtyWarn = belowQty ? el('div', { className: 'msg msg-warn', style: 'margin:0 0 8px', text: 'Nơi giao này cần đặt tối thiểu ' + minQty + ' sản phẩm (hiện có ' + cartQty + ')' }) : null;
  checkoutRefs.footer.replaceChildren(minWarn, qtyWarn, submitBtn);
}

async function submitOrder() {
  if (ST.co.submitting) return;
  const shop = ST.shop;
  const name = (ST.profile.name || '').trim();
  const phone = normalizePhone(ST.profile.phone);
  const places = Array.isArray(shop.places) ? shop.places : [];
  const selPlace = places.find(p => p.name === ST.profile.place) || null;

  if (!name || name.length > 80) {
    ST.co.error = 'Vui lòng nhập tên của bạn (1–80 ký tự).';
    renderCheckoutContent();
    return;
  }
  if (!isValidPhone(phone)) {
    ST.co.error = 'Số điện thoại chưa đúng (10 số bắt đầu bằng 0).';
    renderCheckoutContent();
    return;
  }
  let address = '';
  if (selPlace) {
    const nd = NEEDS[needKey(selPlace)];
    if (isOutside()) {
      const addr = (ST.profile.address || '').trim();
      if (!addr) { ST.co.error = 'Vui lòng nhập địa chỉ nhận hàng ngoài chung cư.'; renderCheckoutContent(); return; }
      address = 'Ngoài chung cư: ' + addr;
    } else {
      const v = (ST.profile[needKey(selPlace)] || '').trim();
      if (!v) { ST.co.error = nd.err; renderCheckoutContent(); return; }
      address = v;
    }
  } else {
    address = (ST.profile.address || '').trim();
  }

  saveProfile();
  const itemsSnapshot = cartEntries().map(e => ({ name: e.item.name, qty: e.qty, price: e.item.price }));
  const payload = {
    p_slug: SLUG,
    p_name: name,
    p_phone: phone,
    p_address: address,
    p_note: (ST.co.note || '').trim(),
    p_items: cartEntries().map(e => ({ item_id: e.item.id, qty: e.qty })),
    p_pay_method: (window.__lastPayId = ST.co.payMethodId || null, window.__lastPayCash = /tiền mặt/i.test(((ST.shop.payment_methods || []).find(m => m.id === ST.co.payMethodId) || {}).name || ''), ST.co.payMethodId || null),
    p_voucher: ST.co.voucherId || null,
    p_place: selPlace ? selPlace.name : null,
    p_deliver_at: ST.co.asap ? null : ST.co.deliverAt
  };

  ST.co.submitting = true;
  ST.co.error = '';
  renderCheckoutContent();

  try {
    const res = await rpc('create_order', payload);
    ST.co.submitting = false;
    ST.co.open = false;
    ST.cart = {};
    ST.co.note = '';
    ST.co.voucherId = null;
    ST.co.quote = null;
    const nowIso = new Date().toISOString();
    saveOrderLocal(res.code, phone, nowIso);
    renderApp();
    openSuccessModal(res, phone, itemsSnapshot, nowIso);
  } catch (err) {
    ST.co.submitting = false;
    ST.co.error = err.message || 'Không gửi được đơn, bạn thử lại nhé.';
    if (/hết|giá|không hợp lệ/i.test(ST.co.error)) {
      await loadShop(true);
      showToast('Thực đơn vừa được cập nhật', 'error');
    }
    renderCheckoutContent();
  }
}

/* ===== MÀN HÌNH ĐẶT ĐƠN THÀNH CÔNG ===== */
/* Khối thanh toán của đơn: hiện cách đang chọn, QR nếu chuyển khoản, nút đổi cách thanh toán */
function makePayBlock(code, phone, total, startId, canChange, onChanged, alreadyReported) {
  const box = el('div');
  let curId = startId || null, picking = false, busy = false, reported = !!alreadyReported;
  const methods = (Array.isArray(ST.shop.payment_methods) ? ST.shop.payment_methods : []);
  const isCashId = id => /tiền mặt/i.test(((methods.find(m => m.id === id) || {}).name) || '');
  const draw = () => {
    const cur = methods.find(m => m.id === curId) || null;
    const cash = cur ? isCashId(curId) : !!window.__lastPayCash;
    const parts = [];
    if (cur) parts.push(el('div', { className: 'card' },
      el('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:10px' },
        el('div', null,
          el('div', { style: 'font-size:13px;color:var(--text-sub)', text: 'Cách thanh toán' }),
          el('b', { text: cur.name })
        ),
        (canChange && methods.length > 1) ? el('button', {
          type: 'button', className: 'btn btn-ghost',
          onClick: () => { picking = !picking; draw(); },
          text: picking ? 'Đóng' : 'Đổi cách thanh toán'
        }) : null
      ),
      picking ? el('div', { className: 'choices', style: 'margin-top:10px' },
        methods.map(m => el('button', {
          type: 'button', className: 'choice-btn', 'aria-pressed': String(curId === m.id), disabled: busy,
          onClick: async () => {
            if (busy || m.id === curId) { picking = false; draw(); return; }
            busy = true; draw();
            try {
              await rpc('change_order_pay', { p_slug: SLUG, p_code: code, p_phone: phone, p_pay_method: m.id });
              curId = m.id; picking = false; busy = false;
              window.__lastPayId = m.id; window.__lastPayCash = isCashId(m.id);
              showToast('Đã đổi sang ' + m.name);
              draw();
              if (onChanged) onChanged(m.id);
            } catch (err) { busy = false; draw(); showToast(err.message, 'error'); }
          },
          text: m.name
        }))
      ) : null
    ));
    if (!cash && window.DDQR && DDQR.canShow(ST.shop) && total > 0) parts.push(el('div', { className: 'card' },
      el('div', { style: 'font-weight:700;margin-bottom:10px;text-align:center', text: 'Quét mã để chuyển khoản' }),
      DDQR.block(ST.shop, total, code),
      ST.shop.payment_note ? el('div', { className: 'pay-note', style: 'margin-top:12px', text: ST.shop.payment_note }) : null
    ));
    else if (!cash && ST.shop.payment_note) parts.push(el('div', { className: 'card' },
      el('div', { style: 'font-weight:700;margin-bottom:6px', text: 'Hướng dẫn chuyển khoản' }),
      el('div', { className: 'pay-note', style: 'margin-top:0', text: ST.shop.payment_note })
    ));
    if (!cash) parts.push(reported
      ? el('div', { className: 'msg msg-ok', role: 'status', text: 'Đã báo quán. Quán sẽ kiểm tra và xác nhận khi nhận được tiền.' })
      : el('button', {
          type: 'button', className: 'btn btn-block', disabled: busy,
          onClick: async () => {
            busy = true; draw();
            try {
              await rpc('report_order_paid', { p_slug: SLUG, p_code: code, p_phone: phone });
              reported = true; busy = false; draw();
            } catch (err) { busy = false; draw(); showToast(err.message, 'error'); }
          },
          text: 'Tôi đã chuyển khoản'
        }));
    box.replaceChildren(...parts);
  };
  draw();
  return box;
}

function openSuccessModal(res, phone, itemsSnapshot, createdIso) {
  const shop = ST.shop;
  const cancelMin = Number(shop.cancel_minutes) || 0;
  const deadline = new Date(createdIso).getTime() + cancelMin * 60000;

  const copyBtn = el('button', {
    type: 'button',
    className: 'btn btn-ghost',
    onClick: () => {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(res.code).then(() => showToast('Đã sao chép mã đơn ' + res.code), () => showToast('Không sao chép được, hãy ghi lại mã ' + res.code));
      } else {
        showToast('Mã đơn của bạn: ' + res.code);
      }
    },
    text: 'Sao chép'
  });

  const cancelBox = el('div');
  const renderCancelBox = () => {
    const leftSec = Math.floor((deadline - Date.now()) / 1000);
    if (cancelMin <= 0 || leftSec <= 0) {
      cancelBox.replaceChildren();
      clearInterval(ST.countdownTimer);
      return;
    }
    const mm = Math.floor(leftSec / 60);
    const ss = leftSec % 60;
    cancelBox.replaceChildren(
      el('div', { className: 'card', style: 'display:flex;align-items:center;justify-content:space-between;gap:10px' },
        el('div', null,
          el('div', { style: 'font-size:13.5px;color:var(--text-sub)', text: 'Còn thời gian tự hủy đơn' }),
          el('b', { className: 'num', style: 'font-size:18px', text: mm + ':' + pad2(ss) })
        ),
        el('button', {
          type: 'button',
          className: 'btn btn-danger',
          onClick: e => confirmDialog(
            'Hủy đơn ' + res.code + '?',
            'Bạn chắc chắn muốn hủy đơn này không?',
            'Xác nhận hủy',
            async () => {
              try {
                await rpc('cancel_order', { p_slug: SLUG, p_code: res.code, p_phone: phone });
                closeDialog();
                showToast('Đã hủy đơn ' + res.code);
                if (ST.tab === 'orders') refreshSavedOrders();
              } catch (err) {
                showToast(err.message, 'error');
              }
            },
            e.currentTarget
          ),
          text: 'Hủy đơn'
        })
      )
    );
  };
  renderCancelBox();
  if (cancelMin > 0) {
    ST.countdownTimer = setInterval(renderCancelBox, 1000);
  }

  const body = el('div', null,
    el('div', { className: 'card', style: 'display:flex;align-items:center;justify-content:space-between;gap:10px' },
      el('div', null,
        el('div', { style: 'font-size:13px;color:var(--text-sub)', text: 'Mã đơn của bạn' }),
        el('div', { className: 'order-code-big num', text: res.code })
      ),
      copyBtn
    ),
    el('div', { className: 'card' },
      itemsSnapshot.map(it => el('div', { className: 'row-kv' },
        el('span', { text: it.qty + ' × ' + it.name }),
        el('span', { className: 'num', text: formatMoney(it.price * it.qty) })
      )),
      res.subtotal != null ? el('div', { className: 'row-kv', style: 'border-top:1px solid var(--border);margin-top:6px;padding-top:8px' },
        el('span', { text: 'Tạm tính' }), el('span', { className: 'num', text: formatMoney(res.subtotal) })
      ) : null,
      res.discount > 0 ? el('div', { className: 'row-kv disc' },
        el('span', { text: 'Giảm giá' }), el('span', { className: 'num', text: '−' + formatMoney(res.discount) })
      ) : null,
      res.delivery_fee > 0 ? el('div', { className: 'row-kv' },
        el('span', { text: 'Phí giao' }), el('span', { className: 'num', text: formatMoney(res.delivery_fee) })
      ) : null,
      el('div', { className: 'row-kv total' },
        el('span', { text: 'Tổng thanh toán' }), el('span', { className: 'num', text: formatMoney(res.total) })
      )
    ),
    makePayBlock(res.code, phone, res.total, window.__lastPayId, true),
    orderEditButtons({ code: res.code, can_add: true }, phone),
    cancelBox
  );

  const footer = el('div', { style: 'display:flex;gap:10px' },
    el('button', {
      type: 'button', className: 'btn btn-ghost', style: 'flex:1',
      onClick: () => { closeDialog(); switchTab('orders'); },
      text: 'Xem đơn của tôi'
    }),
    el('button', {
      type: 'button', className: 'btn', style: 'flex:1',
      onClick: closeDialog,
      text: 'Đặt thêm'
    })
  );

  openDialog('Đặt đơn thành công', body, footer);
}

/* ===== TAB 2: ĐƠN CỦA TÔI ===== */
async function refreshSavedOrders() {
  if (!ST.savedOrders.length) return;
  await Promise.all(ST.savedOrders.map(async o => {
    try {
      const data = await rpc('track_order', { p_slug: SLUG, p_code: o.code, p_phone: o.phone });
      if (data) ST.tracked[o.code] = Object.assign({ phone: o.phone }, data);
    } catch (e) {}
  }));
  if (ST.tab === 'orders') renderApp();
}

  const cancelMin = Number(ST.shop.cancel_minutes) || 0;
  const createdMs = info.created_at ? new Date(info.created_at).getTime() : 0;
  const canCancel = info.status === 'new' && cancelMin > 0 && (Date.now() - createdMs) < cancelMin * 60000;

  return el('div', { className: 'card' },
    el('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap' },
      el('b', { className: 'num', style: 'font-size:17px', text: info.code }),
      el('span', { className: badgeCls, text: STATUS_LABELS[info.status] || info.status })
    ),
    info.created_at ? el('div', { style: 'font-size:13px;color:var(--text-sub);margin-top:4px', text: 'Đặt lúc ' + formatVnDateTime(info.created_at) }) : null,
    Array.isArray(info.items) ? el('div', { style: 'margin-top:8px;border-top:1px solid var(--border);padding-top:8px' },
      info.items.map(it => el('div', { className: 'row-kv' },
        el('span', { text: it.qty + ' × ' + it.name }),
        el('span', { className: 'num', text: formatMoney(it.price * it.qty) })
      ))
    ) : null,
    info.discount > 0 ? el('div', { className: 'row-kv disc' },
      el('span', { text: 'Giảm giá' }), el('span', { className: 'num', text: '−' + formatMoney(info.discount) })
    ) : null,
    el('div', { className: 'row-kv total' },
      el('span', { text: 'Tổng cộng' }), el('span', { className: 'num', text: formatMoney(info.total) })
    ),
    (info.status === 'cancelled' && info.cancel_reason) ? el('div', { className: 'msg msg-err', style: 'margin-top:10px', text: 'Quán đã hủy đơn này: ' + info.cancel_reason }) : null,
    (info.pay_status === 'checking' && info.status !== 'cancelled' && !(info.can_change_pay && info.pay_method_id)) ? el('div', { className: 'msg msg-ok', style: 'margin-top:10px', role: 'status', text: 'Bạn đã báo chuyển khoản. Quán đang kiểm tra.' }) : null,
    (info.can_change_pay && info.pay_method_id) ? el('div', { style: 'margin-top:10px' }, makePayBlock(info.code, phone, info.total, info.pay_method_id, true, () => refreshSavedOrders(), info.pay_status === 'checking')) : null,
    orderEditButtons(info, phone),
    canCancel ? el('button', {
      type: 'button', className: 'btn btn-danger btn-block', style: 'margin-top:10px',
      onClick: e => confirmDialog(
        'Hủy đơn ' + info.code + '?',
        'Bạn chắc chắn muốn hủy đơn này không?',
        'Xác nhận hủy',
        async () => {
          try {
            await rpc('cancel_order', { p_slug: SLUG, p_code: info.code, p_phone: phone });
            closeDialog();
            showToast('Đã hủy đơn ' + info.code);
            refreshSavedOrders();
          } catch (err) { showToast(err.message, 'error'); }
        },
        e.currentTarget
      ),
      text: 'Hủy đơn'
    }) : null,
    info.status === 'done' && info.feedback_sent === false ? el('button', {
      type: 'button', className: 'btn btn-block', style: 'margin-top:10px',
      onClick: e => openFeedbackModal(info.code, phone, e.currentTarget),
      text: 'Đánh giá đơn này'
    }) : null,
    info.status === 'done' && info.feedback_sent === true
      ? el('div', { style: 'margin-top:8px;font-size:13.5px;color:var(--accent);font-weight:600', text: 'Cảm ơn bạn đã đánh giá đơn này.' })
      : null
  );
}

function renderOrdersView() {
  const wrap = el('div');
  wrap.append(el('h2', { className: 'cat-title', text: 'Đơn của tôi' }));

  // Form tra cứu đơn không có trong máy
  const codeInp = el('input', { className: 'input', id: 'lk-code', placeholder: 'Mã đơn (ví dụ: D3F9A1)', autocomplete: 'off' });
  const phoneInp = el('input', { className: 'input', id: 'lk-phone', type: 'tel', inputmode: 'tel', placeholder: 'Số điện thoại đặt đơn', value: ST.profile.phone || '' });
  const errBox = el('div');
  const lkBtn = el('button', {
    type: 'button', className: 'btn btn-block', style: 'margin-top:12px',
    onClick: async () => {
      errBox.replaceChildren();
      const code = codeInp.value.trim().toUpperCase();
      const phone = normalizePhone(phoneInp.value);
      if (!code || !isValidPhone(phone)) {
        errBox.replaceChildren(el('div', { className: 'msg msg-err', text: 'Vui lòng nhập mã đơn và số điện thoại hợp lệ.' }));
        return;
      }
      lkBtn.disabled = true; lkBtn.textContent = 'Đang tra cứu…';
      try {
        const res = await rpc('track_order', { p_slug: SLUG, p_code: code, p_phone: phone });
        if (!res) {
          errBox.replaceChildren(el('div', { className: 'msg msg-err', text: 'Không tìm thấy đơn khớp mã và số điện thoại này.' }));
        } else {
          ST.lookupOrder = Object.assign({ phone }, res);
          saveOrderLocal(res.code, phone, res.created_at);
          ST.tracked[res.code] = ST.lookupOrder;
          renderApp();
        }
      } catch (err) {
        errBox.replaceChildren(el('div', { className: 'msg msg-err', text: err.message }));
      } finally {
        lkBtn.disabled = false; lkBtn.textContent = 'Tra cứu đơn';
      }
    },
    text: 'Tra cứu đơn'
  });

  wrap.append(el('div', { className: 'card' },
    el('div', { style: 'font-weight:700', text: 'Tra cứu bằng mã đơn + số điện thoại' }),
    el('div', { className: 'field' }, el('label', { for: 'lk-code', text: 'Mã đơn' }), codeInp),
    el('div', { className: 'field' }, el('label', { for: 'lk-phone', text: 'Số điện thoại' }), phoneInp),
    errBox,
    lkBtn
  ));

  if (!ST.savedOrders.length) {
    wrap.append(el('div', { className: 'card empty-box' },
      el('b', { text: 'Chưa có đơn nào trên máy này' }),
      el('p', { text: 'Bạn đặt đơn ở mục Thực đơn hoặc nhập mã đơn phía trên để theo dõi trạng thái.' })
    ));
    return wrap;
  }

  for (const o of ST.savedOrders) {
    const info = ST.tracked[o.code];
    if (info) {
      wrap.append(renderOrderCard(info, o.phone));
    } else {
      wrap.append(el('div', { className: 'card' },
        el('div', { style: 'display:flex;justify-content:space-between' },
          el('b', { className: 'num', text: o.code }),
          el('span', { style: 'font-size:13.5px;color:var(--text-sub)', text: 'Đang kiểm tra…' })
        )
      ));
    }
  }
  return wrap;
}

/* ===== HỘP ĐÁNH GIÁ ĐƠN ===== */
function openFeedbackModal(code, phone, opener) {
  const fb = { rating: 5, comment: '', want: 'notify', error: '', busy: false };
  const body = el('div');
  const footer = el('div');

  const draw = () => {
    const wants = [
      { id: 'exchange', label: 'Đổi món' },
      { id: 'refund', label: 'Hoàn tiền' },
      { id: 'notify', label: 'Chỉ báo để quán biết' }
    ];
    body.replaceChildren(
      fb.error ? el('div', { className: 'msg msg-err', role: 'alert', text: fb.error }) : null,
      el('div', { style: 'font-weight:600', text: 'Bạn đánh giá đơn ' + code + ' mấy sao?' }),
      el('div', { className: 'stars', role: 'group', 'aria-label': 'Chọn số sao' },
        [1, 2, 3, 4, 5].map(s => el('button', {
          type: 'button',
          className: s <= fb.rating ? 'on' : '',
          'aria-label': s + ' sao',
          onClick: () => { fb.rating = s; if (s > 3) fb.want = 'notify'; draw(); },
          text: '★'
        }))
      ),
      fb.rating <= 3 ? el('div', { className: 'field' },
        el('label', { text: 'Bạn muốn quán xử lý thế nào?' }),
        el('div', { className: 'choices' },
          wants.map(w => el('button', {
            type: 'button', className: 'choice-btn', 'aria-pressed': String(fb.want === w.id),
            onClick: () => { fb.want = w.id; draw(); },
            text: w.label
          }))
        )
      ) : null,
      el('div', { className: 'field' },
        el('label', { for: 'fb-comment' }, 'Nhận xét ', el('span', { className: 'opt', text: '(không bắt buộc)' })),
        el('textarea', {
          id: 'fb-comment', className: 'textarea', maxlength: 500,
          placeholder: 'Chia sẻ thêm cảm nhận của bạn…',
          value: fb.comment,
          onInput: e => { fb.comment = e.target.value; }
        })
      )
    );
    footer.replaceChildren(
      el('button', {
        type: 'button', className: 'btn btn-block', disabled: fb.busy,
        onClick: async () => {
          fb.busy = true; fb.error = ''; draw();
          try {
            await rpc('submit_feedback', {
              p_slug: SLUG, p_code: code, p_phone: phone,
              p_rating: fb.rating, p_comment: fb.comment.trim(),
              p_want: fb.rating <= 3 ? fb.want : 'notify'
            });
            closeDialog();
            showToast('Cảm ơn bạn đã gửi đánh giá!');
            refreshSavedOrders();
          } catch (err) {
            fb.busy = false; fb.error = err.message; draw();
          }
        },
        text: fb.busy ? 'Đang gửi…' : 'Gửi đánh giá'
      })
    );
  };
  openDialog('Đánh giá đơn hàng', body, footer, opener);
  draw();
}

/* ===== TAB 3: THÀNH VIÊN ===== */
function renderMemberView() {
  const wrap = el('div');
  const promos = ((ST.shop && ST.shop.promos) || []).filter(p => (p.kind === 'loyalty' || p.kind === 'voucher' || p.audience === 'member') && p.running !== false);

  wrap.append(el('h2', { className: 'cat-title', text: 'Thành viên & Ưu đãi' }));

  if (promos.length) {
    wrap.append(el('div', { className: 'card' },
      el('div', { style: 'font-weight:700;margin-bottom:8px', text: 'Quyền lợi thành viên' }),
      promos.map(p => el('div', { style: 'padding:8px 0;border-top:1px solid var(--border)' },
        el('b', { text: p.name }),
        (p.text || p.description) ? el('div', { style: 'font-size:14px;color:var(--text-sub);margin-top:2px', text: p.text || p.description }) : null,
        p.to_date ? el('div', { style: 'font-size:12.5px;color:var(--accent);margin-top:2px', text: 'Hạn đến ' + formatYmdShort(p.to_date) }) : null
      ))
    ));
  }

  // Form đăng ký thành viên
  const mName = el('input', { className: 'input', id: 'mb-name', maxlength: 80, value: ST.profile.name || '', placeholder: 'Tên của bạn' });
  const mPhone = el('input', { className: 'input', id: 'mb-phone', type: 'tel', inputmode: 'tel', value: ST.profile.phone || '', placeholder: '09xx xxx xxx' });
  const mApt = el('input', { className: 'input', id: 'mb-apt', maxlength: 60, value: ST.profile.apt || '', placeholder: 'Số căn hộ / phòng (nếu có)' });
  const mMsg = el('div');
  const mBtn = el('button', {
    type: 'button', className: 'btn btn-block', style: 'margin-top:12px',
    onClick: async () => {
      mMsg.replaceChildren();
      const name = mName.value.trim();
      const phone = normalizePhone(mPhone.value);
      if (!name) { mMsg.replaceChildren(el('div', { className: 'msg msg-err', text: 'Vui lòng nhập tên của bạn.' })); return; }
      if (!isValidPhone(phone)) { mMsg.replaceChildren(el('div', { className: 'msg msg-err', text: 'Số điện thoại chưa hợp lệ.' })); return; }
      mBtn.disabled = true; mBtn.textContent = 'Đang đăng ký…';
      try {
        await rpc('join_member', { p_slug: SLUG, p_name: name, p_phone: phone, p_apt: mApt.value.trim() });
        ST.profile.name = name; ST.profile.phone = phone; ST.profile.apt = mApt.value.trim();
        saveProfile();
        mMsg.replaceChildren(el('div', { className: 'msg msg-ok', text: 'Đăng ký thành viên thành công! Bạn có thể kiểm tra voucher bên dưới.' }));
      } catch (err) {
        mMsg.replaceChildren(el('div', { className: 'msg msg-err', text: err.message }));
      } finally {
        mBtn.disabled = false; mBtn.textContent = 'Đăng ký thành viên';
      }
    },
    text: 'Đăng ký thành viên'
  });

  wrap.append(el('div', { className: 'card' },
    el('div', { style: 'font-weight:700', text: 'Đăng ký thành viên' }),
    el('div', { className: 'field' }, el('label', { for: 'mb-name', text: 'Tên' }), mName),
    el('div', { className: 'field' }, el('label', { for: 'mb-phone', text: 'Số điện thoại' }), mPhone),
    el('div', { className: 'field' }, el('label', { for: 'mb-apt' }, 'Căn hộ ', el('span', { className: 'opt', text: '(không bắt buộc)' })), mApt),
    mMsg,
    mBtn
  ));

  // Xem voucher theo số điện thoại
  const vPhone = el('input', { className: 'input', id: 'mv-phone', type: 'tel', inputmode: 'tel', value: ST.profile.phone || '', placeholder: 'Nhập số điện thoại' });
  const vListBox = el('div', { style: 'margin-top:10px' });
  const vBtn = el('button', {
    type: 'button', className: 'btn btn-ghost btn-block', style: 'margin-top:10px',
    onClick: async () => {
      const phone = normalizePhone(vPhone.value);
      if (!isValidPhone(phone)) {
        vListBox.replaceChildren(el('div', { className: 'msg msg-err', text: 'Số điện thoại chưa hợp lệ.' }));
        return;
      }
      vBtn.disabled = true; vBtn.textContent = 'Đang tìm…';
      try {
        const list = await rpc('my_vouchers', { p_slug: SLUG, p_phone: phone });
        ST.profile.phone = phone; saveProfile();
        ST.co.vouchers = Array.isArray(list) ? list : [];
        ST.co.vouchersPhone = phone;
        if (!ST.co.vouchers.length) {
          vListBox.replaceChildren(el('div', { style: 'font-size:14px;color:var(--text-sub)', text: 'Hiện bạn chưa có voucher nào còn hạn.' }));
        } else {
          vListBox.replaceChildren(ST.co.vouchers.map(v => el('div', {
            style: 'display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border)'
          },
            el('div', null,
              el('b', { text: v.name }),
              el('div', { style: 'font-size:13.5px;color:var(--text-sub)', text: (v.text || '') + (v.expires_at ? ' · HSD ' + formatYmdShort(v.expires_at) : '') })
            ),
            el('button', {
              type: 'button', className: 'btn',
              onClick: () => { ST.co.voucherId = v.id; showToast('Đã chọn voucher ' + v.name); switchTab('menu'); },
              text: 'Dùng ngay'
            })
          )));
        }
      } catch (err) {
        vListBox.replaceChildren(el('div', { className: 'msg msg-err', text: err.message }));
      } finally {
        vBtn.disabled = false; vBtn.textContent = 'Xem voucher của tôi';
      }
    },
    text: 'Xem voucher của tôi'
  });

  wrap.append(el('div', { className: 'card' },
    el('div', { style: 'font-weight:700', text: 'Voucher của tôi' }),
    el('div', { className: 'field' }, el('label', { for: 'mv-phone', text: 'Số điện thoại' }), vPhone),
    vBtn,
    vListBox
  ));

  return wrap;
}

/* ===== TỰ LÀM MỚI MENU SAU 5 PHÚT QUAY LẠI TAB ===== */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && ST.shop && (Date.now() - ST.lastMenuAt) > 300000) {
    loadShop(true);
  }
});

/* ===== KHỞI ĐỘNG ===== */
loadShop(false);
</script>
</body>
</html>
