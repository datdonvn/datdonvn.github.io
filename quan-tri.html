<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body { overflow-x: hidden; font-family: "Be Vietnam Pro", var(--font, system-ui, sans-serif); }
.num { font-variant-numeric: tabular-nums; }

/* Bố cục trang Quản trị */
.qt-wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 12px 14px calc(92px + env(safe-area-inset-bottom));
}
@media (min-width: 900px) {
  .qt-wrap { padding-bottom: 48px; }
}

/* Thanh thẻ điều hướng */
.qt-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 12;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.qt-nav-in { max-width: 960px; margin: 0 auto; display: flex; }
.qt-nav button {
  flex: 1;
  min-height: 56px;
  padding: 6px 4px;
  border: 0;
  background: transparent;
  color: var(--text-sub);
  font: 600 12.5px/1.2 inherit;
  cursor: pointer;
}
.qt-nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
@media (min-width: 900px) {
  .qt-nav { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .qt-nav-in { flex-wrap: wrap; gap: 4px; padding: 6px 14px; }
  .qt-nav button { flex: 0 0 auto; min-height: 44px; padding: 8px 14px; border-radius: 999px; font-size: 14px; }
  .qt-nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
}

/* Chọn khoảng ngày */
.range-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

/* Thẻ số liệu KPI */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.kpi-card small { display: block; color: var(--text-sub); font-size: 13px; }
.kpi-card b { display: block; font-size: 20px; margin-top: 3px; word-break: break-word; }
.kpi-card .sub { display: block; font-size: 12.5px; color: var(--text-sub); margin-top: 2px; }

.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

/* Bảng số liệu */
.table-scroll { overflow-x: auto; margin-top: 8px; }
table.qt-tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.qt-tbl th, table.qt-tbl td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; }
table.qt-tbl th { font-size: 13px; color: var(--text-sub); font-weight: 600; white-space: nowrap; }
table.qt-tbl th.sortable { cursor: pointer; user-select: none; }
table.qt-tbl .r { text-align: right; white-space: nowrap; }
table.qt-tbl tr.sum-row td { font-weight: 700; border-top: 2px solid var(--border); }
table.qt-tbl tr.warn-row { background: var(--warn-bg); }
table.qt-tbl tr.clickable { cursor: pointer; }
table.qt-tbl tr.clickable:hover { background: var(--accent-soft); }

/* Biểu đồ SVG thuần */
.chart-cap { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
.chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.qt-svg { display: block; width: 100%; height: auto; overflow: visible; }
.qt-svg g[tabindex] { cursor: pointer; outline: none; }
.qt-svg g[tabindex]:focus-visible rect.hit { stroke: var(--yellow); stroke-width: 2; }

/* Thanh tiến độ ngang */
.hbar { margin-top: 10px; }
.hbar:first-child { margin-top: 0; }
.hbar-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14.5px; }
.hbar-track { height: 10px; border-radius: 6px; background: var(--accent-soft); margin-top: 5px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 6px; background: var(--accent); }
.hbar-fill.done { background: var(--yellow); }

.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
.badge-warn { background: var(--warn-bg); color: var(--warn-text); }
.badge-err { background: var(--error-bg); color: var(--error); }
.badge-muted { background: var(--surface-alt); color: var(--text-sub); }

.input, .select { min-height: 44px; font-size: 16px; }
.btn { min-height: 44px; }
.btn-sm { min-height: 44px; padding: 8px 12px; }

/* Thanh tiến độ xuất CSV */
.prog-bar { height: 10px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; margin-top: 8px; }
.prog-bar > div { height: 100%; background: var(--accent); transition: width 0.2s; }

/* Hộp thoại */
.modal-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.52); display: flex; align-items: flex-end; justify-content: center; }
.modal-sheet { width: 100%; max-width: 600px; max-height: 90dvh; background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 640px) { .modal-backdrop { align-items: center; padding: 16px; } .modal-sheet { border-radius: 18px; } }
.modal-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.modal-hd h2 { margin: 0; font-size: 17px; }
.modal-close { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-alt); color: var(--text); font-size: 22px; font-weight: 700; cursor: pointer; }
.modal-body { padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; flex: 1; }
.modal-ft { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.empty-state { text-align: center; padding: 28px 14px; color: var(--text-sub); }
</style>
</head>
<body>
<div id="dd-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="chung.js"></script>
<script>
'use strict';

(async function () {
  const app = await DatdonApp.start({ page: 'quan-tri' });
  const sb = app.sb;
  const shopId = app.shop.id;
  const el = app.el;
  const SVGNS = 'http://www.w3.org/2000/svg';

  const showErr = err => app.showToast(app.translateServerError(err), 'error');
  const pct = (part, total) => total ? (part / total * 100).toFixed(1).replace('.', ',') + '%' : '0%';
  const fmtDmy = ymd => {
    const m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] : ymd;
  };
  const fmtDmyFull = ymd => {
    const m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : ymd;
  };

  /* ===== HỘP THOẠI ===== */
  const modalRoot = el('div');
  document.body.append(modalRoot);
  let lastOpener = null;
  function closeModal() {
    modalRoot.replaceChildren();
    if (lastOpener && typeof lastOpener.focus === 'function') lastOpener.focus();
    lastOpener = null;
  }
  function openModal(title, body, footer, opener) {
    lastOpener = opener || document.activeElement;
    const sheet = el('div', { className: 'modal-sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      el('div', { className: 'modal-hd' },
        el('h2', { text: title }),
        el('button', { type: 'button', className: 'modal-close', 'aria-label': 'Đóng', onClick: closeModal, text: '×' })
      ),
      el('div', { className: 'modal-body' }, body),
      footer ? el('div', { className: 'modal-ft' }, footer) : null
    );
    const backdrop = el('div', { className: 'modal-backdrop', onClick: e => { if (e.target === backdrop) closeModal(); } }, sheet);
    modalRoot.replaceChildren(backdrop);
    const first = sheet.querySelector('button, input, select');
    if (first) first.focus();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalRoot.children.length) closeModal(); });

  /* ===== DANH SÁCH TAB THEO GÓI ===== */
  const ALL_TABS = [
    { id: 'overview', label: 'Tổng quan', minPlan: 'standard' },
    { id: 'payment', label: 'Thanh toán', minPlan: 'standard' },
    { id: 'orders', label: 'Đơn hàng', minPlan: 'standard' },
    { id: 'goal', label: 'Mục tiêu', minPlan: 'pro' },
    { id: 'cashflow', label: 'Dòng tiền', minPlan: 'pro' },
    { id: 'costing', label: 'Giá vốn', minPlan: 'pro' },
    { id: 'inventory', label: 'Kho', minPlan: 'pro' },
    { id: 'debt', label: 'Nợ NCC', minPlan: 'pro' },
    { id: 'pnl', label: 'Kết quả KD', minPlan: 'proplus' },
    { id: 'customers', label: 'Khách hàng', minPlan: 'proplus' },
    { id: 'feedback', label: 'Đánh giá', minPlan: 'proplus' }
  ];
  const TABS = ALL_TABS.filter(t => app.hasPlan(t.minPlan));

  /* ===== KHOẢNG NGÀY MẶC ĐỊNH: THÁNG NÀY (GIỜ VIỆT NAM) ===== */
  const todayYmd = app.toVnYmd(new Date());
  const thisMonthStart = todayYmd.slice(0, 8) + '01';
  function prevMonthRange() {
    const y = Number(todayYmd.slice(0, 4));
    const m = Number(todayYmd.slice(5, 7));
    const py = m === 1 ? y - 1 : y;
    const pm = m === 1 ? 12 : m - 1;
    const lastDay = new Date(Date.UTC(py, pm, 0)).getUTCDate();
    return { from: py + '-' + app.pad2(pm) + '-01', to: py + '-' + app.pad2(pm) + '-' + app.pad2(lastDay) };
  }

  const ST = {
    tab: 'overview',
    preset: 'month', // 'today' | '7d' | 'month' | 'prev_month' | 'custom'
    from: thisMonthStart,
    to: todayYmd,
    goalMonth: thisMonthStart,
    loading: false,
    // Dữ liệu từng tab
    revenue: null,
    salesByMethod: null,
    goalData: null,
    orders: [],
    ordersOffset: 0,
    ordersHasMore: false,
    payMethodsMap: new Map(),
    cashflow: null,
    costing: null,
    costSort: { col: 'gross', desc: true },
    inventory: null,
    debts: [],
    pnl: null,
    customers: null,
    feedbacks: []
  };

  /* ===== VẼ BIỂU ĐỒ SVG THUẦN (CÓ TƯƠNG TÁC CHẠM/CLICK) ===== */
  function sv(tag, attrs, ...kids) {
    const node = document.createElementNS(SVGNS, tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v !== null && v !== undefined) node.setAttribute(k, String(v));
      }
    }
    for (const c of kids.flat(Infinity)) {
      if (c !== null && c !== undefined) node.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return node;
  }

  function renderSvgBarChart(title, labels, series, fmtVal) {
    if (!labels.length) return el('div', { className: 'empty-state', text: 'Chưa có dữ liệu trong khoảng thời gian này.' });
    const n = labels.length;
    const k = series.length;
    const W = 560, H = 190, pl = 8, pr = 8, pt = 14, pb = 26;
    const allVals = series.flatMap(s => s.values);
    const maxV = Math.max(1, ...allVals);
    const minV = Math.min(0, ...allVals);
    const yOf = v => pt + (H - pt - pb) * (maxV - v) / (maxV - minV);
    const y0 = yOf(0);
    const gw = (W - pl - pr) / n;
    const bw = Math.max(4, Math.min(28, (gw * 0.76 - (k - 1) * 2) / k));

    let sel = n - 1;
    const cap = el('div', { className: 'chart-cap num' });
    const hits = [];
    const grp = sv('g');

    const labelText = i => labels[i] + ': ' + series.map(s => (k > 1 ? s.name + ' ' : '') + fmtVal(s.values[i])).join(' · ');
    const updateSel = i => {
      sel = i;
      cap.textContent = labelText(i);
      hits.forEach((r, idx) => r.setAttribute('fill', idx === sel ? 'rgba(30,77,58,0.12)' : 'transparent'));
    };

    const step = n <= 10 ? 1 : Math.ceil(n / 8);
    labels.forEach((lb, i) => {
      const gx = pl + gw * i;
      const cx = gx + gw / 2;
      const bx0 = cx - (k * bw + (k - 1) * 2) / 2;
      const hit = sv('rect', { class: 'hit', x: gx, y: 0, width: gw, height: H - pb, rx: 4, fill: 'transparent' });
      hits.push(hit);
      const gi = sv('g', { tabindex: 0, role: 'button', 'aria-label': labelText(i) }, hit);
      series.forEach((s, j) => {
        const v = s.values[i];
        const yy = yOf(v);
        const top = Math.min(yy, y0);
        const ht = Math.max(2, Math.abs(yy - y0));
        gi.append(sv('rect', {
          x: bx0 + j * (bw + 2), y: top, width: bw, height: ht, rx: 3,
          fill: v === 0 ? 'var(--border)' : s.color
        }));
      });
      if (i % step === 0 || i === n - 1) {
        gi.append(sv('text', {
          x: cx, y: H - 6, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--text-sub)'
        }, lb));
      }
      gi.addEventListener('click', () => updateSel(i));
      gi.addEventListener('pointerenter', () => updateSel(i));
      gi.addEventListener('focus', () => updateSel(i));
      grp.append(gi);
    });
    updateSel(sel);

    const svg = sv('svg', { class: 'qt-svg', viewBox: '0 0 ' + W + ' ' + H, role: 'group', 'aria-label': title },
      sv('line', { x1: pl, x2: W - pr, y1: y0, y2: y0, stroke: 'var(--border)', 'stroke-width': 1 }),
      grp
    );

    return el('div', null,
      k > 1 ? el('div', { className: 'chart-legend' }, series.map(s => el('span', null, el('i', { style: 'background:' + s.color }), s.name))) : null,
      cap,
      svg
    );
  }

  function buildFullDayRange(fromYmd, toYmd) {
    const out = [];
    let cur = fromYmd;
    let guard = 0;
    while (cur <= toYmd && guard < 370) {
      out.push(cur);
      cur = app.shiftYmd(cur, 1);
      guard++;
    }
    return out;
  }

  function groupSeriesIfLong(dayRows, valueKeys) {
    if (dayRows.length <= 31) {
      return dayRows.map(r => Object.assign({ label: fmtDmy(r.day) }, r));
    }
    const byMonth = dayRows.length > 93;
    const buckets = new Map();
    for (const r of dayRows) {
      let key;
      if (byMonth) {
        key = r.day.slice(0, 7);
      } else {
        const d = new Date(r.day + 'T00:00:00Z');
        const wd = (d.getUTCDay() + 6) % 7; // Thứ 2 = 0
        key = app.shiftYmd(r.day, -wd);
      }
      if (!buckets.has(key)) {
        const init = { label: byMonth ? ('T' + Number(key.slice(5)) + '/' + key.slice(2, 4)) : ('Tuần ' + fmtDmy(key)) };
        valueKeys.forEach(k => { init[k] = 0; });
        buckets.set(key, init);
      }
      const b = buckets.get(key);
      valueKeys.forEach(k => { b[k] += Number(r[k]) || 0; });
    }
    return [...buckets.values()];
  }

  /* ===== KHUNG GIAO DIỆN CHÍNH ===== */
  const root = document.getElementById('dd-root');
  const navHost = el('div');
  const contentHost = el('div', { className: 'qt-wrap' });
  root.replaceChildren(el('div', { className: 'dd-wrap' }, navHost, contentHost));

  function renderNav() {
    const isWide = window.innerWidth >= 900;
    const visible = (!isWide && TABS.length > 5) ? TABS.slice(0, 4) : TABS;
    const overflow = (!isWide && TABS.length > 5) ? TABS.slice(4) : [];
    const btns = visible.map(t => el('button', {
      type: 'button',
      'aria-current': ST.tab === t.id ? 'page' : null,
      onClick: () => switchTab(t.id),
      text: t.label
    }));
    if (overflow.length) {
      const activeMore = overflow.some(t => t.id === ST.tab);
      btns.push(el('button', {
        type: 'button',
        'aria-current': activeMore ? 'page' : null,
        onClick: e => openModal('Báo cáo khác', el('div', { style: 'display:grid;gap:8px' },
          overflow.map(t => el('button', {
            type: 'button',
            className: 'btn' + (ST.tab === t.id ? ' btn-primary' : ''),
            style: 'width:100%;justify-content:flex-start',
            onClick: () => { closeModal(); switchTab(t.id); },
            text: t.label
          }))
        ), null, e.currentTarget),
        text: 'Thêm'
      }));
    }
    navHost.replaceChildren(el('nav', { className: 'qt-nav', 'aria-label': 'Mục báo cáo' },
      el('div', { className: 'qt-nav-in' }, btns)
    ));
  }
  window.addEventListener('resize', () => renderNav());

  function renderRangeBar() {
    const presets = [
      { id: 'today', label: 'Hôm nay', calc: () => ({ from: todayYmd, to: todayYmd }) },
      { id: '7d', label: '7 ngày', calc: () => ({ from: app.shiftYmd(todayYmd, -6), to: todayYmd }) },
      { id: 'month', label: 'Tháng này', calc: () => ({ from: thisMonthStart, to: todayYmd }) },
      { id: 'prev_month', label: 'Tháng trước', calc: prevMonthRange }
    ];
    return el('div', { className: 'card', style: 'padding:12px' },
      el('div', { className: 'range-bar' },
        el('div', { className: 'chips' },
          presets.map(p => el('button', {
            type: 'button', className: 'chip', 'aria-pressed': String(ST.preset === p.id),
            onClick: async () => {
              const r = p.calc();
              ST.preset = p.id; ST.from = r.from; ST.to = r.to;
              await reloadCurrentTab();
            },
            text: p.label
          }))
        ),
        el('div', { style: 'display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto' },
          el('input', {
            className: 'input', type: 'date', 'aria-label': 'Từ ngày', value: ST.from, style: 'width:auto',
            onChange: async e => { if (!e.target.value) return; ST.preset = 'custom'; ST.from = e.target.value; await reloadCurrentTab(); }
          }),
          el('span', { text: '–' }),
          el('input', {
            className: 'input', type: 'date', 'aria-label': 'Đến ngày', value: ST.to, style: 'width:auto',
            onChange: async e => { if (!e.target.value) return; ST.preset = 'custom'; ST.to = e.target.value; await reloadCurrentTab(); }
          }),
          el('button', { type: 'button', className: 'btn btn-sm', onClick: reloadCurrentTab, text: 'Tải lại' })
        )
      )
    );
  }

  async function switchTab(id) {
    ST.tab = id;
    renderNav();
    await reloadCurrentTab();
    window.scrollTo({ top: 0 });
  }

  async function reloadCurrentTab() {
    ST.loading = true;
    contentHost.replaceChildren(
      ST.tab !== 'goal' && ST.tab !== 'inventory' && ST.tab !== 'debt' ? renderRangeBar() : null,
      el('div', { className: 'card empty-state', text: 'Đang tải số liệu…' })
    );
    try {
      if (ST.tab === 'overview') {
        const reqs = [
          sb.rpc('report_revenue', { p_shop: shopId, p_from: ST.from, p_to: ST.to }),
          sb.rpc('report_sales_by_method', { p_shop: shopId, p_from: ST.from, p_to: ST.to })
        ];
        if (app.hasPlan('pro')) reqs.push(sb.rpc('report_goal', { p_shop: shopId, p_month: thisMonthStart }));
        const res = await Promise.all(reqs);
        if (res[0].error) throw res[0].error;
        if (res[1].error) throw res[1].error;
        ST.revenue = res[0].data;
        ST.salesByMethod = res[1].data;
        if (app.hasPlan('pro') && res[2] && !res[2].error) ST.goalData = res[2].data;
      } else if (ST.tab === 'payment') {
        const { data, error } = await sb.rpc('report_sales_by_method', { p_shop: shopId, p_from: ST.from, p_to: ST.to });
        if (error) throw error;
        ST.salesByMethod = data;
      } else if (ST.tab === 'orders') {
        await loadOrdersPage(false);
      } else if (ST.tab === 'goal' && app.hasPlan('pro')) {
        const { data, error } = await sb.rpc('report_goal', { p_shop: shopId, p_month: ST.goalMonth });
        if (error) throw error;
        ST.goalData = data;
      } else if (ST.tab === 'cashflow' && app.hasPlan('pro')) {
        const { data, error } = await sb.rpc('report_cashflow', { p_shop: shopId, p_from: ST.from, p_to: ST.to });
        if (error) throw error;
        ST.cashflow = data;
      } else if (ST.tab === 'costing' && app.hasPlan('pro')) {
        const { data, error } = await sb.rpc('report_costing', { p_shop: shopId, p_from: ST.from, p_to: ST.to });
        if (error) throw error;
        ST.costing = data;
      } else if (ST.tab === 'inventory' && app.hasPlan('pro')) {
        const { data, error } = await sb.rpc('report_inventory', { p_shop: shopId });
        if (error) throw error;
        ST.inventory = data;
      } else if (ST.tab === 'debt' && app.hasPlan('pro')) {
        const { data, error } = await sb.from('purchases').select('*').eq('shop_id', shopId).eq('on_credit', true).order('due_date', { ascending: true });
        if (error) throw error;
        ST.debts = (data || []).filter(p => (p.total - p.paid) > 0);
      } else if (ST.tab === 'pnl' && app.hasPlan('proplus')) {
        const { data, error } = await sb.rpc('report_pnl', { p_shop: shopId, p_from: ST.from, p_to: ST.to });
        if (error) throw error;
        ST.pnl = data;
      } else if (ST.tab === 'customers' && app.hasPlan('proplus')) {
        const { data, error } = await sb.rpc('report_customers', { p_shop: shopId, p_from: ST.from, p_to: ST.to });
        if (error) throw error;
        ST.customers = data;
      } else if (ST.tab === 'feedback' && app.hasPlan('proplus')) {
        const { data, error } = await sb.from('feedback').select('*, orders(code,customer_name)').eq('shop_id', shopId)
          .gte('created_at', ST.from + 'T00:00:00+07:00').lte('created_at', ST.to + 'T23:59:59+07:00')
          .order('created_at', { ascending: false }).range(0, 99);
        if (error) throw error;
        ST.feedbacks = data || [];
      }
      ST.loading = false;
      renderCurrentTab();
    } catch (err) {
      ST.loading = false;
      showErr(err);
      contentHost.replaceChildren(renderRangeBar(), el('div', { className: 'alert alert-error', text: app.translateServerError(err) }));
    }
  }

  function renderCurrentTab() {
    const map = {
      overview: renderOverviewTab,
      payment: renderPaymentTab,
      orders: renderOrdersTab,
      goal: renderGoalTab,
      cashflow: renderCashflowTab,
      costing: renderCostingTab,
      inventory: renderInventoryTab,
      debt: renderDebtTab,
      pnl: renderPnlTab,
      customers: renderCustomersTab,
      feedback: renderFeedbackTab
    };
    const fn = map[ST.tab];
    if (fn) fn();
  }

  /* ===== KHỐI MỤC TIÊU THÁNG (DÙNG CHUNG CHO TỔNG QUAN & TAB MỤC TIÊU) ===== */
  function buildGoalProgressCard(gd, monthYmd) {
    if (!gd) return null;
    const g = gd.goal;
    const a = gd.actual || { units: 0, orders: 0, gross: 0 };
    const elapsed = Math.max(0, Number(gd.elapsed_days) || 0);
    const dim = Math.max(1, Number(gd.days_in_month) || 30);
    const mLabel = 'Tháng ' + Number(monthYmd.slice(5, 7)) + '/' + monthYmd.slice(0, 4);

    if (!g) {
      return el('div', { className: 'card row-between' },
        el('span', { text: 'Chưa đặt mục tiêu cho ' + mLabel + '.' }),
        ST.tab !== 'goal' ? el('button', { type: 'button', className: 'btn btn-primary btn-sm', onClick: () => switchTab('goal'), text: 'Đặt mục tiêu' }) : null
      );
    }

    const targetUnits = Math.round((Number(g.units_per_day) || 0) * (Number(g.days) || dim));
    const targetProfit = Number(g.profit_month) || 0;
    const estUnits = elapsed > 0 ? Math.round((a.units / elapsed) * dim) : 0;
    const estProfit = elapsed > 0 ? Math.round((a.gross / elapsed) * dim) : 0;

    const bar = (label, cur, target, fmt, est) => {
      const ratio = target > 0 ? Math.min(100, Math.round((cur / target) * 100)) : 0;
      return el('div', { className: 'hbar' },
        el('div', { className: 'hbar-top' },
          el('span', { style: 'font-weight:600', text: label }),
          el('span', { className: 'num', text: fmt(cur) + ' / ' + fmt(target) + ' (' + ratio + '%)' })
        ),
        el('div', { className: 'hbar-track' }, el('div', { className: 'hbar-fill' + (ratio >= 100 ? ' done' : ''), style: 'width:' + ratio + '%' })),
        elapsed > 0 ? el('small', { style: 'color:var(--text-sub);display:block;margin-top:3px', text: 'Dự báo cuối tháng (ước tính): ' + fmt(est) }) : null
      );
    };

    return el('div', { className: 'card' },
      el('div', { className: 'row-between', style: 'margin-bottom:8px' },
        el('b', { text: 'Mục tiêu ' + mLabel }),
        el('span', { className: 'badge num', text: 'Ngày ' + elapsed + '/' + dim })
      ),
      el('p', { style: 'margin:0 0 10px;font-size:14px;color:var(--text-sub)', text: 'Hôm nay là ngày ' + elapsed + '/' + dim + '. Đã bán ' + a.units + ' / ' + targetUnits + ' đơn vị (' + a.orders + ' đơn).' }),
      bar('Số lượng bán cả tháng', a.units, targetUnits, v => v.toLocaleString('vi-VN') + ' đv', estUnits),
      bar('Lãi gộp cả tháng', a.gross, targetProfit, app.formatMoney, estProfit)
    );
  }

  async function loadOrdersPage(append) {
    const from = append ? ST.ordersOffset : 0;
    const { data, error } = await sb.from('orders')
      .select('*, order_items(id,name,unit,price,qty)')
      .eq('shop_id', shopId)
      .gte('ordered_at', ST.from + 'T00:00:00+07:00')
      .lte('ordered_at', ST.to + 'T23:59:59+07:00')
      .order('ordered_at', { ascending: false })
      .range(from, from + 49);
    if (error) throw error;
    const list = data || [];
    ST.orders = append ? ST.orders.concat(list) : list;
    ST.ordersOffset = ST.orders.length;
    ST.ordersHasMore = list.length === 50;
  }

  async function exportOrdersCsv(btn, progBox) {
    btn.disabled = true; btn.textContent = 'Đang xuất…';
    const rows = [['Mã đơn', 'Ngày giờ', 'Nguồn', 'Khách hàng', 'Điện thoại', 'Địa chỉ', 'Ghi chú', 'Trạng thái', 'Thanh toán', 'Tên món', 'Số lượng', 'Đơn giá', 'Thành tiền', 'Giảm giá', 'Tổng đơn']];
    let offset = 0, loadedOrders = 0;
    try {
      while (true) {
        progBox.replaceChildren(
          el('small', { style: 'display:block;margin-top:6px;color:var(--text-sub)', text: 'Đang tải đơn hàng (' + loadedOrders + ' đơn)…' }),
          el('div', { className: 'prog-bar' }, el('div', { style: 'width:' + Math.min(95, 15 + (offset / 50)) + '%' }))
        );
        const { data, error } = await sb.from('orders')
          .select('*, order_items(name,qty,price)')
          .eq('shop_id', shopId)
          .gte('ordered_at', ST.from + 'T00:00:00+07:00')
          .lte('ordered_at', ST.to + 'T23:59:59+07:00')
          .order('ordered_at', { ascending: false })
          .range(offset, offset + 499);
        if (error) throw error;
        const batch = data || [];
        loadedOrders += batch.length;
        for (const o of batch) {
          const items = o.order_items && o.order_items.length ? o.order_items : [{ name: '', qty: 0, price: 0 }];
          const payStr = (ST.payMethodsMap.get(o.pay_method_id) || '') + ' (' + (PAY_TXT[o.pay_status] || o.pay_status) + ')';
          for (const it of items) {
            rows.push([
              o.code, app.formatVnDateTime(o.ordered_at), o.source === 'online' ? 'Online' : 'Tại quầy',
              o.customer_name || 'Khách lẻ', app.csvPhoneCell(o.customer_phone || ''),
              [o.place, o.address].filter(Boolean).join(' - '), o.note || '',
              STATUS_TXT[o.status] || o.status, payStr.trim(),
              it.name, it.qty, it.price, it.price * it.qty, o.discount || 0, o.total
            ]);
          }
        }
        if (batch.length < 500) break;
        offset += 500;
      }
      app.downloadCsv('don-hang-' + ST.from + '_' + ST.to + '.csv', rows);
      app.showToast('Đã xuất ' + loadedOrders + ' đơn hàng', 'accent');
    } catch (err) {
      showErr(err);
    } finally {
      progBox.replaceChildren();
      btn.disabled = false; btn.textContent = 'Xuất CSV danh sách đơn';
    }
  }

        el('div', { className: 'grid-3' },
          el('div', { className: 'field' },

            el('input', { className: 'input num', type: 'number', step: 'any', min: 0, value: f.units_per_day, onInput: e => { f.units_per_day = e.target.value; } })

    const c = ST.costing || { items: [], totals: { revenue: 0, cogs: 0, gross: 0 } };
    const { col, desc } = ST.costSort;
    const sorted = (c.items || []).slice().sort((a, b) => {
      const av = a[col], bv = b[col];
      if (typeof av === 'string') return desc ? bv.localeCompare(av, 'vi') : av.localeCompare(bv, 'vi');
      return desc ? (bv - av) : (av - bv);
    });
    const thSort = (key, label, right) => el('th', {
      className: 'sortable' + (right ? ' r' : ''),
      onClick: () => {

      text: label + (col === key ? (desc ? ' ↓' : ' ↑') : '')

      renderRangeBar(),
      el('div', { className: 'card' },

        return el('div', { className: 'card' },
          el('div', { className: 'row-between' },
            el('b', { style: 'color:#D99A00;font-size:18px', text: '★'.repeat(f.rating) + '☆'.repeat(5 - f.rating) }),
            el('span', { className: 'badge ' + (f.handled ? '' : 'badge-warn'), text: f.handled ? ('Đã xử lý' + (f.fix ? ': ' + f.fix : '')) : 'Chưa xử lý' })
          ),
          el('div', { style: 'font-size:13.5px;color:var(--text-sub);margin-top:4px', text: app.formatVnDateTime(f.created_at) + (ord.code ? ' · Đơn ' + ord.code : '') + (ord.customer_name ? ' · ' + ord.customer_name : '') }),
          f.comment ? el('div', { style: 'margin-top:6px;font-style:italic', text: '“' + f.comment + '”' }) : null
        );
      }) : [el('div', { className: 'card empty-state', text: 'Chưa có đánh giá nào trong khoảng ngày này.' })]
    );
  }

  /* ===== KHỞI CHẠY ===== */
  try {
    const { data: pms } = await sb.from('payment_methods').select('id,name').eq('shop_id', shopId);
    (pms || []).forEach(m => ST.payMethodsMap.set(m.id, m.name));
  } catch (e) {}
  renderNav();
  await reloadCurrentTab();
})();
</script>
</body>
</html>
