<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest-quantri.json">
<link rel="icon" type="image/png" href="icon-quantri-180.png">
<link rel="apple-touch-icon" href="icon-quantri-180.png">
<title>Quản trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body { overflow-x: hidden; font-family: "Be Vietnam Pro", var(--font, system-ui, sans-serif); }
.num { font-variant-numeric: tabular-nums; }

/* Bố cục trang Quản trị */
.qt-wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 12px 14px calc(92px + env(safe-area-inset-bottom));
}
@media (min-width: 900px) {
  .qt-wrap { padding-bottom: 48px; }
}

/* Thanh thẻ điều hướng */
.qt-nav {
  position: fixed;
  transform: translate3d(0, 0, 0);
  -webkit-transform: translate3d(0, 0, 0);
  will-change: transform;

  left: 0;
  right: 0;
  bottom: 0;
  z-index: 12;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.qt-nav-in { max-width: 960px; margin: 0 auto; display: flex; }
.qt-nav button {
  flex: 1;
  min-height: 58px;
  padding: 6px 2px;
  border: 0;
  background: transparent;
  color: var(--text-sub);
  font-family: inherit; font-size: 11.5px; font-weight: 600; line-height: 1.2; white-space: nowrap;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.qt-nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
@media (min-width: 900px) {
  .qt-nav { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .qt-nav-in { flex-wrap: wrap; gap: 4px; padding: 6px 14px; }
  .qt-nav button { flex: 0 0 auto; min-height: 44px; padding: 8px 14px; border-radius: 999px; font-size: 14px; flex-direction: row; gap: 6px; }
  .qt-nav svg { width: 20px; height: 20px; }
  .qt-nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
}

/* Chọn khoảng ngày */
.range-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

/* Thẻ số liệu KPI */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.kpi-grid > .kpi-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
.qt-more { margin-top: 8px; }
.hscroll .chip { padding: 8px 12px; min-height: 40px; font-size: 13.5px; }
.qt-more summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); min-height: 36px; display: flex; align-items: center; }
.kpi-card small { display: block; color: var(--text-sub); font-size: 13px; }
.kpi-card b { display: block; font-size: 20px; margin-top: 3px; word-break: break-word; }
.kpi-card .sub { display: block; font-size: 12.5px; color: var(--text-sub); margin-top: 2px; }

.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

/* Bảng số liệu */
.table-scroll { overflow-x: auto; margin-top: 8px; }
table.qt-tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.qt-tbl th, table.qt-tbl td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; }
table.qt-tbl th { font-size: 13px; color: var(--text-sub); font-weight: 600; white-space: nowrap; }
table.qt-tbl th.sortable { cursor: pointer; user-select: none; }
table.qt-tbl .r { text-align: right; white-space: nowrap; }
table.qt-tbl tr.sum-row td { font-weight: 700; border-top: 2px solid var(--border); }
table.qt-tbl tr.warn-row { background: var(--warn-bg); }
table.qt-tbl tr.clickable { cursor: pointer; }
table.qt-tbl tr.clickable:hover { background: var(--accent-soft); }

.ord-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--border); background: transparent; font: inherit; color: inherit; cursor: pointer; }
.ord-row:hover { background: var(--accent-soft); }

/* Biểu đồ SVG thuần */
.chart-cap { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
.chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.qt-svg { display: block; width: 100%; height: auto; overflow: visible; }
.qt-svg g[tabindex] { cursor: pointer; outline: none; }
.qt-svg g[tabindex]:focus-visible rect.hit { stroke: var(--yellow); stroke-width: 2; }

/* Thanh tiến độ ngang */
.hbar { margin-top: 10px; }
.hbar:first-child { margin-top: 0; }
.hbar-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14.5px; }
.hbar-track { height: 10px; border-radius: 6px; background: var(--accent-soft); margin-top: 5px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 6px; background: var(--accent); }
.hbar-fill.done { background: var(--yellow); }

.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
.badge-warn { background: var(--warn-bg); color: var(--warn-text); }
.badge-err { background: var(--error-bg); color: var(--error); }
.badge-muted { background: var(--surface-alt); color: var(--text-sub); }

.input, .select { min-height: 44px; font-size: 16px; }
.btn { min-height: 44px; }
.btn-sm { min-height: 44px; padding: 8px 12px; }

/* Thanh tiến độ xuất CSV */
.prog-bar { height: 10px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; margin-top: 8px; }
.prog-bar > div { height: 100%; background: var(--accent); transition: width 0.2s; }

/* Hộp thoại */
.modal-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.52); display: flex; align-items: flex-end; justify-content: center; }
.modal-sheet { width: 100%; max-width: 600px; max-height: 90dvh; background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 640px) { .modal-backdrop { align-items: center; padding: 16px; } .modal-sheet { border-radius: 18px; } }
.modal-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.modal-hd h2 { margin: 0; font-size: 17px; }
.modal-close { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-alt); color: var(--text); font-size: 22px; font-weight: 700; cursor: pointer; }
.modal-body { padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; flex: 1; }
.modal-ft { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.empty-state { text-align: center; padding: 28px 14px; color: var(--text-sub); }
</style>
</head>
<body>
<div id="dd-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="chung.js"></script>
<script>
'use strict';

(async function () {
  const app = await DatdonApp.start({ page: 'quan-tri' });
  const sb = app.sb;
  const shopId = app.shop.id;
  const shopSlug = app.shop.slug || 'quan';
  const el = app.el;
  const SVGNS = 'http://www.w3.org/2000/svg';

  const showErr = err => app.showToast(app.translateServerError(err), 'error');
  const pct = (part, total) => total ? (part / total * 100).toFixed(1).replace('.', ',') + '%' : '0%';
  const fmtDmy = ymd => {
    const m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] : ymd;
  };
  const fmtDmyFull = ymd => {
    const m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : ymd;
  };

  /* ===== HỘP THOẠI ===== */
  const modalRoot = el('div');
  document.body.append(modalRoot);
  let lastOpener = null;
  function closeModal() {
    modalRoot.replaceChildren();
    if (lastOpener && typeof lastOpener.focus === 'function') lastOpener.focus();
    lastOpener = null;
  }
  function openModal(title, body, footer, opener) {
    lastOpener = opener || document.activeElement;
    const sheet = el('div', { className: 'modal-sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      el('div', { className: 'modal-hd' },
        el('h2', { text: title }),
        el('button', { type: 'button', className: 'modal-close', 'aria-label': 'Đóng', onClick: closeModal, text: '×' })
      ),
      el('div', { className: 'modal-body' }, body),
      footer ? el('div', { className: 'modal-ft' }, footer) : null
    );
    const backdrop = el('div', { className: 'modal-backdrop', onClick: e => { if (e.target === backdrop) closeModal(); } }, sheet);
    modalRoot.replaceChildren(backdrop);
    const first = sheet.querySelector('button, input, select');
    if (first) first.focus();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalRoot.children.length) closeModal(); });

  /* ===== DANH SÁCH TAB THEO GÓI ===== */
  const ALL_TABS = [
    { id: 'overview', label: 'Tổng quan', minPlan: 'standard' },
    { id: 'bctc', label: 'BCTC', minPlan: 'pro' },
    { id: 'stats', label: 'Chỉ số', minPlan: 'standard' },
    { id: 'cashflow', label: 'Dòng tiền', minPlan: 'pro' }
  ];
  const MAIN_TABS = ['overview', 'bctc', 'stats', 'cashflow'];
  const TABS = ALL_TABS.filter(t => app.hasPlan(t.minPlan));

  /* ===== KHOẢNG NGÀY MẶC ĐỊNH: THÁNG NÀY (GIỜ VIỆT NAM) ===== */
  const todayYmd = app.toVnYmd(new Date());
  const thisMonthStart = todayYmd.slice(0, 8) + '01';
  function prevMonthRange() {
    const y = Number(todayYmd.slice(0, 4));
    const m = Number(todayYmd.slice(5, 7));
    const py = m === 1 ? y - 1 : y;
    const pm = m === 1 ? 12 : m - 1;
    const lastDay = new Date(Date.UTC(py, pm, 0)).getUTCDate();
    return { from: py + '-' + app.pad2(pm) + '-01', to: py + '-' + app.pad2(pm) + '-' + app.pad2(lastDay) };
  }

  const ST = {
    tab: 'overview',
    preset: 'month', // 'today' | '7d' | 'month' | 'prev_month' | 'custom'
    from: thisMonthStart,
    to: todayYmd,
    goalMonth: thisMonthStart,
    bcMonth: thisMonthStart.slice(0, 7),
    loading: false,
    // Dữ liệu từng tab
    revenue: null,
    salesByMethod: null,
    goalData: null,
    orders: [],
    ordersOffset: 0,
    ordersHasMore: false,
    payMethodsMap: new Map(),
    cashflow: null,
    costing: null,
    costSort: { col: 'gross', desc: true },
    inventory: null,
    debts: [],
    pnl: null,
    customers: null,
    feedbacks: []
  };

  /* ===== VẼ BIỂU ĐỒ SVG THUẦN (CÓ TƯƠNG TÁC CHẠM/CLICK) ===== */
  function sv(tag, attrs, ...kids) {
    const node = document.createElementNS(SVGNS, tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v !== null && v !== undefined) node.setAttribute(k, String(v));
      }
    }
    for (const c of kids.flat(Infinity)) {
      if (c !== null && c !== undefined) node.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return node;
  }

  function renderSvgBarChart(title, labels, series, fmtVal) {
    if (!labels.length) return el('div', { className: 'empty-state', text: 'Chưa có dữ liệu trong khoảng thời gian này.' });
    const n = labels.length;
    const k = series.length;
    const W = 560, H = 200, pl = 8, pr = 8, pt = 14, pb = 32;
    const allVals = series.flatMap(s => s.values);
    const maxV = Math.max(1, ...allVals);
    const minV = Math.min(0, ...allVals);
    const yOf = v => pt + (H - pt - pb) * (maxV - v) / (maxV - minV);
    const y0 = yOf(0);
    const gw = (W - pl - pr) / n;
    const bw = Math.max(4, Math.min(28, (gw * 0.76 - (k - 1) * 2) / k));

    let sel = n - 1;
    const cap = el('div', { className: 'chart-cap num' });
    const hits = [];
    const grp = sv('g');

    const labelText = i => labels[i] + ': ' + series.map(s => (k > 1 ? s.name + ' ' : '') + fmtVal(s.values[i])).join(' · ');
    const updateSel = i => {
      sel = i;
      cap.textContent = labelText(i);
      hits.forEach((r, idx) => r.setAttribute('fill', idx === sel ? 'rgba(30,77,58,0.12)' : 'transparent'));
    };

    const step = n <= 7 ? 1 : Math.ceil(n / 5);
    let lastShown = -99;
    labels.forEach((lb, i) => {
      const gx = pl + gw * i;
      const cx = gx + gw / 2;
      const bx0 = cx - (k * bw + (k - 1) * 2) / 2;
      const hit = sv('rect', { class: 'hit', x: gx, y: 0, width: gw, height: H - pb, rx: 4, fill: 'transparent' });
      hits.push(hit);
      const gi = sv('g', { tabindex: 0, role: 'button', 'aria-label': labelText(i) }, hit);
      series.forEach((s, j) => {
        const v = s.values[i];
        const yy = yOf(v);
        const top = Math.min(yy, y0);
        const ht = Math.max(2, Math.abs(yy - y0));
        gi.append(sv('rect', {
          x: bx0 + j * (bw + 2), y: top, width: bw, height: ht, rx: 3,
          fill: v === 0 ? 'var(--border)' : s.color
        }));
      });
      if (i % step === 0 || (i === n - 1 && i - lastShown >= step * 0.7)) {
        lastShown = i;
        gi.append(sv('text', {
          x: cx, y: H - 8, 'text-anchor': i === n - 1 && n > 7 ? 'end' : 'middle', 'font-size': 17, fill: 'var(--text-sub)'
        }, lb));
      }
      gi.addEventListener('click', () => updateSel(i));
      gi.addEventListener('pointerenter', () => updateSel(i));
      gi.addEventListener('focus', () => updateSel(i));
      grp.append(gi);
    });
    updateSel(sel);

    const svg = sv('svg', { class: 'qt-svg', viewBox: '0 0 ' + W + ' ' + H, role: 'group', 'aria-label': title },
      sv('line', { x1: pl, x2: W - pr, y1: y0, y2: y0, stroke: 'var(--border)', 'stroke-width': 1 }),
      grp
    );

    return el('div', null,
      k > 1 ? el('div', { className: 'chart-legend' }, series.map(s => el('span', null, el('i', { style: 'background:' + s.color }), s.name))) : null,
      cap,
      svg
    );
  }

  function buildFullDayRange(fromYmd, toYmd) {
    const out = [];
    let cur = fromYmd;
    let guard = 0;
    while (cur <= toYmd && guard < 370) {
      out.push(cur);
      cur = app.shiftYmd(cur, 1);
      guard++;
    }
    return out;
  }

  function groupSeriesIfLong(dayRows, valueKeys) {
    if (dayRows.length <= 31) {
      return dayRows.map(r => Object.assign({ label: fmtDmy(r.day) }, r));
    }
    const byMonth = dayRows.length > 93;
    const buckets = new Map();
    for (const r of dayRows) {
      let key;
      if (byMonth) {
        key = r.day.slice(0, 7);
      } else {
        const d = new Date(r.day + 'T00:00:00Z');
        const wd = (d.getUTCDay() + 6) % 7; // Thứ 2 = 0
        key = app.shiftYmd(r.day, -wd);
      }
      if (!buckets.has(key)) {
        const init = { label: byMonth ? ('T' + Number(key.slice(5)) + '/' + key.slice(2, 4)) : ('Tuần ' + fmtDmy(key)) };
        valueKeys.forEach(k => { init[k] = 0; });
        buckets.set(key, init);
      }
      const b = buckets.get(key);
      valueKeys.forEach(k => { b[k] += Number(r[k]) || 0; });
    }
    return [...buckets.values()];
  }

  /* ===== KHUNG GIAO DIỆN CHÍNH ===== */
  const root = document.getElementById('dd-root');
  const navHost = el('div');
  const contentHost = el('div', { className: 'qt-wrap' });
  root.replaceChildren(el('div', { className: 'dd-wrap' }, navHost, contentHost));

  const NAV_ICONS = {
    overview: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
    payment: 'M3 6h18v12H3zM3 10h18M7 15h4',
    orders: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
    goal: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01',
    cashflow: 'M4 8h15l-3.5-3.5M20 16H5l3.5 3.5',
    costing: 'M12 3v18M16 7H10a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H8',
    inventory: 'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8',
    debt: 'M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h4',
    pnl: 'M5 19V9M12 19V5M19 19v-7',
    bctc: 'M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7',
    stats: 'M3 17l6-6 4 4 8-8M15 7h6v6',
    customers: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 7M22 21a7 7 0 0 0-4-6',
    feedback: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
    more: 'M5 12h.01M12 12h.01M19 12h.01'
  };
  function navIcon(id) {
    const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('width', '22'); svg.setAttribute('height', '22');
    svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor'); svg.setAttribute('stroke-width', id === 'more' ? '3' : '1.9');
    svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('stroke-linejoin', 'round'); svg.setAttribute('aria-hidden', 'true');
    const pth = document.createElementNS(ns, 'path'); pth.setAttribute('d', NAV_ICONS[id] || NAV_ICONS.more); svg.appendChild(pth);
    return svg;
  }

  function renderNav() {
    const btns = TABS.map(t => el('button', {
      type: 'button',
      'aria-current': ST.tab === t.id ? 'page' : null,
      onClick: () => switchTab(t.id)
    }, navIcon(t.id), el('span', { text: t.label })));
    navHost.replaceChildren(el('nav', { className: 'qt-nav', 'aria-label': 'Mục báo cáo' },
      el('div', { className: 'qt-nav-in' }, btns)
    ));
  }
  window.addEventListener('resize', () => renderNav());

  function renderRangeBar() {
    const presets = [
      { id: 'today', label: 'Hôm nay', calc: () => ({ from: todayYmd, to: todayYmd }) },
      { id: '7d', label: '7 ngày', calc: () => ({ from: app.shiftYmd(todayYmd, -6), to: todayYmd }) },
      { id: 'month', label: 'Tháng này', calc: () => ({ from: thisMonthStart, to: todayYmd }) },
      { id: 'prev_month', label: 'Tháng trước', calc: prevMonthRange }
    ];
    return el('div', { className: 'qt-range', style: 'margin-bottom:12px' },
      el('div', { className: 'hscroll' },
        presets.map(p => el('button', {
          type: 'button', className: 'chip', 'aria-pressed': String(ST.preset === p.id),
          onClick: async () => {
            const r = p.calc();
            ST.preset = p.id; ST.from = r.from; ST.to = r.to; ST.customRange = false;
            await reloadCurrentTab();
          },
          text: p.label
        })),
        el('button', { type: 'button', className: 'chip', 'aria-pressed': String(ST.preset === 'custom' || !!ST.customRange), onClick: () => { ST.customRange = !ST.customRange; reloadCurrentTab(); }, text: 'Chọn ngày' })
      ),
      (ST.customRange || ST.preset === 'custom') ? el('div', { className: 'card', style: 'padding:10px;margin:8px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px' },
        el('div', { className: 'field', style: 'margin:0' }, el('label', { text: 'Từ ngày' }), el('input', {
          className: 'input', type: 'date', value: ST.from,
          onChange: async e => { if (!e.target.value) return; ST.preset = 'custom'; ST.from = e.target.value; await reloadCurrentTab(); }

  function monthKeysLast6() {
    const y = Number(todayYmd.slice(0, 4)), m = Number(todayYmd.slice(5, 7)), keys = [];
    for (let i = 5; i >= 0; i--) { const d = new Date(Date.UTC(y, m - 1 - i, 1)); keys.push(d.getUTCFullYear() + '-' + app.pad2(d.getUTCMonth() + 1)); }
    return keys;
  }
  const monthLabel = k => 'Tháng ' + Number(k.slice(5)) + '/' + k.slice(2, 4);
  function monthRange(k) {
    const y = Number(k.slice(0, 4)), m = Number(k.slice(5, 7));
    return { from: k + '-01', to: k + '-' + app.pad2(new Date(Date.UTC(y, m, 0)).getUTCDate()) };
  }

  async function reloadCurrentTab() {
    ST.loading = true;
    contentHost.replaceChildren(
      ST.tab === 'overview' || ST.tab === 'cashflow' ? renderRangeBar() : null,
      el('div', { className: 'card empty-state', text: 'Đang tải số liệu…' })
    );
    try {
      if (ST.tab === 'overview') {
        const reqs = [
          sb.rpc('report_revenue', { p_shop: shopId, p_from: ST.from, p_to: ST.to }),
          sb.rpc('report_sales_by_method', { p_shop: shopId, p_from: ST.from, p_to: ST.to }),
          sb.rpc('report_revenue', { p_shop: shopId, p_from: todayYmd, p_to: todayYmd }),
          sb.from('menu_items').select('name').eq('shop_id', shopId).eq('active', true)
        ];
        const pro = app.hasPlan('pro');
        if (pro) {
          reqs.push(sb.rpc('report_goal', { p_shop: shopId, p_month: thisMonthStart }));
          reqs.push(sb.rpc('report_inventory', { p_shop: shopId }));
          reqs.push(sb.from('batches').select('at,out_qty,out_item_id').eq('shop_id', shopId)
            .gte('at', ST.from + 'T00:00:00+07:00').lte('at', ST.to + 'T23:59:59+07:00'));
          reqs.push(sb.from('inv_items').select('id,name,unit').eq('shop_id', shopId));
        }
        const res = await Promise.all(reqs);
        for (const r of res) if (r.error) throw r.error;
        ST.revenue = res[0].data;
        ST.salesByMethod = res[1].data;
        ST.today = res[2].data;
        ST.menuNames = (res[3].data || []).map(m => m.name);
        if (pro) {
          ST.goalData = res[4].data;
          ST.inventory = res[5].data;
          const names = new Map((res[7].data || []).map(i => [i.id, i]));
          const agg = new Map();
          for (const b of (res[6].data || [])) {
            const it = names.get(b.out_item_id) || { name: 'Thành phẩm', unit: '' };
            const a = agg.get(b.out_item_id) || { name: it.name, unit: it.unit, qty: 0, batches: 0 };
            a.qty += Number(b.out_qty) || 0; a.batches += 1; agg.set(b.out_item_id, a);
          }
          ST.made = [...agg.values()].sort((x, y) => y.qty - x.qty);
        }
      } else if (ST.tab === 'bctc' && app.hasPlan('pro')) {
        const r = monthRange(ST.bcMonth);
        const reqs = [sb.rpc('report_costing', { p_shop: shopId, p_from: r.from, p_to: r.to })];
        if (app.hasPlan('proplus')) reqs.push(sb.rpc('report_pnl', { p_shop: shopId, p_from: r.from, p_to: r.to }));
        const res = await Promise.all(reqs);
        for (const x of res) if (x.error) throw x.error;
        ST.costing = res[0].data;
        ST.pnl = res[1] ? res[1].data : null;
      } else if (ST.tab === 'stats') {
        const y = Number(todayYmd.slice(0, 4)), m = Number(todayYmd.slice(5, 7));
        const d0 = new Date(Date.UTC(y, m - 1 - 5, 1));
        ST.statsFrom = d0.getUTCFullYear() + '-' + app.pad2(d0.getUTCMonth() + 1) + '-01';
        const reqs = [sb.rpc('report_revenue', { p_shop: shopId, p_from: ST.statsFrom, p_to: todayYmd })];
        if (app.hasPlan('proplus')) {
          reqs.push(sb.rpc('report_pnl', { p_shop: shopId, p_from: ST.statsFrom, p_to: todayYmd }));
          reqs.push(sb.rpc('report_customers', { p_shop: shopId, p_from: thisMonthStart, p_to: todayYmd }));
        }
        const iCf = app.hasPlan('pro') ? reqs.push(sb.rpc('report_cashflow', { p_shop: shopId, p_from: ST.statsFrom, p_to: todayYmd })) - 1 : -1;
        const iNew = app.hasPlan('proplus') ? reqs.push(sb.from('customers').select('created_at').eq('shop_id', shopId).gte('created_at', ST.statsFrom + 'T00:00:00+07:00').limit(5000)) - 1 : -1;
        const res = await Promise.all(reqs);
        for (const r of res) if (r.error) throw r.error;
        ST.statsRev = res[0].data;
        if (res[1] && app.hasPlan('proplus')) ST.statsPnl = res[1].data;
        if (res[2] && app.hasPlan('proplus')) ST.statsCust = res[2].data;
        ST.statsCash = iCf >= 0 ? res[iCf].data : null;
        ST.statsNew = iNew >= 0 ? (res[iNew].data || []) : null;
      } else if (ST.tab === 'cashflow' && app.hasPlan('pro')) {
        const { data, error } = await sb.rpc('report_cashflow', { p_shop: shopId, p_from: ST.from, p_to: ST.to });
        if (error) throw error;
        ST.cashflow = data;
      }
      ST.loading = false;
      renderCurrentTab();
    } catch (err) {
      ST.loading = false;
      showErr(err);
      contentHost.replaceChildren(el('div', { className: 'alert alert-error', text: app.translateServerError(err) }));
    }
  }

  /* ===== KHỐI MỤC TIÊU THÁNG (DÙNG CHUNG CHO TỔNG QUAN & TAB MỤC TIÊU) ===== */
  function buildGoalProgressCard(gd, monthYmd) {
    if (!gd) return null;
    const g = gd.goal;
    const a = gd.actual || { units: 0, orders: 0, gross: 0 };
    const elapsed = Math.max(0, Number(gd.elapsed_days) || 0);
    const dim = Math.max(1, Number(gd.days_in_month) || 30);
    const mLabel = 'Tháng ' + Number(monthYmd.slice(5, 7)) + '/' + monthYmd.slice(0, 4);

    if (!g) {
      return el('div', { className: 'card row-between' },
        el('span', { text: 'Chưa đặt mục tiêu cho ' + mLabel + '.' }),
        el('button', { type: 'button', className: 'btn btn-primary btn-sm', onClick: e => openGoalModal(e.currentTarget), text: 'Đặt mục tiêu' })
      );
    }

    const targetUnits = Math.round((Number(g.units_per_day) || 0) * (Number(g.days) || dim));
    const targetProfit = Number(g.profit_month) || 0;
    const estUnits = elapsed > 0 ? Math.round((a.units / elapsed) * dim) : 0;
    const estProfit = elapsed > 0 ? Math.round((a.gross / elapsed) * dim) : 0;

    const bar = (label, cur, target, fmt, est) => {
      const ratio = target > 0 ? Math.min(100, Math.round((cur / target) * 100)) : 0;
      return el('div', { className: 'hbar' },
        el('div', { className: 'hbar-top' },
          el('span', { style: 'font-weight:600', text: label }),
          el('span', { className: 'num', text: fmt(cur) + ' / ' + fmt(target) + ' (' + ratio + '%)' })
        ),
        el('div', { className: 'hbar-track' }, el('div', { className: 'hbar-fill' + (ratio >= 100 ? ' done' : ''), style: 'width:' + ratio + '%' })),
        elapsed > 0 ? el('small', { style: 'color:var(--text-sub);display:block;margin-top:3px', text: 'Dự báo cuối tháng (ước tính): ' + fmt(est) }) : null
      );
    };

    return el('div', { className: 'card' },
      el('div', { className: 'row-between', style: 'margin-bottom:8px' },
        el('b', { text: 'Mục tiêu ' + mLabel }),
        el('div', { style: 'display:flex;gap:8px;align-items:center' },
          el('span', { className: 'badge num', text: 'Ngày ' + elapsed + '/' + dim }),
          el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openGoalModal(e.currentTarget), text: 'Sửa' })
        )
      ),
      el('p', { style: 'margin:0 0 10px;font-size:14px;color:var(--text-sub)', text: 'Hôm nay là ngày ' + elapsed + '/' + dim + '. Đã bán ' + a.units + ' / ' + targetUnits + ' đơn vị (' + a.orders + ' đơn).' }),
      bar('Số lượng bán cả tháng', a.units, targetUnits, v => v.toLocaleString('vi-VN') + ' đv', estUnits),
      bar('Lãi gộp cả tháng', a.gross, targetProfit, app.formatMoney, estProfit)
    );
  }


  /* ===== POP-UP ĐẶT MỤC TIÊU THÁNG (CHỖ NHẬP DUY NHẤT CỦA MỤC TIÊU) ===== */
  function openGoalModal(opener) {
    const gd = ST.goalData || {};
    const g = gd.goal || null;
    const f = { upd: g ? g.units_per_day : '', pm: g ? g.profit_month : '', days: g ? g.days : (gd.days_in_month || 30) };
    const saveBtn = el('button', { type: 'button', className: 'btn btn-primary', text: 'Lưu mục tiêu' });
    saveBtn.onclick = async () => {
      const upd = Number(f.upd), pm = Math.round(Number(f.pm)), days = Math.round(Number(f.days));
      if (!(upd >= 0) || !(pm >= 0) || !(days >= 1 && days <= 31)) { app.showToast('Kiểm tra lại số lượng mỗi ngày, lãi gộp tháng và số ngày bán (1–31)', 'error'); return; }
      saveBtn.disabled = true; saveBtn.textContent = 'Đang lưu…';
      try {
        const { error } = await sb.from('goals').upsert({ shop_id: shopId, month: thisMonthStart, units_per_day: upd, profit_month: pm, days }, { onConflict: 'shop_id,month' });

        closeModal();
        await reloadCurrentTab();

      el('div', { className: 'field' }, el('label', { text: 'Số lượng bán mỗi ngày' }),

      el('div', { className: 'field' }, el('label', { text: 'Lãi gộp mục tiêu cả tháng (đ)' }),

      el('div', { className: 'field' }, el('label', { text: 'Số ngày bán trong tháng' }),

    ), [el('button', { type: 'button', className: 'btn', onClick: closeModal, text: 'Đóng' }), saveBtn], opener);
  }

  async function fetchAll(makeQuery) {
    const out = [];
    for (let off = 0; ; off += 1000) {
      const { data, error } = await makeQuery().range(off, off + 999);
      if (error) throw error;
      out.push(...(data || []));
      if (!data || data.length < 1000) break;
    }
    return out;
  }
  const dtParts = iso => { const t = iso ? app.formatVnDateTime(iso) : ''; return [t.slice(0, 10), t.slice(11)]; };

  /* ===== BCTC: gom Kết quả KD + Dòng tiền + Giá vốn vào một màn ===== */
  function collectNodes(fn) {
    const orig = contentHost.replaceChildren;
    let nodes = [];
    contentHost.replaceChildren = (...n) => { nodes = n; };
    try { fn(); } finally { contentHost.replaceChildren = orig; }
    return nodes.filter(n => n && !(n.classList && n.classList.contains('qt-range')));
  }
  function renderBctcTab() {

  /* ===== CHỈ SỐ: so với tháng trước + biểu đồ theo tháng ===== */
  function renderStatsTab() {
    const rev = ST.statsRev || { days: [] };
    const monthKeys = [];
    const y0 = Number(ST.statsFrom.slice(0, 4)), m0 = Number(ST.statsFrom.slice(5, 7));
    for (let i = 0; i < 6; i++) { const d = new Date(Date.UTC(y0, m0 - 1 + i, 1)); monthKeys.push(d.getUTCFullYear() + '-' + app.pad2(d.getUTCMonth() + 1)); }
    const agg = new Map(monthKeys.map(k => [k, { orders: 0, revenue: 0 }]));
    for (const d of (rev.days || [])) { const a = agg.get(String(d.day).slice(0, 7)); if (a) { a.orders += d.orders || 0; a.revenue += d.revenue || 0; } }
    const labels = monthKeys.map(k => 'T' + Number(k.slice(5)) + '/' + k.slice(2, 4));
    const pnlBy = new Map(((ST.statsPnl && ST.statsPnl.months) || []).map(m => [String(m.month).slice(0, 7), m]));
    const cur = agg.get(monthKeys[5]), prev = agg.get(monthKeys[4]);
    const avg = a => (a.orders ? Math.round(a.revenue / a.orders) : 0);
    const tile = (label, c, p, fmt) => {
      let note = 'chưa có tháng trước';
      if (p) note = (c >= p ? '▲ +' : '▼ ') + Math.round((c - p) / Math.abs(p) * 100) + '% so với tháng trước';
      return el('div', { className: 'kpi-card' }, el('small', { text: label }), el('b', { className: 'num', text: fmt(c) }), el('small', { text: note }));
    };
    const plus = app.hasPlan('proplus');
    const curNet = plus && pnlBy.get(monthKeys[5]) ? pnlBy.get(monthKeys[5]).net : 0, prevNet = plus && pnlBy.get(monthKeys[4]) ? pnlBy.get(monthKeys[4]).net : 0;
    const chart = (title, vals, fmt, color) => el('div', { className: 'card' },
      el('b', { text: title }),
      el('div', { style: 'margin-top:8px' }, renderSvgBarChart(title, labels, [{ name: title, color: color || 'var(--accent)', values: vals }], fmt)));
    const kids = [
      el('div', { style: 'font-weight:700;margin:2px 0 8px;color:var(--text-sub)', text: 'So với tháng trước' }),
      el('div', { className: 'kpi-grid' },
        tile('Doanh thu', cur.revenue, prev.revenue, app.formatMoney),
        tile('Số đơn', cur.orders, prev.orders, v => String(v)),
        tile('Trung bình mỗi đơn', avg(cur), avg(prev), app.formatMoney),
        plus ? tile('Lãi ròng', curNet, prevNet, app.formatMoney) : null
      ),
      el('p', { style: 'margin:6px 0 12px;font-size:13px;color:var(--text-sub)', text: 'Tháng này tính đến hôm nay, tháng trước tính đủ tháng.' }),
      chart('Doanh thu theo tháng', monthKeys.map(k => agg.get(k).revenue), app.formatMoney),
      chart('Số đơn theo tháng', monthKeys.map(k => agg.get(k).orders), v => String(v)),
      chart('Trung bình mỗi đơn', monthKeys.map(k => avg(agg.get(k))), app.formatMoney),
      plus ? chart('Lãi ròng theo tháng', monthKeys.map(k => (pnlBy.get(k) ? pnlBy.get(k).net : 0)), app.formatMoney, 'var(--yellow)') : null
    ];
    if (ST.statsCash) {   // Thực thu và thực chi theo tháng (như v1)
      const cin = new Map(monthKeys.map(k => [k, 0])), cout = new Map(monthKeys.map(k => [k, 0]));
      for (const d of (ST.statsCash.days || [])) {
        const k = String(d.day).slice(0, 7);
        if (cin.has(k)) { cin.set(k, cin.get(k) + (d.in_orders || 0) + (d.in_manual || 0)); cout.set(k, cout.get(k) + (d.out_purchases || 0) + (d.out_debt || 0) + (d.out_manual || 0)); }
      }
      kids.push(el('div', { className: 'card' }, el('b', { text: 'Thực thu và thực chi theo tháng' }),
        el('div', { style: 'margin-top:8px' }, renderSvgBarChart('Thực thu và thực chi theo tháng', labels, [
          { name: 'Thực thu', color: 'var(--accent)', values: monthKeys.map(k => cin.get(k)) },
          { name: 'Thực chi', color: 'var(--yellow)', values: monthKeys.map(k => cout.get(k)) }
        ], app.formatMoney))));
    }
    if (ST.statsNew) {    // Khách mới theo tháng (như v1)
      const cnt = new Map(monthKeys.map(k => [k, 0]));
      for (const r of ST.statsNew) { const k = app.toVnYmd(new Date(r.created_at)).slice(0, 7); if (cnt.has(k)) cnt.set(k, cnt.get(k) + 1); }
      kids.push(el('div', { className: 'card' }, el('b', { text: 'Khách mới theo tháng' }),
        el('div', { style: 'margin-top:8px' }, renderSvgBarChart('Khách mới theo tháng', labels, [{ name: 'Khách mới', color: 'var(--accent)', values: monthKeys.map(k => cnt.get(k)) }], v => String(v)))));
    }
    if (plus && ST.statsCust) {
      const saved = ST.customers; ST.customers = ST.statsCust;
      kids.push(el('div', { style: 'font-weight:700;margin:14px 0 8px;color:var(--text-sub)', text: 'Khách hàng tháng này' }), ...collectNodes(renderCustomersTab));
      ST.customers = saved;
    }
    contentHost.replaceChildren(...kids);
  }

  /* ===== TAB: Giá vốn & lãi gộp (gói tối thiểu: pro) ===== */
  function renderCostingTab() {
    const c = ST.costing || { items: [], totals: { revenue: 0, cogs: 0, gross: 0 } };
    const { col, desc } = ST.costSort;
    const sorted = (c.items || []).slice().sort((a, b) => {
      const av = a[col], bv = b[col];
      if (typeof av === 'string') return desc ? bv.localeCompare(av, 'vi') : av.localeCompare(bv, 'vi');
      return desc ? (bv - av) : (av - bv);
    });
    const thSort = (key, label, right) => el('th', {
      className: 'sortable' + (right ? ' r' : ''),
      onClick: () => {
        if (ST.costSort.col === key) ST.costSort.desc = !ST.costSort.desc;
        else ST.costSort = { col: key, desc: true };
        renderCostingTab();
      },
      text: label + (col === key ? (desc ? ' ↓' : ' ↑') : '')
    });

    contentHost.replaceChildren(
      renderRangeBar(),
      el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:8px' },
          el('b', { text: 'Giá vốn & lãi gộp theo món' })
        ),
        sorted.length ? el('div', { className: 'table-scroll' },
          el('table', { className: 'qt-tbl' },
            el('thead', null, el('tr', null,
              thSort('name', 'Món', false), thSort('qty', 'SL', true), thSort('revenue', 'Doanh thu', true),
              thSort('cogs', 'Giá vốn', true), thSort('gross', 'Lãi gộp', true), thSort('gross_pct', '% Lãi', true)
            )),
            el('tbody', null,
              sorted.map(i => {
                const noCost = i.cogs === 0 && i.qty > 0;
                const lowMargin = !noCost && i.gross_pct < 30;
                return el('tr', { className: (lowMargin || noCost) ? 'warn-row' : '' },
                  el('td', null, i.name, noCost ? el('span', { className: 'badge badge-warn', style: 'margin-left:6px', text: 'Chưa có giá vốn' }) : null),
                  el('td', { className: 'r num', text: String(i.qty) }),
                  el('td', { className: 'r num', text: app.formatMoney(i.revenue) }),
                  el('td', { className: 'r num', text: app.formatMoney(i.cogs) }),
                  el('td', { className: 'r num', text: app.formatMoney(i.gross) }),
                  el('td', { className: 'r num', style: lowMargin ? 'color:var(--error);font-weight:700' : '', text: Number(i.gross_pct || 0).toFixed(1).replace('.', ',') + '%' })
                );
              }),
              el('tr', { className: 'sum-row' },
                el('td', { text: 'Tổng cộng' }), el('td'),
                el('td', { className: 'r num', text: app.formatMoney(c.totals.revenue) }),
                el('td', { className: 'r num', text: app.formatMoney(c.totals.cogs) }),
                el('td', { className: 'r num', text: app.formatMoney(c.totals.gross) }),
                el('td', { className: 'r num', text: pct(c.totals.gross, c.totals.revenue) })
              )
            )
          )
        ) : el('div', { className: 'empty-state', text: 'Chưa có dữ liệu giá vốn trong kỳ này.' })
      )
    );
  }

  /* ===== TAB: Kho (gói tối thiểu: pro — chỉ đọc) ===== */
  function renderInventoryTab() {
    const inv = ST.inventory || { items: [], total_value: 0, low_count: 0 };
    const items = (inv.items || []).slice().sort((a, b) => Number(b.low) - Number(a.low) || a.name.localeCompare(b.name, 'vi'));
    const kinds = { nl: 'Nguyên liệu', bb: 'Bao bì', btp: 'Bán thành phẩm' };

    contentHost.replaceChildren(
      el('div', { className: 'kpi-grid' },
        el('div', { className: 'kpi-card' }, el('small', { text: 'Tổng giá trị kho' }), el('b', { className: 'num', text: app.formatMoney(inv.total_value) })),
        el('div', { className: 'kpi-card' }, el('small', { text: 'Vật tư sắp hết' }), el('b', { className: 'num', style: inv.low_count > 0 ? 'color:var(--error)' : '', text: String(inv.low_count) }))
      ),
      el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:8px' },
          el('b', { text: 'Kho nguyên liệu hiện tại' })
        ),
        items.length ? el('div', { className: 'table-scroll' },
          el('table', { className: 'qt-tbl' },
            el('thead', null, el('tr', null, el('th', { text: 'Vật tư' }), el('th', { text: 'Loại' }), el('th', { className: 'r', text: 'Tồn' }), el('th', { className: 'r', text: 'Giá BQ' }), el('th', { className: 'r', text: 'Giá trị' }))),
            el('tbody', null, items.map(i => el('tr', { className: i.low ? 'warn-row' : '' },
              el('td', null, i.name, i.low ? el('span', { className: 'badge badge-warn', style: 'margin-left:6px', text: 'Sắp hết' }) : null),
              el('td', { text: kinds[i.kind] || i.kind }),
              el('td', { className: 'r num', text: i.qty + ' ' + i.unit }),
              el('td', { className: 'r num', text: app.formatMoney(i.avg_cost) }),
              el('td', { className: 'r num', text: app.formatMoney(i.value) })
            )))
          )
        ) : el('div', { className: 'empty-state', text: 'Kho chưa có vật tư nào.' })
      )
    );
  }

  /* ===== TAB: Báo cáo kết quả kinh doanh (gói tối thiểu: proplus) ===== */
  function renderPnlTab() {
    const p = ST.pnl || { revenue: 0, discounts: 0, cogs: 0, sell_costs: { gh: 0, qc: 0, kh: 0, ht: 0, total: 0 }, gross: 0, net: 0, months: [] };
    const sc = p.sell_costs || { gh: 0, qc: 0, kh: 0, ht: 0, total: 0 };
    const pnlRows = [
      { label: 'Doanh thu', val: p.revenue, bold: false },
      { label: 'Giảm giá', val: p.discounts, bold: false },
      { label: 'Giá vốn hàng bán', val: p.cogs, bold: false },
      { label: 'Lãi gộp', val: p.gross, bold: true },
      { label: 'Chi phí giao hàng', val: sc.gh, bold: false },
      { label: 'Chi phí quảng cáo', val: sc.qc, bold: false },
      { label: 'Chi phí khác (điện, gas, nước…)', val: sc.kh, bold: false },
      { label: 'Hoàn tiền', val: sc.ht, bold: false },
      { label: 'Lãi ròng', val: p.net, bold: true }
    ];
    const months = ST.tab === 'bctc' ? [] : (p.months || []);

    contentHost.replaceChildren(
      renderRangeBar(),
      el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:8px' },
          el('b', { text: 'Báo cáo kết quả kinh doanh' })
        ),
        el('div', { className: 'table-scroll' },
          el('table', { className: 'qt-tbl' },
            el('thead', null, el('tr', null, el('th', { text: 'Chỉ tiêu' }), el('th', { className: 'r', text: 'Số tiền' }), el('th', { className: 'r', text: '% Doanh thu' }))),
            el('tbody', null, pnlRows.map(r => el('tr', { className: r.bold ? 'sum-row' : '' },
              el('td', { text: r.label }),
              el('td', { className: 'r num', text: app.formatMoney(r.val) }),
              el('td', { className: 'r num', text: pct(r.val, p.revenue) })
            )))
          )
        ),
        el('p', { style: 'margin:10px 0 0;font-size:13px;color:var(--text-sub)', text: 'Dụng cụ không tính vào chi phí. Lãi gộp = Doanh thu − Giá vốn; Lãi ròng = Lãi gộp − Tổng chi phí bán hàng.' })
      ),
      months.length ? el('div', { className: 'card' },
        el('b', { text: 'Kết quả theo tháng' }),
        el('div', { style: 'margin-top:8px' },
          renderSvgBarChart('Lãi theo tháng', months.map(m => 'T' + Number(m.month.slice(5)) + '/' + m.month.slice(2, 4)), [
            { name: 'Doanh thu', color: 'var(--accent)', values: months.map(m => m.revenue) },
            { name: 'Lãi ròng', color: 'var(--yellow)', values: months.map(m => m.net) }
          ], app.formatMoney)
        ),
        el('div', { className: 'table-scroll' },
          el('table', { className: 'qt-tbl' },
            el('thead', null, el('tr', null, el('th', { text: 'Tháng' }), el('th', { className: 'r', text: 'Doanh thu' }), el('th', { className: 'r', text: 'Giá vốn' }), el('th', { className: 'r', text: 'Chi phí BH' }), el('th', { className: 'r', text: 'Lãi ròng' }))),
            el('tbody', null, months.map(m => el('tr', null,
              el('td', { style: 'white-space:nowrap', text: 'T' + Number(m.month.slice(5)) + '/' + m.month.slice(2, 4) }),
              el('td', { className: 'r num', text: app.formatMoney(m.revenue) }),
              el('td', { className: 'r num', text: app.formatMoney(m.cogs) }),
              el('td', { className: 'r num', text: app.formatMoney(m.sell_costs) }),
              el('td', { className: 'r num', style: 'font-weight:700', text: app.formatMoney(m.net) })
            )))
          )
        )
      ) : null
    );
  }

  /* ===== TAB: Khách hàng (gói tối thiểu: proplus — chỉ đọc) ===== */
  function renderCustomersTab() {
    const c = ST.customers || { new_customers: 0, new_members: 0, active_customers: 0, repeat_rate: 0, top_customers: [] };
    const top = c.top_customers || [];

    contentHost.replaceChildren(
      renderRangeBar(),
      el('div', { className: 'kpi-grid' },
        el('div', { className: 'kpi-card' }, el('small', { text: 'Khách mới' }), el('b', { className: 'num', text: String(c.new_customers) })),
        el('div', { className: 'kpi-card' }, el('small', { text: 'Thành viên mới' }), el('b', { className: 'num', text: String(c.new_members) })),
        el('div', { className: 'kpi-card' }, el('small', { text: 'Khách hoạt động' }), el('b', { className: 'num', text: String(c.active_customers) })),
        el('div', { className: 'kpi-card' }, el('small', { text: 'Tỷ lệ quay lại' }), el('b', { className: 'num', style: 'color:var(--accent)', text: Number(c.repeat_rate || 0).toFixed(1).replace('.', ',') + '%' }))
      ),
      el('div', { className: 'card' },
        el('div', { className: 'row-between', style: 'margin-bottom:8px' },
          el('b', { text: 'Top 20 khách mua nhiều' })
        ),
        top.length ? el('div', { className: 'table-scroll' },
          el('table', { className: 'qt-tbl' },
            el('thead', null, el('tr', null, el('th', { text: 'Khách hàng' }), el('th', { text: 'Căn hộ' }), el('th', { className: 'r', text: 'Số đơn' }), el('th', { className: 'r', text: 'Tổng chi' }), el('th', { className: 'r', text: 'Gần nhất' }))),
            el('tbody', null, top.map(x => el('tr', null,
              el('td', { style: 'font-weight:600', text: x.name }),
              el('td', { text: x.apt || '—' }),
              el('td', { className: 'r num', text: String(x.orders) }),
              el('td', { className: 'r num', style: 'font-weight:700', text: app.formatMoney(x.spent) }),
              el('td', { className: 'r num', text: app.formatVnDateTime(x.last_at) })
            )))
          )
        ) : el('div', { className: 'empty-state', text: 'Chưa có dữ liệu khách hàng trong kỳ này.' })
      )
    );
  }

  /* ===== KHỞI CHẠY ===== */
  try {
    const { data: pms } = await sb.from('payment_methods').select('id,name').eq('shop_id', shopId);
    (pms || []).forEach(m => ST.payMethodsMap.set(m.id, m.name));
  } catch (e) {}
  if (app.headerExtra) app.headerExtra.replaceChildren(el('button', { type: 'button', className: 'btn btn-sm', onClick: e => openExportModal(e.currentTarget), text: 'Xuất Excel' }));
  renderNav();
  await reloadCurrentTab();
})();
</script>
</body>
</html>
